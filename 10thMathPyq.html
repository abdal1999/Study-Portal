mcq(1,[],`If the system of equations 3x + y = 1 and (2k − 1)x + (k − 1)y = 2k + 1 is inconsistent then k is`,['−1','0','1','2'],3,`Inconsistent means [[a_{1}|a_{2}]] = [[b_{1}|b_{2}]] ≠ [[c_{1}|c_{2}]].<br>[[3|2k − 1]] = [[1|k − 1]] gives 3k − 3 = 2k − 1, so k = 2.<br>Check: the ratio of the a’s and b’s is 1, while [[c_{1}|c_{2}]] = [[1|2k + 1]] = [[1|5]] ≠ 1. ✓`);
mcq(2,[],`For what value of k, the system of equations kx + 3y = 1, 12x + ky = 2 has no solution`,['k = −6','k ≠ −6','k = 4','k = −4'],0,`No solution: [[k|12]] = [[3|k]] ≠ [[1|2]].<br>k^{2} = 36, so k = ±6. For k = 6, [[k|12]] = [[1|2]], which is not allowed. For k = −6, [[k|12]] = −[[1|2]] ≠ [[1|2]] ✓. So k = −6.`);
mcq(3,[],`For what value of p the system of equations have no solution: (2p − 1)x + (p − 1)y = 2p + 1, y + 3x − 1 = 0`,['p = 2','p ≠ 2','p = 4','p ≠ 4'],0,`Rewrite as 3x + y = 1. No solution: [[2p − 1|3]] = [[p − 1|1]] ≠ [[2p + 1|1]].<br>2p − 1 = 3p − 3 gives p = 2. Check: [[2p + 1|1]] = 5 ≠ 1 ✓.`);
mcq(4,[],`For which value(s) of p, will the lines represented by the following pair of linear equations be parallel: 3x − y − 5 = 0 and 6x − 2y − p = 0`,['All real values except 10','[[5|2]]','10','[[1|2]]'],0,`Parallel: [[3|6]] = [[−1|−2]] ≠ [[−5|−p]], i.e. [[1|2]] ≠ [[5|p]]. So p ≠ 10. The lines are parallel for all real p except 10 (for p = 10 they coincide).`);
mcq(5,[],`If the lines given by 3x + 2ky = 2 and 2x + 5y + 1 = 0 are parallel then value of k is`,['−[[5|4]]','[[2|5]]','[[15|4]]','[[3|2]]'],2,`Parallel: [[3|2]] = [[2k|5]], so 4k = 15 and k = [[15|4]]. (The constants satisfy [[−2|1]] ≠ [[3|2]], so the lines are parallel, not coincident.)`);
mcq(6,[2023],`The pair of equations ax + 2y = 9 & 3x + by = 18 represent parallel lines, where a, b are integers if`,['a = b','3a = 2b','2a = 3b','ab = 6'],3,`Parallel: [[a|3]] = [[2|b]] ≠ [[9|18]]. So ab = 6 (and a ≠ [[3|2]]).`);
mcq(7,[],`The pair of equations 2kx + 5y = 7, 6x − 5y = 11 has a unique solution, if`,['k ≠ −3','k ≠ [[2|3]]','k ≠ 5','k ≠ [[2|9]]'],0,`Unique solution: [[2k|6]] ≠ [[5|−5]] = −1, so 2k ≠ −6 and k ≠ −3.`);
mcq(8,[],`For what value of p does the pair of linear equations given below has unique solution 4x + py + 8 = 0 and 2x + 2y + 2 = 0`,['p = 1','p = 2','p ≠ 4','p ≠ 2'],2,`Unique solution: [[4|2]] ≠ [[p|2]], so p ≠ 4.`);
mcq(9,[2023],`The condition for the system of linear equations ax + by = c & lx + my = n to have a unique solution is`,['am ≠ bl','al ≠ bm','al = bm','am = bl'],0,`Unique solution: [[a|l]] ≠ [[b|m]], i.e. am ≠ bl.`);
mcq(10,[2023],`For what value of k, the equations 3x − y + 8 = 0, 6x − ky = −16 represent coincident lines`,['[[1|2]]','−[[1|2]]','2','−2'],2,`Coincident: [[3|6]] = [[−1|−k]] = [[8|16]]. So [[1|2]] = [[1|k]], giving k = 2.`);
mcq(11,[2023],`The value of k for which the pair of equations kx = y + 2 & 6x = 2y + 3 has infinitely many solutions, is`,['k = 3','k = −3','k = 4','doesn’t exist'],3,`Write as kx − y − 2 = 0 and 6x − 2y − 3 = 0. For infinitely many solutions [[k|6]] = [[−1|−2]] = [[−2|−3]]. The first equality gives k = 3, but [[1|2]] ≠ [[2|3]], so the conditions never hold together. Such a k doesn’t exist.`);
mcq(12,[2024],`For what value of k, the equations kx + y = k^{2} and x + ky = 1 have infinitely many solutions.`,['1','2','3','4'],0,`[[k|1]] = [[1|k]] = [[k^{2}|1]]. From [[k|1]] = [[1|k]], k^{2} = 1. From [[k|1]] = [[k^{2}|1]], k = k^{2}, so k = 0 or 1. Both hold only for k = 1.`);
mcq(13,[2025],`The value of k for which the pair of equations 6x + y = 3k & 36x + 6y = 3 have infinitely many solutions, is`,['6','[[1|6]]','[[1|2]]','[[1|3]]'],1,`[[6|36]] = [[1|6]] = [[3k|3]] gives k = [[1|6]].`);
mcq(14,[2025],`The value of ‘p’ for which equations px + 3y = p − 3 and 12x + py = p has infinitely many solutions is`,['−6 only','±6','6 only','any real number except ±6'],2,`[[p|12]] = [[3|p]] = [[p − 3|p]]. From the first equality p^{2} = 36, p = ±6. From [[3|p]] = [[p − 3|p]], p − 3 = 3, so p = 6. Hence p = 6 only.`);
mcq(15,[],`One equation of a pair of dependent linear equation is −5x + 7y = 2. The second equation can be`,['10x + 14y + 4 = 0','−10x + 14y + 4 = 0','−10x − 14y + 4 = 0','10x − 14y + 4 = 0'],3,`Dependent (coincident) lines: the second equation is a multiple of −5x + 7y − 2 = 0. Multiplying by −2 gives 10x − 14y + 4 = 0.`);
mcq(16,[2024],`Two lines are given to be parallel. The equation of one of the lines is 4x + 3y = 14 then the equation of the second line will be`,['12x + 9y = 42','12x + 8y = 15','12x + 9y = 5','12x + 8y = 42'],2,`For parallel lines [[4|12]] = [[3|9]] ≠ [[14|c]]. 12x + 9y = 42 would give [[14|42]] = [[1|3]] (coincident), so the answer is 12x + 9y = 5.`);
mcq(17,[],`Given the linear equation 3x + 4y = 9, select another linear equation in these two variables such that the geometrical representation of the pair so formed is intersecting lines`,['3x − 5y = 10','8x + 12y = 18','6x + 8y = 18','above all'],0,`Intersecting lines need [[a_{1}|a_{2}]] ≠ [[b_{1}|b_{2}]]. For (a) [[3|3]] ≠ [[4|−5]] ✓. For (b) [[3|8]] ≠ [[4|12]] = [[1|3]] ✓. For (c) [[3|6]] = [[4|8]] = [[9|18]], so the lines coincide. “Above all” is therefore not correct. Options (a) and (b) both give intersecting lines, and the site accepts either.`,{alt:[1]});
mcq(18,[2025],`If x = 1 and y = 2 is a solution of the pair of linear equations 2x − 3y + a = 0 and 2x + 3y − b = 0 then`,['a = 2b','2a = b','a + 2b = 0','2a + b = 0'],1,`2(1) − 3(2) + a = 0 gives a = 4. 2(1) + 3(2) − b = 0 gives b = 8. So b = 2a.`);
mcq(19,[],`If x = a and y = b is the solution of the equation x − y = 2 and x + y = 4 then the values of a and b are, respectively`,['3 and 5','5 and 3','3 and 1','−1 and −3'],2,`Adding: 2x = 6, so x = 3. Then y = 1. So a = 3 and b = 1.`);
mcq(20,[],`What are the values of x and y for the following pair of linear equations? 3x + 2y − 7 = 0 and 4x + y − 6 = 0`,['1 and 2','2 and 2','1 and 1','−1 and −1'],0,`From the second, y = 6 − 4x. Then 3x + 12 − 8x − 7 = 0, so x = 1 and y = 2.`);
mcq(21,[2023],`The solutions of the pair of equations x + y = a + b & ax − by = a^{2} − b^{2} is`,['x = b, y = a','x = −a, y = b','x = a, y = b','x = a, y = −b'],2,`Substituting x = a, y = b: x + y = a + b ✓ and ax − by = a^{2} − b^{2} ✓. So x = a, y = b.`);
mcq(22,[2024],`If ax + by = a^{2} − b^{2} and bx + ay = 0 then the value of x + y is`,['a^{2} − b^{2}','a + b','a − b','a^{2} + b^{2}'],2,`From bx + ay = 0, bx = −ay. Multiply the first equation by a and the second by b and subtract: a^{2}x + aby − (b^{2}x + aby) = a(a^{2} − b^{2}), so (a^{2} − b^{2})x = a(a^{2} − b^{2}) and x = a. Then y = −b. So x + y = a − b.`);
mcq(23,[],`If 2x + y = 23 and 4x − y = 19 the value of (5y − 2x) and ([[y|x]] − 2) will be`,['−[[5|7]], 31','31, −[[5|7]]','37, [[2|7]]','[[2|7]], 37'],1,`Adding: 6x = 42, so x = 7 and y = 9.<br>5y − 2x = 45 − 14 = 31. [[y|x]] − 2 = [[9|7]] − 2 = −[[5|7]].`);
mcq(24,[],`In the figure, ABCDE is a pentagon with BE ∥ CD and BC ∥ DE. BC is perpendicular to CD. AB = 5 cm, AE = 5 cm, BE = 7 cm, BC = x − y and CD = x + y. If the perimeter of ABCDE is 27 cm. The value of x and y will be`,['3 and 2','2 and 3','1 and 6','6 and 1'],3,`BCDE is a rectangle, so CD = BE = 7, i.e. x + y = 7, and DE = BC = x − y.<br>Perimeter = AB + BC + CD + DE + EA = 5 + (x − y) + 7 + (x − y) + 5 = 27, so 2(x − y) = 10 and x − y = 5.<br>Adding x + y = 7 and x − y = 5: 2x = 12, so x = 6 and y = 1.`,{fig:F24});
mcq(25,[2023],`The pair of equations x = a and y = b graphically represents lines which are`,['Parallel','coincident','intersecting at (a, b)','intersecting at (b, a)'],2,`x = a is a vertical line and y = b is a horizontal line. They meet at the point (a, b).`);
mcq(26,[],`If a pair of linear equations is consistent then the lines will be`,['Parallel','Intersecting or coincident','always coincident','always intersecting'],1,`Consistent means the pair has at least one solution: either exactly one (intersecting lines) or infinitely many (coincident lines).`);
mcq(27,[2023],`What do you say about the lines represented by 2x + y = 3 and 4x + 2y = 6?`,['Parallel','Intersecting','coincident','none of these'],2,`[[2|4]] = [[1|2]] = [[3|6]] = [[1|2]], so the lines coincide.`);
mcq(28,[2025],`A system of two linear equations in two variables is inconsistent, if the lines in the graph are`,['parallel','Intersecting at one point','coincident','intersecting at right angles'],0,`Inconsistent means no solution, so the lines never meet: they are parallel.`);
mcq(29,[2025],`The system of equations 2x + 1 = 0 and 3y − 5 = 0 has`,['Unique solution','Infinitely many solution','two solution','no solution'],0,`x = −[[1|2]] (a vertical line) and y = [[5|3]] (a horizontal line) meet at exactly one point.`);
mcq(30,[2024],`The pair of equations y = 0 and y = 7 has`,['Unique solution','Infinitely many solution','two solution','no solution'],3,`These are two parallel horizontal lines, so there is no solution.`);
mcq(31,[2024],`The pair of equations x + 2y + 5 = 0 and −3x − 6y + 1 = 0 has`,['Unique solution','Infinitely many solutions','exactly two solutions','no solution'],3,`[[1|−3]] = [[2|−6]] = −[[1|3]] ≠ [[5|1]]. The lines are parallel, so there is no solution.`);
mcq(32,[],`The pair of equations 3^{x+y} = 81, 81^{x−y} = 3 has`,['No solution','infinitely many solutions','unique solution','x = 2[[1|8]], y = 1[[7|8]]'],3,`3^{x+y} = 3^{4} gives x + y = 4. 81^{x−y} = 3 means 3^{4(x−y)} = 3^{1}, so x − y = [[1|4]].<br>Adding and subtracting: x = [[17|8]] = 2[[1|8]] and y = [[15|8]] = 1[[7|8]]. Options (c) and (d) are both true statements, and the site accepts either.`,{alt:[2]});
mcq(33,[],`The pair of linear equations 2x + 3y = 5 and 4x + 6y = 10 is`,['Inconsistent','Consistent','dependent consistent','none of these'],2,`[[2|4]] = [[3|6]] = [[5|10]], so the lines coincide: the pair is dependent and consistent. (It is also consistent, so options (b) and (c) are both true; the site accepts either.)`,{alt:[1]});
mcq(34,[2025],`The line represented by the equation x − y = 0 is`,['Parallel to x-axis','Passing through the origin','parallel to y-axis','passing through the point (3, 2)'],1,`x − y = 0 is y = x, which passes through the origin (0, 0). It is neither parallel to an axis, nor does it pass through (3, 2).`);
mcq(35,[2025],`The equation of a line parallel to the x-axis and at a distance of 3 units below the x-axis is`,['x = 3','x = −3','y = −3','y = 3'],2,`A line parallel to the x-axis has the form y = constant. Below the axis the constant is negative: y = −3.`);
mcq(36,[2025],`The equation of a line parallel to y-axis and at a distance of 5 units to the right of y-axis is`,['x = 5','x = −5','y = 5','y = −5'],0,`A line parallel to the y-axis has the form x = constant. To the right, the constant is positive: x = 5.`);
mcq(37,[2025],`The system of equations y + a = 0 and 2x = b has`,['No solution','([[b|2]], −a) as its solution','(−a, [[b|2]]) as its solution','infinite solutions'],1,`y = −a and x = [[b|2]], so the solution is ([[b|2]], −a).`);
mcq(38,[2023],`3 chairs and 1 table cost Rs 900, whereas 5 chairs and 3 tables cost Rs 2100. If the cost of 1 chair is Rs x and the cost of 1 table is Rs y then the situation can be represented algebraically as`,['3x + y = 900, 3x + 5y = 2100','3x + y = 900, 5x + 3y = 2100','x + 3y = 900, 3x + 5y = 2100','x + 3y = 900, 5x + 3y = 2100'],1,`3 chairs + 1 table: 3x + y = 900. 5 chairs + 3 tables: 5x + 3y = 2100.`);
mcq(39,[2024],`In the given figure, graphs of two linear equations are shown. The pair of these linear equations is`,['Consistent with unique solution','Consistent with infinitely many solutions','Inconsistent','Inconsistent but can be made consistent by extending these lines.'],2,`The two lines are parallel, so they never meet. The pair has no solution, so it is inconsistent. (Extending parallel lines never makes them meet.)`,{fig:F39});

/* ===== Assertion-Reason ===== */
ar(40,[2025],`The pair of equations px + 3y + 59 = 0 and 2x + 6y + 118 = 0 will have infinitely many solutions if p = 1.`,`If the pair of equations px + 3y + 19 = 0 and 2x + 6y + 157 = 0 has a unique solution then p ≠ 1.`,1,`For the first pair, [[p|2]] = [[3|6]] = [[59|118]] = [[1|2]] holds exactly when p = 1, so A is true. For the second pair a unique solution needs [[p|2]] ≠ [[3|6]], i.e. p ≠ 1, so R is true. But R is about a different pair of equations, so it does not explain A.<br><span class="ans">Answer: (b)</span>`);
ar(41,[],`x + y − 4 = 0 and 2x + ky − 3 = 0 has no solution if k = 2.`,`a_{1}x + b_{1}y + c_{1} = 0 and a_{2}x + b_{2}y + c_{2} = 0 are consistent if [[a_{1}|a_{2}]] ≠ [[b_{1}|b_{2}]].`,1,`For k = 2: [[1|2]] = [[1|2]] ≠ [[−4|−3]], so the lines are parallel and have no solution. A is true. R is also a true statement (lines with different slopes intersect, so the pair is consistent), but it talks about a consistent pair and does not explain why k = 2 gives no solution.<br><span class="ans">Answer: (b)</span>`);
ar(42,[],`Pair of linear equations 9x + 3y + 12 = 0 and 8x + 6y + 24 = 0 have infinitely many solution.`,`Pair of linear equations a_{1}x + b_{1}y + c_{1} = 0 and a_{2}x + b_{2}y + c_{2} = 0 have infinitely many solutions if [[a_{1}|a_{2}]] = [[b_{1}|b_{2}]] = [[c_{1}|c_{2}]].`,3,`[[9|8]] ≠ [[3|6]], so the lines intersect at one point and A is false. R is the correct condition for infinitely many solutions, so R is true.<br><span class="ans">Answer: (d)</span>`);

/* ===== 2 marks ===== */
vsa(1,[],`For what value of k for which the following pair of linear equations have infinitely many solutions? 2x − 3y = 7, (k + 2)x − (2k + 1)y = 3(2k − 1).`,`[[2|k + 2]] = [[3|2k + 1]] = [[7|3(2k − 1)]].<br>[[2|k + 2]] = [[3|2k + 1]] gives 4k + 2 = 3k + 6, so k = 4.<br>Check: [[2|6]] = [[3|9]] = [[7|21]] = [[1|3]] ✓. So <b>k = 4</b>.`);
vsa(2,[],`For what value of k will the following pair of linear equations have no solution? 3x + y = 1, (2k − 1)x + (k − 1)y = 2k + 1.`,`No solution: [[3|2k − 1]] = [[1|k − 1]] ≠ [[1|2k + 1]].<br>3k − 3 = 2k − 1 gives k = 2. For k = 2: [[3|3]] = [[1|1]] = 1 ≠ [[1|5]] ✓. So <b>k = 2</b>.`);
vsa(3,[],`For what value of p will the following pair of linear equations have infinitely many solutions? (p − 3)x + 3y = p and px + py = 12.`,`[[p − 3|p]] = [[3|p]] = [[p|12]].<br>From [[3|p]] = [[p|12]], p^{2} = 36 so p = ±6. From [[p − 3|p]] = [[3|p]], p − 3 = 3 so p = 6.<br>Check p = 6: [[3|6]] = [[3|6]] = [[6|12]] ✓. So <b>p = 6</b>.`);
vsa(4,[],`If the system of equations 2x + 3y = 7 and (a + b)x + (2a − b)y = 21 has infinitely many solutions, then find a and b.`,`[[2|a + b]] = [[3|2a − b]] = [[7|21]] = [[1|3]].<br>So a + b = 6 and 2a − b = 9. Adding: 3a = 15, so <b>a = 5</b> and <b>b = 1</b>.`);
vsa(5,[],`In figure, ABCD is a rectangle. Find the values of x and y.`,`Opposite sides of a rectangle are equal: DC = AB, so x + y = 30; and BC = AD, so x − y = 14.<br>Adding: 2x = 44, so <b>x = 22</b>. Then <b>y = 8</b>.`,{fig:F5});
vsa(6,[2025],`Solve for x and y: √{2}x + √{3}y = 5 and √{3}x − √{8}y = −√{6}.`,`Note √{8} = 2√{2}. Multiply the first equation by √{3}: √{6}x + 3y = 5√{3}. Multiply the second by √{2}: √{6}x − 4y = −2√{3}.<br>Subtracting: 7y = 7√{3}, so <b>y = √{3}</b>.<br>Then √{2}x = 5 − 3 = 2, so <b>x = √{2}</b>.`);
vsa(7,[2025],`Solve 30x + 44y = 10 and 40x + 55y = 13 algebraically.`,`Multiply the first by 4: 120x + 176y = 40. Multiply the second by 3: 120x + 165y = 39.<br>Subtracting: 11y = 1, so <b>y = [[1|11]]</b>. Then 30x = 10 − 4 = 6, so <b>x = [[1|5]]</b>.`);
vsa(8,[2025],`Solve 37x + 63y = 137 and 63x + 37y = 163 algebraically.`,`Adding: 100x + 100y = 300, so x + y = 3. Subtracting: 26x − 26y = 26, so x − y = 1.<br>Hence <b>x = 2</b> and <b>y = 1</b>.`);
vsa(9,[2025],`Solve 73x − 37y = 109 and 37x − 73y = 1 algebraically.`,`Adding: 110x − 110y = 110, so x − y = 1. Subtracting the second from the first: 36x + 36y = 108, so x + y = 3.<br>Hence <b>x = 2</b> and <b>y = 1</b>.`);
vsa(10,[2025],`Solve 101x + 102y = 304 and 102x + 101y = 305 algebraically.`,`Adding: 203x + 203y = 609, so x + y = 3. Subtracting the first from the second: x − y = 1.<br>Hence <b>x = 2</b> and <b>y = 1</b>.`);
vsa(11,[2023],`Solve 217x + 131y = 913, 131x + 217y = 827.`,`Adding: 348x + 348y = 1740, so x + y = 5. Subtracting: 86x − 86y = 86, so x − y = 1.<br>Hence <b>x = 3</b> and <b>y = 2</b>.`);
vsa(12,[2023],`Solve the pair of equations x = 3 & y = −4 graphically.`,`x = 3 is a vertical line through (3, 0), and y = −4 is a horizontal line through (0, −4). They meet at the point (3, −4).<br>So the solution is <b>x = 3, y = −4</b>.<div class="fig">${F12}</div>`);
vsa(13,[2023],`Using graphical method, find whether following system of linear equations is consistent or not x = 0 & y = −7.`,`x = 0 is the y-axis and y = −7 is a horizontal line. They intersect at (0, −7), so the system has a solution and is <b>consistent</b>, with x = 0, y = −7.<div class="fig">${F13}</div>`);
vsa(14,[2024],`Solve 7x − 2y = 5 & 8x + 7y = 15 and verify your answer.`,`Multiply the first by 7: 49x − 14y = 35. Multiply the second by 2: 16x + 14y = 30.<br>Adding: 65x = 65, so <b>x = 1</b>. Then 7 − 2y = 5, so <b>y = 1</b>.<br>Verification: 7(1) − 2(1) = 5 ✓ and 8(1) + 7(1) = 15 ✓.`);
vsa(15,[2024],`Sum of two numbers is 105 and their difference is 45. Find the numbers.`,`Let the numbers be x and y: x + y = 105 and x − y = 45.<br>Adding: 2x = 150, so x = 75. Then y = 30.<br>The numbers are <b>75 and 30</b>.`);
vsa(16,[2025],`The cost of 2 kg apples and 1 kg of grapes on a day was found to be Rs 320. The cost of 4 kg apples and 2 kg grapes was found to be Rs 600. If cost of 1 kg of apples and 1 kg of grapes is Rs x and Rs y respectively. Represent the given situation algebraically as a system of equations and check whether the system so obtained is consistent or not.`,`The system is 2x + y = 320 and 4x + 2y = 600.<br>[[2|4]] = [[1|2]] = [[1|2]] but [[320|600]] = [[8|15]] ≠ [[1|2]].<br>The lines are parallel, so there is no solution: the system is <b>inconsistent</b>.`);
vsa(17,[2025],`In a pair of supplementary angles, the greater angle exceeds the smaller by 50°. Express the given situation as a system of linear equations in two variables and hence obtain the measure of each angle.`,`Let the angles be x and y (x greater). Supplementary: x + y = 180. Difference: x − y = 50.<br>Adding: 2x = 230, so x = 115. Then y = 65.<br>The angles are <b>115° and 65°</b>.`);

/* ===== 3 marks ===== */
sa(1,[],`Solve for x and y: [[x|2]] + [[2y|3]] = −1 and x − [[y|3]] = 3.`,`Multiply the first by 6: 3x + 4y = −6. Multiply the second by 3: 3x − y = 9.<br>Subtracting: 5y = −15, so <b>y = −3</b>. Then 3x = 9 − 3 = 6, so <b>x = 2</b>.`);
sa(2,[],`Solve for x and y: [[x + 1|2]] + [[y − 1|3]] = 9 and [[x − 1|3]] + [[y + 1|2]] = 8.`,`Multiply the first by 6: 3(x + 1) + 2(y − 1) = 54, i.e. 3x + 2y = 53. Multiply the second by 6: 2(x − 1) + 3(y + 1) = 48, i.e. 2x + 3y = 47.<br>Adding: 5x + 5y = 100, so x + y = 20. Subtracting: x − y = 6.<br>Hence <b>x = 13</b> and <b>y = 7</b>.`);
sa(3,[],`Solve for x and y: ax + by = [[a + b|2]] and 3x + 5y = 4.`,`Multiply the first equation by 5: 5ax + 5by = [[5(a + b)|2]]. Multiply the second equation by b: 3bx + 5by = 4b.<br>Subtracting: (5a − 3b)x = [[5a + 5b − 8b|2]] = [[5a − 3b|2]], so <b>x = [[1|2]]</b> (for 5a ≠ 3b).<br>Then 3x + 5y = 4 gives 5y = 4 − [[3|2]] = [[5|2]], so <b>y = [[1|2]]</b>.`);
sa(4,[2025],`Solve: 2x − y − 2 = 0 and −4x + y + 4 = 0. Also, find absolute difference between the ordinates of the points where given lines cut y-axis.`,`Adding the two equations: −2x + 2 = 0, so <b>x = 1</b>. Then y = 2x − 2 = <b>0</b>.<br>On the y-axis x = 0. First line: −y − 2 = 0, so y = −2, the point (0, −2). Second line: y + 4 = 0, so y = −4, the point (0, −4).<br>Absolute difference of ordinates = |−2 − (−4)| = <b>2</b>.`);
sa(5,[2025],`Solve: 2x + y = 5 and 4x − y = 7 graphically. Hence, write the coordinates of the points where given lines meet y-axis.`,`2x + y = 5: points (0, 5), (1, 3), (2, 1). 4x − y = 7: points (1, −3), (2, 1), (0, −7).<br>The lines meet at (2, 1), so the solution is <b>x = 2, y = 1</b>.<br>They meet the y-axis at <b>(0, 5)</b> and <b>(0, −7)</b>.<div class="fig">${S5}</div>`);
sa(6,[2025],`Solve 2x + 3y = 6 and x + y − 1 = 0 graphically. Also, find the sum of ordinates of the points where given lines meet y-axis.`,`2x + 3y = 6: points (0, 2), (3, 0), (−3, 4). x + y = 1: points (0, 1), (1, 0), (−3, 4).<br>The lines meet at (−3, 4), so the solution is <b>x = −3, y = 4</b>.<br>They meet the y-axis at (0, 2) and (0, 1), so the sum of ordinates = 2 + 1 = <b>3</b>.<div class="fig">${S6}</div>`);
sa(7,[2025],`Check whether the following pair of equations is consistent or not. If consistent, solve graphically x + 3y = 6 and 3y − 2x = −12.`,`[[1|−2]] ≠ [[3|3]], so the lines intersect and the pair is <b>consistent</b>.<br>x + 3y = 6: points (0, 2), (6, 0), (3, 1). 3y − 2x = −12: points (0, −4), (6, 0), (3, −2).<br>The lines meet at (6, 0), so the solution is <b>x = 6, y = 0</b>.<div class="fig">${S7}</div>`);
sa(8,[2025],`Check whether the following pair of equations is consistent or not. If consistent, solve graphically x − 2y + 4 = 0 and 2x − y − 4 = 0.`,`[[1|2]] ≠ [[−2|−1]], so the lines intersect and the pair is <b>consistent</b>.<br>x − 2y + 4 = 0: points (0, 2), (−4, 0), (4, 4). 2x − y − 4 = 0: points (0, −4), (2, 0), (4, 4).<br>The lines meet at (4, 4), so the solution is <b>x = 4, y = 4</b>.<div class="fig">${S8}</div>`);
sa(9,[],`Determine the values of m and n so that the following system of linear equation have infinite number of solutions: (2m − 1)x + 3y − 5 = 0 and 3x + (n − 1)y − 2 = 0.`,`[[2m − 1|3]] = [[3|n − 1]] = [[−5|−2]] = [[5|2]].<br>[[2m − 1|3]] = [[5|2]] gives 4m − 2 = 15, so <b>m = [[17|4]]</b>.<br>[[3|n − 1]] = [[5|2]] gives 5n − 5 = 6, so <b>n = [[11|5]]</b>.`);
sa(10,[],`For what value of p will the following system of equations have no solution? (2p − 1)x + (p − 1)y = 2p + 1 and y + 3x − 1 = 0.`,`The second equation is 3x + y = 1. No solution: [[2p − 1|3]] = [[p − 1|1]] ≠ [[2p + 1|1]].<br>2p − 1 = 3p − 3 gives <b>p = 2</b>, and then [[2p + 1|1]] = 5 ≠ 1 ✓.`);
sa(11,[2023],`If the system of equations 2x + 3y = 7 and 2ax + (a + b)y = 28 has infinitely many solutions, then find a and b.`,`[[2|2a]] = [[3|a + b]] = [[7|28]] = [[1|4]].<br>2a = 8, so <b>a = 4</b>. a + b = 12, so <b>b = 8</b>.`);
sa(12,[2023],`A fraction becomes [[1|3]] when 2 is subtracted from the numerator and it becomes [[1|2]] when 1 is subtracted from the denominator. Find the fraction.`,`Let the fraction be [[x|y]]. [[x − 2|y]] = [[1|3]] gives 3x − 6 = y. [[x|y − 1]] = [[1|2]] gives 2x = y − 1, so y = 2x + 1.<br>3x − 6 = 2x + 1, so x = 7 and y = 15.<br>The fraction is <b>[[7|15]]</b>.`);
sa(13,[2023],`Half of the difference between two numbers is 2. The sum of the greater number and twice the smaller number is 13. Find the numbers.`,`Let the numbers be x (greater) and y. [[x − y|2]] = 2, so x − y = 4. Also x + 2y = 13.<br>Subtracting: 3y = 9, so y = 3 and x = 7.<br>The numbers are <b>7 and 3</b>.`);
sa(14,[],`The sum of the digits of a two digit number is 9. Also 9 times this number is twice the number obtained by reversing the order of the digits. Find the number.`,`Let the number be 10x + y. x + y = 9 and 9(10x + y) = 2(10y + x).<br>90x + 9y = 20y + 2x gives 88x = 11y, so y = 8x. Then 9x = 9, so x = 1 and y = 8.<br>The number is <b>18</b>. (Check: 9 × 18 = 162 = 2 × 81 ✓.)`);
sa(15,[],`A number consists of two digits. Where the number is divided by the sum of its digits, the quotient is 7. If 27 is subtracted from the number, the digits interchange their places, find the number.`,`Let the number be 10x + y. 10x + y = 7(x + y) gives x = 2y. Also 10x + y − 27 = 10y + x gives x − y = 3.<br>So y = 3 and x = 6. The number is <b>63</b>. (Check: 63 ÷ 9 = 7 and 63 − 27 = 36 ✓.)`);
sa(16,[2023],`A 2-digit number is seven times the sum of its digits. The number formed by reversing the digits is 18 less than the given number. Find the given number.`,`Let the number be 10x + y. 10x + y = 7(x + y) gives x = 2y. Reversed number: 10y + x = 10x + y − 18 gives x − y = 2.<br>So y = 2 and x = 4. The number is <b>42</b>. (Check: 42 = 7 × 6 and 24 = 42 − 18 ✓.)`);
sa(17,[2024],`The sum of the digits of a 2-digit number is 14. The number obtained by interchanging its digits exceeds the given number by 18. Find the number.`,`Let the number be 10x + y. x + y = 14. (10y + x) − (10x + y) = 18 gives y − x = 2.<br>So y = 8 and x = 6. The number is <b>68</b>. (Check: 86 − 68 = 18 ✓.)`);
sa(18,[],`Two numbers are in the ratio of 1 : 3. If 5 is added to both the numbers, the ratio becomes 1 : 2. Find the numbers.`,`Let the numbers be x and y. [[x|y]] = [[1|3]] gives y = 3x. [[x + 5|y + 5]] = [[1|2]] gives 2x + 10 = y + 5, so y = 2x + 5.<br>3x = 2x + 5, so x = 5 and y = 15.<br>The numbers are <b>5 and 15</b>.`);
sa(19,[2024],`A part of monthly hostel charges in a college is fixed and the remaining depends on the number of days one has taken food in the mess. When a student ‘A’ takes food for 22 days, he has to pay Rs.1380 as hostel charges. Whereas a student ‘B’ who takes food for 28 days, pays Rs. 1680 as hostel charges. Find the fixed charges and the cost of food per day.`,`Let the fixed charge be Rs x and the food cost per day be Rs y. x + 22y = 1380 and x + 28y = 1680.<br>Subtracting: 6y = 300, so <b>y = 50</b>. Then x = 1380 − 1100 = <b>280</b>.<br>Fixed charge = <b>Rs 280</b>; food cost = <b>Rs 50 per day</b>.`);
sa(20,[2025],`The ratio of income 2 persons is 9 : 7 and the ratio of their expenditure is 4 : 3, if each of them manage to save Rs.5000/ month. Find their monthly incomes.`,`Let the incomes be 9k and 7k and the expenditures 4m and 3m.<br>9k − 4m = 5000 and 7k − 3m = 5000.<br>Multiply the first by 3 and the second by 4: 27k − 12m = 15000 and 28k − 12m = 20000. Subtracting: k = 5000.<br>The incomes are <b>Rs 45000</b> and <b>Rs 35000</b>. (Check: expenditures are 40000 and 30000, so each saves 5000 ✓.)`);
sa(21,[],`A shop keeper gives books on rent for reading. She takes a fixed charge for first two days and an additional charge for each day thereafter. Latika paid Rs 22 for a book kept for six days, while Anand paid Rs 16 for the book kept for four days. Find the fixed charge and the charge for each extra day.`,`Let the fixed charge be Rs x and the extra charge per day be Rs y.<br>Six days: x + 4y = 22. Four days: x + 2y = 16.<br>Subtracting: 2y = 6, so <b>y = 3</b>. Then x = 16 − 6 = <b>10</b>.<br>Fixed charge = <b>Rs 10</b>; each extra day = <b>Rs 3</b>.`);
sa(22,[2023],`Places A and B are 100 km apart on a highway. One car starts from A and another from B at the same time. If the cars travel in the same direction at different speeds, they meet in 5 hours. If they travel towards each other, they meet in 1 hour. What are the speeds of the two cars?`,`Let the speeds be x km/h and y km/h (x > y).<br>Same direction: the faster car gains 100 km in 5 h, so 5(x − y) = 100, i.e. x − y = 20.<br>Towards each other: 1 × (x + y) = 100, i.e. x + y = 100.<br>Adding: 2x = 120, so <b>x = 60</b> and <b>y = 40</b>.<br>The speeds are <b>60 km/h and 40 km/h</b>.`);
sa(23,[],`A train covered a certain distance at a uniform speed. If the train would have been 6 km/hr faster, it would have taken 4 hours less than the scheduled time. And if the train were slower by 6 km/hr, it would have taken 6 hours more than the scheduled time. Find the length of the journey.`,`Let the speed be x km/h, the scheduled time t hours, so the distance is xt.<br>(x + 6)(t − 4) = xt gives −4x + 6t − 24 = 0, i.e. 3t − 2x = 12.<br>(x − 6)(t + 6) = xt gives 6x − 6t − 36 = 0, i.e. x − t = 6.<br>Substituting x = t + 6: 3t − 2t − 12 = 12, so t = 24 and x = 30.<br>Distance = 30 × 24 = <b>720 km</b>.`);
sa(24,[],`Anuj had some chocolates and he divided them into two lots A and B. He sold the first lot at the rate of Rs 2 for 3 chocolates and the second lot at the rate of Re 1 per chocolate and got a total of Rs 400. If he had sold the first lot at the rate of Re 1 per chocolate and the second lot at the rate of Rs 4 for 5 chocolates, his total collection would have been Rs 460. Find the total number of chocolates he had.`,`Let lot A have x chocolates and lot B have y chocolates.<br>First case: [[2x|3]] + y = 400, i.e. 2x + 3y = 1200. Second case: x + [[4y|5]] = 460, i.e. 5x + 4y = 2300.<br>Multiply the first by 5 and the second by 2: 10x + 15y = 6000 and 10x + 8y = 4600. Subtracting: 7y = 1400, so y = 200. Then 2x = 1200 − 600, so x = 300.<br>Total chocolates = 300 + 200 = <b>500</b>.`);
sa(25,[2024],`Meena went to a bank to withdraw Rs.2000. She asked the cashier to give her Rs.50 and Rs. 100 notes only. Meena got 25 notes in all. How many notes of Rs. 50 and Rs.100 she received?`,`Let there be x notes of Rs 50 and y notes of Rs 100. x + y = 25 and 50x + 100y = 2000, i.e. x + 2y = 40.<br>Subtracting: y = 15, so x = 10.<br>She received <b>10 notes of Rs 50</b> and <b>15 notes of Rs 100</b>.`);
sa(26,[],`A man wished to give Rs.12 to each person and found that he fell short of Rs. 6 when he wanted to give to all the persons present. He therefore, distributed Rs.9 to each person and found that Rs.9 were left over. How much money did he have and how many persons were there?`,`Let the man have Rs M and let there be n persons.<br>12n = M + 6 and 9n = M − 9.<br>Subtracting: 3n = 15, so <b>n = 5</b>. Then M = 12 × 5 − 6 = <b>54</b>.<br>He had <b>Rs 54</b> and there were <b>5 persons</b>.`);
sa(27,[2023],`A father’s age is three times the sum of the ages of his children. After 5 years, his age will be two times the sum of their ages. Find the present age of the father.`,`(Taking the father to have two children, as in the standard problem.)<br>Let the father’s age be x and the sum of the children’s ages be y. x = 3y. After 5 years: x + 5 = 2(y + 10).<br>3y + 5 = 2y + 20, so y = 15 and x = 45.<br>The father’s present age is <b>45 years</b>.`);
sa(28,[2024],`Three years ago, Rashmi was thrice as old as Namza. Ten years later, Rashmi will be twice as old as Namza. How old are Rashmi and Namza now?`,`Let Rashmi be x years and Namza y years now.<br>x − 3 = 3(y − 3), i.e. x − 3y = −6. x + 10 = 2(y + 10), i.e. x − 2y = 10.<br>Subtracting: y = 16, so x = 42.<br>Rashmi is <b>42 years</b> and Namza is <b>16 years</b> old.`);
sa(29,[2024],`In a chemistry lab, there is some quantity of 50% acid solution and some quantity of 25% acid solution. How much of each should be mixed to make 10 liters of 40% acid solution?`,`Let x litres of 50% solution and y litres of 25% solution be mixed.<br>x + y = 10 and 0.5x + 0.25y = 0.4 × 10 = 4, i.e. 2x + y = 16.<br>Subtracting: x = 6, so y = 4.<br>Mix <b>6 litres of 50%</b> solution with <b>4 litres of 25%</b> solution.`);
sa(30,[2025],`The two angles of a right angled triangle other than 90° are in the ratio 2 : 3. Express the given situation algebraically as a system of linear equations in two variables and hence solve it.`,`Let the two acute angles be x and y. The angle sum gives x + y + 90 = 180, i.e. <b>x + y = 90</b>. The ratio gives [[x|y]] = [[2|3]], i.e. <b>3x − 2y = 0</b>.<br>From the second, y = [[3x|2]]. Then x + [[3x|2]] = 90, so x = 36 and y = 54.<br>The angles are <b>36° and 54°</b>.`);
sa(31,[2025],`The perimeter of a rectangle is 70 cm. The length of the rectangle is 5 cm more than twice its breadth. Express the given situation as a system of linear equations in two variables and hence solve it.`,`Let the length be x cm and the breadth y cm. The perimeter gives 2(x + y) = 70, i.e. <b>x + y = 35</b>. The length condition gives <b>x = 2y + 5</b>.<br>Then 2y + 5 + y = 35, so y = 10 and x = 25.<br>Length = <b>25 cm</b>, breadth = <b>10 cm</b>.`);

/* ===== 5 marks ===== */
la(1,[],`For what value of k, which the following pair of linear equations have infinitely many solutions: 2x + 3y = 7 and (k + 1)x + (2k − 1)y = 4k + 1.`,`[[2|k + 1]] = [[3|2k − 1]] = [[7|4k + 1]].<br>[[2|k + 1]] = [[3|2k − 1]] gives 4k − 2 = 3k + 3, so k = 5.<br>Check: [[2|6]] = [[3|9]] = [[7|21]] = [[1|3]] ✓. So <b>k = 5</b>.`);
la(2,[],`For what value of a and b does the following pair of linear equations have infinitely many solutions: 2x + 3y = 7, a(x + y) − b(x − y) = 3a + b − 2.`,`Rewrite the second equation: (a − b)x + (a + b)y = 3a + b − 2.<br>[[2|a − b]] = [[3|a + b]] = [[7|3a + b − 2]].<br>[[2|a − b]] = [[3|a + b]] gives 2a + 2b = 3a − 3b, so a = 5b.<br>[[3|a + b]] = [[7|3a + b − 2]] gives 9a + 3b − 6 = 7a + 7b, so a − 2b = 3.<br>Substituting a = 5b: 3b = 3, so <b>b = 1</b> and <b>a = 5</b>.<br>Check: [[2|4]] = [[3|6]] = [[7|14]] = [[1|2]] ✓.`);
la(3,[],`Find the value of p and q for which the system of equations represent coincident lines 2x + 3y = 7 and (p + q + 1)x + (p + 2q + 2)y = 4(p + q) + 1.`,`Coincident lines: [[2|p + q + 1]] = [[3|p + 2q + 2]] = [[7|4(p + q) + 1]].<br>[[2|p + q + 1]] = [[3|p + 2q + 2]] gives 2p + 4q + 4 = 3p + 3q + 3, so p − q = 1.<br>[[3|p + 2q + 2]] = [[7|4p + 4q + 1]] gives 12p + 12q + 3 = 7p + 14q + 14, so 5p − 2q = 11.<br>Substituting p = q + 1: 5q + 5 − 2q = 11, so q = 2 and p = 3.<br>So <b>p = 3, q = 2</b>. Check: [[2|6]] = [[3|9]] = [[7|21]] ✓.`);
la(4,[],`Solve for x and y: 2x − y + 3 = 0 and 3x − 5y + 1 = 0.`,`From the first equation, y = 2x + 3. Substituting into the second: 3x − 5(2x + 3) + 1 = 0, so −7x − 14 = 0 and <b>x = −2</b>.<br>Then y = 2(−2) + 3 = <b>−1</b>.<br>Check: 3(−2) − 5(−1) + 1 = 0 ✓.`);
la(5,[2024],`Solve graphically: 3x − 4y + 3 = 0 and 3x + 4y − 21 = 0.`,`3x − 4y + 3 = 0: y = [[3x + 3|4]]. Points: (−1, 0), (3, 3), (7, 6).<br>3x + 4y − 21 = 0: y = [[21 − 3x|4]]. Points: (7, 0), (3, 3), (−1, 6).<br>The lines meet at (3, 3), so the solution is <b>x = 3, y = 3</b>.<div class="fig">${A5}</div>`);
la(6,[],`Draw the graph of the equations x − y + 1 = 0 and 3x + 2y − 12 = 0. Determine the coordinates of the vertices of the triangle formed by these lines and the X-axis and shade the triangular region.`,`x − y + 1 = 0: points (−1, 0), (0, 1), (2, 3). 3x + 2y − 12 = 0: points (4, 0), (0, 6), (2, 3).<br>The lines meet at (2, 3). The first line meets the x-axis at (−1, 0) and the second at (4, 0).<br>Vertices of the triangle: <b>(−1, 0), (4, 0) and (2, 3)</b>.<div class="fig">${A6}</div>`);
la(7,[],`Solve the pair of linear equations graphically: x + 3y = 12, 2x − 3y = 12. Also shade the region bounded by the line 2x − 3y = 2 and both the coordinate axes.`,`x + 3y = 12: points (12, 0), (0, 4), (6, 2). 2x − 3y = 12: points (6, 0), (0, −4), (9, 2).<br>The lines meet at (8, [[4|3]]), so the solution is <b>x = 8, y = [[4|3]]</b>.<br>2x − 3y = 2 meets the x-axis at (1, 0) and the y-axis at (0, −[[2|3]]). The region bounded by this line and the two axes is the triangle with vertices (0, 0), (1, 0) and (0, −[[2|3]]), shaded in the figure.<br>(The question as printed gives “2x − 3y = 2”; I have used it as printed.)<div class="fig">${A7}</div>`);
la(8,[],`Solve the pair of linear equations graphically: x − y = 1, 2x + y = 8. Also find the coordinates of the points where the lines represented by the above equation intersect y-axis.`,`x − y = 1: points (1, 0), (0, −1), (3, 2). 2x + y = 8: points (4, 0), (0, 8), (3, 2).<br>The lines meet at (3, 2), so the solution is <b>x = 3, y = 2</b>.<br>They meet the y-axis at <b>(0, −1)</b> and <b>(0, 8)</b>.<div class="fig">${A8}</div>`);
la(9,[2024],`The area of rectangle gets reduced by 80 square units, if its length is reduced by 5 units and breadth is increased by 2 units. If we increase the length by 10 units and decrease the breadth by 5 units, the area increases by 50 square units. Find the dimensions of the rectangle.`,`Let the length be x and the breadth y, so the area is xy.<br>(x − 5)(y + 2) = xy − 80 gives 2x − 5y − 10 = −80, i.e. 2x − 5y = −70.<br>(x + 10)(y − 5) = xy + 50 gives −5x + 10y − 50 = 50, i.e. −x + 2y = 20.<br>From the second, x = 2y − 20. Then 4y − 40 − 5y = −70, so y = 30 and x = 40.<br>Length = <b>40 units</b>, breadth = <b>30 units</b>.<br>(Check: 35 × 32 = 1120 = 1200 − 80 ✓ and 50 × 25 = 1250 = 1200 + 50 ✓.)`);
la(10,[2023,2024],`Yash scored 40 marks in a test, getting 3 marks for each right answer and losing 1 mark for each wrong answer. Had 4 marks been awarded for each correct answer and 2 marks been deducted for each incorrect answer, then Yash would have scored 50 marks. How many questions were there in the test?`,`Let Yash answer x questions correctly and y incorrectly.<br>3x − y = 40 and 4x − 2y = 50, i.e. 2x − y = 25.<br>Subtracting: x = 15. Then y = 3(15) − 40 = 5.<br>Total questions = 15 + 5 = <b>20</b>.`);
la(11,[2024],`If three times the greater of two numbers is divided by the smaller one, we get 4 as the quotient and 3 as the remainder. Also, if seven times the smaller number is divided by greater one, we get 5 as the quotient and 1 as the remainder. Find the numbers.`,`Let the greater number be x and the smaller y.<br>Dividend = divisor × quotient + remainder: 3x = 4y + 3 and 7y = 5x + 1.<br>From the first, x = [[4y + 3|3]]. Substituting: 7y = [[5(4y + 3)|3]] + 1, so 21y = 20y + 15 + 3, giving y = 18. Then x = [[72 + 3|3]] = 25.<br>The numbers are <b>25 and 18</b>.<br>(Check: 75 = 4 × 18 + 3 ✓ and 126 = 5 × 25 + 1 ✓.)`);
la(12,[2025],`A man lent a part of his money at 10% p.a. and the rate at 15% p.a. His income at the end of the year is Rs 1900. If he had interchanged the rate of interest on the two sums, he would have earned Rs 200 more. Find the amount lent in both cases.`,`Let Rs x be lent at 10% and Rs y at 15% (the rest of the money).<br>0.10x + 0.15y = 1900, i.e. 2x + 3y = 38000.<br>Interchanged: 0.15x + 0.10y = 2100, i.e. 3x + 2y = 42000.<br>Adding: 5(x + y) = 80000, so x + y = 16000. Subtracting: x − y = 4000.<br>So <b>x = Rs 10000</b> (at 10%) and <b>y = Rs 6000</b> (at 15%).<br>(Check: 1000 + 900 = 1900 ✓ and 1500 + 600 = 2100 ✓.)`);
la(13,[2025],`Vijay invested certain amounts of money in two schemes A and B, which offer interest at the rate of 8% per annum and 9% per annum respectively. He received Rs 1860 as the total annual interest. However, had he interchanged the amounts of investments in the two schemes, he would have received Rs 20 more as annual interest. How much money did he invest in each scheme?`,`Let Rs x be invested in A (8%) and Rs y in B (9%).<br>0.08x + 0.09y = 1860, i.e. 8x + 9y = 186000.<br>Interchanged: 0.09x + 0.08y = 1880, i.e. 9x + 8y = 188000.<br>Adding: 17(x + y) = 374000, so x + y = 22000. Subtracting the first from the second: x − y = 2000.<br>So <b>x = Rs 12000</b> in scheme A and <b>y = Rs 10000</b> in scheme B.<br>(Check: 960 + 900 = 1860 ✓ and 1080 + 800 = 1880 ✓.)`);
la(14,[2025],`The perimeter of an isosceles triangle is 32 cm. If equal side is [[5^{th}|6]] of the base, find the area of the triangle.`,`Let each equal side be x cm and the base y cm. 2x + y = 32 and x = [[5|6]]y.<br>Then [[5y|3]] + y = 32, so [[8y|3]] = 32 and y = 12. Then x = 10.<br>Height on the base = √{10^{2} − 6^{2}} = √{64} = 8 cm.<br>Area = [[1|2]] × 12 × 8 = <b>48 cm²</b>.`);
la(15,[2025],`The students of a class are made to stand equally in rows. If 3 students are extra in each row, there would be 1 row less. If 3 students are less in a row, there would be 2 more rows. Find the number of students in the class.`,`Let there be x students in each row and y rows, so the class has xy students.<br>(x + 3)(y − 1) = xy gives 3y − x − 3 = 0, so x = 3y − 3.<br>(x − 3)(y + 2) = xy gives 2x − 3y − 6 = 0.<br>Substituting: 6y − 6 − 3y − 6 = 0, so y = 4 and x = 9.<br>Number of students = 9 × 4 = <b>36</b>.`);
la(16,[2025],`A bag contains some red and blue balls. Ten percent of the red balls, when added to twenty percent of the blue balls, give a total of 24. If three times the number of red balls exceeds the number of blue balls by 20, find the number of red balls and blue balls.`,`Let there be x red balls and y blue balls.<br>0.1x + 0.2y = 24, i.e. x + 2y = 240. And 3x − y = 20, so y = 3x − 20.<br>x + 6x − 40 = 240, so x = 40 and y = 100.<br>There are <b>40 red balls</b> and <b>100 blue balls</b>.<br>(Check: 4 + 20 = 24 ✓ and 120 − 100 = 20 ✓.)`);

/* ===== Case-based ===== */
cs(1,[2023],`Two schools ‘P’ and ‘Q’ decided to award prizes to their students for two games of Hockey Rs x per student and Cricket Rs y per student. School ‘P’ decided to award a total of Rs 9,500 for the two games to 5 and 4 students respectively; while school ‘Q’ decided to award Rs 7,370 for the two games to 4 and 3 students respectively.`,[
  {l:'(i)',m:1,q:`Represent the following information algebraically (in terms of x and y).`},
  {l:'(ii)',m:2,q:`(a) What is the prize amount for hockey?`,or:`(b) Prize amount on which game is more and by how much?`},
  {l:'(iii)',m:1,q:`What will be the total prize amount if there are 2 students each from two games?`}
],`<b>(i)</b> 5x + 4y = 9500 and 4x + 3y = 7370.<br><b>(ii)(a)</b> Multiply the first by 3 and the second by 4: 15x + 12y = 28500 and 16x + 12y = 29480. Subtracting: x = 980. The prize for hockey is <b>Rs 980</b>.<br>(OR) <b>(b)</b> y = [[9500 − 4900|4]] = 1150. Cricket’s prize is more, by 1150 − 980 = <b>Rs 170</b>.<br><b>(iii)</b> Total = 2x + 2y = 2(980 + 1150) = <b>Rs 4260</b>.`);
cs(2,[2023],`A coaching institute of Mathematics conducts classes in two batches I and II and fees for rich and poor children are different. In batch I, there are 20 poor and 5 rich children, whereas in batch II, there are 5 poor and 25 rich children. The total monthly collection of fees from batch I is Rs 9000 and from batch II is Rs 26000. Assume that each poor child pays Rs x per month and each rich child pays Rs y per month. Based on the above information answer the following questions:`,[
  {l:'(i)',m:1,q:`Represent the situation in terms of x and y.`},
  {l:'(ii)',m:2,q:`Find the monthly fee paid by a poor child.`,or:`Find the difference in the monthly fee paid by a poor child and a rich child.`},
  {l:'(iii)',m:1,q:`If there are 10 poor and 20 rich children in batch II, what is the total monthly collection of fees from batch II?`}
],`<b>(i)</b> 20x + 5y = 9000 (i.e. 4x + y = 1800) and 5x + 25y = 26000.<br><b>(ii)</b> From 4x + y = 1800, y = 1800 − 4x. Then 5x + 25(1800 − 4x) = 26000, so 45000 − 95x = 26000 and x = 200. A poor child pays <b>Rs 200</b>. (OR) y = 1800 − 800 = 1000, so the difference is 1000 − 200 = <b>Rs 800</b>.<br><b>(iii)</b> 10x + 20y = 2000 + 20000 = <b>Rs 22000</b>.`);
cs(3,[2025],`A school is organizing a grand cultural event to show the talent of its students. To accommodate the guests, the school plans to rent chairs and tables from a local supplier. It finds that rent for each chair is Rs 50 and for each table is Rs 200. The school spends Rs 30,000 for renting the chairs and tables. Also, the total number of items (chairs and tables) rented are 300. If the school rents ‘x’ chairs and ‘y’ tables, answer the following questions:`,[
  {l:'(i)',m:1,q:`Write down the pair of linear equations representing the given information.`},
  {l:'(ii)',m:2,q:`(a) Find the number of chairs and tables rented by the school.`,or:`(b) If the school wants to spend a maximum of Rs 27,000 on 300 items (tables and chairs) then find the number of chairs and tables it can rent.`},
  {l:'(iii)',m:1,q:`What is maximum number of tables that can be rented in Rs 30,000 if no chairs are rented?`}
],`<b>(i)</b> x + y = 300 and 50x + 200y = 30000 (i.e. x + 4y = 600).<br><b>(ii)(a)</b> Subtracting: 3y = 300, so y = 100 and x = 200. The school rents <b>200 chairs and 100 tables</b>.<br>(OR) <b>(b)</b> 50x + 200y = 27000 gives x + 4y = 540. With x + y = 300: 3y = 240, so y = 80 and x = 220. It can rent <b>220 chairs and 80 tables</b>.<br><b>(iii)</b> 30000 ÷ 200 = <b>150 tables</b>.`);
cs(4,[],`Masks are an additional step to help prevent people from getting and spreading COVID-19. They provide a barrier that keeps respiratory droplets from spreading. Wear a mask and take every day preventive actions in public settings. Due to ongoing Corona virus outbreak, Wellness Medical store has started selling masks of decent quality. The store is selling two types of masks currently type A and type B. The cost of type A mask is Rs. 15 and of type B mask is Rs. 20. In the month of April, 2020, the store sold 100 masks for total sales of Rs. 1650.`,[
  {l:'(i)',m:1,q:`How many masks of each type were sold in the month of April? If the store had sold 50 masks of each type, what would be its sales in the month of April?`},
  {l:'(ii)',m:1,q:`Due to great demand and short supply, the store has increased the price of each type by Rs. 5 from May 1, 2020. In the month of May, 2020, the store sold 310 masks for total sales of Rs. 6875. How many masks of each type were sold in the month of May?`},
  {l:'(iii)',m:2,q:`What percent of masks of each type sale was increased in the month of May, compared with the sale of month April?`,or:`What extra profit did store earn by increasing price in May month.`}
],`<b>(i)</b> Let there be x masks of type A and y of type B. x + y = 100 and 15x + 20y = 1650. Then 15x + 20(100 − x) = 1650, so 2000 − 5x = 1650 and x = 70. So <b>70 of type A and 30 of type B</b>. If 50 of each were sold: 50 × 15 + 50 × 20 = <b>Rs 1750</b>.<br><b>(ii)</b> New prices: Rs 20 and Rs 25. x + y = 310 and 20x + 25y = 6875. Then 20x + 25(310 − x) = 6875, so 7750 − 5x = 6875 and x = 175. So <b>175 of type A and 135 of type B</b>.<br><b>(iii)</b> Type A: increase = 175 − 70 = 105, so [[105|70]] × 100 = <b>150%</b>. Type B: increase = 135 − 30 = 105, so [[105|30]] × 100 = <b>350%</b>.<br>(OR) Each of the 310 masks was sold for Rs 5 more, so the extra amount = 310 × 5 = <b>Rs 1550</b>.`);
cs(5,[],`Varsha is a licensed architect and design very innovative house. She has made a house layout for her client which is given below. In the layout, the design and measurements has been made such that area of two bedrooms and kitchen together is 95 sq. m.`,[
  {l:'(i)',m:1,q:`Which pair of linear equations does describe this situation?`},
  {l:'(ii)',m:1,q:`What is the length of the outer boundary of the layout.`},
  {l:'(iii)',m:2,q:`What is the area of bedroom 1? What is the area of living room in the layout?`,or:`What is the cost of laying tiles in Kitchen at the rate of Rs. 50 per sq. m?`}
],`From the layout, the width gives x + 2 + y = 15, i.e. x + y = 13. Bedroom 1 is 5x, the kitchen is 5y and Bedroom 2 is 5x (same width as Bedroom 1), so 5x + 5y + 5x = 95, i.e. 2x + y = 19. Subtracting: x = 6 and y = 7.<br><b>(i)</b> <b>x + y = 13 and 2x + y = 19</b>.<br><b>(ii)</b> The layout is 15 m wide and 5 + 2 + 5 = 12 m tall. Boundary = 2(15 + 12) = <b>54 m</b>.<br><b>(iii)</b> Area of Bedroom 1 = 5 × 6 = <b>30 m²</b>. Total area = 15 × 12 = 180 m². Taking the 2 m passage as part of the living room: living room = 5 × (15 − 6) + 2 × 15 = 45 + 30 = <b>75 m²</b>. (Check: 180 − [30 + 10 + 35 + 30] = 75 ✓.)<br>(OR) Kitchen area = 5 × 7 = 35 m², so the cost = 35 × 50 = <b>Rs 1750</b>.`,{fig:HL});
cs(6,[2024],`Mr. RK Agrawal is owner of a famous amusement park in Delhi. The ticket charge for the park is Rs 150 for children and Rs 400 for adult. Generally he does not go to park and it is managed by team of staff. One day Mr Agrawal decided to random check the park and went there. When he checked the cash counter, he found that 480 tickets were sold and Rs 134500 was collected.`,[
  {l:'(i)',m:1,q:`Let the number of children visited be x and the number of adults visited be y. Which of the following is the correct system of equations that model the problem?`},
  {l:'(ii)',m:1,q:`How many children visited the park? How many adults visited the park?`},
  {l:'(iii)',m:2,q:`How much amount collected if 300 children and 350 adults visited the park?`,or:`One day total visited children and adults together are 750 and the total amount collected is Rs 212500. What are the number of children and adults visited the park?`}
],`<b>(i)</b> x + y = 480 and 150x + 400y = 134500 (i.e. 3x + 8y = 2690).<br><b>(ii)</b> From x = 480 − y: 3(480 − y) + 8y = 2690, so 1440 + 5y = 2690 and y = 250. Then x = 230. <b>230 children and 250 adults</b> visited.<br><b>(iii)</b> 300 × 150 + 350 × 400 = 45000 + 140000 = <b>Rs 185000</b>.<br>(OR) x + y = 750 and 150x + 400y = 212500, i.e. 3x + 8y = 4250. Then 3(750 − y) + 8y = 4250, so 2250 + 5y = 4250 and y = 400, x = 350. <b>350 children and 400 adults</b>.`);

/* ===== Chapter 3: extra case-based (practice) ===== */
cs(7,[],`A taxi company charges a fixed amount for the first booking and then a fixed charge for every kilometre travelled. For a journey of 10 km, the fare is Rs 105 and for a journey of 15 km, the fare is Rs 155. Let the fixed amount be Rs x and the charge per km be Rs y.`,[
  {l:'(i)',m:1,q:`Represent the situation algebraically in terms of x and y.`},
  {l:'(ii)',m:1,q:`Find the fixed amount and the charge per kilometre.`},
  {l:'(iii)',m:2,q:`(a) Find the fare for a journey of 25 km.`,or:`(b) For how many kilometres can a passenger travel for a fare of Rs 305?`}
],`<b>(i)</b> x + 10y = 105 and x + 15y = 155.<br><b>(ii)</b> Subtracting: 5y = 50, so y = 10. Then x = 105 − 100 = 5. Fixed amount = <b>Rs 5</b>; charge per km = <b>Rs 10</b>.<br><b>(iii)(a)</b> Fare = 5 + 25 × 10 = <b>Rs 255</b>.<br>(OR) <b>(b)</b> 5 + 10d = 305, so d = <b>30 km</b>.`);
cs(8,[],`A boat covers 24 km downstream in 2 hours and 16 km upstream in 2 hours. Let the speed of the boat in still water be x km/h and the speed of the stream be y km/h.`,[
  {l:'(i)',m:1,q:`Write the pair of linear equations for this situation.`},
  {l:'(ii)',m:1,q:`Find the speed of the boat in still water and the speed of the stream.`},
  {l:'(iii)',m:2,q:`(a) How long will the boat take to cover 30 km downstream?`,or:`(b) How long will the boat take to cover 20 km upstream?`}
],`<b>(i)</b> Downstream speed = x + y = [[24|2]] = 12 and upstream speed = x − y = [[16|2]] = 8. So x + y = 12 and x − y = 8.<br><b>(ii)</b> Adding: 2x = 20, so x = 10. Then y = 2. Boat: <b>10 km/h</b>; stream: <b>2 km/h</b>.<br><b>(iii)(a)</b> Downstream speed = 12 km/h, so time = [[30|12]] = <b>2.5 hours</b>.<br>(OR) <b>(b)</b> Upstream speed = 8 km/h, so time = [[20|8]] = <b>2.5 hours</b>.`);
cs(9,[],`In a school canteen, 2 samosas and 3 cups of tea cost Rs 70, while 3 samosas and 2 cups of tea cost Rs 80. Let the price of a samosa be Rs x and the price of a cup of tea be Rs y.`,[
  {l:'(i)',m:1,q:`Represent the situation algebraically.`},
  {l:'(ii)',m:1,q:`Find the price of a samosa and the price of a cup of tea.`},
  {l:'(iii)',m:2,q:`(a) Find the cost of 4 samosas and 5 cups of tea.`,or:`(b) How much more does a samosa cost than a cup of tea?`}
],`<b>(i)</b> 2x + 3y = 70 and 3x + 2y = 80.<br><b>(ii)</b> Adding: 5x + 5y = 150, so x + y = 30. Subtracting: x − y = 10. So x = 20 and y = 10. A samosa costs <b>Rs 20</b> and a cup of tea <b>Rs 10</b>.<br><b>(iii)(a)</b> 4 × 20 + 5 × 10 = <b>Rs 130</b>.<br>(OR) <b>(b)</b> 20 − 10 = <b>Rs 10</b> more.`);
cs(10,[],`The graph of a pair of linear equations x + y = 6 and x − y = 2 is shown. Use it to answer the questions.`,[
  {l:'(i)',m:1,q:`Are the lines parallel, intersecting or coincident?`},
  {l:'(ii)',m:1,q:`Write the coordinates of the point of intersection. What is the solution of the pair?`},
  {l:'(iii)',m:2,q:`(a) Find the area of the triangle formed by the two lines and the y-axis.`,or:`(b) Write the coordinates of the points where the two lines meet the x-axis.`}
],`<b>(i)</b> [[1|1]] ≠ [[1|−1]], so the lines are <b>intersecting</b>.<br><b>(ii)</b> They meet at <b>(4, 2)</b>, so the solution is <b>x = 4, y = 2</b>.<br><b>(iii)(a)</b> On the y-axis the lines meet at (0, 6) and (0, −2). Base along the y-axis = 6 − (−2) = 8; height = distance of (4, 2) from the y-axis = 4. Area = [[1|2]] × 8 × 4 = <b>16 square units</b>.<br>(OR) <b>(b)</b> x + y = 6 meets the x-axis at <b>(6, 0)</b>; x − y = 2 meets it at <b>(2, 0)</b>.`,{fig:C10});

la(17,[],`Solve for x and y: [[2|x]] + [[3|y]] = 13 and [[5|x]] − [[4|y]] = −2.`,`Put u = [[1|x]] and v = [[1|y]]. Then 2u + 3v = 13 and 5u − 4v = −2.<br>Multiply the first by 4 and the second by 3: 8u + 12v = 52 and 15u − 12v = −6. Adding: 23u = 46, so u = 2. Then 3v = 13 − 4 = 9, so v = 3.<br>Hence <b>x = [[1|2]]</b> and <b>y = [[1|3]]</b>.<br>(Check: [[2|1/2]] + [[3|1/3]] = 4 + 9 = 13 ✓ and 10 − 12 = −2 ✓.)`);
la(18,[],`A boat goes 30 km upstream and 44 km downstream in 10 hours. In 13 hours, it can go 40 km upstream and 55 km downstream. Determine the speed of the stream and that of the boat in still water.`,`Let the speed of the boat in still water be x km/h and the speed of the stream y km/h. Upstream speed = x − y, downstream speed = x + y.<br>[[30|x − y]] + [[44|x + y]] = 10 and [[40|x − y]] + [[55|x + y]] = 13.<br>Put p = [[1|x − y]] and q = [[1|x + y]]: 30p + 44q = 10 and 40p + 55q = 13.<br>Multiply the first by 4 and the second by 3: 120p + 176q = 40 and 120p + 165q = 39. Subtracting: 11q = 1, so q = [[1|11]]. Then 30p = 10 − 4 = 6, so p = [[1|5]].<br>So x − y = 5 and x + y = 11. Hence <b>x = 8</b> and <b>y = 3</b>.<br>The boat’s speed in still water is <b>8 km/h</b> and the stream’s speed is <b>3 km/h</b>.`);
la(19,[],`For what values of k will the pair of equations kx + 3y = k − 3 and 12x + ky = k have (a) infinitely many solutions, (b) no solution, (c) a unique solution?`,`Here [[a_{1}|a_{2}]] = [[k|12]], [[b_{1}|b_{2}]] = [[3|k]] and [[c_{1}|c_{2}]] = [[k − 3|k]].<br><b>(a) Infinitely many:</b> [[k|12]] = [[3|k]] = [[k − 3|k]]. The first equality gives k^{2} = 36, so k = ±6. The second equality [[3|k]] = [[k − 3|k]] gives k − 3 = 3, so k = 6. So <b>k = 6</b>.<br><b>(b) No solution:</b> [[k|12]] = [[3|k]] ≠ [[k − 3|k]]. So k = ±6 but k ≠ 6, giving <b>k = −6</b>. (Check: [[−6|12]] = −[[1|2]] = [[3|−6]], and [[−9|−6]] = [[3|2]] ≠ −[[1|2]] ✓.)<br><b>(c) Unique solution:</b> [[k|12]] ≠ [[3|k]], i.e. k^{2} ≠ 36. So <b>k ≠ 6 and k ≠ −6</b>.`);
la(20,[],`2 men and 5 boys can finish a piece of work in 4 days, while 3 men and 6 boys can finish it in 3 days. Find the time taken by 1 man alone and by 1 boy alone to finish the work.`,`Let 1 man alone take m days and 1 boy alone take b days. Put p = [[1|m]] and q = [[1|b]] (work done per day).<br>4(2p + 5q) = 1 gives 8p + 20q = 1. 3(3p + 6q) = 1 gives 9p + 18q = 1.<br>Multiply the first by 9 and the second by 8: 72p + 180q = 9 and 72p + 144q = 8. Subtracting: 36q = 1, so q = [[1|36]]. Then 8p = 1 − [[20|36]] = [[16|36]], so p = [[1|18]].<br>Hence <b>1 man alone takes 18 days</b> and <b>1 boy alone takes 36 days</b>.<br>(Check: 3 men and 6 boys do [[3|18]] + [[6|36]] = [[1|3]] of the work per day, so they need 3 days ✓.)`);
la(21,[],`Draw the graphs of 2x + y = 6 and 2x − y + 2 = 0. Shade the region bounded by these two lines and the x-axis, and find its area.`,`2x + y = 6: points (0, 6), (3, 0), (1, 4). 2x − y + 2 = 0: points (0, 2), (−1, 0), (1, 4).<br>The lines meet at (1, 4). The first meets the x-axis at (3, 0) and the second at (−1, 0).<br>The shaded triangle has vertices (−1, 0), (3, 0) and (1, 4). Base = 3 − (−1) = 4 and height = 4, so area = [[1|2]] × 4 × 4 = <b>8 square units</b>.<div class="fig">${A21}</div>`);

mcq(1,[],`The quadratic equation (x^{2} + 1)^{2} − x^{2} = 0 has`,['Four real roots','No real roots','two real roots','one real root'],1,`(x^{2} + 1)^{2} − x^{2} = (x^{2} + 1 − x)(x^{2} + 1 + x). Both x^{2} − x + 1 and x^{2} + x + 1 have discriminant 1 − 4 = −3 < 0, so there are no real roots.`);
mcq(2,[],`The quadratic equation 2x^{2} − √{5}x + 1 = 0 has`,['Two distinct real roots','No real roots','two equal real roots','more than 2 real roots'],1,`D = (√{5})^{2} − 4(2)(1) = 5 − 8 = −3 < 0, so there are no real roots.`);
mcq(3,[],`The quadratic equation 2x^{2} − 3√{2}x + [[9|4]] = 0 has`,['Two distinct real roots','No real roots','two equal real roots','more than 2 real roots'],2,`D = 18 − 4 × 2 × [[9|4]] = 18 − 18 = 0, so the roots are real and equal.`);
mcq(4,[],`The quadratic equation x^{2} + 3x + 2√{2} = 0 has`,['Two distinct real roots','No real roots','two equal real roots','more than 2 real roots'],1,`D = 9 − 8√{2} ≈ 9 − 11.3 < 0, so there are no real roots.`);
mcq(5,[2024],`The quadratic equation 5x^{2} − 3x + 1 = 0 has`,['Two distinct real roots','No real roots','two equal real roots','more than 2 real roots'],1,`D = 9 − 20 = −11 < 0, so there are no real roots.`);
mcq(6,[],`Nature of roots of quadratic equations 2x^{2} − 4x + 3 = 0 is`,['Real','equal','not real','none of them'],2,`D = 16 − 24 = −8 < 0, so the roots are not real.`);
mcq(7,[2023],`The roots of the quadratic equation x^{2} − 0.04 = 0 are`,['± 0.2','± 0.02','0.4','2'],0,`x^{2} = 0.04, so x = ±0.2.`);
mcq(8,[2025],`If [[x|12]] − [[3|x]] = 0 then the values of x are`,['±6','±4','±12','±3'],0,`[[x|12]] = [[3|x]] gives x^{2} = 36, so x = ±6.`);
mcq(9,[],`What is the positive real root of 64x^{2} − 1 = 0?`,['[[1|8]]','[[1|4]]','[[1|2]]','[[1|6]]'],0,`x^{2} = [[1|64]], so the positive root is x = [[1|8]].`);
mcq(10,[],`The real roots of the equation x^{[[2|3]]} + x^{[[1|3]]} − 2 = 0 are`,['1, 8','−1, −8','−1, 8','1, −8'],3,`Put t = x^{[[1|3]]}: t^{2} + t − 2 = 0, so (t + 2)(t − 1) = 0 and t = 1 or t = −2. Then x = t^{3} = 1 or −8.`);
mcq(11,[2024],`If ½ is a root of the equation x^{2} + kx − [[5|4]] = 0, then the value of k is`,['2','−2','¼','½'],0,`[[1|4]] + [[k|2]] − [[5|4]] = 0, so [[k|2]] = 1 and k = 2.`);
mcq(12,[],`If r = 3 is a root of quadratic equation kr^{2} − kr − 3 = 0 then the value of k is`,['[[1|2]]','3','[[1|3]]','[[1|4]]'],0,`9k − 3k − 3 = 0, so 6k = 3 and k = [[1|2]].`);
mcq(13,[2023],`If x = 0.3 is a root of the equation x^{2} − 0.9k = 0 then k is`,['1','10','0.1','100'],2,`0.09 − 0.9k = 0, so k = 0.1.`);
mcq(14,[],`If p is the root of the equation x^{2} − (p + q)x + k = 0 then the value of k is`,['p','q','p + q','pq'],3,`p^{2} − (p + q)p + k = 0 gives p^{2} − p^{2} − pq + k = 0, so k = pq.`);
mcq(15,[2024],`If the roots of the equation ax^{2} + bx + c = 0, a ≠ 0 are real and equal then which of the following relation is true?`,['a = [[b^{2}|c]]','b^{2} = ac','ac = [[b^{2}|4]]','c = [[b^{2}|a]]'],2,`Equal roots need b^{2} − 4ac = 0, i.e. ac = [[b^{2}|4]].`);
mcq(16,[],`If the quadratic equation x^{2} + 4x + k = 0 has real and equal roots, then`,['k < 4','k > 4','k = 4','k ≥ 4'],2,`D = 16 − 4k = 0, so k = 4.`);
mcq(17,[],`Value(s) of k for which the quadratic equation 2x^{2} − kx + k = 0 has equal roots is/are`,['0','4','8','0, 8'],3,`D = k^{2} − 8k = k(k − 8) = 0, so k = 0 or k = 8.`);
mcq(18,[2023],`Find the value of k for which the equation x^{2} + k(2x + k − 1) + 2 = 0 has real and equal roots.`,['2','3','4','5'],0,`The equation is x^{2} + 2kx + (k^{2} − k + 2) = 0. D = 4k^{2} − 4(k^{2} − k + 2) = 4k − 8 = 0, so k = 2.`);
mcq(19,[2025],`The value of ‘a’ for which ax^{2} + x + a = 0 has equal and positive roots is`,['2','−2','[[1|2]]','−[[1|2]]'],3,`D = 1 − 4a^{2} = 0, so a = ±[[1|2]]. The root is −[[1|2a]]. For a = [[1|2]] it is −1 (negative); for a = −[[1|2]] it is 1 (positive). So a = −[[1|2]].`);
mcq(20,[2025],`If x^{2} + bx + b = 0 has two real and distinct roots, then the value of b can be`,['0','4','3','−3'],3,`D = b^{2} − 4b = b(b − 4) > 0, so b < 0 or b > 4. Among the options only −3 works.`);
mcq(21,[],`If x^{2} + k(4x + k − 1) + 2 = 0 has equal roots, then k is`,['−[[2|3]], 1','[[2|3]], −1','[[3|2]], [[1|3]]','[[3|2]], −[[1|3]]'],1,`x^{2} + 4kx + (k^{2} − k + 2) = 0. D = 16k^{2} − 4(k^{2} − k + 2) = 12k^{2} + 4k − 8 = 0, so 3k^{2} + k − 2 = 0, i.e. (3k − 2)(k + 1) = 0. Hence k = [[2|3]] or k = −1.`);
mcq(22,[2023,2024],`If the quadratic equation ax^{2} + bx + c = 0 has two real and equal roots then c is`,['[[−b|2a]]','[[b|2a]]','[[−b^{2}|4a]]','[[b^{2}|4a]]'],3,`Equal roots: b^{2} = 4ac, so c = [[b^{2}|4a]].`);
mcq(23,[],`The quadratic equations x^{2} − 4x + k = 0 has distinct real roots if`,['k = 4','k > 4','k = 16','k < 4'],3,`D = 16 − 4k > 0, so k < 4.`);
mcq(24,[2023],`The least positive value of k for which the quadratic equation 2x^{2} + kx − 4 = 0 has rational roots, is`,['±2√{2}','2','±2','√{2}'],1,`D = k^{2} + 32 must be a perfect square. For k = 2: D = 36 = 6^{2}. The equation 2x^{2} + 2x − 4 = 0 has roots 1 and −2, which are rational. (k = 1 gives D = 33, not a square.) So k = 2.`);
mcq(25,[],`Let p be a prime number. The quadratic equation having its roots as factors of p is`,['x^{2} − px + p = 0','x^{2} + (p + 1)x + p = 0','x^{2} − (p + 1)x + p = 0','x^{2} − px + p + 1 = 0'],2,`The factors of a prime p are 1 and p. Sum = p + 1, product = p. Equation: x^{2} − (p + 1)x + p = 0.`);
mcq(26,[2025],`Which of the following equations is a quadratic equation?`,['x^{2} + 1 = (x − 1)^{2}','(x + √{x})^{2} = 2x√{x}','x^{3} + 3x^{2} = (x + 1)^{3}','(x + 1)(x − 1) = (x + 1)^{2}'],1,`(a) x^{2} + 1 = x^{2} − 2x + 1 gives 2x = 0 (linear). (b) x^{2} + 2x√{x} + x = 2x√{x} gives x^{2} + x = 0 (quadratic). (c) gives 3x + 1 = 0 (linear). (d) x^{2} − 1 = x^{2} + 2x + 1 gives 2x + 2 = 0 (linear).`);
mcq(27,[2025],`Which of the following equations is a quadratic equation?`,['(x + [[1|x]])^{2} = 2','(x − √{x})^{2} + 2x√{x} = 0','(x + 1)^{3} = (1 − x)^{3}','(√{x} + 1)^{2} = x^{2}'],1,`(b) x^{2} − 2x√{x} + x + 2x√{x} = 0 gives x^{2} + x = 0, which is quadratic. (a) becomes a degree-4 equation, (c) simplifies to 2x^{3} + 6x = 0 (cubic), and (d) is not a polynomial equation.`);
mcq(28,[2025],`Which of the following equations is a quadratic equation?`,['x^{3} = (x − 1)^{3} + 3x^{2}','x^{2} = √{x}','x^{3} = (x + 1)^{3}','x^{2} + 1 = [[1|x]]'],2,`(c) x^{3} = x^{3} + 3x^{2} + 3x + 1 gives 3x^{2} + 3x + 1 = 0, which is quadratic. (a) simplifies to 3x − 1 = 0 (linear), (b) is not a polynomial, and (d) gives x^{3} + x − 1 = 0 (cubic).`);
mcq(29,[2025],`Which of the following equations does not have a real root?`,['x^{2} = 0','x^{2} + 1 = 0','2x − 1 = 3','x^{3} + x^{2} = 0'],1,`x^{2} + 1 = 0 would need x^{2} = −1, which has no real solution.`);
mcq(30,[],`Which of the following equation has 2 as a root?`,['x^{2} − 4x + 5 = 0','2x^{2} − 7x + 6 = 0','x^{2} + 3x − 12 = 0','3x^{2} − 6x − 2 = 0'],1,`For 2x^{2} − 7x + 6: 8 − 14 + 6 = 0 ✓. (The others give 1, −2 and −2 at x = 2.)`);
mcq(31,[2023],`Which of the following equations has the sum of its roots as 4?`,['2x^{2} − 4x + 8 = 0','√{2}x^{2} − [[4|√{2}]]x + 1 = 0','−x^{2} + 4x + 4 = 0','4x^{2} − 4x + 4 = 0'],2,`Sum of roots = −[[b|a]]. (a) 2, (b) [[4/√2|√2]] = 2, (c) −[[4|−1]] = 4 ✓, (d) 1.`);
mcq(32,[2023],`A quadratic equation whose roots are 2 + √{3} and 2 − √{3} is`,['x^{2} − 4x + 1 = 0','4x^{2} − 3 = 0','x^{2} + 4x + 1 = 0','x^{2} − 1 = 0'],0,`Sum = 4 and product = 4 − 3 = 1. Equation: x^{2} − 4x + 1 = 0.`);
mcq(33,[2025],`The quadratic equation whose roots are 7 and [[1|7]] is`,['7x^{2} − 50x + 7 = 0','7x^{2} + 50x − 7 = 0','7x^{2} − 50x + 1 = 0','7x^{2} + 50x − 1 = 0'],0,`Sum = 7 + [[1|7]] = [[50|7]] and product = 1. Equation: x^{2} − [[50|7]]x + 1 = 0, i.e. 7x^{2} − 50x + 7 = 0.`);
mcq(34,[2025],`Which of the following quadratic equations has real and equal roots?`,['(x + 1)^{2} = 2x + 1','x^{2} − 4 = 0','x^{2} + x = 0','x^{2} + x + 1 = 0'],0,`(a) x^{2} + 2x + 1 = 2x + 1 gives x^{2} = 0, with equal roots 0, 0. (b) and (c) have distinct roots; (d) has D = −3.`);
mcq(35,[2025],`The quadratic equation whose sum and product of roots are ‘a’ and [[1|a]] respectively, is`,['ax^{2} − ax + 1 = 0','ax^{2} + ax + 1 = 0','ax^{2} − a^{2}x + 1 = 0','ax^{2} + a^{2}x − 1 = 0'],2,`x^{2} − ax + [[1|a]] = 0. Multiplying by a: ax^{2} − a^{2}x + 1 = 0.`);
mcq(36,[],`Each root of x^{2} − bx + c = 0 is decreased by 2. The resulting equation is x^{2} − 2x + 1 = 0 then`,['b = 6, c = 9','b = 3, c = 5','b = 2, c = −1','b = −4, c = 3'],0,`The new roots are 1 and 1, so the original roots are 3 and 3. Sum b = 6 and product c = 9.`);
mcq(37,[],`If one root of the equation ax^{2} + bx + c = 0 is the reciprocal of the other, then`,['b = c','a = b','ac = 1','a = c'],3,`Product of roots = [[c|a]] = 1, so a = c.`);
mcq(38,[],`If one root of the equation (k − 1)x^{2} − 10x + 3 = 0 is the reciprocal of the other then the value of k is`,['2','3','4','5'],2,`Product of roots = [[3|k − 1]] = 1, so k = 4.`);
mcq(39,[],`The linear factors of the quadratic equation x^{2} + kx + 1 = 0 are`,['k ≥ 2','k ≤ 2','k ≥ −2','2 ≤ k ≤ −2'],3,`Real linear factors exist when D = k^{2} − 4 ≥ 0, i.e. k ≥ 2 or k ≤ −2. Option (d), printed as “2 ≤ k ≤ −2”, appears to be meant as “k ≥ 2 or k ≤ −2”, which is the complete condition; option (a) gives only half of it.`);
mcq(40,[],`The condition for one root of the quadratic equation ax^{2} + bx + c = 0 to be twice the other, is`,['b^{2} = 4ac','2b^{2} = 9ac','c^{2} = 4a + b^{2}','c^{2} = 9a − b^{2}'],1,`Let the roots be α and 2α. Sum: 3α = −[[b|a]], so α = −[[b|3a]]. Product: 2α^{2} = [[c|a]], so [[2b^{2}|9a^{2}]] = [[c|a]], giving 2b^{2} = 9ac.`);
mcq(41,[],`The equation 2x^{2} + 2(p + 1)x + p = 0 where p is real, always has roots that are`,['Equal','Irrational','equal in magnitude but opposite in sign','real'],3,`D = 4(p + 1)^{2} − 8p = 4(p^{2} + 1) > 0 for every real p. So the roots are always real (and distinct).`);
mcq(42,[],`If α and β are roots of ax^{2} − bx + c = 0 (a ≠ 0) then value of α + β is`,['[[b|a]]','[[a|b]]','[[2a|b]]','[[a|2b]]'],0,`Sum of roots = −[[−b|a]] = [[b|a]].`);
mcq(43,[2025],`The discriminant of the quadratic equation bx^{2} + ax + c = 0, b ≠ 0 is given by`,['b^{2} − 4ac','√{b^{2} − 4ac}','√{a^{2} − 4bc}','a^{2} − 4bc'],3,`For bx^{2} + ax + c, the coefficients are (b, a, c), so D = a^{2} − 4bc.`);
mcq(44,[2024],`If the discriminant of the quadratic equation 3x^{2} − 2x + c = 0 is 16, then the value of c is`,['1','0','−1','√{2}'],2,`D = 4 − 12c = 16, so c = −1.`);
mcq(45,[2024],`The ratio of the sum and product of the roots of the quadratic equation 5x^{2} − 6x + 21 = 0 is`,['5 : 21','2 : 7','21 : 5','7 : 2'],1,`Sum = [[6|5]] and product = [[21|5]]. Ratio = 6 : 21 = 2 : 7.`);

/* ===== Assertion-Reason ===== */
ar(46,[],`4x^{2} − 12x + 9 = 0 has repeated roots.`,`The quadratic equation has repeated roots if discriminant D > 0.`,2,`D = 144 − 144 = 0, so the roots are repeated and A is true. Repeated roots occur when D = 0 (D > 0 gives two distinct roots), so R is false.<br><span class="ans">Answer: (c)</span>`);
ar(47,[],`The equation x^{2} + 3x + 1 = (x − 2)^{2} has repeated roots.`,`Any equation of the form ax^{2} + bx + c = 0 where a ≠ 0, is called a quadratic equation.`,3,`x^{2} + 3x + 1 = x^{2} − 4x + 4 simplifies to 7x = 3, which is linear, so it has just one root and A is false. R is the correct definition of a quadratic equation, so R is true.<br><span class="ans">Answer: (d)</span>`);
ar(48,[],`The value of x are −[[a|2]], a for a quadratic equation 2x^{2} + ax − a^{2} = 0.`,`For quadratic equation ax^{2} + bx + c = 0 where a ≠ 0, x = [[−b ± √{b^{2} − 4ac}|2a]].`,3,`2x^{2} + ax − a^{2} = (2x − a)(x + a), so the roots are [[a|2]] and −a, not −[[a|2]] and a. A is false. R is the quadratic formula, so R is true.<br><span class="ans">Answer: (d)</span>`);
ar(49,[],`The equation 8x^{2} + 3kx + 2 = 0 has equal roots then the value of k is ±[[8|3]].`,`The equation ax^{2} + bx + c = 0 has equal roots if D = b^{2} − 4ac = 0.`,0,`D = 9k^{2} − 64 = 0 gives k = ±[[8|3]], so A is true. R states exactly the condition used, so R is true and explains A.<br><span class="ans">Answer: (a)</span>`);
ar(50,[],`The roots of the quadratic equation x^{2} + 2x + 2 = 0 are imaginary.`,`If discriminant D = b^{2} − 4ac < 0 then the roots of the quadratic equation ax^{2} + bx + c = 0 are imaginary.`,0,`D = 4 − 8 = −4 < 0, so the roots are imaginary and A is true. R is the general rule that A applies, so R explains A.<br><span class="ans">Answer: (a)</span>`);
ar(51,[2023],`If 5 + √{7} is a root of a quadratic equation with rational co-efficient then its other root is 5 − √{7}.`,`Surd roots of the quadratic equation with rational coefficient occur in conjugate pairs.`,0,`Both statements are true, and the conjugate-pair property in R is exactly why the other root is 5 − √{7}.<br><span class="ans">Answer: (a)</span>`);
