vsa(1,[2023],`Find the sum and product of the roots of the quadratic equation 2x^{2} − 9x + 4 = 0.`,`Sum of roots = −[[b|a]] = <b>[[9|2]]</b>. Product of roots = [[c|a]] = [[4|2]] = <b>2</b>.`);
vsa(2,[2023],`Find the discriminant of the quadratic equation 4x^{2} − 5 = 0 and hence comment on the nature of roots of the equation.`,`Here a = 4, b = 0, c = −5. D = b^{2} − 4ac = 0 − 4(4)(−5) = <b>80</b>.<br>Since D > 0, the equation has <b>two distinct real roots</b>.`);
vsa(3,[2023],`A natural number increased by 12 equals 160 times the reciprocal. Find the number.`,`Let the number be n: n + 12 = [[160|n]], so n^{2} + 12n − 160 = 0.<br>(n + 20)(n − 8) = 0, so n = 8 (n = −20 is not natural).<br>The number is <b>8</b>.`);
vsa(4,[2023],`If one root of the quadratic equation x^{2} + 12x − k = 0 is thrice the other root, then find the value of k.`,`Let the roots be α and 3α. Sum: 4α = −12, so α = −3. Product: 3α^{2} = −k, so 3 × 9 = −k.<br><b>k = −27</b>.`);
vsa(5,[2025],`Find the value(s) of ‘k’ so that the quadratic equation 4x^{2} + kx + 1 = 0 has real and equal roots.`,`D = k^{2} − 16 = 0, so <b>k = ±4</b>.`);

/* ===== 3 marks ===== */
sa(1,[],`Solve: [[1|x]] − [[1|x − 2]] = 3, x ≠ 0, 2.`,`[[(x − 2) − x|x(x − 2)]] = 3, so −2 = 3x(x − 2), i.e. 3x^{2} − 6x + 2 = 0.<br>x = [[6 ± √{36 − 24}|6]] = [[6 ± 2√{3}|6]] = [[3 ± √{3}|3]].<br>So <b>x = 1 + [[√{3}|3]]</b> or <b>x = 1 − [[√{3}|3]]</b>.`);
sa(2,[],`Solve: [[1|x]] + [[2|2x − 3]] = [[1|x − 2]], x ≠ 0, [[3|2]], 2.`,`LHS = [[(2x − 3) + 2x|x(2x − 3)]] = [[4x − 3|x(2x − 3)]].<br>(4x − 3)(x − 2) = x(2x − 3), so 4x^{2} − 11x + 6 = 2x^{2} − 3x, i.e. 2x^{2} − 8x + 6 = 0, or x^{2} − 4x + 3 = 0.<br>(x − 1)(x − 3) = 0, so <b>x = 1</b> or <b>x = 3</b>.`);
sa(3,[],`Solve: [[1|x + 4]] − [[1|x + 7]] = [[11|30]], x ≠ −4, −7.`,`LHS = [[(x + 7) − (x + 4)|(x + 4)(x + 7)]] = [[3|(x + 4)(x + 7)]]. So 90 = 11(x^{2} + 11x + 28), i.e. 11x^{2} + 121x + 218 = 0.<br>D = 121^{2} − 4 × 11 × 218 = 5049 = 9 × 561, so x = [[−121 ± 3√{561}|22]]. These are the roots as the equation is printed.<br><i>Note:</i> the usual textbook version is [[1|x + 4]] − [[1|x − 7]] = [[11|30]] with x ≠ −4, 7. That gives (x + 4)(x − 7) = −30, i.e. x^{2} − 3x + 2 = 0, so x = 1 or x = 2.`);
sa(4,[],`Solve: [[x + 1|x − 1]] + [[x − 2|x + 2]] = 4 − [[2x + 3|x − 2]], x ≠ 1, −2, 2.`,`LHS = [[(x + 1)(x + 2) + (x − 2)(x − 1)|(x − 1)(x + 2)]] = [[2x^{2} + 4|(x − 1)(x + 2)]]. RHS = [[4(x − 2) − (2x + 3)|x − 2]] = [[2x − 11|x − 2]].<br>(2x^{2} + 4)(x − 2) = (2x − 11)(x^{2} + x − 2), so 2x^{3} − 4x^{2} + 4x − 8 = 2x^{3} − 9x^{2} − 15x + 22.<br>5x^{2} + 19x − 30 = 0, i.e. (5x − 6)(x + 5) = 0.<br><b>x = [[6|5]]</b> or <b>x = −5</b>.`);
sa(5,[],`Solve: [[2x|x − 3]] + [[1|2x + 3]] + [[3x + 9|(x − 3)(2x + 3)]] = 0, x ≠ 3, −[[3|2]].`,`Multiply by (x − 3)(2x + 3): 2x(2x + 3) + (x − 3) + (3x + 9) = 0, so 4x^{2} + 10x + 6 = 0, i.e. 2x^{2} + 5x + 3 = 0.<br>(2x + 3)(x + 1) = 0, so x = −[[3|2]] or x = −1. But x ≠ −[[3|2]], so <b>x = −1</b>.`);
sa(6,[],`Solve: x^{2} + ([[a|a + b]] + [[a + b|a]])x + 1 = 0.`,`The sum of the roots is −([[a|a + b]] + [[a + b|a]]) and the product is 1. Note that [[a|a + b]] × [[a + b|a]] = 1, so the roots are −[[a|a + b]] and −[[a + b|a]].<br>Check: x^{2} + ([[a|a + b]] + [[a + b|a]])x + 1 = (x + [[a|a + b]])(x + [[a + b|a]]).<br><b>x = −[[a|a + b]]</b> or <b>x = −[[a + b|a]]</b>.`);
sa(7,[],`Solve: [[1|(x − 1)(x − 2)]] + [[1|(x − 2)(x − 3)]] = [[2|3]], x ≠ 1, 2, 3.`,`LHS = [[(x − 3) + (x − 1)|(x − 1)(x − 2)(x − 3)]] = [[2(x − 2)|(x − 1)(x − 2)(x − 3)]] = [[2|(x − 1)(x − 3)]].<br>[[2|(x − 1)(x − 3)]] = [[2|3]], so (x − 1)(x − 3) = 3, i.e. x^{2} − 4x = 0.<br><b>x = 0</b> or <b>x = 4</b>.`);
sa(8,[2023],`Find the value of p for which the quadratic equation px(x − 2) + 6 = 0 has two equal real roots.`,`px^{2} − 2px + 6 = 0. D = 4p^{2} − 24p = 4p(p − 6) = 0, so p = 0 or p = 6. For p = 0 the equation is not quadratic, so <b>p = 6</b>.`);
sa(9,[],`Find the value of p for which one root of the quadratic equation px^{2} − 14x + 8 = 0 is 6 times the other.`,`Let the roots be α and 6α. Sum: 7α = [[14|p]], so α = [[2|p]]. Product: 6α^{2} = [[8|p]], so [[24|p^{2}]] = [[8|p]], giving p = 3.<br><b>p = 3</b>. (Check: 3x^{2} − 14x + 8 = (3x − 2)(x − 4), with roots [[2|3]] and 4 = 6 × [[2|3]] ✓.)`);
sa(10,[2023],`The sum of two numbers is 15. If the sum of their reciprocals is [[3|10]] find the two numbers.`,`Let the numbers be x and 15 − x. [[1|x]] + [[1|15 − x]] = [[3|10]], so [[15|x(15 − x)]] = [[3|10]], i.e. x(15 − x) = 50.<br>x^{2} − 15x + 50 = 0, so (x − 5)(x − 10) = 0.<br>The numbers are <b>5 and 10</b>.`);
sa(11,[2023],`If α and β are roots of the quadratic equation x^{2} − 7x + 10 = 0 find the quadratic equation whose roots are α^{2} and β^{2}.`,`α + β = 7 and αβ = 10. α^{2} + β^{2} = 49 − 20 = 29 and α^{2}β^{2} = 100.<br>Equation: <b>x^{2} − 29x + 100 = 0</b>.<br>(Check: the roots are 2 and 5, so the new roots are 4 and 25 ✓.)`);
sa(12,[2024],`In a 2-digit number, the digit at the unit’s place is 5 less than the digit at the ten’s place. The product of the digits is 36. Find the number.`,`Let the tens digit be x. The units digit is x − 5. x(x − 5) = 36, so x^{2} − 5x − 36 = 0, i.e. (x − 9)(x + 4) = 0.<br>x = 9 and the units digit is 4. The number is <b>94</b>.`);
sa(13,[2024],`Three consecutive integers are such that sum of the square of second and product of other two is 161. Find the three integers.`,`Let the integers be n − 1, n, n + 1. n^{2} + (n − 1)(n + 1) = 161, so 2n^{2} − 1 = 161 and n^{2} = 81, giving n = ±9.<br>The integers are <b>8, 9, 10</b> (or −10, −9, −8).`);
sa(14,[2024],`A dealer sells an article for Rs 75 and gains as much percent as the cost price of the article. Find the cost price of the article.`,`Let the cost price be Rs x. Gain = x% of x = [[x^{2}|100]]. Selling price = x + [[x^{2}|100]] = 75.<br>x^{2} + 100x − 7500 = 0, so (x + 150)(x − 50) = 0.<br>The cost price is <b>Rs 50</b>.`);

/* ===== 5 marks ===== */
la(1,[],`Solve: ([[2x|x − 5]])^{2} + 5([[2x|x − 5]]) − 24 = 0, x ≠ 5.`,`Let y = [[2x|x − 5]]. Then y^{2} + 5y − 24 = 0, so (y + 8)(y − 3) = 0 and y = −8 or y = 3.<br>y = 3: 2x = 3x − 15, so x = 15.<br>y = −8: 2x = −8x + 40, so x = 4.<br><b>x = 15</b> or <b>x = 4</b>.`);
la(2,[],`Solve: [[1|x + 1]] + [[2|x + 2]] = [[4|x + 4]], x ≠ −1, −2, −4.`,`LHS = [[(x + 2) + 2(x + 1)|(x + 1)(x + 2)]] = [[3x + 4|(x + 1)(x + 2)]].<br>(3x + 4)(x + 4) = 4(x + 1)(x + 2), so 3x^{2} + 16x + 16 = 4x^{2} + 12x + 8, i.e. x^{2} − 4x − 8 = 0.<br>x = [[4 ± √{16 + 32}|2]] = [[4 ± 4√{3}|2]].<br><b>x = 2 + 2√{3}</b> or <b>x = 2 − 2√{3}</b>.`);
la(3,[],`Solve: 4x^{2} + 4bx − (a^{2} − b^{2}) = 0.`,`4x^{2} + 4bx + b^{2} = a^{2}, so (2x + b)^{2} = a^{2}.<br>2x + b = ±a, so x = [[−b ± a|2]].<br><b>x = [[a − b|2]]</b> or <b>x = −[[a + b|2]]</b>.`);
la(4,[],`Find x in terms of a, b and c: [[a|x − a]] + [[b|x − b]] = [[2c|x − c]], x ≠ a, b, c.`,`Add 1 to each term: [[a|x − a]] + 1 = [[x|x − a]] and [[b|x − b]] + 1 = [[x|x − b]] and [[2c|x − c]] + 2 = [[2x|x − c]]. So the equation becomes x([[1|x − a]] + [[1|x − b]] − [[2|x − c]]) = 0.<br>Hence <b>x = 0</b> (which satisfies the original equation), or [[1|x − a]] + [[1|x − b]] = [[2|x − c]].<br>In the second case, (2x − a − b)(x − c) = 2(x − a)(x − b). Expanding, 2x^{2} − (a + b + 2c)x + c(a + b) = 2x^{2} − 2(a + b)x + 2ab, so (a + b − 2c)x = 2ab − ac − bc.<br><b>x = [[2ab − ac − bc|a + b − 2c]]</b> (if a + b ≠ 2c).`);
la(5,[],`Solve: [[x − 1|2x + 1]] + [[2x + 1|x − 1]] = 2 where x ≠ −[[1|2]], 1.`,`Let y = [[x − 1|2x + 1]]. Then y + [[1|y]] = 2, so y^{2} − 2y + 1 = 0, i.e. (y − 1)^{2} = 0 and y = 1.<br>[[x − 1|2x + 1]] = 1 gives x − 1 = 2x + 1, so <b>x = −2</b>.`);
la(6,[2025],`Express the equation [[x − 2|x − 3]] + [[x − 4|x − 5]] = [[10|3]], x ≠ 3, 5 as a quadratic equation in standard form. Hence, find the roots of the equation so formed.`,`LHS = [[(x − 2)(x − 5) + (x − 4)(x − 3)|(x − 3)(x − 5)]] = [[2x^{2} − 14x + 22|x^{2} − 8x + 15]].<br>3(2x^{2} − 14x + 22) = 10(x^{2} − 8x + 15), so 6x^{2} − 42x + 66 = 10x^{2} − 80x + 150.<br>Standard form: <b>2x^{2} − 19x + 42 = 0</b>.<br>(2x − 7)(x − 6) = 0, so the roots are <b>x = [[7|2]]</b> and <b>x = 6</b>.`);
la(7,[],`If x = −2 is a root of the equation 3x^{2} + 7x + p = 0 find the value of k so that the roots of the equation x^{2} + k(4x + k − 1) + p = 0 are equal.`,`Put x = −2: 12 − 14 + p = 0, so p = 2.<br>The second equation becomes x^{2} + 4kx + (k^{2} − k + 2) = 0. For equal roots, D = 16k^{2} − 4(k^{2} − k + 2) = 12k^{2} + 4k − 8 = 0, so 3k^{2} + k − 2 = 0.<br>(3k − 2)(k + 1) = 0, so <b>k = [[2|3]]</b> or <b>k = −1</b>.`);
la(8,[2024],`Find the values of k for which the equation (3k + 1)x^{2} + 2(k + 1)x + 1 has equal roots. Also find the roots.`,`(The equation is taken to be (3k + 1)x^{2} + 2(k + 1)x + 1 = 0.)<br>D = 4(k + 1)^{2} − 4(3k + 1) = 4(k^{2} − k) = 0, so k = 0 or k = 1.<br>k = 0: x^{2} + 2x + 1 = 0, so x = −1 (twice).<br>k = 1: 4x^{2} + 4x + 1 = 0, i.e. (2x + 1)^{2} = 0, so x = −[[1|2]] (twice).`);
la(9,[2024],`Find the value of p for which the quadratic equation (p + 1)x^{2} − 6(p + 1)x + 3(p + 9) = 0, p ≠ −1 has equal roots.`,`D = 36(p + 1)^{2} − 12(p + 1)(p + 9) = 12(p + 1)[3(p + 1) − (p + 9)] = 12(p + 1)(2p − 6) = 0.<br>Since p ≠ −1, 2p − 6 = 0, so <b>p = 3</b>.<br>(Check: 4x^{2} − 24x + 36 = 4(x − 3)^{2}.)`);
la(10,[2025],`Find the value(s) of p for which the quadratic equation given as (p + 4)x^{2} − (p + 1)x + 1 = 0 has real and equal roots. Also, find the roots of the equation(s) so obtained.`,`D = (p + 1)^{2} − 4(p + 4) = p^{2} − 2p − 15 = (p − 5)(p + 3) = 0, so p = 5 or p = −3.<br>p = 5: 9x^{2} − 6x + 1 = 0, i.e. (3x − 1)^{2} = 0, so x = [[1|3]].<br>p = −3: x^{2} + 2x + 1 = 0, so x = −1.`);
la(11,[2025],`Find the smallest value of p for which the quadratic equation x^{2} − 2(p + 1)x + p^{2} = 0 has real roots. Hence, find the roots of the equation so obtained.`,`D = 4(p + 1)^{2} − 4p^{2} = 4(2p + 1) ≥ 0, so p ≥ −[[1|2]]. The smallest value is <b>p = −[[1|2]]</b>.<br>Then x^{2} − x + [[1|4]] = 0, i.e. (x − [[1|2]])^{2} = 0, so the roots are <b>x = [[1|2]]</b> (twice).`);
la(12,[],`Find the positive values of k for which the quadratic equations x^{2} + kx + 64 = 0 and x^{2} − 8x + k = 0 both will have the real roots.`,`First equation: D = k^{2} − 256 ≥ 0, so k ≥ 16 (for positive k).<br>Second equation: D = 64 − 4k ≥ 0, so k ≤ 16.<br>Both hold only for <b>k = 16</b>.`);
la(13,[],`Write all values of p for which the quadratic equation x^{2} + px + 16 = 0 has equal roots. Find the roots of the equation so obtained.`,`D = p^{2} − 64 = 0, so <b>p = ±8</b>.<br>p = 8: (x + 4)^{2} = 0, so x = −4. p = −8: (x − 4)^{2} = 0, so x = 4.`);
la(14,[],`If the roots of the quadratic equation (x − a)(x − b) + (x − b)(x − c) + (x − c)(x − a) = 0 are equal. Then show that a = b = c.`,`Expanding: 3x^{2} − 2(a + b + c)x + (ab + bc + ca) = 0.<br>Equal roots: D = 4(a + b + c)^{2} − 12(ab + bc + ca) = 0, so (a + b + c)^{2} = 3(ab + bc + ca).<br>a^{2} + b^{2} + c^{2} − ab − bc − ca = 0, i.e. [[1|2]][(a − b)^{2} + (b − c)^{2} + (c − a)^{2}] = 0.<br>A sum of squares is zero only if each is zero, so a = b = c. Hence proved.`);
la(15,[2024],`A two digit number is such that product of its digits is 14. If 45 is added to the number, the digits interchange their places. Find the number.`,`Let the tens digit be x and the units digit y. xy = 14. 10x + y + 45 = 10y + x gives y − x = 5.<br>x(x + 5) = 14, so x^{2} + 5x − 14 = 0, i.e. (x + 7)(x − 2) = 0, so x = 2 and y = 7.<br>The number is <b>27</b>. (Check: 27 + 45 = 72 ✓.)`);
la(16,[2025],`A two digit number is such that product of its digits is 12. When 36 is added to the number, the digits interchange their places. Find the number.`,`Let the tens digit be x and the units digit y. xy = 12. 10x + y + 36 = 10y + x gives y − x = 4.<br>x(x + 4) = 12, so x^{2} + 4x − 12 = 0, i.e. (x + 6)(x − 2) = 0, so x = 2 and y = 6.<br>The number is <b>26</b>. (Check: 26 + 36 = 62 ✓.)`);
la(17,[2025],`A two digit number is seven times the sum of its digits and two more than 5 times the product of its digits. Find the number.`,`Let the tens digit be x and the units digit y. 10x + y = 7(x + y) gives x = 2y. Also 10x + y = 5xy + 2.<br>Substituting x = 2y: 21y = 10y^{2} + 2, so 10y^{2} − 21y + 2 = 0, i.e. (10y − 1)(y − 2) = 0. So y = 2 (y = [[1|10]] is not a digit) and x = 4.<br>The number is <b>42</b>. (Check: 7 × 6 = 42 and 5 × 8 + 2 = 42 ✓.)`);
la(18,[],`A fast train takes 3 hours less than a slow train for a journey of 60 km. If the speed of the slow train is 10 km/hr less than that of the fast train, find the speed of each train.`,`Let the speed of the fast train be x km/h. The slow train goes at (x − 10) km/h.<br>[[60|x − 10]] − [[60|x]] = 3, so [[600|x(x − 10)]] = 3, i.e. x^{2} − 10x − 200 = 0.<br>(x − 20)(x + 10) = 0, so x = 20.<br>The fast train goes at <b>20 km/h</b> and the slow train at <b>10 km/h</b>.`);
la(19,[2023],`A train travels at a certain average speed for a distance of 54 km and then travels at a distance of 63 km at an average speed of 6 km/hr more than its original speed. If it takes 3 hours to complete total journey, what is the original average speed?`,`Let the original speed be x km/h. [[54|x]] + [[63|x + 6]] = 3.<br>54(x + 6) + 63x = 3x(x + 6), so 117x + 324 = 3x^{2} + 18x, i.e. x^{2} − 33x − 108 = 0.<br>(x − 36)(x + 3) = 0, so x = 36.<br>The original speed is <b>36 km/h</b>. (Check: 1.5 h + 1.5 h = 3 h ✓.)`);
la(20,[2024],`A train travels a distance of 90 km at a constant speed. Had the speed been 15 km/hr more, it would have taken 30 minutes less for the journey. Find the original speed of the train.`,`Let the speed be x km/h. [[90|x]] − [[90|x + 15]] = [[1|2]], so [[1350|x(x + 15)]] = [[1|2]], i.e. x^{2} + 15x − 2700 = 0.<br>(x + 60)(x − 45) = 0, so x = 45.<br>The original speed is <b>45 km/h</b>.`);
la(21,[2025],`A train travels a distance of 480 km at a uniform speed. If the speed had been 8 km/hr less, then it would have taken 3 hours more to cover the same distance. Find the speed of the train.`,`Let the speed be x km/h. [[480|x − 8]] − [[480|x]] = 3, so [[3840|x(x − 8)]] = 3, i.e. x^{2} − 8x − 1280 = 0.<br>(x − 40)(x + 32) = 0, so x = 40.<br>The speed of the train is <b>40 km/h</b>.`);
la(22,[2025],`A train travelling at a uniform speed for 360 km would have taken 48 minutes less to travel the same distance if its speed were 5 km/hr more. Find the original speed of the train.`,`48 minutes = [[4|5]] hour. Let the speed be x km/h. [[360|x]] − [[360|x + 5]] = [[4|5]], so [[1800|x(x + 5)]] = [[4|5]], i.e. x^{2} + 5x − 2250 = 0.<br>(x + 50)(x − 45) = 0, so x = 45.<br>The original speed is <b>45 km/h</b>.`);
la(23,[],`A motor boat whose speed is 18 km/hr in still water takes 1 hour more to go 24 km upstream than to return downstream to the same spot. Find the speed of the stream.`,`Let the speed of the stream be s km/h. [[24|18 − s]] − [[24|18 + s]] = 1, so [[48s|324 − s^{2}]] = 1, i.e. s^{2} + 48s − 324 = 0.<br>(s + 54)(s − 6) = 0, so s = 6.<br>The speed of the stream is <b>6 km/h</b>.`);
la(24,[],`A motor boat whose speed in still water is 9 km/hr, goes 15 km downstream and comes back to the same spot, in a total time of 3 hours 45 minutes. Find the speed of the stream.`,`3 h 45 min = [[15|4]] h. Let the stream speed be s km/h. [[15|9 + s]] + [[15|9 − s]] = [[15|4]], so [[270|81 − s^{2}]] = [[15|4]], i.e. 81 − s^{2} = 72 and s^{2} = 9.<br>The speed of the stream is <b>3 km/h</b>.`);
la(25,[],`A motor boat whose speed is 15 km/hr in still water goes 30 km downstream and comes back in 4 hours 30 minutes. Find the speed of the stream.`,`4 h 30 min = [[9|2]] h. Let the stream speed be s km/h. [[30|15 + s]] + [[30|15 − s]] = [[9|2]], so [[900|225 − s^{2}]] = [[9|2]], i.e. 225 − s^{2} = 200 and s^{2} = 25.<br>The speed of the stream is <b>5 km/h</b>.`);
la(26,[2025],`The time taken by a person to travel an upward distance of 150 km was 2[[1|2]] hours more than the time taken in the downward return journey. If he returned at a speed of 10 km/hr more than the speed while going up, find the speeds in each direction.`,`Let the upward speed be x km/h; the downward speed is (x + 10) km/h.<br>[[150|x]] − [[150|x + 10]] = [[5|2]], so [[1500|x(x + 10)]] = [[5|2]], i.e. x^{2} + 10x − 600 = 0.<br>(x + 30)(x − 20) = 0, so x = 20.<br>Upward speed = <b>20 km/h</b> and downward speed = <b>30 km/h</b>.`);
la(27,[2024],`In a flight of 600 km, an aircraft was slowed down due to bad weather. Its average speed for the trip was reduced by 200 km/hr from its usual speed and the time of the flight increased by 30 minutes. Find the scheduled duration of the flight.`,`Let the usual speed be x km/h. [[600|x − 200]] − [[600|x]] = [[1|2]], so [[120000|x(x − 200)]] = [[1|2]], i.e. x^{2} − 200x − 240000 = 0.<br>(x − 600)(x + 400) = 0, so x = 600 km/h.<br>Scheduled duration = [[600|600]] = <b>1 hour</b>.`);
la(28,[],`A person on tour has Rs.4200 for his expenses. If he extends his tour for 3 days, he has to cut down his daily expenses by Rs 70. Find the original duration of tour.`,`Let the original duration be x days. [[4200|x]] − [[4200|x + 3]] = 70, so [[12600|x(x + 3)]] = 70, i.e. x^{2} + 3x − 180 = 0.<br>(x + 15)(x − 12) = 0, so x = 12.<br>The original duration is <b>12 days</b>.`);
la(29,[2023],`Two water taps together can fill a tank in [[15|8]] hours. The tap of larger diameter takes 2 hours less than the smaller one to fill the tank separately. Find the time in which each tap can separately fill the tank.`,`Let the smaller tap take x hours; the larger takes (x − 2) hours.<br>[[1|x]] + [[1|x − 2]] = [[8|15]], so [[2x − 2|x(x − 2)]] = [[8|15]], i.e. 15(2x − 2) = 8x^{2} − 16x, so 4x^{2} − 23x + 15 = 0.<br>(4x − 3)(x − 5) = 0, so x = 5 (x = [[3|4]] would make x − 2 negative).<br>The smaller tap takes <b>5 hours</b> and the larger tap <b>3 hours</b>.`);
la(30,[],`Two pipes running together can fill a cistern in 3[[1|13]] hours. If one pipe takes 3 hours more than the other to fill it, find the time in which each pipe would fill the cistern.`,`3[[1|13]] = [[40|13]] hours. Let one pipe take x hours and the other (x + 3) hours.<br>[[1|x]] + [[1|x + 3]] = [[13|40]], so [[2x + 3|x(x + 3)]] = [[13|40]], i.e. 40(2x + 3) = 13x^{2} + 39x, so 13x^{2} − 41x − 120 = 0.<br>(13x + 24)(x − 5) = 0, so x = 5.<br>The pipes take <b>5 hours</b> and <b>8 hours</b>.`);
la(31,[],`To fill a swimming pool two pipes are used. If the pipe of larger diameter used for 4 hours and the pipe of smaller diameter for 9 hours, only half of the pool can be filled. Find, how long it would take for each pipe to fill the pool separately, if the pipe of smaller diameter takes 10 hours more than the pipe of larger diameter to fill the pool?`,`Let the larger pipe take x hours and the smaller (x + 10) hours.<br>[[4|x]] + [[9|x + 10]] = [[1|2]], so 8(x + 10) + 18x = x(x + 10), i.e. x^{2} − 16x − 80 = 0.<br>(x − 20)(x + 4) = 0, so x = 20.<br>The larger pipe takes <b>20 hours</b> and the smaller pipe <b>30 hours</b>.`);
la(32,[],`A rectangular park is to be designed whose breadth is 3 m less than its length. Its area is to be 4 square meters more than the area of a park that has already been made in the shape of an isosceles triangle with its base as the breadth of the rectangular park and of altitude 12 m. Find its length and breadth.`,`Let the length be x m and the breadth (x − 3) m. The triangle’s area = [[1|2]] × (x − 3) × 12 = 6(x − 3).<br>x(x − 3) = 6(x − 3) + 4, so x^{2} − 9x + 14 = 0, i.e. (x − 7)(x − 2) = 0.<br>x = 7 (x = 2 would give a negative breadth).<br>Length = <b>7 m</b> and breadth = <b>4 m</b>.`);
la(33,[],`Some students planned a picnic. The total budget for food was Rs. 2,000. But 5 students failed to attend the picnic and thus the cost of food for each member increased by Rs. 20. How many students attended the picnic and how much did each student pay for the food?`,`Let x students plan to go. [[2000|x − 5]] − [[2000|x]] = 20, so [[10000|x(x − 5)]] = 20, i.e. x^{2} − 5x − 500 = 0.<br>(x − 25)(x + 20) = 0, so x = 25.<br><b>20 students attended</b> and each paid [[2000|20]] = <b>Rs 100</b>.`);
la(34,[],`If Zeba was younger by 5 years than what she really is, then the square of her age (in years) would have been 11 more than five times her actual age. What is her age now?`,`Let her age be x years. (x − 5)^{2} = 5x + 11, so x^{2} − 15x + 14 = 0, i.e. (x − 14)(x − 1) = 0.<br>x = 1 is impossible (x − 5 would be negative), so her age is <b>14 years</b>.`);
la(35,[2024],`The age of a man is twice the square of the age of his son. Eight years hence, the age of the man will be 4 years more than three time the age of his son. Find their present ages.`,`Let the son’s age be x years. The man’s age is 2x^{2}.<br>2x^{2} + 8 = 3(x + 8) + 4, so 2x^{2} − 3x − 20 = 0, i.e. (2x + 5)(x − 4) = 0, so x = 4.<br>The son is <b>4 years</b> old and the man is <b>32 years</b> old.`);
la(36,[],`Rs.6500 were divided equally among a certain number of persons. Had there been 15 more persons, each would have got Rs. 30 less. Find the original number of persons.`,`Let there be x persons. [[6500|x]] − [[6500|x + 15]] = 30, so [[97500|x(x + 15)]] = 30, i.e. x^{2} + 15x − 3250 = 0.<br>(x + 65)(x − 50) = 0, so x = 50.<br>There were <b>50 persons</b>.`);
la(37,[],`A takes 6 days less than the time taken by B to finish a piece of work. If both A and B together can finish it in 4 days, find the time taken by B to finish the work.`,`Let B take x days and A take (x − 6) days. [[1|x]] + [[1|x − 6]] = [[1|4]], so 4(2x − 6) = x(x − 6), i.e. x^{2} − 14x + 24 = 0.<br>(x − 12)(x − 2) = 0. x = 2 would make A’s time negative, so x = 12.<br>B takes <b>12 days</b> (and A takes 6 days).`);
la(38,[2024],`The denominator of a fraction is one more than twice the numerator. If the sum of the fraction and its reciprocal is 2[[16|21]], find the fraction.`,`Let the numerator be x; the fraction is [[x|2x + 1]]. 2[[16|21]] = [[58|21]].<br>[[x|2x + 1]] + [[2x + 1|x]] = [[58|21]], so 21(x^{2} + (2x + 1)^{2}) = 58x(2x + 1), i.e. 105x^{2} + 84x + 21 = 116x^{2} + 58x, so 11x^{2} − 26x − 21 = 0.<br>(11x + 7)(x − 3) = 0, so x = 3.<br>The fraction is <b>[[3|7]]</b>. (Check: [[3|7]] + [[7|3]] = [[58|21]] ✓.)`);
la(39,[2025],`The numerator of a fraction is 3 less than its denominator. If 2 is added to both numerator and denominator, then the sum of the new fraction and the original fraction is 1[[9|20]]. Find the original fraction.`,`Let the denominator be x; the fraction is [[x − 3|x]]. The new fraction is [[x − 1|x + 2]]. 1[[9|20]] = [[29|20]].<br>[[x − 3|x]] + [[x − 1|x + 2]] = [[29|20]], so 20[(x − 3)(x + 2) + x(x − 1)] = 29x(x + 2), i.e. 40x^{2} − 40x − 120 = 29x^{2} + 58x, so 11x^{2} − 98x − 120 = 0.<br>(11x + 12)(x − 10) = 0, so x = 10.<br>The original fraction is <b>[[7|10]]</b>. (Check: [[7|10]] + [[9|12]] = [[29|20]] ✓.)`);
la(40,[2024],`The side of a square exceeds the side of another square by 4 cm and the sum of the areas of the two squares is 400 cm². Find the sides of the squares.`,`Let the smaller side be x cm and the larger side (x + 4) cm. x^{2} + (x + 4)^{2} = 400, so 2x^{2} + 8x − 384 = 0, i.e. x^{2} + 4x − 192 = 0.<br>(x + 16)(x − 12) = 0, so x = 12.<br>The sides are <b>12 cm and 16 cm</b>.`);
la(41,[2025],`The sum of the areas of two squares is 52 cm² and difference of their perimeters is 8 cm. Find the lengths of the sides of the two squares.`,`Let the sides be x and y (x > y). The difference of perimeters: 4x − 4y = 8, so x = y + 2. Sum of areas: x^{2} + y^{2} = 52.<br>(y + 2)^{2} + y^{2} = 52, so 2y^{2} + 4y − 48 = 0, i.e. y^{2} + 2y − 24 = 0, so (y + 6)(y − 4) = 0 and y = 4.<br>The sides are <b>4 cm and 6 cm</b>.`);
la(42,[2025],`The perimeter of a right triangle is 60 cm and its hypotenuse is 25 cm. Find the lengths of other two sides of the triangle.`,`Let the other two sides be a and b. a + b = 60 − 25 = 35 and a^{2} + b^{2} = 625.<br>2ab = 35^{2} − 625 = 600, so ab = 300. The sides are the roots of t^{2} − 35t + 300 = 0, i.e. (t − 15)(t − 20) = 0.<br>The other two sides are <b>15 cm and 20 cm</b>.`);
la(43,[2025],`The perimeter of an isosceles triangle is 32 cm. If each equal side is [[5^{th}|6]] of the base, find the area of the triangle.`,`Let the base be x cm. Each equal side is [[5x|6]]. x + 2 × [[5x|6]] = 32, so [[8x|3]] = 32 and x = 12. The equal sides are 10 cm each.<br>Height on the base = √{10^{2} − 6^{2}} = √{64} = 8 cm.<br>Area = [[1|2]] × 12 × 8 = <b>48 cm²</b>.`);
la(44,[2025],`The sides of a right triangle are such that the longest side is 4 m more than the shortest side and the third side is 2 m less than the longest side. Find the length of each side of the triangle. Also, find the difference between the numerical values of the area and the perimeter of the given triangle.`,`Let the shortest side be s m. The longest is s + 4 and the third side is s + 2.<br>s^{2} + (s + 2)^{2} = (s + 4)^{2}, so s^{2} − 4s − 12 = 0, i.e. (s − 6)(s + 2) = 0, so s = 6.<br>The sides are <b>6 m, 8 m and 10 m</b>.<br>Area = [[1|2]] × 6 × 8 = 24 and perimeter = 6 + 8 + 10 = 24. The difference is <b>0</b>.`);
la(45,[2025],`A student scored a total of 32 marks in class tests in Mathematics and Science. Had he scored 2 marks less in Science and 4 marks more in Mathematics, the product of his marks would have been 253. Find his marks in the two subjects.`,`Let the Mathematics marks be x. The Science marks are 32 − x.<br>(x + 4)(32 − x − 2) = 253, so (x + 4)(30 − x) = 253, i.e. −x^{2} + 26x + 120 = 253, so x^{2} − 26x + 133 = 0.<br>(x − 7)(x − 19) = 0, so x = 7 or x = 19.<br>The marks are <b>Mathematics 19 and Science 13</b>, or <b>Mathematics 7 and Science 25</b>. Both satisfy the conditions.`);
la(46,[2025],`There is a circular park of diameter 65 m as shown in the following figure, where AB is a diameter. An entry gate is to be constructed at a point P on the boundary of the park such that distance of P from A is 35 m more than the distance of P from B. Find the distance of point P from A and B respectively.`,`P lies on the circle, so ∠APB = 90° (angle in a semicircle). Let PB = x m, so PA = (x + 35) m.<br>By Pythagoras: x^{2} + (x + 35)^{2} = 65^{2}, so 2x^{2} + 70x + 1225 = 4225, i.e. x^{2} + 35x − 1500 = 0.<br>(x + 60)(x − 25) = 0, so x = 25.<br>PB = <b>25 m</b> and PA = <b>60 m</b>. (Check: 60^{2} + 25^{2} = 4225 = 65^{2} ✓.)`,{fig:F46});

/* ===== Case-based ===== */
cs(1,[2023],`While designing the school year book, a teacher asked the student that the length and width of a particular photo is increased by x units each to double the area of the photo. The original photo is 18 cm long and 12 cm wide.`,[
  {l:'(i)',m:1,q:`Write an algebraic equation depicting the above information.`},
  {l:'(ii)',m:1,q:`Write the corresponding quadratic equation in standard form.`},
  {l:'(iii)',m:2,q:`What should be the new dimensions of the enlarged photo?`,or:`Can any rational value of x make the new area equal to 220 cm²?`}
],`The original area is 18 × 12 = 216 cm², so the new area is 432 cm².<br><b>(i)</b> (18 + x)(12 + x) = 432.<br><b>(ii)</b> x^{2} + 30x + 216 = 432, so <b>x^{2} + 30x − 216 = 0</b>.<br><b>(iii)</b> (x + 36)(x − 6) = 0, so x = 6 (x = −36 is rejected). The new dimensions are <b>24 cm × 18 cm</b>.<br>(OR) (18 + x)(12 + x) = 220 gives x^{2} + 30x − 4 = 0. D = 900 + 16 = 916, which is not a perfect square, so the roots are irrational. <b>No rational value of x</b> works.`,{fig:FP});
cs(2,[],`In an auditorium, seats are arranged in rows and columns. The number of rows are equal to the number of seats in each row. When the number of rows are doubled and the number of seats in each row is reduced by 10, the total number of seats increases by 300.`,[
  {l:'(i)',m:1,q:`If x is taken as number of row in original arrangement, write the quadratic equation that describes the situation?`},
  {l:'(ii)',m:1,q:`How many number of rows are there in the original arrangement?`},
  {l:'(iii)',m:2,q:`How many number of seats are there in the auditorium in original arrangement? How many number of seats are there in the auditorium after re-arrangement.`,or:`How many number of columns are there in the auditorium after re-arrangement?`}
],`Originally there are x rows and x seats in each row, so x^{2} seats.<br><b>(i)</b> After re-arrangement: 2x rows with (x − 10) seats each, so 2x(x − 10) = x^{2} + 300, i.e. <b>x^{2} − 20x − 300 = 0</b>.<br><b>(ii)</b> (x − 30)(x + 10) = 0, so x = 30. There are <b>30 rows</b>.<br><b>(iii)</b> Original seats = 30 × 30 = <b>900</b>. After re-arrangement: 60 × 20 = <b>1200</b> seats.<br>(OR) The number of columns (seats in each row) after re-arrangement is 30 − 10 = <b>20</b>.`);
cs(3,[2024],`A rectangular floor area can be completely tiled with 200 square tiles. If the side length of each tile is increased by 1 unit, it would take only 128 tiles to cover the floor.`,[
  {l:'(i)',m:1,q:`Assuming the original length of each side of a tile be x units, makes a quadratic equation from the above information.`},
  {l:'(ii)',m:1,q:`Write the corresponding quadratic equation in standard form.`},
  {l:'(iii)',m:2,q:`Find the values of x, the length of side of a tile by factorization.`,or:`Solve the quadratic equation for x, using quadratic formula.`}
],`The floor area is the same in both cases.<br><b>(i)</b> 200x^{2} = 128(x + 1)^{2}.<br><b>(ii)</b> 200x^{2} = 128x^{2} + 256x + 128, so 72x^{2} − 256x − 128 = 0, i.e. <b>9x^{2} − 32x − 16 = 0</b>.<br><b>(iii)</b> 9x^{2} − 36x + 4x − 16 = 9x(x − 4) + 4(x − 4) = (x − 4)(9x + 4) = 0, so x = 4 or x = −[[4|9]]. A length cannot be negative, so <b>x = 4</b> units.<br>(OR) x = [[32 ± √{1024 + 576}|18]] = [[32 ± 40|18]], so x = 4 or −[[4|9]]. Hence <b>x = 4</b>.`);

/* ===== Chapter 4: extra case-based (practice) ===== */
cs(4,[],`The length of a rectangular garden is 3 m more than its breadth, and its area is 70 m². Let the breadth of the garden be x metres.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the breadth of the garden.`},
  {l:'(iii)',m:2,q:`(a) Find the perimeter of the garden.`,or:`(b) Find the cost of fencing the garden at Rs 120 per metre.`}
],`<b>(i)</b> x(x + 3) = 70, i.e. x^{2} + 3x − 70 = 0.<br><b>(ii)</b> (x + 10)(x − 7) = 0, so x = 7 (x = −10 is rejected). The breadth is <b>7 m</b>; the length is 10 m.<br><b>(iii)(a)</b> Perimeter = 2(10 + 7) = <b>34 m</b>.<br>(OR) <b>(b)</b> Cost = 34 × 120 = <b>Rs 4080</b>.`);
cs(5,[],`A train covers a distance of 120 km at a uniform speed. If the speed had been 10 km/h more, the train would have taken 1 hour less for the journey. Let the original speed be x km/h.`,[
  {l:'(i)',m:1,q:`Form the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the original speed of the train.`},
  {l:'(iii)',m:2,q:`(a) How long does the train take for the journey at its original speed?`,or:`(b) How long would it take at the increased speed?`}
],`<b>(i)</b> [[120|x]] − [[120|x + 10]] = 1, so [[1200|x(x + 10)]] = 1, i.e. x^{2} + 10x − 1200 = 0.<br><b>(ii)</b> (x + 40)(x − 30) = 0, so x = 30. The original speed is <b>30 km/h</b>.<br><b>(iii)(a)</b> Time = [[120|30]] = <b>4 hours</b>.<br>(OR) <b>(b)</b> Time = [[120|40]] = <b>3 hours</b>.`);
cs(6,[],`Two taps A and B can together fill a swimming pool in 6 hours. Tap A alone takes 5 hours less than tap B alone. Let tap A alone take x hours.`,[
  {l:'(i)',m:1,q:`Write the equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Write it as a quadratic equation in standard form.`},
  {l:'(iii)',m:2,q:`(a) How long does each tap take to fill the pool alone?`,or:`(b) What fraction of the pool does tap B fill in 4 hours?`}
],`Tap A takes x hours, so tap B takes (x + 5) hours.<br><b>(i)</b> [[1|x]] + [[1|x + 5]] = [[1|6]].<br><b>(ii)</b> 6(2x + 5) = x(x + 5), so <b>x^{2} − 7x − 30 = 0</b>.<br><b>(iii)(a)</b> (x − 10)(x + 3) = 0, so x = 10. Tap A takes <b>10 hours</b> and tap B takes <b>15 hours</b>.<br>(OR) <b>(b)</b> B fills [[1|15]] of the pool each hour, so in 4 hours it fills <b>[[4|15]]</b> of the pool.`);
cs(7,[],`The sum of the ages of two sisters is 20 years and the product of their ages is 96. Let the age of the younger sister be x years.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the ages of the two sisters.`},
  {l:'(iii)',m:2,q:`(a) After how many years will the product of their ages be 252?`,or:`(b) What was the product of their ages 4 years ago?`}
],`<b>(i)</b> x(20 − x) = 96, i.e. x^{2} − 20x + 96 = 0.<br><b>(ii)</b> (x − 8)(x − 12) = 0, so the sisters are <b>8 and 12 years</b> old.<br><b>(iii)(a)</b> After t years: (8 + t)(12 + t) = 252, so t^{2} + 20t − 156 = 0. D = 400 + 624 = 1024 = 32^{2}, so t = [[−20 + 32|2]] = <b>6 years</b>. (Check: 14 × 18 = 252 ✓.)<br>(OR) <b>(b)</b> Four years ago they were 4 and 8, so the product was <b>32</b>.`);

/* ===== Chapter 4: extra long answer (practice) ===== */
la(47,[],`Solve 2x^{2} − 7x + 3 = 0 by the method of completing the square.`,`Divide by 2: x^{2} − [[7|2]]x = −[[3|2]].<br>Add ([[7|4]])^{2} = [[49|16]] to both sides: x^{2} − [[7|2]]x + [[49|16]] = −[[3|2]] + [[49|16]] = [[25|16]].<br>(x − [[7|4]])^{2} = [[25|16]], so x − [[7|4]] = ±[[5|4]].<br>x = [[7|4]] + [[5|4]] = <b>3</b> or x = [[7|4]] − [[5|4]] = <b>[[1|2]]</b>.`);
la(48,[],`Find the values of k for which the equation (k + 1)x^{2} − 2(k − 1)x + 1 = 0 has equal roots. Also find the roots in each case.`,`D = 4(k − 1)^{2} − 4(k + 1) = 4(k^{2} − 3k) = 4k(k − 3) = 0, so k = 0 or k = 3.<br>k = 0: x^{2} + 2x + 1 = 0, i.e. (x + 1)^{2} = 0, so x = −1 (twice).<br>k = 3: 4x^{2} − 4x + 1 = 0, i.e. (2x − 1)^{2} = 0, so x = [[1|2]] (twice).`);
la(49,[],`Solve: [[x − 1|x − 2]] + [[x − 3|x − 4]] = [[10|3]], x ≠ 2, 4.`,`LHS = [[(x − 1)(x − 4) + (x − 3)(x − 2)|(x − 2)(x − 4)]] = [[2x^{2} − 10x + 10|x^{2} − 6x + 8]].<br>3(2x^{2} − 10x + 10) = 10(x^{2} − 6x + 8), so 6x^{2} − 30x + 30 = 10x^{2} − 60x + 80, i.e. 4x^{2} − 30x + 50 = 0, or 2x^{2} − 15x + 25 = 0.<br>(2x − 5)(x − 5) = 0, so <b>x = [[5|2]]</b> or <b>x = 5</b>.`);
la(50,[],`A motor boat whose speed in still water is 8 km/h takes 1 hour more to go 15 km upstream than to return downstream to the same spot. Find the speed of the stream.`,`Let the speed of the stream be s km/h. [[15|8 − s]] − [[15|8 + s]] = 1, so [[30s|64 − s^{2}]] = 1, i.e. s^{2} + 30s − 64 = 0.<br>(s + 32)(s − 2) = 0, so s = 2.<br>The speed of the stream is <b>2 km/h</b>.`);
la(51,[],`Find the roots of the quadratic equation √{3}x^{2} + 10x + 7√{3} = 0 using the quadratic formula.`,`a = √{3}, b = 10, c = 7√{3}. D = 100 − 4 × √{3} × 7√{3} = 100 − 84 = 16.<br>x = [[−10 ± 4|2√{3}]] gives x = [[−6|2√{3}]] = −√{3} or x = [[−14|2√{3}]] = −[[7|√{3}]].<br><b>x = −√{3}</b> or <b>x = −[[7√{3}|3]]</b>.`);

mcq(1,[],`In an AP, if d = −4, n = 7, a_{n} = 4 then a is equal to`,['6','7','20','28'],3,`a_{n} = a + (n − 1)d, so 4 = a + 6(−4), giving a = 28.`);
mcq(2,[],`In an AP, if a = 3.5, d = 0 and n = 101 then a_{n} will be`,['0','3.5','103.5','104.5'],1,`With d = 0 every term equals the first term, so a_{101} = 3.5.`);
mcq(3,[],`The n^{th} term of the AP a, 3a, 5a, … is`,['na','(2n − 1)a','(2n + 1)a','2na'],1,`d = 2a, so a_{n} = a + (n − 1)2a = (2n − 1)a.`);
mcq(4,[2024],`Which term of an AP 21, 42, 63, 84, … is 210?`,['9^{th}','10^{th}','11^{th}','12^{th}'],1,`a = 21, d = 21. 21 + (n − 1)21 = 210, so 21n = 210 and n = 10.`);
mcq(5,[],`If the common difference of an AP is 5, then what is a_{18} − a_{13}?`,['5','20','25','30'],2,`a_{18} − a_{13} = 5d = 25.`);
mcq(6,[2024],`What is the common difference of an AP in which a_{18} − a_{14} = 32?`,['8','−8','−4','4'],0,`a_{18} − a_{14} = 4d = 32, so d = 8.`);
mcq(7,[2024],`The common difference of the AP [[1|p]], [[1 − p|p]], [[1 − 2p|p]], … is`,['1','[[1|p]]','−[[1|p]]','−1'],3,`d = [[1 − p|p]] − [[1|p]] = [[−p|p]] = −1.`);
mcq(8,[2023,2024],`The common difference of the A.P whose n^{th} term is given by a_{n} = 3n + 7 is`,['7','3','3n','1'],1,`a_{n+1} − a_{n} = 3(n + 1) + 7 − (3n + 7) = 3.`);
mcq(9,[2023],`The common difference of the A.P whose n^{th} term is given by a_{n} = 5n − 7 is`,['−7','7','5','−2'],2,`a_{n+1} − a_{n} = 5.`);
mcq(10,[],`The first term of AP is p and the common difference is q, then its 10^{th} term is`,['q + 9p','p − 9q','p + 9q','2p + 9q'],2,`a_{10} = p + 9q.`);
mcq(11,[2025],`The 9^{th} term from the end of an AP 7, 11, 15, 19, …, 147 is`,['135','125','115','39'],2,`The n-th term from the end is l − (n − 1)d = 147 − 8 × 4 = 115.`);
mcq(12,[2023],`The 11^{th} term from the end of the A.P 10, 7, 4, …, −62 is`,['25','16','−32','0'],2,`d = −3. From the end: l − (n − 1)d = −62 − 10(−3) = −32.`);
mcq(13,[2023],`The 13^{th} term from the end of the A.P 20, 13, 6, −1, …, −148 is`,['57','−57','64','−64'],3,`d = −7. From the end: −148 − 12(−7) = −148 + 84 = −64.`);
mcq(14,[2025],`The 10^{th} term of an AP 5, [[19|4]], [[9|2]], [[17|4]], … is`,['[[11|4]]','[[4|11]]','[[13|4]]','[[4|13]]'],0,`d = [[19|4]] − 5 = −[[1|4]]. a_{10} = 5 + 9(−[[1|4]]) = 5 − [[9|4]] = [[11|4]].`);
mcq(15,[],`There are 60 terms in an AP of which the first term is 8 and the last term is 185. The 31^{st} term is`,['56','94','85','98'],3,`185 = 8 + 59d, so d = 3. a_{31} = 8 + 30 × 3 = 98.`);
mcq(16,[2025],`The 11^{th} and 13^{th} terms of an AP are 39 and 45 respectively, its common difference is`,['42','21','6','3'],3,`a_{13} − a_{11} = 2d = 6, so d = 3.`);
mcq(17,[2023],`The next term of the A.P √{6}, √{24}, √{54}, … is`,['√{60}','√{96}','√{72}','√{216}'],1,`The terms are √{6}, 2√{6}, 3√{6}, so the next is 4√{6} = √{96}.`);
mcq(18,[2023],`The next term of the A.P √{7}, √{28}, √{63}, … is`,['√{70}','√{80}','√{97}','√{112}'],3,`The terms are √{7}, 2√{7}, 3√{7}, so the next is 4√{7} = √{112}.`);
mcq(19,[],`The two APs have the common difference. The first term of one of these is −1 and that of the other is −8. Then the difference between their 4^{th} terms is`,['−1','−8','7','−9'],2,`With the same d, the difference of corresponding terms stays equal to the difference of the first terms: −1 − (−8) = 7.`);
mcq(20,[],`The first four terms of an AP whose first term is −2 and the common difference is −2 are`,['−2, 0, 2, 4','−2, 4, −8, 16','−2, −4, −6, −8','−2, −4, −8, −16'],2,`Adding −2 each time: −2, −4, −6, −8.`);
mcq(21,[2024],`If the first term of an AP is −5 and the common difference is 2, then the sum of the first 6 terms is`,['0','5','6','15'],0,`S_{6} = [[6|2]][2(−5) + 5 × 2] = 3 × 0 = 0.`);
mcq(22,[],`The sum of first 16 terms of the AP 10, 6, 2, … is`,['−320','320','−352','−400'],0,`S_{16} = 8[20 + 15(−4)] = 8 × (−40) = −320.`);
mcq(23,[2024],`Sum of first 200 natural numbers`,['2010','2000','20100','21000'],2,`S = [[200 × 201|2]] = 20100.`);
mcq(24,[2024],`In an AP, if a = 1, a_{n} = 20, S_{n} = 399 then n is equal to`,['19','21','38','42'],2,`S_{n} = [[n|2]](a + a_{n}) = [[n|2]] × 21 = 399, so n = 38.`);
mcq(25,[],`If the n^{th} term of an AP is given by a_{n} = 5n − 3 then the sum of first 10 terms is`,['225','245','255','270'],1,`a_{1} = 2 and a_{10} = 47. S_{10} = [[10|2]](2 + 47) = 245.`);
mcq(26,[],`An AP starts with a positive fraction and every alternate term is an integer. If the sum of the first 11 terms is 33, then the fourth term is`,['2','3','5','6'],0,`S_{11} = 11 × a_{6} = 33, so a_{6} = 3. Alternate terms are integers, so 2d is an integer. Taking the first term as a proper positive fraction (between 0 and 1): a_{1} = 3 − 5d must lie between 0 and 1, giving d = [[1|2]] and a_{1} = [[1|2]]. The terms are [[1|2]], 1, [[3|2]], 2, … so a_{4} = 2.<br>(This assumes “positive fraction” means a fraction less than 1.)`);
mcq(27,[],`If the sum of the first 2n terms of 2, 5, 8, … is equal to the sum of the first n terms of 57, 59, 61, … then n is equal to`,['10','11','12','13'],1,`S_{2n} = [[2n|2]][4 + (2n − 1)3] = n(6n + 1). The second sum = [[n|2]][114 + 2(n − 1)] = n(n + 56).<br>6n + 1 = n + 56, so n = 11.`);
mcq(28,[2023],`If the sum of the first n terms of an AP is 3n^{2} + n and its common difference is 6, then its first term is`,['1','2','3','4'],3,`a_{1} = S_{1} = 3 + 1 = 4. (Check: S_{2} = 14, so a_{2} = 10 and d = 6 ✓.)`);
mcq(29,[2025],`If the sum of first m terms of an AP is 2m^{2} + 3m then its second term is`,['10','9','12','4'],1,`S_{1} = 5 and S_{2} = 8 + 6 = 14. a_{2} = S_{2} − S_{1} = 9.`);
mcq(30,[2023],`If p − 1, p + 1 and 2p + 3 are in A.P then the value of p is`,['−2','4','0','2'],2,`2(p + 1) = (p − 1) + (2p + 3), so 2p + 2 = 3p + 2 and p = 0.`);
mcq(31,[2023,2024],`If k + 2, 4k − 6 and 3k − 2 are three consecutive terms of an A.P then the value of k is`,['3','−3','4','−4'],0,`2(4k − 6) = (k + 2) + (3k − 2), so 8k − 12 = 4k and k = 3.`);
mcq(32,[2023],`If a, b, c form an A.P with common difference d, then the value of a − 2b − c is`,['2a + 4d','0','−2a − 4d','−2a − 3d'],2,`b = a + d and c = a + 2d. a − 2b − c = a − 2a − 2d − a − 2d = −2a − 4d.`);
mcq(33,[2024,2025],`Three numbers in A.P have the sum 30. What is its middle term?`,['4','10','16','8'],1,`Let the numbers be a − d, a, a + d. The sum is 3a = 30, so the middle term a = 10.`);
mcq(34,[2024],`The number of terms of an A.P 3, 6, 9, … 111 is`,['36','40','37','30'],2,`111 = 3 + (n − 1)3, so n − 1 = 36 and n = 37.`);

/* ===== Assertion-Reason ===== */
ar(35,[2025],`Common difference of the AP −5, −1, 3, 7, … is 4.`,`Common difference of the AP a, a + d, a + 2d, … is given by d = a_{n} − a_{n−1}.`,0,`−1 − (−5) = 4, so A is true. R is the correct definition of the common difference and it is exactly what was used.<br><span class="ans">Answer: (a)</span>`);
ar(36,[2025],`For an AP, 3, 6, 9, …, 198, 10^{th} term from the end is 168.`,`If ‘a’ and ‘l’ are the first and last terms of an AP with common difference ‘d’, then nth term from the end is l − (n − 1)d.`,3,`By R, the 10th term from the end = 198 − 9 × 3 = 171, not 168, so A is false. R is the correct formula, so R is true.<br><span class="ans">Answer: (d)</span>`);
ar(37,[],`a_{n} − a_{n−1} is not independent of n then the given sequences is an AP.`,`Common difference d = a_{n} − a_{n−1} is constant or independent of n.`,3,`In an AP the difference a_{n} − a_{n−1} must be independent of n. If it depends on n, the sequence is not an AP, so A is false. R is true.<br><span class="ans">Answer: (d)</span>`);
ar(38,[],`If n^{th} term of an AP is 7 − 4n then its common difference is −4.`,`Common difference of an AP is d = a_{n+1} − a_{n}.`,0,`a_{n+1} − a_{n} = 7 − 4(n + 1) − (7 − 4n) = −4, so A is true. R is the formula used, so it explains A.<br><span class="ans">Answer: (a)</span>`);
ar(39,[],`If sum of the first n terms of an AP is S_{n} = 3n^{2} − 4n. Then its n^{th} term is a_{n} = 6n − 7.`,`n^{th} term of an AP, whose sum to n terms is S_{n} is given by, a_{n} = S_{n} − S_{n−1}.`,0,`a_{n} = S_{n} − S_{n−1} = 3n^{2} − 4n − [3(n − 1)^{2} − 4(n − 1)] = 6n − 3 − 4 = 6n − 7. So A is true. R is the formula used, so it explains A.<br><span class="ans">Answer: (a)</span>`);
ar(40,[2023],`a, b, c are in A.P. if and only if 2b = a + c.`,`The sum of first n odd natural numbers is n^{2}.`,1,`A is true, because b − a = c − b is the same as 2b = a + c. R is also true (1 + 3 + … + (2n − 1) = n^{2}), but it has nothing to do with the condition in A, so it is not the explanation.<br><span class="ans">Answer: (b)</span>`);
ar(41,[],`−5, −[[5|2]], 0, [[5|2]], … is an AP.`,`The terms of an AP cannot have both positive and negative rational numbers.`,2,`The common difference is [[5|2]] throughout, so A is true. R is false, since an AP such as −5, −[[5|2]], 0, [[5|2]] has both positive and negative rational terms.<br><span class="ans">Answer: (c)</span>`);

/* ===== 2 marks ===== */
vsa(1,[],`If the number x + 3, 2x + 1 and x − 7 are in AP find the value of x.`,`2(2x + 1) = (x + 3) + (x − 7), so 4x + 2 = 2x − 4 and <b>x = −3</b>.`);
vsa(2,[],`Find the values of a, b and c such that the numbers a, 10, b, c, 31 are in AP.`,`10 is the second term and 31 is the fifth term, so 3d = 21 and d = 7.<br><b>a = 3, b = 17, c = 24</b>.`);
vsa(3,[],`Find the 21^{st} term of the AP −4[[1|2]], −3, −1[[1|2]], …`,`a = −4.5 and d = 1.5. a_{21} = −4.5 + 20 × 1.5 = <b>25.5</b> (= 25[[1|2]]).`);
vsa(4,[],`Find the 7^{th} term from the end of AP 7, 10, 13, …, 184.`,`7th term from the end = l − 6d = 184 − 6 × 3 = <b>166</b>.`);
vsa(5,[],`Find the middle term of the AP 213, 205, 197, …, 37.`,`d = −8. n = [[37 − 213|−8]] + 1 = 22 + 1 = 23 terms, so the middle term is the 12th.<br>a_{12} = 213 + 11(−8) = <b>125</b>.`);
vsa(6,[],`Find, 100 is a term of the AP 25, 28, 31, … or not.`,`d = 3. 100 = 25 + (n − 1)3 gives n − 1 = 25, so n = 26, a whole number.<br>So yes, <b>100 is the 26th term</b>.`);
vsa(7,[],`Is 184 a term of the sequence 3, 7, 11, … ?`,`d = 4. 184 = 3 + (n − 1)4 gives n − 1 = [[181|4]] = 45.25, which is not a whole number.<br>So <b>184 is not a term</b> of the sequence.`);
vsa(8,[],`How many two digits numbers are divisible by 3?`,`The numbers are 12, 15, 18, …, 99. 99 = 12 + (n − 1)3, so n − 1 = 29 and n = <b>30</b>.`);
vsa(9,[],`If the n^{th} term of an AP −1, 4, 9, 14, … is 129. Find the value of n?`,`d = 5. 129 = −1 + (n − 1)5, so n − 1 = 26 and <b>n = 27</b>.`);
vsa(10,[],`Write the n^{th} term of an AP [[1|m]], [[1 + m|m]], [[1 + 2m|m]], …`,`d = [[1 + m|m]] − [[1|m]] = 1. a_{n} = [[1|m]] + (n − 1) × 1 = <b>[[1|m]] + n − 1</b>, or [[1 + m(n − 1)|m]].`);
vsa(11,[],`Which term of the AP 3, 15, 27, 39, … will be 120 more than its 21^{st} term?`,`d = 12. 120 more is [[120|12]] = 10 terms later, so it is the (21 + 10) = <b>31st term</b>.`);
vsa(12,[],`The 8^{th} term of an AP is zero. Prove that its 38^{th} term is triple of its 18^{th} term.`,`a_{8} = 0 gives a + 7d = 0, so a = −7d.<br>a_{38} = a + 37d = 30d and a_{18} = a + 17d = 10d.<br>So a_{38} = 3 × a_{18}. Hence proved.`);
vsa(13,[],`For AP show that a_{p} + a_{p+2q} = 2a_{p+q}.`,`a_{p} + a_{p+2q} = [a + (p − 1)d] + [a + (p + 2q − 1)d] = 2a + (2p + 2q − 2)d = 2[a + (p + q − 1)d] = 2a_{p+q}. Hence proved.`);
vsa(14,[],`In an AP, 32^{nd} term is twice the 12^{th} term. Prove that 70^{th} term is twice the 31^{st} term.`,`a + 31d = 2(a + 11d), so a = 9d.<br>a_{70} = a + 69d = 78d and a_{31} = a + 30d = 39d.<br>So a_{70} = 2 × a_{31}. Hence proved.`);
vsa(15,[],`The seventeenth term of an AP exceeds its 10^{th} term by 7. Find the common difference.`,`a_{17} − a_{10} = 7d = 7, so <b>d = 1</b>.`);
vsa(16,[],`If five times the fifth term of an AP is equal to eight times its eighth term, show that its 13^{th} term is zero.`,`5(a + 4d) = 8(a + 7d), so 5a + 20d = 8a + 56d and a = −12d.<br>a_{13} = a + 12d = −12d + 12d = 0. Hence proved.`);
vsa(17,[],`The ninth term of an AP is −32 and the sum of its eleventh and thirteenth term is −94. Find the common difference of the AP.`,`a + 8d = −32 and (a + 10d) + (a + 12d) = −94, i.e. a + 11d = −47.<br>Subtracting: 3d = −15, so <b>d = −5</b>.`);
vsa(18,[],`How many terms of AP 3, 5, 7, 9, … must be taken to get the sum 120?`,`S_{n} = [[n|2]][6 + 2(n − 1)] = n(n + 2) = 120, so n^{2} + 2n − 120 = 0, i.e. (n + 12)(n − 10) = 0.<br><b>n = 10</b> terms.`);
vsa(19,[],`Find the sum of first ten multiple of 5.`,`The multiples are 5, 10, …, 50. S = [[10|2]](5 + 50) = <b>275</b>.`);
vsa(20,[],`Find the sum of first 15 multiples of 8.`,`The multiples are 8, 16, …, 120. S = [[15|2]](8 + 120) = <b>960</b>.`);
vsa(21,[],`What is the sum of five positive integer divisible by 6?`,`The five smallest are 6, 12, 18, 24, 30. S = [[5|2]](6 + 30) = <b>90</b>.`);
vsa(22,[],`Find the sum of first 16 terms of the AP 10, 6, 2…`,`S_{16} = [[16|2]][2 × 10 + 15(−4)] = 8 × (−40) = <b>−320</b>.`);
vsa(23,[],`If S_{n} the sum of first n terms of an AP is given by S_{n} = 3n^{2} − 4n. Find the n^{th} term.`,`a_{n} = S_{n} − S_{n−1} = 3n^{2} − 4n − [3(n − 1)^{2} − 4(n − 1)] = 6n − 3 − 4.<br><b>a_{n} = 6n − 7</b>.`);
vsa(24,[],`If the sum of n terms of an AP is 2n^{2} + 5n then find the 4^{th} term.`,`S_{4} = 32 + 20 = 52 and S_{3} = 18 + 15 = 33.<br>a_{4} = 52 − 33 = <b>19</b>.`);
vsa(25,[],`If the sum of first n terms of an AP is n^{2}, then find its 10^{th} term.`,`a_{10} = S_{10} − S_{9} = 100 − 81 = <b>19</b>.`);
vsa(26,[],`If the sum of first k terms of an AP is 3k^{2} − k and its common difference is 6. What is the first term?`,`The first term a_{1} = S_{1} = 3 − 1 = <b>2</b>. (Check: S_{2} = 10, so a_{2} = 8 and d = 6 ✓.)`);
vsa(27,[],`The fifth term of an AP is 20 and the sum of its seventh and eleventh terms is 64. Find the common difference.`,`a + 4d = 20 and (a + 6d) + (a + 10d) = 64, i.e. a + 8d = 32.<br>Subtracting: 4d = 12, so <b>d = 3</b>.`);
vsa(28,[],`The fourth term of an AP is 11. The sum of the fifth and seventh terms of the AP is 34. Find the common difference.`,`a + 3d = 11 and (a + 4d) + (a + 6d) = 34, i.e. a + 5d = 17.<br>Subtracting: 2d = 6, so <b>d = 3</b>.`);
vsa(29,[],`If the sum of first m terms of an AP is the same as the sum of its first n terms, show that the sum of its first (m + n) terms is zero.`,`S_{m} = S_{n} gives [[m|2]][2a + (m − 1)d] = [[n|2]][2a + (n − 1)d].<br>2a(m − n) + d[m^{2} − m − n^{2} + n] = 0, so (m − n)[2a + (m + n − 1)d] = 0.<br>Since m ≠ n, 2a + (m + n − 1)d = 0. Therefore S_{m+n} = [[m + n|2]][2a + (m + n − 1)d] = 0. Hence proved.`);
vsa(30,[],`If S_{n} denotes the sum of n terms of an AP whose common difference is d and first term is a, find S_{n} = 2S_{n−1} + S_{n−2}.`,`(As printed this reads S_{n} = 2S_{n−1} + S_{n−2}; the standard problem asks for the value of S_{n} − 2S_{n−1} + S_{n−2}, which is what is worked out here.)<br>S_{n} − S_{n−1} = a_{n} and S_{n−1} − S_{n−2} = a_{n−1}.<br>S_{n} − 2S_{n−1} + S_{n−2} = (S_{n} − S_{n−1}) − (S_{n−1} − S_{n−2}) = a_{n} − a_{n−1} = <b>d</b>.`);

/* ===== 3 marks ===== */
sa(1,[2025],`Find the sum of all 3 digit natural numbers which are divisible by 11.`,`The numbers are 110, 121, …, 990. 990 = 110 + (n − 1)11, so n − 1 = 80 and n = 81.<br>S = [[81|2]](110 + 990) = 81 × 550 = <b>44550</b>.`);
sa(2,[],`The sum of four consecutive number in AP is 32 and the ratio of the product of the first and last term to the product of two middle terms is 7 : 15. Find the numbers.`,`Let the numbers be a − 3d, a − d, a + d, a + 3d. Sum = 4a = 32, so a = 8.<br>[[(a − 3d)(a + 3d)|(a − d)(a + d)]] = [[7|15]]: 15(64 − 9d^{2}) = 7(64 − d^{2}), so 512 = 128d^{2} and d^{2} = 4, d = ±2.<br>The numbers are <b>2, 6, 10, 14</b> (or in reverse order). (Check: [[2 × 14|6 × 10]] = [[28|60]] = [[7|15]] ✓.)`);
sa(3,[],`The sum of the first 7 terms of an AP is 63 and that of its next 7 terms is 161. Find the AP.`,`S_{7} = 63 and S_{14} = 63 + 161 = 224.<br>S_{7}: [[7|2]](2a + 6d) = 63, so a + 3d = 9. S_{14}: 7(2a + 13d) = 224, so 2a + 13d = 32.<br>Subtracting 2(a + 3d) = 18: 7d = 14, so d = 2 and a = 3.<br>The AP is <b>3, 5, 7, 9, …</b>`);
sa(4,[],`The sum of the 5^{th} and the 9^{th} terms of an AP is 30. If its 25^{th} term is three times its 8^{th} term find the AP.`,`(a + 4d) + (a + 8d) = 30, so a + 6d = 15. And a + 24d = 3(a + 7d), so 3d = 2a.<br>Substituting a = [[3d|2]]: [[3d|2]] + 6d = 15, so d = 2 and a = 3.<br>The AP is <b>3, 5, 7, 9, …</b>`);
sa(5,[],`If the ratio of the sum of first n terms of two AP’s is (7n + 1) : (4n + 27) find the ratio of their m^{th} terms.`,`The ratio of the sums is S_{n} : S_{n}′ = (n/2)[2a + (n − 1)d] : (n/2)[2a′ + (n − 1)d′] = [a + ((n − 1)/2)d] : [a′ + ((n − 1)/2)d′] = (7n + 1) : (4n + 27).<br>The m-th term is a + (m − 1)d, so we need (n − 1)/2 = m − 1, i.e. n = 2m − 1.<br>[[a_{m}|a_{m}′]] = [[7(2m − 1) + 1|4(2m − 1) + 27]] = <b>[[14m − 6|8m + 23]]</b>.`);
sa(6,[],`Which term of the AP 20, 19[[1|4]], 18[[1|2]], 17[[3|4]], … is the first negative term.`,`d = −[[3|4]]. a_{n} = 20 − (n − 1)[[3|4]] < 0 gives n − 1 > [[80|3]] = 26.67, so n − 1 = 27 and n = 28.<br>a_{28} = 20 − 27 × [[3|4]] = −[[1|4]]. The <b>28th term</b> is the first negative term.`);
sa(7,[2023],`Which term of the AP 65, 61, 57, 53, … is the first negative term.`,`d = −4. 65 − 4(n − 1) < 0 gives n − 1 > 16.25, so n = 18.<br>a_{18} = 65 − 68 = −3. The <b>18th term</b> is the first negative term.`);
sa(8,[],`Find the middle term of the AP 7, 13, 19, …, 247.`,`d = 6. n = [[247 − 7|6]] + 1 = 41, so the middle term is the 21st.<br>a_{21} = 7 + 20 × 6 = <b>127</b>.`);
sa(9,[],`Show that the sum of all terms of an AP whose first term is a, the second term is b and the last term is c, is equal to [[(a + c)(b + c − 2a)|2(b − a)]].`,`d = b − a. From c = a + (n − 1)d, n − 1 = [[c − a|b − a]], so n = [[c − a + b − a|b − a]] = [[b + c − 2a|b − a]].<br>S = [[n|2]](a + c) = [[(a + c)(b + c − 2a)|2(b − a)]]. Hence proved.`);
sa(10,[],`If in an AP, the sum of first m terms is n and the sum of its first n terms is m, then prove that the sum of its first (m + n) terms is −(m + n).`,`[[m|2]][2a + (m − 1)d] = n and [[n|2]][2a + (n − 1)d] = m.<br>Divide by m and n: 2a + (m − 1)d = [[2n|m]] and 2a + (n − 1)d = [[2m|n]]. Subtracting: (m − n)d = 2([[n|m]] − [[m|n]]) = [[2(n^{2} − m^{2})|mn]], so d = −[[2(m + n)|mn]] (as m ≠ n).<br>Then 2a = [[2n|m]] − (m − 1)d. S_{m+n} = [[m + n|2]][2a + (m + n − 1)d] = [[m + n|2]]([[2n|m]] + nd) = [[m + n|2]]([[2n|m]] − [[2(m + n)|m]]) = [[m + n|2]] × [[−2m|m]] = −(m + n). Hence proved.`);
sa(11,[2024],`If the sum of first m terms of an A.P is same as sum of its first n terms (m ≠ n) then show that the sum of its first (m + n) terms is zero.`,`S_{m} = S_{n} gives (m − n)[2a + (m + n − 1)d] = 0 (after simplifying), and since m ≠ n, 2a + (m + n − 1)d = 0.<br>So S_{m+n} = [[m + n|2]][2a + (m + n − 1)d] = 0. Hence proved.`);
sa(12,[],`The 17^{th} term of an AP is 5 more than twice its 8^{th} term. If 11^{th} term of AP is 43, then find its n^{th} term.`,`a + 16d = 2(a + 7d) + 5, so a = 2d − 5. And a + 10d = 43.<br>2d − 5 + 10d = 43, so d = 4 and a = 3.<br>a_{n} = 3 + (n − 1)4 = <b>4n − 1</b>.`);
sa(13,[2023],`How many terms are there in an A.P whose first and fifth terms are −14 and 2 respectively and the last term is 62.`,`a = −14 and a + 4d = 2, so d = 4.<br>62 = −14 + (n − 1)4, so n − 1 = 19 and n = <b>20</b>.`);
sa(14,[2023,2024],`The sum of first 15 terms of an A.P is 750 and its first term is 15. Find its 20^{th} term and n^{th} term.`,`S_{15} = [[15|2]][30 + 14d] = 750, so 30 + 14d = 100 and d = 5.<br>a_{20} = 15 + 19 × 5 = <b>110</b>. a_{n} = 15 + (n − 1)5 = <b>5n + 10</b>.`);
sa(15,[2023],`Rohan repays his total loan of Rs 1,18,000 by paying every month starting with the first installment of Rs 1,000. If he increases the installment by Rs 100 every month, what amount will be paid by him in the 30^{th} installment? What amount of loan has he paid after 30^{th} installment?`,`a = 1000 and d = 100. a_{30} = 1000 + 29 × 100 = <b>Rs 3900</b>.<br>S_{30} = [[30|2]](1000 + 3900) = 15 × 4900 = <b>Rs 73500</b> paid after the 30th installment.`);
sa(16,[2023],`If p^{th} term of an A.P is q and q^{th} term is p, then prove that its n^{th} term is (p + q − n).`,`a + (p − 1)d = q and a + (q − 1)d = p. Subtracting: (p − q)d = q − p, so d = −1.<br>Then a = q + (p − 1) = p + q − 1.<br>a_{n} = (p + q − 1) + (n − 1)(−1) = p + q − n. Hence proved.`);
sa(17,[2023],`In an A.P the sum of the first n terms is given by S_{n} = 6n − n^{2}. Find its 30^{th} term.`,`a_{30} = S_{30} − S_{29} = (180 − 900) − (174 − 841) = −720 − (−667) = <b>−53</b>.`);
sa(18,[2023],`Find the common difference of an A.P whose first term is 8, the last term is 65 and the sum of all its terms is 730.`,`S = [[n|2]](8 + 65) = 730, so n = 20.<br>65 = 8 + 19d, so 19d = 57 and <b>d = 3</b>.`);
sa(19,[2023],`Find the sum of all integers between 50 and 500, which are divisible by 7.`,`The numbers are 56, 63, …, 497. 497 = 56 + (n − 1)7, so n − 1 = 63 and n = 64.<br>S = [[64|2]](56 + 497) = 32 × 553 = <b>17696</b>.`);
sa(20,[2023],`How many numbers lie between 10 and 300, which when divided by 4 leave a remainder 3? Also find their sum.`,`The numbers are 11, 15, 19, …, 299. 299 = 11 + (n − 1)4, so n − 1 = 72 and n = <b>73</b>.<br>S = [[73|2]](11 + 299) = 73 × 155 = <b>11315</b>.`);
sa(21,[2024],`In an A.P, the sum of three consecutive terms is 24 and the sum of their squares is 194. Find the numbers.`,`Let the terms be a − d, a, a + d. The sum 3a = 24, so a = 8.<br>(a − d)^{2} + a^{2} + (a + d)^{2} = 3a^{2} + 2d^{2} = 192 + 2d^{2} = 194, so d^{2} = 1 and d = ±1.<br>The numbers are <b>7, 8, 9</b> (or 9, 8, 7).`);
sa(22,[2024],`If the sum of first 7 terms of an A.P is 49 and that of first 17 terms is 289, find the sum of its first 20 terms.`,`S_{7} = [[7|2]](2a + 6d) = 49, so a + 3d = 7. S_{17} = 17(a + 8d) = 289, so a + 8d = 17.<br>Subtracting: 5d = 10, so d = 2 and a = 1.<br>S_{20} = 10(2 + 19 × 2) = <b>400</b>.`);
sa(23,[2024],`The first term of an A.P is 5, the last term is 45 and the sum of all the terms is 400. Find the number of terms and the common difference.`,`S = [[n|2]](5 + 45) = 400, so n = <b>16</b>.<br>45 = 5 + 15d, so d = [[40|15]] = <b>[[8|3]]</b>.`);
sa(24,[2024],`The ratio of the 10^{th} term to its 30^{th} term of an A.P is 1 : 3 and the sum of its first six terms is 42. Find the first term and the common difference of A.P.`,`3(a + 9d) = a + 29d, so 2a = 2d and a = d.<br>S_{6} = 3(2a + 5d) = 42, so 2a + 5d = 14, i.e. 7a = 14.<br><b>a = 2 and d = 2</b>.`);
sa(25,[2024],`A man starts his job with a certain monthly salary and earns a fixed increment every year. If his salary was Rs 15,000 after 4 years of service and Rs 18000 after 10 years of service, what was his starting salary and what was the annual increment?`,`Let the starting salary be a and the yearly increment d. After 4 years of service the salary is a + 4d, and after 10 years it is a + 10d.<br>a + 4d = 15000 and a + 10d = 18000. Subtracting: 6d = 3000, so <b>d = Rs 500</b>. Then a = 15000 − 2000 = <b>Rs 13000</b>.`);
sa(26,[2025],`The sum of Rs 2000 invested at 7% per annum simple interest. Calculate the interest at the end of 1^{st}, 2^{nd} and 3^{rd} year. Do these interests form an AP? If so, find the interest at the end of the 27^{th} year?`,`Interest at the end of the 1st year = 2000 × [[7|100]] = Rs 140. At the end of the 2nd year: Rs 280. At the end of the 3rd year: Rs 420.<br>The numbers 140, 280, 420, … have a common difference of 140, so <b>they form an AP</b>.<br>Interest at the end of the 27th year = 140 + 26 × 140 = 140 × 27 = <b>Rs 3780</b>.`);

/* ===== 5 marks ===== */
la(1,[2023],`The ratio of 11^{th} term to 17^{th} term of an A.P is 3 : 4. Find the ratio of 5^{th} term to 21^{st} term of the same A.P. Also find the ratio of the sum of first 5 terms to that of first 21 terms.`,`[[a + 10d|a + 16d]] = [[3|4]], so 4a + 40d = 3a + 48d and a = 8d.<br>[[a_{5}|a_{21}]] = [[a + 4d|a + 20d]] = [[12d|28d]] = <b>[[3|7]]</b>.<br>S_{5} = [[5|2]](2a + 4d) = [[5|2]] × 20d = 50d. S_{21} = [[21|2]](2a + 20d) = [[21|2]] × 36d = 378d.<br>[[S_{5}|S_{21}]] = [[50|378]] = <b>[[25|189]]</b>.`);
la(2,[2023],`How many terms of an A.P 45, 39, 33, … must be taken so that their sum is 180? Explain the double answer.`,`a = 45, d = −6. [[n|2]][90 − 6(n − 1)] = 180, so n(96 − 6n) = 360, i.e. n^{2} − 16n + 60 = 0.<br>(n − 6)(n − 10) = 0, so <b>n = 6 or n = 10</b>.<br><b>Why two answers:</b> the terms are 45, 39, 33, 27, 21, 15, 9, 3, −3, −9, … The 7th to 10th terms are 9, 3, −3, −9, whose sum is 0. So adding them changes nothing, and S_{6} = S_{10} = 180.`);
la(3,[2023],`200 logs are stacked in the following manner: 20 logs in the bottom row, 19 in the next row, 18 in the row next to it and so on (see below figures). In how many rows are the 200 logs placed and how many logs are in the top row?`,`a = 20 and d = −1. S_{n} = [[n|2]][40 − (n − 1)] = 200, so n(41 − n) = 400, i.e. n^{2} − 41n + 400 = 0.<br>(n − 16)(n − 25) = 0, so n = 16 or n = 25.<br>For n = 25 the 25th row would have 20 − 24 = −4 logs, which is impossible. So <b>n = 16 rows</b>.<br>Top row = a_{16} = 20 − 15 = <b>5 logs</b>.`,{fig:LOGS});
la(4,[2023,2025],`The sum of the third and the seventh terms of an AP is 6 and their product is 8. Find the sum of first sixteen terms of an AP.`,`(a + 2d) + (a + 6d) = 6, so a + 4d = 3 and a = 3 − 4d.<br>(a + 2d)(a + 6d) = (3 − 2d)(3 + 2d) = 9 − 4d^{2} = 8, so d^{2} = [[1|4]] and d = ±[[1|2]].<br>If d = [[1|2]], a = 1: S_{16} = 8(2 + 7.5) = <b>76</b>.<br>If d = −[[1|2]], a = 5: S_{16} = 8(10 − 7.5) = <b>20</b>.`);
la(5,[2024],`The sum of first and eighth terms of an A.P is 32 and their product is 60. Find the first term and common difference of the A.P. Hence, also find the sum of its first 20 terms.`,`a + (a + 7d) = 32 and a(a + 7d) = 60. So a and a + 7d are the roots of t^{2} − 32t + 60 = 0, i.e. (t − 2)(t − 30) = 0.<br>Case 1: a = 2, a + 7d = 30, so d = 4. S_{20} = 10(4 + 76) = <b>800</b>.<br>Case 2: a = 30, a + 7d = 2, so d = −4. S_{20} = 10(60 − 76) = <b>−160</b>.`);
la(6,[2023],`Solve the equation for x: 1 + 4 + 7 + 10 + ⋯ + x = 287.`,`a = 1, d = 3. [[n|2]][2 + 3(n − 1)] = 287, so n(3n − 1) = 574, i.e. 3n^{2} − n − 574 = 0.<br>D = 1 + 6888 = 6889 = 83^{2}, so n = [[1 + 83|6]] = 14.<br>x = 1 + 13 × 3 = <b>40</b>.`);
la(7,[2023],`Solve the equation: −4 + (−1) + 2 + 5 + ⋯ + x = 437.`,`a = −4, d = 3. [[n|2]][−8 + 3(n − 1)] = 437, so n(3n − 11) = 874, i.e. 3n^{2} − 11n − 874 = 0.<br>D = 121 + 10488 = 10609 = 103^{2}, so n = [[11 + 103|6]] = 19.<br>x = −4 + 18 × 3 = <b>50</b>.`);
la(8,[2023],`If the sum of first 6 terms of an AP is 36 and that of the first 16 terms is 256 then find the sum of first 10 terms.`,`S_{6}: 3(2a + 5d) = 36, so 2a + 5d = 12. S_{16}: 8(2a + 15d) = 256, so 2a + 15d = 32.<br>Subtracting: 10d = 20, so d = 2 and a = 1.<br>S_{10} = 5(2 + 18) = <b>100</b>.`);
la(9,[2023],`Poorna saves Rs 32 during the first month, Rs 36 in the second month and Rs 40 in the third month. If she continues to save in this manner, in how many months will she save Rs 2000?`,`a = 32, d = 4. [[n|2]][64 + 4(n − 1)] = 2000, so n(2n + 30) = 2000, i.e. n^{2} + 15n − 1000 = 0.<br>(n + 40)(n − 25) = 0, so n = 25.<br>She will have saved Rs 2000 in <b>25 months</b>.`);
la(10,[2023],`The sum of first seven terms of an AP is 182. If its 4^{th} term and the 17^{th} term are in the ratio 1 : 5, find the A.P.`,`S_{7} = [[7|2]](2a + 6d) = 182, so a + 3d = 26. Also 5(a + 3d) = a + 16d, so 4a = d.<br>a + 12a = 26, so a = 2 and d = 8.<br>The AP is <b>2, 10, 18, 26, …</b>`);
la(11,[2025],`The sum of first six terms of an AP is 42. The ratio of the 10^{th} term to the 30^{th} term is 1 : 3. Calculate the first and thirteenth terms of the AP.`,`3(a + 9d) = a + 29d gives a = d. S_{6} = 3(2a + 5d) = 42 gives 2a + 5d = 14, so 7a = 14.<br>a = d = 2. The first term is <b>2</b> and a_{13} = 2 + 12 × 2 = <b>26</b>.`);
la(12,[2023],`The sum of first q terms of an AP is 63q − 3q^{2}. If its p^{th} term is −60, find the value of p. Also find the 11^{th} term of this AP.`,`a_{n} = S_{n} − S_{n−1} = 63 − 3(2n − 1) = 66 − 6n.<br>a_{p} = 66 − 6p = −60, so <b>p = 21</b>.<br>a_{11} = 66 − 66 = <b>0</b>.`);
la(13,[2023],`Find the sum of integers between 100 and 200 which are (i) Divisible by 9 (ii) Not divisible by 9.`,`<b>(i)</b> The multiples of 9 are 108, 117, …, 198. 198 = 108 + (n − 1)9, so n = 11. Sum = [[11|2]](108 + 198) = <b>1683</b>.<br><b>(ii)</b> The sum of all integers from 101 to 199 is [[99|2]](101 + 199) = 14850. Not divisible by 9: 14850 − 1683 = <b>13167</b>.`);
la(14,[2024],`In an A.P of 40 terms, the sum of first 9 terms is 153 and the sum of last 6 terms is 687. Determine the first term and common difference of A.P. Also, find the sum of all the terms of the A.P.`,`S_{9} = [[9|2]](2a + 8d) = 153, so a + 4d = 17.<br>The last 6 terms are a_{35} to a_{40}: [[6|2]](a_{35} + a_{40}) = 687, so 2a + 73d = 229.<br>Substituting a = 17 − 4d: 34 − 8d + 73d = 229, so 65d = 195, d = 3 and a = 5.<br>S_{40} = 20(10 + 39 × 3) = 20 × 127 = <b>2540</b>.<br>The first term is <b>5</b>, d = <b>3</b>.`);
la(15,[2025],`An AP consists of ‘n’ terms whose nth term is 4 and the common difference is 2. If the sum of ‘n’ terms of AP is −14, then find ‘n’. Also, find the sum of the first 20 terms.`,`a_{n} = 4 and d = 2, so a = 4 − 2(n − 1) = 6 − 2n.<br>S_{n} = [[n|2]](a + a_{n}) = [[n|2]](10 − 2n) = n(5 − n) = −14, so n^{2} − 5n − 14 = 0, i.e. (n − 7)(n + 2) = 0.<br><b>n = 7</b> and a = −8.<br>S_{20} = 10[2(−8) + 19 × 2] = 10 × 22 = <b>220</b>.`);
la(16,[2025],`The minimum age of children eligible to participate in a painting competition is 8 years. It is observed that the age of the youngest boy was 8 years and the ages of the participants, when seated in order of age, have a common difference of 4 months. If the sum of the ages of all the participants is 168 years, find the age of the eldest participant in the painting competition.`,`a = 8 years and d = 4 months = [[1|3]] year. Let there be n participants.<br>[[n|2]][16 + (n − 1)[[1|3]]] = 168, so n(48 + n − 1) = 1008, i.e. n^{2} + 47n − 1008 = 0.<br>D = 2209 + 4032 = 6241 = 79^{2}, so n = [[−47 + 79|2]] = 16.<br>The eldest is a_{16} = 8 + 15 × [[1|3]] = <b>13 years</b>.`);

/* ===== Case-based ===== */
cs(1,[],`The school auditorium was to be constructed to accommodate at least 1500 people. The chairs are to be placed in concentric circular arrangement in such a way that each succeeding circular row has 10 seats more than the previous one.`,[
  {l:'(i)',m:1,q:`If the first circular row has 30 seats, how many seats will be there in the 10th row?`},
  {l:'(ii)',m:2,q:`(a) For 1500 seats in the auditorium, how many rows need to be there?`,or:`(b) If 1500 seats are to be arranged in the auditorium, how many seats are still left to be put after 10th row?`},
  {l:'(iii)',m:1,q:`If there were 17 rows in the auditorium, how many seats will be there in the middle row?`}
],`a = 30 and d = 10.<br><b>(i)</b> a_{10} = 30 + 9 × 10 = <b>120</b> seats.<br><b>(ii)(a)</b> [[n|2]][60 + 10(n − 1)] = 1500, so n(10n + 50) = 3000, i.e. n^{2} + 5n − 300 = 0, so (n + 20)(n − 15) = 0 and n = <b>15 rows</b>.<br>(OR) <b>(b)</b> S_{10} = 5(60 + 90) = 750. Seats still to be put = 1500 − 750 = <b>750</b>.<br><b>(iii)</b> With 17 rows the middle row is the 9th: a_{9} = 30 + 8 × 10 = <b>110</b> seats.`);
cs(2,[],`Manpreet Kaur is the national record holder for women in the shot-put discipline. Her throw of 18.86 m at the Asian Grand Prix in 2017 is the biggest distance for an Indian female athlete. Keeping her as a role model, Sanjitha is determined to earn gold in Olympics one day. Initially her throw reached 7.56 m only. Being an athlete in school, she regularly practiced both in the mornings and in the evenings and was able to improve the distance by 9 cm every week. During the special camp for 15 days, she started with 40 throws and every day kept increasing the number of throws by 12 to achieve this remarkable progress.`,[
  {l:'(i)',m:1,q:`How many throws Sanjitha practiced on 11th day of the camp?`},
  {l:'(ii)',m:2,q:`(a) What would be Sanjitha’s throw distance at the end of 6 months?`,or:`(b) When will she be able to achieve a throw of 11.16 m?`},
  {l:'(iii)',m:1,q:`How many throws did she do during the entire camp of 15 days?`}
],`<b>(i)</b> Throws form an AP with a = 40 and d = 12. a_{11} = 40 + 10 × 12 = <b>160</b> throws.<br><b>(ii)(a)</b> Distances form an AP: first term 7.56 m and d = 0.09 m per week. Taking 6 months = 24 weeks, the distance = 7.56 + 24 × 0.09 = <b>9.72 m</b>.<br>(OR) <b>(b)</b> 7.56 + 0.09n = 11.16, so 0.09n = 3.6 and n = 40. She will reach 11.16 m after <b>40 weeks</b>.<br><b>(iii)</b> S_{15} = [[15|2]][80 + 14 × 12] = [[15|2]] × 248 = <b>1860 throws</b>.`);
cs(3,[],`Salary: In investigating different job opportunities, you find that firm A will start you at Rs 25,000 per year and guarantee you a raise of Rs 1,200 each year whereas firm B will start you at Rs 28,000 per year but will guarantee you a raise of only Rs 800 each year.`,[
  {l:'(i)',m:1,q:`Over a period of 15 years, how much would you receive from firm A?`},
  {l:'(ii)',m:1,q:`Over a period of 15 years, how much would you receive from firm B?`},
  {l:'(iii)',m:2,q:`(a) What would be your annual salary at firm A for the tenth year?`,or:`(b) What would be your annual salary at firm B for the tenth year?`}
],`<b>(i)</b> Firm A: a = 25000, d = 1200. S_{15} = [[15|2]][50000 + 14 × 1200] = [[15|2]] × 66800 = <b>Rs 501000</b>.<br><b>(ii)</b> Firm B: a = 28000, d = 800. S_{15} = [[15|2]][56000 + 14 × 800] = [[15|2]] × 67200 = <b>Rs 504000</b>.<br><b>(iii)(a)</b> a_{10} = 25000 + 9 × 1200 = <b>Rs 35800</b>.<br>(OR) <b>(b)</b> a_{10} = 28000 + 9 × 800 = <b>Rs 35200</b>.`);
cs(4,[],`Bequests to Charity: At the time our mother left this Earth, she gave Rs 90000 to her children of birth. This we kept and each year added Rs 30000 more, as a lasting memorial from the children she bore. When Rs 4,20,000 is thusly attained, all goes to charity that her memory be maintained.`,[
  {l:'(i)',m:1,q:`What was the balance in the sixth year?`},
  {l:'(ii)',m:2,q:`In what year was the goal of Rs 420,000 met?`}
],`The balance in successive years forms an AP with a = 90000 and d = 30000.<br><b>(i)</b> a_{6} = 90000 + 5 × 30000 = <b>Rs 240000</b>.<br><b>(ii)</b> 90000 + (n − 1)30000 = 420000, so n − 1 = 11 and n = 12. The goal was met in the <b>12th year</b>.`);
cs(5,[],`It takes 5 toothpicks to build the top trapezoid shown as below. You need 9 toothpicks to build 2 adjoined trapezoids and 13 toothpicks for 3 trapezoids.`,[
  {l:'(i)',m:1,q:`If 1000 toothpicks are available, how many trapezoids will be in the last complete row?`},
  {l:'(ii)',m:1,q:`How many complete rows will there be?`},
  {l:'(iii)',m:1,q:`How many toothpicks will you use to construct these rows?`}
],`(The rows are taken as 1 trapezoid in the top row, 2 in the next, 3 in the next, and so on. Row n then needs 4n + 1 toothpicks: 5, 9, 13, … is an AP with a = 5 and d = 4.)<br>The toothpicks used for n rows: S_{n} = [[n|2]][10 + 4(n − 1)] = n(2n + 3).<br>S_{21} = 21 × 45 = 945 ≤ 1000, while S_{22} = 22 × 47 = 1034 > 1000.<br><b>(i)</b> The last complete row has <b>21 trapezoids</b>.<br><b>(ii)</b> There are <b>21 complete rows</b>.<br><b>(iii)</b> The toothpicks used = <b>945</b>.`,{fig:TRAP});
cs(6,[],`A manufacturer of TV sets produced 600 sets in the third year and 700 sets in the seventh year. Assuming that the production increases uniformly by a fixed number every year.`,[
  {l:'(i)',m:1,q:`What is the production in the 1st year?`},
  {l:'(ii)',m:1,q:`What is the production in the 10th year?`},
  {l:'(iii)',m:2,q:`What is the total production in first 7 years?`}
],`a_{3} = 600 and a_{7} = 700, so 4d = 100 and d = 25.<br><b>(i)</b> a = 600 − 2 × 25 = <b>550</b> sets.<br><b>(ii)</b> a_{10} = 550 + 9 × 25 = <b>775</b> sets.<br><b>(iii)</b> S_{7} = [[7|2]][2 × 550 + 6 × 25] = [[7|2]] × 1250 = <b>4375</b> sets.`);
cs(7,[2024],`Treasure Hunt is an exciting and adventurous game where participants follow a series of clues/numbers/maps to discover hidden treasures. Players engage in a thrilling quest, solving puzzles and riddles to unveil the location of the coveted prize. While playing a treasure hunt game, some clues (numbers) are hidden in various spots collectively forming an A.P. If the number on the nth spot is 20 + 4n, then answer the following questions to help the players in spotting the clues:`,[
  {l:'(i)',m:1,q:`Which number is on first spot?`},
  {l:'(ii)',m:2,q:`(a) Which spot is numbered as 112?`,or:`(b) What is the sum of all the numbers on the first 10 spots?`},
  {l:'(iii)',m:1,q:`Which number is on the (n − 2)^{th} spot?`}
],`<b>(i)</b> a_{1} = 20 + 4 = <b>24</b>.<br><b>(ii)(a)</b> 20 + 4n = 112, so n = <b>23</b>. The 23rd spot is numbered 112.<br>(OR) <b>(b)</b> a_{1} = 24 and a_{10} = 60. S_{10} = [[10|2]](24 + 60) = <b>420</b>.<br><b>(iii)</b> a_{n−2} = 20 + 4(n − 2) = <b>4n + 12</b>.`);
cs(8,[2025],`A school is organizing a charity run to raise funds for a local hospital. The run is planned as a series of rounds around track, with each round being 300 m. To make the event more challenging and engaging, the organizers decide to increase the distance of each subsequent round by 50 m. For example, the second round will be 350 m, the third round will be 400 m and so on. The total number of rounds planned is 10.`,[
  {l:'(i)',m:1,q:`Write the fourth, fifth and sixth term of the Arithmetic Progression so formed.`},
  {l:'(ii)',m:1,q:`Determine the distance of the 8^{th} round.`},
  {l:'(iii)',m:2,q:`(a) Find the total distance run after completing all 10 rounds.`,or:`(b) If a runner completes only the first 6 rounds, what is the total distance run by the runner?`}
],`The distances form an AP with a = 300 and d = 50.<br><b>(i)</b> a_{4} = 450, a_{5} = 500 and a_{6} = 550 m.<br><b>(ii)</b> a_{8} = 300 + 7 × 50 = <b>650 m</b>.<br><b>(iii)(a)</b> S_{10} = [[10|2]][600 + 9 × 50] = 5 × 1050 = <b>5250 m</b>.<br>(OR) <b>(b)</b> S_{6} = [[6|2]][600 + 5 × 50] = 3 × 850 = <b>2550 m</b>.`);
cs(9,[2025],`Cable cars at hill stations are one of the major tourist attractions. On a hill station, the length of cable car ride from base point to top most point on the hill is 5000 m. Poles are installed at equal intervals on the way to provide support to the cables on which car moves. The distance of first pole from base point is 200 m and subsequent poles are installed at equal interval of 150 m. Further, the distance of last pole from the top is 300 m.`,[
  {l:'(i)',m:1,q:`Find the distance of 10^{th} pole from the base.`},
  {l:'(ii)',m:1,q:`Find the distance between 15^{th} pole and 25^{th} pole.`},
  {l:'(iii)',m:2,q:`(a) Find the time taken by cable car to reach 15^{th} pole from the top if it is moving at the speed of 5 m/sec and coming from top.`,or:`(b) Find the total number of poles installed along the entire journey.`}
],`The pole distances from the base form an AP with a = 200 and d = 150.<br><b>(i)</b> a_{10} = 200 + 9 × 150 = <b>1550 m</b>.<br><b>(ii)</b> The distance between the 15th and 25th poles = 10 × 150 = <b>1500 m</b>.<br><b>(iii)(a)</b> The 15th pole is a_{15} = 200 + 14 × 150 = 2300 m from the base, i.e. 5000 − 2300 = 2700 m from the top. Time = [[2700|5]] = <b>540 s (9 minutes)</b>.<br>(OR) <b>(b)</b> The last pole is 5000 − 300 = 4700 m from the base. 200 + (n − 1)150 = 4700, so n − 1 = 30 and there are <b>31 poles</b>.`);
cs(10,[2025],`In an equilateral triangle of side 10 cm, equilateral triangle of side 1 cm are formed as shown in the figure below, such that there is one triangle in the first row, three triangles in the second row, five triangles in the third row and so on.`,[
  {l:'(i)',m:1,q:`How many triangles will be there in bottom most row?`},
  {l:'(ii)',m:1,q:`How many triangles will be there in fourth row from the bottom?`},
  {l:'(iii)',m:2,q:`(a) Find the total number of triangles of side 1 cm each till 8^{th} row.`,or:`(b) How many more number of triangles are there from 5^{th} row to 10^{th} row than in first 4 rows? Show working.`}
],`The rows have 1, 3, 5, … triangles: an AP with a = 1 and d = 2. The side is 10 cm, so there are 10 rows.<br><b>(i)</b> The bottom (10th) row has a_{10} = 1 + 9 × 2 = <b>19</b> triangles.<br><b>(ii)</b> The 4th row from the bottom is the 7th row: a_{7} = 1 + 6 × 2 = <b>13</b> triangles.<br><b>(iii)(a)</b> S_{8} = [[8|2]][2 + 7 × 2] = 4 × 16 = <b>64</b>.<br>(OR) <b>(b)</b> S_{10} = 100 and S_{4} = 16, so the 5th to 10th rows have 100 − 16 = 84 triangles. That is 84 − 16 = <b>68 more</b> than the first 4 rows.`,{fig:TRI});
cs(11,[2025],`In order to organize, Annual sports day, a school prepared an eight lane running track with an integrated football field inside the track area as shown below: The length of innermost lane of the track is 400 m and each subsequent lane is 7.6 m longer than the preceding lane.`,[
  {l:'(i)',m:1,q:`What is the length of the 6^{th} lane?`},
  {l:'(ii)',m:1,q:`How long is the 8^{th} lane than that of 4^{th} lane?`},
  {l:'(iii)',m:2,q:`(a) While practicing for a race, a student took one round each in first six lanes. Find the total distance covered by the student.`,or:`(b) A student took one round each in lane 4 to lane 8. Find the total distance covered by the student.`}
],`The lane lengths form an AP with a = 400 and d = 7.6.<br><b>(i)</b> a_{6} = 400 + 5 × 7.6 = <b>438 m</b>.<br><b>(ii)</b> a_{8} − a_{4} = 4d = 4 × 7.6 = <b>30.4 m</b>.<br><b>(iii)(a)</b> S_{6} = [[6|2]][800 + 5 × 7.6] = 3 × 838 = <b>2514 m</b>.<br>(OR) <b>(b)</b> a_{4} = 422.8 and a_{8} = 453.2, for 5 lanes. Sum = [[5|2]](422.8 + 453.2) = [[5|2]] × 876 = <b>2190 m</b>.`);
