cs(12,[],`Riya starts saving for a school trip. She saves Rs 50 in the first week and every week she saves Rs 20 more than in the previous week.`,[
  {l:'(i)',m:1,q:`How much does she save in the 8th week?`},
  {l:'(ii)',m:1,q:`How much has she saved altogether in the first 10 weeks?`},
  {l:'(iii)',m:2,q:`(a) In which week will she save Rs 350?`,or:`(b) How much has she saved altogether in the first 16 weeks?`}
],`The weekly savings form an AP with a = 50 and d = 20.<br><b>(i)</b> a_{8} = 50 + 7 × 20 = <b>Rs 190</b>.<br><b>(ii)</b> S_{10} = [[10|2]][100 + 9 × 20] = 5 × 280 = <b>Rs 1400</b>.<br><b>(iii)(a)</b> 50 + (n − 1)20 = 350, so n − 1 = 15 and n = <b>16th week</b>.<br>(OR) <b>(b)</b> S_{16} = 8[100 + 15 × 20] = 8 × 400 = <b>Rs 3200</b>.`);
cs(13,[],`A theatre has 20 seats in the first row and each following row has 2 more seats than the row before it. There are 25 rows in all.`,[
  {l:'(i)',m:1,q:`How many seats are there in the 10th row?`},
  {l:'(ii)',m:1,q:`How many seats are there in the last row?`},
  {l:'(iii)',m:2,q:`(a) Find the total number of seats in the theatre.`,or:`(b) In which row will the number of seats first be more than 50?`}
],`The seats per row form an AP with a = 20 and d = 2.<br><b>(i)</b> a_{10} = 20 + 9 × 2 = <b>38</b>.<br><b>(ii)</b> a_{25} = 20 + 24 × 2 = <b>68</b>.<br><b>(iii)(a)</b> S_{25} = [[25|2]](20 + 68) = [[25|2]] × 88 = <b>1100 seats</b>.<br>(OR) <b>(b)</b> 20 + 2(n − 1) > 50 gives n − 1 > 15, so n = 17. The 17th row has 52 seats. So the <b>17th row</b>.`);
cs(14,[],`A school plants trees under a green-campus drive. On the first day it plants 5 trees, and on every following day it plants 3 trees more than on the previous day.`,[
  {l:'(i)',m:1,q:`How many trees are planted on the 12th day?`},
  {l:'(ii)',m:1,q:`How many trees are planted in the first 12 days altogether?`},
  {l:'(iii)',m:2,q:`(a) In how many days will the school have planted 440 trees in all?`,or:`(b) On which day will the school plant 50 trees in a day?`}
],`The daily numbers form an AP with a = 5 and d = 3.<br><b>(i)</b> a_{12} = 5 + 11 × 3 = <b>38</b>.<br><b>(ii)</b> S_{12} = [[12|2]][10 + 11 × 3] = 6 × 43 = <b>258</b>.<br><b>(iii)(a)</b> [[n|2]][10 + 3(n − 1)] = 440, so 3n^{2} + 7n − 880 = 0. D = 49 + 10560 = 10609 = 103^{2}, so n = [[−7 + 103|6]] = <b>16 days</b>.<br>(OR) <b>(b)</b> 5 + 3(n − 1) = 50, so n − 1 = 15 and n = <b>16th day</b>.`);
cs(15,[],`Ravi is training for a marathon. He runs 2 km on the first day and increases the distance by 0.5 km every day.`,[
  {l:'(i)',m:1,q:`How far does he run on the 7th day?`},
  {l:'(ii)',m:1,q:`How far has he run altogether in the first 7 days?`},
  {l:'(iii)',m:2,q:`(a) On which day will he run 10 km?`,or:`(b) How far has he run altogether by the day he first runs 10 km?`}
],`The daily distances form an AP with a = 2 and d = 0.5.<br><b>(i)</b> a_{7} = 2 + 6 × 0.5 = <b>5 km</b>.<br><b>(ii)</b> S_{7} = [[7|2]](2 + 5) = <b>24.5 km</b>.<br><b>(iii)(a)</b> 2 + 0.5(n − 1) = 10, so n − 1 = 16 and n = <b>17th day</b>.<br>(OR) <b>(b)</b> S_{17} = [[17|2]](2 + 10) = <b>102 km</b>.`);

/* ===== Chapter 5: extra long answer (practice) ===== */
la(17,[],`Find the sum of all two-digit odd positive numbers.`,`The numbers are 11, 13, 15, …, 99, an AP with a = 11 and d = 2. 99 = 11 + (n − 1)2, so n = 45.<br>S = [[45|2]](11 + 99) = [[45|2]] × 110 = <b>2475</b>.`);
la(18,[],`The sum of the first n terms of an AP is 4n^{2} − n. Find the AP, its n^{th} term and its 20^{th} term.`,`a_{1} = S_{1} = 3. S_{2} = 16 − 2 = 14, so a_{2} = 11 and d = 8.<br>The AP is <b>3, 11, 19, 27, …</b><br>a_{n} = S_{n} − S_{n−1} = 4n^{2} − n − [4(n − 1)^{2} − (n − 1)] = 8n − 5, so <b>a_{n} = 8n − 5</b>.<br>a_{20} = 160 − 5 = <b>155</b>.`);
la(19,[],`The sum of the first 14 terms of an AP is 1050 and its first term is 10. Find the 20^{th} term.`,`S_{14} = [[14|2]][20 + 13d] = 1050, so 20 + 13d = 150 and d = 10.<br>a_{20} = 10 + 19 × 10 = <b>200</b>.`);
la(20,[],`Three numbers in AP have sum 27 and product 648. Find the numbers.`,`Let the numbers be a − d, a, a + d. The sum 3a = 27, so a = 9.<br>Product: (9 − d)(9)(9 + d) = 648, so 81 − d^{2} = 72 and d^{2} = 9, d = ±3.<br>The numbers are <b>6, 9, 12</b> (or 12, 9, 6).`);
la(21,[],`Which term of the AP 3, 8, 13, 18, … is 78? Also find the sum of all the terms up to that term.`,`a = 3 and d = 5. 78 = 3 + (n − 1)5, so n − 1 = 15 and n = <b>16</b>. The 16th term is 78.<br>S_{16} = [[16|2]](3 + 78) = 8 × 81 = <b>648</b>.`);

mcq(46,[],`The roots of the quadratic equation x^{2} − 5x + 6 = 0 are`,['2 and 3','−2 and −3','1 and 6','−1 and −6'],0,`x^{2} − 5x + 6 = (x − 2)(x − 3) = 0, so x = 2 or x = 3.`);
mcq(47,[],`The discriminant of the quadratic equation 3x^{2} − 5x + 2 = 0 is`,['1','49','−1','0'],0,`D = b^{2} − 4ac = 25 − 4(3)(2) = 1.`);
mcq(48,[],`The value of k for which kx^{2} + 6x + 1 = 0 has equal roots is`,['3','6','9','12'],2,`D = 36 − 4k = 0, so k = 9.`);

mcq(51,[],`The nature of roots of the quadratic equation x^{2} − 6x + 9 = 0 is`,['Two distinct real roots','Two equal real roots','No real roots','Cannot be said'],1,`D = 36 − 36 = 0, so the roots are real and equal (x = 3 twice).`);

ar(52,[],`The equation x^{2} + 4 = 0 has no real roots.`,`If the discriminant D < 0, the quadratic equation has no real roots.`,0,`D = 0 − 16 = −16 < 0, so A is true. R is the rule used, so it explains A.<br><span class="ans">Answer: (a)</span>`);
ar(53,[],`The equation 2x^{2} − 4x + 2 = 0 has equal roots.`,`For a quadratic equation to have equal roots, its discriminant must be positive.`,2,`D = 16 − 16 = 0, so the roots are equal and A is true. But equal roots need D = 0, not D > 0, so R is false.<br><span class="ans">Answer: (c)</span>`);
ar(54,[],`If 3 + √{2} is a root of a quadratic equation with rational coefficients, then its other root is 3 − √{2}.`,`A quadratic equation can have at most two roots.`,1,`Surd roots occur in conjugate pairs for rational coefficients, so A is true. R is also true, but it only counts the roots and does not explain why the other root is the conjugate.<br><span class="ans">Answer: (b)</span>`);

vsa(6,[],`Find the roots of the quadratic equation x^{2} − 7x + 12 = 0.`,`x^{2} − 3x − 4x + 12 = x(x − 3) − 4(x − 3) = (x − 3)(x − 4) = 0.<br>The roots are <b>x = 3</b> and <b>x = 4</b>.`);
vsa(7,[],`Find the value of k for which x = −1 is a root of the equation 2x^{2} + kx − 3 = 0.`,`2(1) + k(−1) − 3 = 0, so 2 − k − 3 = 0 and <b>k = −1</b>.`);
vsa(8,[],`Determine the nature of the roots of the equation 2x^{2} − 6x + 3 = 0.`,`D = 36 − 4(2)(3) = 36 − 24 = 12 > 0.<br>The equation has <b>two distinct real roots</b>.`);
vsa(9,[],`Find the roots of the quadratic equation 6x^{2} − x − 2 = 0.`,`6x^{2} − 4x + 3x − 2 = 2x(3x − 2) + 1(3x − 2) = (3x − 2)(2x + 1) = 0.<br>The roots are <b>x = [[2|3]]</b> and <b>x = −[[1|2]]</b>.`);
vsa(10,[],`Find two consecutive positive integers whose product is 72.`,`Let the integers be x and x + 1. x(x + 1) = 72, so x^{2} + x − 72 = 0, i.e. (x + 9)(x − 8) = 0.<br>x = 8, so the integers are <b>8 and 9</b>.`);
vsa(11,[],`Find the values of k for which the equation 2x^{2} + kx + 3 = 0 has equal roots.`,`D = k^{2} − 4(2)(3) = k^{2} − 24 = 0.<br><b>k = ±2√{6}</b>.`);

sa(15,[],`Solve 2x^{2} + 5x − 3 = 0 using the quadratic formula.`,`a = 2, b = 5, c = −3. D = 25 + 24 = 49.<br>x = [[−5 ± 7|4]], so <b>x = [[1|2]]</b> or <b>x = −3</b>.`);
sa(16,[],`Find the values of k for which the equation kx^{2} − 6x − 2 = 0 has real roots.`,`For a quadratic equation we need k ≠ 0. D = 36 + 8k ≥ 0, so k ≥ −[[9|2]].<br>The equation has real roots for <b>k ≥ −[[9|2]], k ≠ 0</b>.`);
sa(17,[],`The sum of a number and its reciprocal is [[10|3]]. Find the number.`,`Let the number be x. x + [[1|x]] = [[10|3]], so 3x^{2} − 10x + 3 = 0.<br>(3x − 1)(x − 3) = 0, so the number is <b>3</b> or <b>[[1|3]]</b>.`);
sa(18,[],`Find two numbers whose sum is 27 and product is 182.`,`The numbers are the roots of t^{2} − 27t + 182 = 0. D = 729 − 728 = 1, so t = [[27 ± 1|2]] = 14 or 13.<br>The numbers are <b>13 and 14</b>.`);
sa(19,[],`The area of a rectangular field is 360 m² and its perimeter is 78 m. Find its length and breadth.`,`l + b = 39 and lb = 360. So l and b are the roots of t^{2} − 39t + 360 = 0, i.e. (t − 15)(t − 24) = 0.<br>The length is <b>24 m</b> and the breadth is <b>15 m</b>.`);
sa(20,[],`Solve for x: x^{2} − (√{2} + 1)x + √{2} = 0.`,`x^{2} − √{2}x − x + √{2} = x(x − √{2}) − 1(x − √{2}) = (x − 1)(x − √{2}) = 0.<br><b>x = 1</b> or <b>x = √{2}</b>.`);

cs(8,[],`A farmer has a rectangular field whose length is 5 m more than its breadth. The area of the field is 750 m². Let the breadth be x metres.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the length and breadth of the field.`},
  {l:'(iii)',m:2,q:`(a) Find the cost of fencing the field at Rs 40 per metre.`,or:`(b) Find the cost of levelling the field at Rs 12 per square metre.`}
],`<b>(i)</b> x(x + 5) = 750, i.e. x^{2} + 5x − 750 = 0.<br><b>(ii)</b> (x + 30)(x − 25) = 0, so x = 25. The breadth is <b>25 m</b> and the length is <b>30 m</b>.<br><b>(iii)(a)</b> Perimeter = 2(30 + 25) = 110 m. Cost = 110 × 40 = <b>Rs 4400</b>.<br>(OR) <b>(b)</b> Cost = 750 × 12 = <b>Rs 9000</b>.`);
cs(9,[],`A cyclist travels 36 km at a uniform speed. If his speed had been 3 km/h more, he would have taken 1 hour less for the journey. Let his original speed be x km/h.`,[
  {l:'(i)',m:1,q:`Form the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the original speed of the cyclist.`},
  {l:'(iii)',m:2,q:`(a) How long does he take for the journey at his original speed?`,or:`(b) How long would he take at the increased speed?`}
],`<b>(i)</b> [[36|x]] − [[36|x + 3]] = 1, so [[108|x(x + 3)]] = 1, i.e. x^{2} + 3x − 108 = 0.<br><b>(ii)</b> (x + 12)(x − 9) = 0, so x = 9. The original speed is <b>9 km/h</b>.<br><b>(iii)(a)</b> Time = [[36|9]] = <b>4 hours</b>.<br>(OR) <b>(b)</b> Time = [[36|12]] = <b>3 hours</b>.`);

la(52,[],`Solve: [[1|x − 3]] − [[1|x + 5]] = [[1|6]], x ≠ 3, −5.`,`LHS = [[(x + 5) − (x − 3)|(x − 3)(x + 5)]] = [[8|(x − 3)(x + 5)]].<br>[[8|(x − 3)(x + 5)]] = [[1|6]], so (x − 3)(x + 5) = 48, i.e. x^{2} + 2x − 63 = 0.<br>(x + 9)(x − 7) = 0, so <b>x = 7</b> or <b>x = −9</b>.`);
la(53,[],`The sum of the squares of two consecutive even numbers is 340. Find the numbers.`,`Let the numbers be x and x + 2. x^{2} + (x + 2)^{2} = 340, so 2x^{2} + 4x − 336 = 0, i.e. x^{2} + 2x − 168 = 0.<br>(x + 14)(x − 12) = 0, so x = 12 (or x = −14).<br>The numbers are <b>12 and 14</b> (or −14 and −12).`);
la(54,[],`A train travels 360 km at a uniform speed. If the speed had been 5 km/h more, it would have taken 1 hour less for the same journey. Find the speed of the train.`,`Let the speed be x km/h. [[360|x]] − [[360|x + 5]] = 1, so [[1800|x(x + 5)]] = 1, i.e. x^{2} + 5x − 1800 = 0.<br>(x + 45)(x − 40) = 0, so x = 40.<br>The speed of the train is <b>40 km/h</b>.`);

sa(27,[],`Find the sum of all two-digit multiples of 4.`,`The multiples are 12, 16, …, 96. 96 = 12 + (n − 1)4, so n = 22.<br>S = [[22|2]](12 + 96) = 11 × 108 = <b>1188</b>.`);
sa(28,[],`The 3^{rd} term of an AP is 16 and its 7^{th} term exceeds its 5^{th} term by 12. Find the AP.`,`a_{7} − a_{5} = 2d = 12, so d = 6. a + 2d = 16 gives a = 4.<br>The AP is <b>4, 10, 16, 22, …</b>`);

sa(30,[],`The 11^{th} term of an AP is 38 and its 16^{th} term is 73. Find the 31^{st} term.`,`a_{16} − a_{11} = 5d = 35, so d = 7. a + 10 × 7 = 38 gives a = −32.<br>a_{31} = −32 + 30 × 7 = <b>178</b>.`);
sa(31,[],`Find the sum of the first 40 positive integers divisible by 6.`,`The integers are 6, 12, …, 240. S = [[40|2]](6 + 240) = 20 × 246 = <b>4920</b>.`);

cs(16,[],`A builder stacks bricks in rows. The bottom row has 18 bricks and each higher row has 1 brick less than the row below it. The top row has 8 bricks.`,[
  {l:'(i)',m:1,q:`How many bricks are there in the 5th row from the bottom?`},
  {l:'(ii)',m:1,q:`How many rows are there in the stack?`},
  {l:'(iii)',m:2,q:`(a) Find the total number of bricks in the stack.`,or:`(b) How many bricks are there in the top three rows?`}
],`The rows form an AP with a = 18 and d = −1.<br><b>(i)</b> a_{5} = 18 + 4(−1) = <b>14</b>.<br><b>(ii)</b> 8 = 18 + (n − 1)(−1), so n − 1 = 10 and n = <b>11 rows</b>.<br><b>(iii)(a)</b> S_{11} = [[11|2]](18 + 8) = [[11|2]] × 26 = <b>143 bricks</b>.<br>(OR) <b>(b)</b> The top three rows have 8, 9 and 10 bricks, so 8 + 9 + 10 = <b>27 bricks</b>.`);
cs(17,[],`Mohan starts a monthly deposit scheme. He deposits Rs 500 in the first month and increases the deposit by Rs 50 every month.`,[
  {l:'(i)',m:1,q:`How much does he deposit in the 10th month?`},
  {l:'(ii)',m:1,q:`How much has he deposited altogether in the first 12 months?`},
  {l:'(iii)',m:2,q:`(a) In which month will he deposit Rs 1,200?`,or:`(b) How much has he deposited altogether up to the month in which he deposits Rs 1,200?`}
],`The deposits form an AP with a = 500 and d = 50.<br><b>(i)</b> a_{10} = 500 + 9 × 50 = <b>Rs 950</b>.<br><b>(ii)</b> S_{12} = [[12|2]][1000 + 11 × 50] = 6 × 1550 = <b>Rs 9300</b>.<br><b>(iii)(a)</b> 500 + 50(n − 1) = 1200, so n − 1 = 14 and n = <b>15th month</b>.<br>(OR) <b>(b)</b> S_{15} = [[15|2]](500 + 1200) = [[15|2]] × 1700 = <b>Rs 12750</b>.`);

la(22,[],`The sum of the first n terms of an AP is 3n^{2} + 5n. Which term of the AP is 164?`,`a_{n} = S_{n} − S_{n−1} = 3n^{2} + 5n − [3(n − 1)^{2} + 5(n − 1)] = 6n + 2. (Check: a_{1} = 8 = S_{1} ✓.)<br>6n + 2 = 164, so n = <b>27</b>. The 27th term is 164.`);
la(23,[],`A ladder has rungs 25 cm apart. The rungs decrease uniformly in length from 45 cm at the bottom to 25 cm at the top. The distance between the top and the bottom rungs is 2.5 m. Find the length of the wood required for the rungs.`,`2.5 m = 250 cm. The number of rungs = [[250|25]] + 1 = 11.<br>The rung lengths form an AP with first term 45 and last term 25.<br>Total length = [[11|2]](45 + 25) = [[11|2]] × 70 = <b>385 cm</b>.`);
la(24,[],`The 4^{th} term of an AP is zero. Prove that its 25^{th} term is triple its 11^{th} term.`,`a_{4} = 0 gives a + 3d = 0, so a = −3d.<br>a_{25} = a + 24d = 21d and a_{11} = a + 10d = 7d.<br>So a_{25} = 21d = 3 × 7d = 3 × a_{11}. Hence proved.`);

ar(50,[],`The LCM of 12 and 18 is 36.`,`For two positive integers a and b, LCM(a, b) = [[a × b|HCF(a, b)]].`,0,`HCF(12, 18) = 6, so LCM = [[12 × 18|6]] = 36. A is true. R is the formula used, so it explains A.<br><span class="ans">Answer: (a)</span>`);
ar(51,[],`√{2} is an irrational number.`,`The sum of a rational number and an irrational number is irrational.`,1,`√{2} is irrational (it is proved by contradiction using prime factors), so A is true. R is also true, but it is not what proves A, so it is not the explanation.<br><span class="ans">Answer: (b)</span>`);
ar(52,[],`√{9} is an irrational number.`,`√{p} is irrational for every prime number p.`,3,`√{9} = 3, which is rational, so A is false. R is a true statement about primes (9 is not prime).<br><span class="ans">Answer: (d)</span>`);
ar(53,[],`7 × 11 × 13 + 13 is a composite number.`,`A natural number greater than 1 is composite if it has more than two factors.`,0,`7 × 11 × 13 + 13 = 13(77 + 1) = 13 × 78, which has more than two factors. So A is true, and R is the definition used.<br><span class="ans">Answer: (a)</span>`);
ar(54,[],`The HCF of two co-prime numbers is 1.`,`Two numbers are co-prime if they have no common factor other than 1.`,0,`The only common factor of co-prime numbers is 1, so their HCF is 1. A is true and R is exactly the definition that explains it.<br><span class="ans">Answer: (a)</span>`);
ar(55,[],`The product of two irrational numbers is always irrational.`,`√{2} × √{2} = 2.`,3,`√{2} × √{2} = 2 is rational, which is a counter-example, so A is false. R is a true statement.<br><span class="ans">Answer: (d)</span>`);
ar(56,[],`2 + √{3} is an irrational number.`,`The sum of a rational number and an irrational number is irrational.`,0,`2 is rational and √{3} is irrational, so 2 + √{3} is irrational. A is true and R is the rule that gives it.<br><span class="ans">Answer: (a)</span>`);
ar(57,[],`6^{n} ends with the digit 0 for some natural number n.`,`For a number to end with the digit 0, 2 and 5 must both be prime factors of it.`,3,`6^{n} = 2^{n} × 3^{n} has no factor 5, so it never ends with 0. A is false. R is true.<br><span class="ans">Answer: (d)</span>`);
ar(58,[],`The HCF of 24 and 36 is 12 and their LCM is 72.`,`The HCF of two numbers always divides their LCM.`,1,`24 = 2^{3} × 3 and 36 = 2^{2} × 3^{2}. HCF = 2^{2} × 3 = 12 and LCM = 2^{3} × 3^{2} = 72, so A is true. R is also true, but it does not give the values in A, so it is not the explanation.<br><span class="ans">Answer: (b)</span>`);

la(7,[],`Prove that √{5} is an irrational number. Hence show that 3 + 2√{5} is also irrational.`,`<b>Part 1: √{5} is irrational (3 marks)</b><br>`+rootProof(5)+`<br><b>Part 2 (2 marks)</b><br>`+irr('3 + 2√{5}','√{5} = [[(3 + 2√{5}) − 3|2]]','√{5}'));
la(8,[],`Find the HCF and LCM of 120, 144 and 180 using prime factorisation.`,`120 = 2^{3} × 3 × 5, 144 = 2^{4} × 3^{2} and 180 = 2^{2} × 3^{2} × 5.<br>HCF = 2^{2} × 3 = <b>12</b> (lowest powers of the common primes).<br>LCM = 2^{4} × 3^{2} × 5 = <b>720</b> (highest powers of all primes).`);
la(9,[],`Three bells ring at intervals of 8, 12 and 18 minutes. All three ring together at 8:00 a.m. After how many minutes will they next ring together? How many times will they ring together between 8:00 a.m. and 8:00 p.m. (counting the ring at 8:00 p.m., but not the one at 8:00 a.m.)?`,`8 = 2^{3}, 12 = 2^{2} × 3 and 18 = 2 × 3^{2}. LCM = 2^{3} × 3^{2} = 72.<br>They next ring together after <b>72 minutes</b>, at 9:12 a.m.<br>From 8:00 a.m. to 8:00 p.m. is 12 hours = 720 minutes. 720 ÷ 72 = 10, so they ring together <b>10 times</b>.`);
la(10,[],`Find the greatest number which divides 245 and 1029, leaving remainder 5 in each case.`,`The number divides 245 − 5 = 240 and 1029 − 5 = 1024.<br>240 = 2^{4} × 3 × 5 and 1024 = 2^{10}, so HCF = 2^{4} = 16.<br>16 is greater than the remainder 5, so the number is <b>16</b>.`);
la(11,[],`Find the least number which leaves remainder 5 when divided by 12, 16, 24 and 36, and is exactly divisible by 7.`,`LCM(12, 16, 24, 36) = 2^{4} × 3^{2} = 144. Numbers leaving remainder 5 are 144k + 5: 149, 293, 437, 581, …<br>Check divisibility by 7: 149 = 7 × 21 + 2, 293 = 7 × 41 + 6, 437 = 7 × 62 + 3, 581 = 7 × 83.<br>The least number is <b>581</b>. (Check: 581 − 5 = 576 = 144 × 4 ✓.)`);
la(12,[],`A rectangular courtyard 18 m 72 cm long and 13 m 20 cm broad is to be paved with square tiles of the same size. Find the least number of such tiles and the size of each tile.`,`18 m 72 cm = 1872 cm and 13 m 20 cm = 1320 cm. 1872 = 2^{4} × 3^{2} × 13 and 1320 = 2^{3} × 3 × 5 × 11.<br>The largest tile has side HCF = 2^{3} × 3 = <b>24 cm</b>.<br>Number of tiles = [[1872|24]] × [[1320|24]] = 78 × 55 = <b>4290</b>.`);
la(13,[],`Prove that √{3} is an irrational number. Hence show that 7 − 2√{3} is also irrational.`,`<b>Part 1: √{3} is irrational (3 marks)</b><br>`+rootProof(3)+`<br><b>Part 2 (2 marks)</b><br>`+irr('7 − 2√{3}','√{3} = [[7 − (7 − 2√{3})|2]]','√{3}'));
la(14,[],`The HCF of two numbers is 23 and their LCM is 1449. If one of the numbers is 161, find the other number. Verify that HCF × LCM = product of the two numbers.`,`Other number = [[HCF × LCM|161]] = [[23 × 1449|161]] = [[33327|161]] = <b>207</b>.<br>Verification: 161 = 7 × 23 and 207 = 9 × 23. HCF = 23 and LCM = 7 × 9 × 23 = 1449 ✓.<br>HCF × LCM = 23 × 1449 = 33327 and 161 × 207 = 33327. They are equal ✓.`);
la(15,[],`Find the smallest number which, when increased by 17, is exactly divisible by both 520 and 468.`,`The required number + 17 is the LCM of 520 and 468.<br>520 = 2^{3} × 5 × 13 and 468 = 2^{2} × 3^{2} × 13, so LCM = 2^{3} × 3^{2} × 5 × 13 = 4680.<br>The smallest number = 4680 − 17 = <b>4663</b>.`);

cs(9,[],`A school has 48 boys and 36 girls who are to be arranged in rows for the morning assembly. Each row must have students of only one gender, every row must have the same number of students, and the number of students in each row should be as large as possible.`,[
  {l:'(i)',m:1,q:`Write the prime factorisation of 48 and 36.`},
  {l:'(ii)',m:1,q:`How many students stand in each row?`},
  {l:'(iii)',m:2,q:`(a) How many rows are formed in all?`,or:`(b) If 6 more girls join (42 girls in all), how many students will stand in each row, keeping the same conditions?`}
],`<b>(i)</b> 48 = 2^{4} × 3 and 36 = 2^{2} × 3^{2}.<br><b>(ii)</b> The row size is HCF(48, 36) = 2^{2} × 3 = <b>12</b> students.<br><b>(iii)(a)</b> Boys: 48 ÷ 12 = 4 rows. Girls: 36 ÷ 12 = 3 rows. Total = <b>7 rows</b>.<br>(OR) <b>(b)</b> HCF(48, 42) = 6, so each row will have <b>6 students</b>.`);
cs(10,[],`Three traffic signals at a crossing change colour after every 36 seconds, 48 seconds and 72 seconds respectively. They all change together at 8:00:00 a.m.`,[
  {l:'(i)',m:1,q:`Write the prime factorisation of 36, 48 and 72.`},
  {l:'(ii)',m:1,q:`After how many seconds will they change together again?`},
  {l:'(iii)',m:2,q:`(a) At what time will they next change together?`,or:`(b) How many times in the next one hour (after 8:00:00 a.m.) will they change together?`}
],`<b>(i)</b> 36 = 2^{2} × 3^{2}, 48 = 2^{4} × 3 and 72 = 2^{3} × 3^{2}.<br><b>(ii)</b> LCM = 2^{4} × 3^{2} = <b>144 seconds</b>.<br><b>(iii)(a)</b> 144 s = 2 min 24 s, so they next change together at <b>8:02:24 a.m.</b><br>(OR) <b>(b)</b> One hour = 3600 s and 3600 ÷ 144 = 25. They change together <b>25 times</b>.`);
cs(11,[],`A shopkeeper has 420 notebooks and 336 pens. She wants to make packets such that each packet contains only one kind of item, every packet has the same number of items, and the number of items in a packet is as large as possible.`,[
  {l:'(i)',m:1,q:`How many items are there in each packet?`},
  {l:'(ii)',m:1,q:`How many packets of notebooks can be made?`},
  {l:'(iii)',m:2,q:`(a) How many packets can be made in all?`,or:`(b) If she gets 12 more pens (348 pens in all), what will be the greatest possible number of items in a packet?`}
],`<b>(i)</b> 420 = 2^{2} × 3 × 5 × 7 and 336 = 2^{4} × 3 × 7, so HCF = 2^{2} × 3 × 7 = <b>84</b> items per packet.<br><b>(ii)</b> 420 ÷ 84 = <b>5</b> packets of notebooks.<br><b>(iii)(a)</b> Pens: 336 ÷ 84 = 4 packets. Total = 5 + 4 = <b>9 packets</b>.<br>(OR) <b>(b)</b> 348 = 2^{2} × 3 × 29, so HCF(420, 348) = 2^{2} × 3 = <b>12</b> items per packet.`);
cs(12,[],`Rohan’s square plot of land has an area of 75 m².`,[
  {l:'(i)',m:1,q:`Find the length of a side of the plot.`},
  {l:'(ii)',m:1,q:`Is the side of the plot a rational or an irrational number?`},
  {l:'(iii)',m:2,q:`(a) Given that √{3} is irrational, prove that the side of the plot is irrational.`,or:`(b) Given that √{3} is irrational, prove that the perimeter of the plot is irrational.`}
],`<b>(i)</b> Side = √{75} = √{25 × 3} = <b>5√{3} m</b>.<br><b>(ii)</b> It is <b>irrational</b> (proved in part iii).<br><b>(iii)(a)</b> `+irr('5√{3}','√{3} = [[5√{3}|5]]','√{3}')+`<br>(OR) <b>(b)</b> Perimeter = 4 × 5√{3} = 20√{3} m.<br>`+irr('20√{3}','√{3} = [[20√{3}|20]]','√{3}'));
cs(13,[],`A metro train leaves a station every 12 minutes and a bus leaves the same station every 18 minutes. Both leave together at 9:00 a.m.`,[
  {l:'(i)',m:1,q:`Write the prime factorisation of 12 and 18.`},
  {l:'(ii)',m:1,q:`After how many minutes will they leave together again?`},
  {l:'(iii)',m:2,q:`(a) At what time will they next leave together?`,or:`(b) How many times between 9:00 a.m. and 12:00 noon will they leave together (not counting 9:00 a.m.)?`}
],`<b>(i)</b> 12 = 2^{2} × 3 and 18 = 2 × 3^{2}.<br><b>(ii)</b> LCM = 2^{2} × 3^{2} = <b>36 minutes</b>.<br><b>(iii)(a)</b> 9:00 a.m. + 36 minutes = <b>9:36 a.m.</b><br>(OR) <b>(b)</b> 9:00 a.m. to 12:00 noon is 180 minutes, and 180 ÷ 36 = 5. They leave together <b>5 times</b> (at 9:36, 10:12, 10:48, 11:24 and 12:00).`);
cs(14,[],`The HCF of two numbers is 18 and their LCM is 360. One of the numbers is 90.`,[
  {l:'(i)',m:1,q:`Find the product of the two numbers.`},
  {l:'(ii)',m:1,q:`Find the other number.`},
  {l:'(iii)',m:2,q:`(a) Verify that HCF × LCM = product of the two numbers using prime factorisation.`,or:`(b) Write both numbers as products of prime factors.`}
],`<b>(i)</b> Product = HCF × LCM = 18 × 360 = <b>6480</b>.<br><b>(ii)</b> Other number = [[6480|90]] = <b>72</b>.<br><b>(iii)(a)</b> 90 = 2 × 3^{2} × 5 and 72 = 2^{3} × 3^{2}. HCF = 2 × 3^{2} = 18 and LCM = 2^{3} × 3^{2} × 5 = 360 ✓. HCF × LCM = 6480 = 90 × 72 ✓.<br>(OR) <b>(b)</b> 90 = <b>2 × 3^{2} × 5</b> and 72 = <b>2^{3} × 3^{2}</b>.`);
cs(15,[],`Sunita wants to know, without dividing, whether the fractions [[7|8]], [[13|15]], [[17|40]] and [[5|12]] have terminating decimal expansions.`,[
  {l:'(i)',m:1,q:`What condition must the denominator (in lowest terms) satisfy for a fraction to have a terminating decimal expansion?`},
  {l:'(ii)',m:1,q:`Which of the four fractions have terminating decimal expansions?`},
  {l:'(iii)',m:2,q:`(a) Write [[7|8]] as a decimal.`,or:`(b) Write [[17|40]] as a decimal.`}
],`<b>(i)</b> The prime factors of the denominator must be only 2 and/or 5.<br><b>(ii)</b> 8 = 2^{3} ✓, 15 = 3 × 5 ✗, 40 = 2^{3} × 5 ✓, 12 = 2^{2} × 3 ✗. So <b>[[7|8]] and [[17|40]]</b> terminate.<br><b>(iii)(a)</b> [[7|8]] = [[7 × 125|1000]] = <b>0.875</b>.<br>(OR) <b>(b)</b> [[17|40]] = [[17 × 25|1000]] = <b>0.425</b>.`);

ar(65,[],`The polynomial x^{2} + 1 has no real zeros.`,`A quadratic polynomial has no real zeros if its discriminant is negative.`,0,`D = 0 − 4 = −4 < 0, so x^{2} + 1 has no real zeros. A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);
ar(66,[],`The graph of y = x^{2} − 4 cuts the x-axis at two points.`,`The zeros of x^{2} − 4 are 2 and −2.`,0,`The x-coordinates of the points where the graph cuts the x-axis are the zeros, which are 2 and −2. So A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(67,[],`The degree of the polynomial 3x^{4} − 2x + 1 is 4.`,`The degree of a polynomial is the highest power of the variable in it.`,0,`The highest power of x is 4, so A is true. R is the definition used.<br><span class="ans">Answer: (a)</span>`);
ar(68,[],`A cubic polynomial can have at most three real zeros.`,`A polynomial of degree n has at most n zeros.`,0,`A cubic has degree 3, so it has at most 3 zeros. A is true and R is the general fact that gives it.<br><span class="ans">Answer: (a)</span>`);
ar(69,[],`A quadratic polynomial with sum of zeros 5 and product of zeros 6 is x^{2} − 5x + 6.`,`A quadratic polynomial with sum of zeros S and product of zeros P is x^{2} − Sx + P.`,0,`Using R with S = 5 and P = 6 gives x^{2} − 5x + 6. So A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(70,[],`The polynomial x^{2} − 2x + 1 has two distinct real zeros.`,`The discriminant of x^{2} − 2x + 1 is 0.`,3,`x^{2} − 2x + 1 = (x − 1)^{2} has a repeated zero 1, not two distinct zeros, so A is false. R is true (D = 4 − 4 = 0).<br><span class="ans">Answer: (d)</span>`);
ar(71,[],`A polynomial of degree 5 has exactly 5 real zeros.`,`A polynomial of degree n has at most n zeros.`,3,`A degree 5 polynomial can have fewer than 5 real zeros (for example x^{5} has only the zero 0), so A is false. R is true.<br><span class="ans">Answer: (d)</span>`);
ar(72,[],`The zeros of 2x^{2} − 8 are 2 and −2.`,`The zeros of x^{2} − k^{2} are k and −k.`,0,`2x^{2} − 8 = 2(x^{2} − 4), so with k = 2 the zeros are ±2. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(73,[],`If α and β are the zeros of x^{2} − 3x + 2, then α + β = 3.`,`For a quadratic polynomial ax^{2} + bx + c, the sum of the zeros is −[[b|a]].`,0,`The sum of the zeros is −[[−3|1]] = 3, so A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);
ar(74,[],`The product of the zeros of 2x^{2} − 6x + 5 is 5.`,`For a quadratic polynomial ax^{2} + bx + c, the product of the zeros is [[c|a]].`,3,`The product is [[5|2]], not 5, so A is false. R is the correct rule.<br><span class="ans">Answer: (d)</span>`);
ar(75,[],`The polynomial x^{2} + x + 1 has real zeros.`,`A quadratic polynomial has real zeros only if its discriminant is non-negative.`,3,`D = 1 − 4 = −3 < 0, so there are no real zeros and A is false. R is a true statement.<br><span class="ans">Answer: (d)</span>`);

la(12,[],`If α and β are the zeros of the polynomial 2x^{2} − 5x + 3, find a quadratic polynomial whose zeros are α^{2} and β^{2}. Verify your answer by finding the zeros of the given polynomial.`,`α + β = [[5|2]] and αβ = [[3|2]].<br>α^{2} + β^{2} = (α + β)^{2} − 2αβ = [[25|4]] − 3 = [[13|4]]. α^{2}β^{2} = [[9|4]].<br>Polynomial: x^{2} − [[13|4]]x + [[9|4]], or <b>4x^{2} − 13x + 9</b>.<br><b>Verification:</b> 2x^{2} − 5x + 3 = (2x − 3)(x − 1), so the zeros are [[3|2]] and 1. Their squares are [[9|4]] and 1, with sum [[13|4]] and product [[9|4]] ✓.`);
la(13,[],`If the sum of the squares of the zeros of the polynomial x^{2} − 6x + k is 20, find the value of k. Hence find the zeros of the polynomial.`,`α + β = 6 and αβ = k.<br>α^{2} + β^{2} = (α + β)^{2} − 2αβ = 36 − 2k = 20, so 2k = 16 and <b>k = 8</b>.<br>The polynomial is x^{2} − 6x + 8 = (x − 2)(x − 4), so the zeros are <b>2 and 4</b>. (Check: 4 + 16 = 20 ✓.)`);
la(14,[],`If α and β are the zeros of the polynomial x^{2} − 7x + 10, find the quadratic polynomial whose zeros are (α + β) and αβ.`,`α + β = 7 and αβ = 10.<br>The new zeros are 7 and 10. Sum = 17 and product = 70.<br>Polynomial: <b>x^{2} − 17x + 70</b>.<br>(Check: x^{2} − 7x + 10 = (x − 2)(x − 5), so α, β = 2, 5; α + β = 7 and αβ = 10 ✓.)`);
la(15,[],`Find the zeros of the polynomial 6x^{2} + x − 2 and verify the relationship between the zeros and the coefficients. Hence find a quadratic polynomial whose zeros are the reciprocals of these zeros.`,`6x^{2} + x − 2 = 6x^{2} + 4x − 3x − 2 = 2x(3x + 2) − 1(3x + 2) = (3x + 2)(2x − 1). Zeros: <b>−[[2|3]]</b> and <b>[[1|2]]</b>.<br>Sum = −[[2|3]] + [[1|2]] = −[[1|6]] = −[[1|6]] ✓. Product = −[[2|3]] × [[1|2]] = −[[1|3]] = [[−2|6]] ✓.<br>Reciprocals: −[[3|2]] and 2. Sum = [[1|2]], product = −3.<br>Polynomial: x^{2} − [[1|2]]x − 3, or <b>2x^{2} − x − 6</b>.`);

cs(9,[],`A rocket model is launched vertically upward. Its height h (in metres) after t seconds is given by h = 20t − 5t^{2}.`,[
  {l:'(i)',m:1,q:`Find the zeros of the polynomial h = 20t − 5t^{2}.`},
  {l:'(ii)',m:1,q:`Find the maximum height reached by the rocket.`},
  {l:'(iii)',m:2,q:`(a) Find the height of the rocket at t = 1 second.`,or:`(b) At what two times is the height of the rocket 15 m?`}
],`<b>(i)</b> 20t − 5t^{2} = 5t(4 − t) = 0, so the zeros are <b>t = 0</b> and <b>t = 4</b>.<br><b>(ii)</b> The maximum is at t = 2 (midway between the zeros): h = 40 − 20 = <b>20 m</b>.<br><b>(iii)(a)</b> h = 20 − 5 = <b>15 m</b>.<br>(OR) <b>(b)</b> 20t − 5t^{2} = 15 gives t^{2} − 4t + 3 = 0, i.e. (t − 1)(t − 3) = 0. So <b>t = 1 s and t = 3 s</b>.`);
cs(10,[],`The length and the breadth (in metres) of a rectangular plot are the zeros of the polynomial x^{2} − 12x + 35.`,[
  {l:'(i)',m:1,q:`Find the perimeter of the plot.`},
  {l:'(ii)',m:1,q:`Find the area of the plot.`},
  {l:'(iii)',m:2,q:`(a) Find the length and the breadth of the plot.`,or:`(b) If each side is increased by 1 m, find the quadratic polynomial whose zeros are the new length and breadth.`}
],`Sum of zeros = l + b = 12 and product = lb = 35.<br><b>(i)</b> Perimeter = 2 × 12 = <b>24 m</b>.<br><b>(ii)</b> Area = <b>35 m²</b>.<br><b>(iii)(a)</b> x^{2} − 12x + 35 = (x − 5)(x − 7), so the length is <b>7 m</b> and the breadth is <b>5 m</b>.<br>(OR) <b>(b)</b> New sides are 8 and 6. Sum = 14 and product = 48. Polynomial: <b>x^{2} − 14x + 48</b>.`);
cs(11,[],`The graph of a quadratic polynomial p(x) is shown. It cuts the x-axis at two points and its lowest point is (2, −4).`,[
  {l:'(i)',m:1,q:`How many zeros does the polynomial have?`},
  {l:'(ii)',m:1,q:`Write the zeros of the polynomial.`},
  {l:'(iii)',m:2,q:`(a) Find the polynomial represented by the graph (take the coefficient of x^{2} as 1).`,or:`(b) Find the minimum value of the polynomial and the value of x at which it occurs.`}
],`<b>(i)</b> The graph cuts the x-axis at 2 points, so there are <b>2 zeros</b>.<br><b>(ii)</b> The zeros are <b>0</b> and <b>4</b>.<br><b>(iii)(a)</b> Sum of zeros = 4 and product = 0, so p(x) = <b>x^{2} − 4x</b>. (Check: p(2) = 4 − 8 = −4 ✓.)<br>(OR) <b>(b)</b> The minimum value is <b>−4</b>, at <b>x = 2</b> (the midpoint of the zeros 0 and 4).`,{fig:C2c11});
cs(12,[],`A fountain shoots water upward. The height h (in metres) of a drop of water after t seconds is given by h = 6t − t^{2}.`,[
  {l:'(i)',m:1,q:`Find the zeros of the polynomial h = 6t − t^{2}.`},
  {l:'(ii)',m:1,q:`Find the maximum height reached.`},
  {l:'(iii)',m:2,q:`(a) At what two times is the height 8 m?`,or:`(b) Find the height at t = 5 seconds.`}
],`<b>(i)</b> 6t − t^{2} = t(6 − t) = 0, so <b>t = 0</b> and <b>t = 6</b>.<br><b>(ii)</b> The maximum is at t = 3: h = 18 − 9 = <b>9 m</b>.<br><b>(iii)(a)</b> 6t − t^{2} = 8 gives t^{2} − 6t + 8 = 0, i.e. (t − 2)(t − 4) = 0. So <b>t = 2 s and t = 4 s</b>.<br>(OR) <b>(b)</b> h = 30 − 25 = <b>5 m</b>.`);
cs(13,[],`Meera thinks of two numbers whose sum is 10 and whose product is 24.`,[
  {l:'(i)',m:1,q:`Form the quadratic polynomial whose zeros are the two numbers.`},
  {l:'(ii)',m:1,q:`Find the two numbers.`},
  {l:'(iii)',m:2,q:`(a) Find the sum of the squares of the two numbers.`,or:`(b) Form the quadratic polynomial whose zeros are the reciprocals of the two numbers.`}
],`<b>(i)</b> x^{2} − (sum)x + product = <b>x^{2} − 10x + 24</b>.<br><b>(ii)</b> x^{2} − 10x + 24 = (x − 4)(x − 6), so the numbers are <b>4 and 6</b>.<br><b>(iii)(a)</b> 4^{2} + 6^{2} = <b>52</b>. (Also (α + β)^{2} − 2αβ = 100 − 48 = 52 ✓.)<br>(OR) <b>(b)</b> The reciprocals are [[1|4]] and [[1|6]]: sum = [[5|12]] and product = [[1|24]]. Polynomial: x^{2} − [[5|12]]x + [[1|24]], or <b>24x^{2} − 10x + 1</b>.`);
cs(14,[],`The graph of a cubic polynomial p(x) is shown. It cuts the x-axis at the points (−2, 0), (0, 0) and (3, 0).`,[
  {l:'(i)',m:1,q:`How many zeros does p(x) have?`},
  {l:'(ii)',m:1,q:`Write the zeros of p(x).`},
  {l:'(iii)',m:2,q:`(a) Write a cubic polynomial with these zeros.`,or:`(b) Find the sum of the zeros and verify it using the cubic polynomial x^{3} − x^{2} − 6x.`}
],`<b>(i)</b> The graph cuts the x-axis 3 times, so there are <b>3 zeros</b>.<br><b>(ii)</b> The zeros are <b>−2, 0 and 3</b>.<br><b>(iii)(a)</b> p(x) = x(x + 2)(x − 3) = x(x^{2} − x − 6) = <b>x^{3} − x^{2} − 6x</b> (or any non-zero constant multiple).<br>(OR) <b>(b)</b> Sum of zeros = −2 + 0 + 3 = 1. For x^{3} − x^{2} − 6x, the sum of zeros = −[[−1|1]] = 1 ✓.`,{fig:C2c14});
cs(15,[],`Sunita has two polynomials p(x) = x^{2} − 5x + 6 and q(x) = x^{2} − x − 6.`,[
  {l:'(i)',m:1,q:`Find the zeros of p(x).`},
  {l:'(ii)',m:1,q:`Find the zeros of q(x).`},
  {l:'(iii)',m:2,q:`(a) Which zero is common to both polynomials?`,or:`(b) How many distinct zeros do the two polynomials have in all?`}
],`<b>(i)</b> x^{2} − 5x + 6 = (x − 2)(x − 3), so the zeros are <b>2 and 3</b>.<br><b>(ii)</b> x^{2} − x − 6 = (x − 3)(x + 2), so the zeros are <b>3 and −2</b>.<br><b>(iii)(a)</b> The common zero is <b>3</b>.<br>(OR) <b>(b)</b> The zeros are 2, 3 and −2, so there are <b>3 distinct zeros</b>.`);

ar(43,[],`The pair of equations x + y = 5 and 2x + 2y = 10 has infinitely many solutions.`,`A pair of linear equations has infinitely many solutions if [[a_{1}|a_{2}]] = [[b_{1}|b_{2}]] = [[c_{1}|c_{2}]].`,0,`[[1|2]] = [[1|2]] = [[−5|−10]] = [[1|2]], so the lines coincide. A is true and R is the condition used.<br><span class="ans">Answer: (a)</span>`);
ar(44,[],`The pair x + y = 4 and x − y = 2 has the unique solution (3, 1).`,`A pair of linear equations has a unique solution if [[a_{1}|a_{2}]] ≠ [[b_{1}|b_{2}]].`,0,`Adding gives x = 3 and then y = 1, so A is true. [[1|1]] ≠ [[1|−1]], which is the condition in R, so R explains why the solution is unique.<br><span class="ans">Answer: (a)</span>`);
ar(45,[],`The pair 2x + 3y = 5 and 4x + 6y = 7 has no solution.`,`Two lines are parallel if [[a_{1}|a_{2}]] = [[b_{1}|b_{2}]] ≠ [[c_{1}|c_{2}]].`,0,`[[2|4]] = [[3|6]] = [[1|2]] ≠ [[5|7]], so the lines are parallel and there is no solution. A is true and R is the condition used.<br><span class="ans">Answer: (a)</span>`);
ar(46,[],`x = 1, y = 2 is a solution of the pair x + y = 3 and 2x − y = 0.`,`A solution of a pair of linear equations must satisfy both the equations.`,0,`1 + 2 = 3 ✓ and 2(1) − 2 = 0 ✓, so A is true. R is the definition of a solution of a pair, so it explains A.<br><span class="ans">Answer: (a)</span>`);
ar(47,[],`The graph of x = 3 is a line parallel to the y-axis.`,`The equation x = k represents a vertical line for every real number k.`,0,`Every point on x = 3 has x-coordinate 3, so the line is vertical, i.e. parallel to the y-axis. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(48,[],`The lines 3x + 2y = 6 and 6x + 4y = 18 are coincident.`,`Coincident lines satisfy [[a_{1}|a_{2}]] = [[b_{1}|b_{2}]] = [[c_{1}|c_{2}]].`,3,`[[3|6]] = [[2|4]] = [[1|2]] but [[6|18]] = [[1|3]] ≠ [[1|2]], so the lines are parallel, not coincident. A is false. R is the correct condition, so R is true.<br><span class="ans">Answer: (d)</span>`);
ar(49,[],`The pair y = 2x and y = 2x + 3 has no solution.`,`Parallel lines have equal slopes.`,0,`Both lines have slope 2 and different intercepts, so they are parallel and never meet. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(50,[],`The line x − y = 0 passes through the origin.`,`The point (0, 0) satisfies the equation x − y = 0.`,0,`0 − 0 = 0, so (0, 0) lies on the line. A is true and R is exactly why.<br><span class="ans">Answer: (a)</span>`);
ar(51,[],`The lines 2x − 3y = 6 and 4x − 6y = 12 are coincident.`,`Coincident lines have infinitely many common points.`,0,`[[2|4]] = [[−3|−6]] = [[−6|−12]] = [[1|2]], so the lines coincide. A is true. R describes what coincident lines are, so it explains A.<br><span class="ans">Answer: (a)</span>`);
ar(52,[],`The pair 5x − 3y = 7 and 10x − 6y = 15 is consistent.`,`A pair of linear equations is consistent if it has at least one solution.`,3,`[[5|10]] = [[−3|−6]] = [[1|2]] ≠ [[7|15]], so the lines are parallel and the pair is inconsistent. A is false. R is a true definition.<br><span class="ans">Answer: (d)</span>`);
ar(53,[],`If a pair of linear equations has a unique solution, the lines intersect at exactly one point.`,`Intersecting lines have [[a_{1}|a_{2}]] ≠ [[b_{1}|b_{2}]].`,0,`A unique solution is the single common point of two intersecting lines, so A is true. R is the algebraic condition for intersecting lines.<br><span class="ans">Answer: (a)</span>`);
ar(54,[],`The pair x + 2y = 3 and 2x + 4y = 6 has a unique solution.`,`A pair of linear equations has infinitely many solutions if [[a_{1}|a_{2}]] = [[b_{1}|b_{2}]] = [[c_{1}|c_{2}]].`,3,`[[1|2]] = [[2|4]] = [[3|6]], so the lines coincide and there are infinitely many solutions. A is false. R is true.<br><span class="ans">Answer: (d)</span>`);

cs(11,[],`A stationery shop sells notebooks and pens. 2 notebooks and 3 pens cost Rs 60, while 3 notebooks and 2 pens cost Rs 65. Let the price of a notebook be Rs x and the price of a pen be Rs y.`,[
  {l:'(i)',m:1,q:`Represent the situation algebraically.`},
  {l:'(ii)',m:1,q:`Find the price of a notebook and of a pen.`},
  {l:'(iii)',m:2,q:`(a) Find the cost of 5 notebooks and 4 pens.`,or:`(b) How much more does a notebook cost than a pen?`}
],`<b>(i)</b> 2x + 3y = 60 and 3x + 2y = 65.<br><b>(ii)</b> Adding: 5x + 5y = 125, so x + y = 25. Subtracting: x − y = 5. So x = 15 and y = 10. A notebook costs <b>Rs 15</b> and a pen <b>Rs 10</b>.<br><b>(iii)(a)</b> 5 × 15 + 4 × 10 = <b>Rs 115</b>.<br>(OR) <b>(b)</b> 15 − 10 = <b>Rs 5</b> more.`);
cs(12,[],`The sum of the ages of a father and his son is 50 years. Five years ago the father was 7 times as old as his son. Let the father’s present age be x years and the son’s present age be y years.`,[
  {l:'(i)',m:1,q:`Represent the situation algebraically.`},
  {l:'(ii)',m:1,q:`Find their present ages.`},
  {l:'(iii)',m:2,q:`(a) What will be the father’s age after 10 years?`,or:`(b) Find the ratio of their ages after 5 years.`}
],`<b>(i)</b> x + y = 50 and x − 5 = 7(y − 5), i.e. x − 7y = −30.<br><b>(ii)</b> Subtracting: 8y = 80, so y = 10 and x = 40. The father is <b>40 years</b> old and the son <b>10 years</b>.<br><b>(iii)(a)</b> 40 + 10 = <b>50 years</b>.<br>(OR) <b>(b)</b> After 5 years: 45 and 15, so the ratio is 45 : 15 = <b>3 : 1</b>.`);
cs(13,[],`A cashier gives 22 notes of Rs 50 and Rs 100 in all, and the total value is Rs 1700. Let the number of Rs 50 notes be x and the number of Rs 100 notes be y.`,[
  {l:'(i)',m:1,q:`Represent the situation algebraically.`},
  {l:'(ii)',m:1,q:`Find the number of notes of each kind.`},
  {l:'(iii)',m:2,q:`(a) Find the total amount in Rs 100 notes.`,or:`(b) If 2 more Rs 50 notes are added, what is the total value of all the notes?`}
],`<b>(i)</b> x + y = 22 and 50x + 100y = 1700, i.e. x + 2y = 34.<br><b>(ii)</b> Subtracting: y = 12, so x = 10. There are <b>10 notes of Rs 50</b> and <b>12 notes of Rs 100</b>.<br><b>(iii)(a)</b> 12 × 100 = <b>Rs 1200</b>.<br>(OR) <b>(b)</b> 1700 + 2 × 50 = <b>Rs 1800</b>.`);
cs(14,[],`The sum of the numerator and denominator of a fraction is 12. If 3 is added to the denominator, the fraction becomes [[1|2]]. Let the numerator be x and the denominator be y.`,[
  {l:'(i)',m:1,q:`Represent the situation algebraically.`},
  {l:'(ii)',m:1,q:`Find the fraction.`},
  {l:'(iii)',m:2,q:`(a) What does the fraction become if both numerator and denominator are increased by 1?`,or:`(b) Write the reciprocal of the fraction.`}
],`<b>(i)</b> x + y = 12 and [[x|y + 3]] = [[1|2]], i.e. 2x − y = 3.<br><b>(ii)</b> Adding the two equations: 3x = 15, so x = 5 and y = 7. The fraction is <b>[[5|7]]</b>. (Check: [[5|10]] = [[1|2]] ✓.)<br><b>(iii)(a)</b> [[6|8]] = <b>[[3|4]]</b>.<br>(OR) <b>(b)</b> The reciprocal is <b>[[7|5]]</b>.`);
cs(15,[],`The graph of the pair of equations x − y = −1 and x + y = 7 is shown. Use it to answer the questions.`,[
  {l:'(i)',m:1,q:`Are the lines parallel, intersecting or coincident?`},
  {l:'(ii)',m:1,q:`Write the solution of the pair.`},
  {l:'(iii)',m:2,q:`(a) Find the area of the triangle formed by the two lines and the x-axis.`,or:`(b) Write the coordinates of the points where the two lines meet the y-axis.`}
],`<b>(i)</b> [[1|1]] ≠ [[−1|1]], so the lines are <b>intersecting</b>.<br><b>(ii)</b> They meet at (3, 4), so <b>x = 3, y = 4</b>.<br><b>(iii)(a)</b> x − y = −1 meets the x-axis at (−1, 0) and x + y = 7 at (7, 0). Base = 7 − (−1) = 8 and height = 4 (the y-coordinate of (3, 4)). Area = [[1|2]] × 8 × 4 = <b>16 square units</b>.<br>(OR) <b>(b)</b> x − y = −1 meets the y-axis at <b>(0, 1)</b> and x + y = 7 at <b>(0, 7)</b>.`,{fig:C3c15});

ar(55,[],`The equation x^{2} − 3x + 2 = 0 has roots 1 and 2.`,`For the equation x^{2} − 3x + 2 = 0, the sum of the roots is 3 and the product is 2.`,0,`x^{2} − 3x + 2 = (x − 1)(x − 2) = 0, so A is true. The roots 1 and 2 have sum 3 and product 2, which is what R states, so R is consistent with and supports A.<br><span class="ans">Answer: (a)</span>`);
ar(56,[],`The equation 5x^{2} + 2x + 1 = 0 has no real roots.`,`If the discriminant D < 0, the quadratic equation has no real roots.`,0,`D = 4 − 20 = −16 < 0, so A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);
ar(57,[],`The equation x^{2} − 4x + 4 = 0 has equal roots.`,`A quadratic equation has equal roots if its discriminant D = 0.`,0,`D = 16 − 16 = 0, so the roots are equal (x = 2 twice). A is true and R is the condition used.<br><span class="ans">Answer: (a)</span>`);
ar(58,[],`x^{2} = 0 is a quadratic equation.`,`Any equation of the form ax^{2} + bx + c = 0 with a ≠ 0 is a quadratic equation.`,0,`x^{2} = 0 has a = 1, b = 0, c = 0, so it is of the form in R. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(59,[],`The roots of x^{2} + 5x + 6 = 0 are −2 and −3.`,`For the equation x^{2} + 5x + 6 = 0, the sum of the roots is −5 and the product is 6.`,0,`(x + 2)(x + 3) = 0 gives the roots −2 and −3, which have sum −5 and product 6. A is true and R supports it.<br><span class="ans">Answer: (a)</span>`);
ar(60,[],`The roots of 3x^{2} − 6x + 3 = 0 are distinct.`,`The discriminant of 3x^{2} − 6x + 3 = 0 is 0.`,3,`D = 36 − 36 = 0, so the roots are equal (x = 1 twice) and A is false. R is true.<br><span class="ans">Answer: (d)</span>`);

vsa(12,[],`Find the discriminant of the equation x^{2} − 6x + 9 = 0 and state the nature of its roots.`,`D = b^{2} − 4ac = 36 − 36 = <b>0</b>.<br>Since D = 0, the equation has <b>two equal real roots</b> (x = 3 twice).`);
vsa(13,[],`Find the value of k for which x = 2 is a root of x^{2} − kx + 6 = 0.`,`4 − 2k + 6 = 0, so 2k = 10 and <b>k = 5</b>.`);
vsa(14,[],`Find the sum and the product of the roots of the equation 3x^{2} + 5x − 2 = 0.`,`Sum = −[[b|a]] = <b>−[[5|3]]</b>. Product = [[c|a]] = <b>−[[2|3]]</b>.`);
vsa(15,[],`Check whether x = 3 is a root of the equation x^{2} − 5x + 6 = 0.`,`Substituting x = 3: 9 − 15 + 6 = 0.<br>The left side equals the right side, so <b>x = 3 is a root</b>.`);

cs(10,[],`The side of a square plot is increased by 4 m, and the area of the new square plot becomes 400 m². Let the original side be x metres.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the side of the original plot.`},
  {l:'(iii)',m:2,q:`(a) Find the perimeter of the original plot.`,or:`(b) Find the area of the original plot.`}
],`<b>(i)</b> (x + 4)^{2} = 400, i.e. x^{2} + 8x − 384 = 0.<br><b>(ii)</b> (x + 24)(x − 16) = 0, so x = 16 (x = −24 is rejected). The original side is <b>16 m</b>.<br><b>(iii)(a)</b> Perimeter = 4 × 16 = <b>64 m</b>.<br>(OR) <b>(b)</b> Area = 16^{2} = <b>256 m²</b>.`);
cs(11,[],`The product of two consecutive odd positive integers is 143. Let the smaller odd integer be x.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the two integers.`},
  {l:'(iii)',m:2,q:`(a) Find their sum.`,or:`(b) Find the sum of their squares.`}
],`<b>(i)</b> x(x + 2) = 143, i.e. x^{2} + 2x − 143 = 0.<br><b>(ii)</b> (x + 13)(x − 11) = 0, so x = 11. The integers are <b>11 and 13</b>.<br><b>(iii)(a)</b> 11 + 13 = <b>24</b>.<br>(OR) <b>(b)</b> 11^{2} + 13^{2} = 121 + 169 = <b>290</b>.`);
cs(12,[],`Ravi and Rohan together can finish a piece of work in [[24|7]] days. Ravi alone takes 2 days less than Rohan alone. Let Ravi alone take x days.`,[
  {l:'(i)',m:1,q:`Write the equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the time taken by Ravi alone and by Rohan alone.`},
  {l:'(iii)',m:2,q:`(a) What fraction of the work does Ravi finish in 3 days?`,or:`(b) What fraction of the work do both finish together in 1 day?`}
],`Rohan alone takes (x + 2) days.<br><b>(i)</b> [[1|x]] + [[1|x + 2]] = [[7|24]], i.e. 24(2x + 2) = 7x(x + 2), so 7x^{2} − 34x − 48 = 0.<br><b>(ii)</b> D = 1156 + 1344 = 2500, so x = [[34 + 50|14]] = 6. <b>Ravi takes 6 days</b> and <b>Rohan takes 8 days</b>.<br><b>(iii)(a)</b> In 3 days Ravi finishes [[3|6]] = <b>[[1|2]]</b> of the work.<br>(OR) <b>(b)</b> Together they finish [[1|6]] + [[1|8]] = <b>[[7|24]]</b> of the work in 1 day.`);
cs(13,[],`In a right triangle, the hypotenuse is 6 m more than twice the shortest side, and the third side is 2 m less than the hypotenuse. Let the shortest side be x metres.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the lengths of the three sides.`},
  {l:'(iii)',m:2,q:`(a) Find the perimeter of the triangle.`,or:`(b) Find the area of the triangle.`}
],`The hypotenuse is (2x + 6) m and the third side is (2x + 4) m.<br><b>(i)</b> By Pythagoras: x^{2} + (2x + 4)^{2} = (2x + 6)^{2}, i.e. x^{2} − 8x − 20 = 0.<br><b>(ii)</b> (x − 10)(x + 2) = 0, so x = 10. The sides are <b>10 m, 24 m and 26 m</b>.<br><b>(iii)(a)</b> Perimeter = 10 + 24 + 26 = <b>60 m</b>.<br>(OR) <b>(b)</b> Area = [[1|2]] × 10 × 24 = <b>120 m²</b>.`);
cs(14,[],`A rectangular park is 30 m long and 20 m wide. A uniform path of width x metres is built all around the outside of the park, so that the park together with the path has an area of 1200 m².`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the width of the path.`},
  {l:'(iii)',m:2,q:`(a) Find the area of the path.`,or:`(b) Find the cost of paving the path at Rs 25 per square metre.`}
],`<b>(i)</b> (30 + 2x)(20 + 2x) = 1200, so 4x^{2} + 100x + 600 = 1200, i.e. x^{2} + 25x − 150 = 0.<br><b>(ii)</b> (x + 30)(x − 5) = 0, so x = 5. The width of the path is <b>5 m</b>.<br><b>(iii)(a)</b> Area of the path = 1200 − 30 × 20 = 1200 − 600 = <b>600 m²</b>.<br>(OR) <b>(b)</b> Cost = 600 × 25 = <b>Rs 15000</b>.`);
cs(15,[],`The sum of the squares of two consecutive positive integers is 61. Let the smaller integer be x.`,[
  {l:'(i)',m:1,q:`Write the quadratic equation that represents the situation.`},
  {l:'(ii)',m:1,q:`Find the two integers.`},
  {l:'(iii)',m:2,q:`(a) Find the product of the two integers.`,or:`(b) Find the sum of the two integers.`}
],`<b>(i)</b> x^{2} + (x + 1)^{2} = 61, so 2x^{2} + 2x − 60 = 0, i.e. x^{2} + x − 30 = 0.<br><b>(ii)</b> (x + 6)(x − 5) = 0, so x = 5. The integers are <b>5 and 6</b>.<br><b>(iii)(a)</b> 5 × 6 = <b>30</b>.<br>(OR) <b>(b)</b> 5 + 6 = <b>11</b>.`);

ar(45,[],`The 5^{th} term of the AP 3, 7, 11, … is 19.`,`The n^{th} term of an AP is a_{n} = a + (n − 1)d.`,0,`a = 3 and d = 4, so a_{5} = 3 + 4 × 4 = 19. A is true and R is the formula used.<br><span class="ans">Answer: (a)</span>`);
ar(46,[],`The sum of the first 5 terms of the AP 2, 4, 6, … is 30.`,`The sum of the first n terms of an AP is S_{n} = [[n|2]][2a + (n − 1)d].`,0,`S_{5} = [[5|2]][4 + 4 × 2] = [[5|2]] × 12 = 30. A is true and R is the formula used.<br><span class="ans">Answer: (a)</span>`);
ar(47,[],`The common difference of the AP 10, 7, 4, … is −3.`,`The common difference of an AP is d = a_{2} − a_{1}.`,0,`d = 7 − 10 = −3, so A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);
ar(48,[],`The sequence 1, 4, 9, 16, … is an AP.`,`The differences between consecutive terms of 1, 4, 9, 16, … are 3, 5, 7, … which are not equal.`,3,`The differences 3, 5, 7, … are not constant, so the sequence is not an AP and A is false. R is a true statement.<br><span class="ans">Answer: (d)</span>`);
ar(49,[],`If a_{n} = 2n + 3 for an AP, its common difference is 2.`,`The common difference of an AP is d = a_{n+1} − a_{n}.`,0,`a_{n+1} − a_{n} = 2(n + 1) + 3 − (2n + 3) = 2, so A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);

/* ---------- geometry figure helper ---------- */
const P2=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
const IX=(a,b,c,d)=>{const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=d[0],y4=d[1];
  const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  return [((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den,((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den];};
const FOOT=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];const t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);return [a[0]+t*dx,a[1]+t*dy];};
function geo(o){
  const W=o.w||250,H=o.h||195,pad=o.pad||34;
  const nm=Object.keys(o.p);
  const xs=nm.map(n=>o.p[n][0]),ys=nm.map(n=>o.p[n][1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const sc=Math.min((W-2*pad)/((mxx-mnx)||1),(H-2*pad)/((mxy-mny)||1));
  const ox=(W-(mxx-mnx)*sc)/2,oy=(H-(mxy-mny)*sc)/2;
  const S={};nm.forEach(n=>{S[n]=[ox+(o.p[n][0]-mnx)*sc,H-oy-(o.p[n][1]-mny)*sc];});
  const vis=nm.filter(n=>n===n.toUpperCase()||(o.sl||'').indexOf(n)>-1).filter(n=>(o.nl||'').indexOf(n)<0);
  const cx=vis.reduce((a,n)=>a+S[n][0],0)/vis.length,cy=vis.reduce((a,n)=>a+S[n][1],0)/vis.length;
  const f=v=>v.toFixed(1);
  const T=(x,y,t,a,z)=>`<text x="${f(x)}" y="${f(y)}" text-anchor="${a||'middle'}" font-size="${z||11}" font-family="Arial,sans-serif" fill="currentColor">${t}</text>`;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${o.alt||'geometry figure'}" style="max-width:100%;height:auto;color:var(--ink)">`;
  const segs=(str,dash)=>{(str||'').split(' ').filter(Boolean).forEach(t=>{const a=S[t[0]],b=S[t[1]];if(!a||!b)return;s+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="currentColor" stroke-width="1.6" ${dash?'stroke-dasharray="5 4"':''}/>`;});};
  segs(o.s);segs(o.d,true);
  const unit=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];};
  (o.par||[]).forEach(k=>{const a=S[k[0]],b=S[k[1]];const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],u=unit(a,b),nn=[-u[1],u[0]];
    s+=`<polyline points="${f(m[0]-5*u[0]-4*nn[0])},${f(m[1]-5*u[1]-4*nn[1])} ${f(m[0]+3*u[0])},${f(m[1]+3*u[1])} ${f(m[0]-5*u[0]+4*nn[0])},${f(m[1]-5*u[1]+4*nn[1])}" fill="none" stroke="currentColor" stroke-width="1.4"/>`;});
  (o.tk||[]).forEach(k=>{const a=S[k[0][0]],b=S[k[0][1]];const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],u=unit(a,b),nn=[-u[1],u[0]];
    for(let i=0;i<k[1];i++){const d=(i-(k[1]-1)/2)*4;s+=`<line x1="${f(m[0]+d*u[0]-4*nn[0])}" y1="${f(m[1]+d*u[1]-4*nn[1])}" x2="${f(m[0]+d*u[0]+4*nn[0])}" y2="${f(m[1]+d*u[1]+4*nn[1])}" stroke="currentColor" stroke-width="1.3"/>`;}});
  (o.ra||[]).forEach(r=>{const v=S[r[0]],u=unit(v,S[r[1]]),w=unit(v,S[r[2]]),z=9;
    s+=`<polyline points="${f(v[0]+z*u[0])},${f(v[1]+z*u[1])} ${f(v[0]+z*u[0]+z*w[0])},${f(v[1]+z*u[1]+z*w[1])} ${f(v[0]+z*w[0])},${f(v[1]+z*w[1])}" fill="none" stroke="currentColor" stroke-width="1.3"/>`;});
  (o.arc||[]).forEach(r=>{const v=S[r[0]],u=unit(v,S[r[1]]),w=unit(v,S[r[2]]),n=r[3]||1;
    for(let i=0;i<n;i++){const rad=15+i*4;const a1=Math.atan2(u[1],u[0]),a2=Math.atan2(w[1],w[0]);let da=a2-a1;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      s+=`<path d="M${f(v[0]+rad*Math.cos(a1))},${f(v[1]+rad*Math.sin(a1))} A${rad},${rad} 0 0 ${da>0?1:0} ${f(v[0]+rad*Math.cos(a2))},${f(v[1]+rad*Math.sin(a2))}" fill="none" stroke="currentColor" stroke-width="1.3"/>`;}});
  vis.forEach(n=>{const p=S[n];let dx=p[0]-cx,dy=p[1]-cy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    s+=T(p[0]+dx*(o.lo||11),p[1]+dy*(o.lo||11)+4,n,dx>0.35?'start':(dx<-0.35?'end':'middle'),12);});
  Object.keys(o.t||{}).forEach(k=>{const a=S[k[0]],b=S[k[1]];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;let nx=-(b[1]-a[1]),ny=b[0]-a[0];const L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;
    const out=(mx-cx)*nx+(my-cy)*ny>=0;const inside=(o.ti||[]).indexOf(k)>-1;if(out===inside){nx=-nx;ny=-ny;}
    s+=T(mx+nx*13,my+ny*13+4,o.t[k],'middle',10.5);});

}

/* ===== 1 mark: MCQ ===== */
mcq(1,[],`In the given figure, DE ∥ BC, AE = a units, EC = b units, DE = x units and BC = y units. Which of the following is true?`,['x = [[a + b|ay]]','y = [[ax|a + b]]','x = [[ay|a + b]]','[[x|y]] = [[a|b]]'],2,`DE ∥ BC, so ΔADE ~ ΔABC and [[DE|BC]] = [[AE|AC]]. So [[x|y]] = [[a|a + b]], giving x = [[ay|a + b]].`,{fig:bpt(.6,.6,{AE:'a',EC:'b',DE:'x',BC:'y'})});
mcq(2,[2023],`In the given figure, DE ∥ BC. The value of x is`,['2 cm','3 cm','5 cm','[[9|2]] cm'],3,`By the Basic Proportionality Theorem, [[AD|DB]] = [[AE|EC]], so [[2|3]] = [[3|x]] and x = [[9|2]] cm.`,{fig:bpt(.4,.4,{AD:'2',DB:'3',AE:'3',EC:'x'})});
mcq(3,[2023],`In the given figure, PQ ∥ AC. If BP = 4 cm, AP = 2.4 cm, BQ = 5 cm then find the length of BC.`,['8 cm','3 cm','0.3 cm','[[25|3]] cm'],0,`PQ ∥ AC, so [[BP|BA]] = [[BQ|BC]]. BA = 4 + 2.4 = 6.4 cm, so [[4|6.4]] = [[5|BC]] and BC = 8 cm.`,{fig:geo({p:{A:[0,0],P:[24,0],B:[64,0],C:[15,60],Q:P2([64,0],[15,60],.625)},s:'AB BC CA PQ',par:['AC','PQ'],t:{AP:'2.4 cm',PB:'4 cm',BQ:'5 cm'}})});
mcq(4,[2023],`In the given figure, DE ∥ BC. The value of x is`,['6 cm','12.5 cm','8 cm','10 cm'],3,`ΔADE ~ ΔABC, so [[AD|AB]] = [[DE|BC]]. [[2|5]] = [[4|x]], giving x = 10 cm.`,{fig:bpt(.4,.4,{AD:'2 cm',DB:'3 cm',DE:'4 cm',BC:'x cm'})});
mcq(5,[2025],`In the given figure, PQ ∥ XY ∥ BC, AP = 2 cm, PX = 1.5 cm, BX = 4 cm. If QY = 0.75 cm then AQ + CY is equal to`,['6 cm','4.5 cm','3 cm','5.25 cm'],2,`In ΔAXY, PQ ∥ XY, so [[AP|PX]] = [[AQ|QY]]: [[2|1.5]] = [[AQ|0.75]], so AQ = 1 cm.<br>In ΔABC, XY ∥ BC, so [[AX|XB]] = [[AY|YC]]. AX = 3.5 and AY = AQ + QY = 1.75: [[3.5|4]] = [[1.75|CY]], so CY = 2 cm.<br>AQ + CY = 1 + 2 = 3 cm.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],P:P2([50,100],[0,0],.267),Q:P2([50,100],[100,0],.267),X:P2([50,100],[0,0],.467),Y:P2([50,100],[100,0],.467)},s:'AB BC CA PQ XY',par:['PQ','XY','BC'],t:{AP:'2 cm',PX:'1.5 cm',XB:'4 cm',QY:'0.75 cm'}})});
mcq(6,[2023],`ABCD is a trapezium with AD ∥ BC and AD = 4 cm. If the diagonals AC and BD intersect each other at O such that [[AO|CO]] = [[DO|BO]] = [[1|2]] then BC is`,['6 cm','7 cm','8 cm','9 cm'],2,`AD ∥ BC, so ΔAOD ~ ΔCOB and [[AD|BC]] = [[AO|CO]] = [[1|2]]. So BC = 2 × 4 = 8 cm.`,{fig:geo({p:{A:[20,60],D:[60,60],B:[0,0],C:[80,0],O:IX([20,60],[80,0],[60,60],[0,0])},s:'AB BC CD DA AC BD',par:['AD','BC'],t:{AD:'4 cm'}})});
mcq(7,[2025],`E and F are points on the sides AB and AC respectively of a ΔABC such that [[AE|EB]] = [[AF|FC]] = [[1|2]]. Which of the following relation is true?`,['EF = 2BC','BC = 2EF','EF = 3BC','BC = 3EF'],3,`[[AE|EB]] = [[AF|FC]] gives EF ∥ BC (converse of BPT). Then ΔAEF ~ ΔABC with [[EF|BC]] = [[AE|AB]] = [[1|3]], so BC = 3EF.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],E:P2([50,100],[0,0],1/3),F:P2([50,100],[100,0],1/3)},s:'AB BC CA EF'})});
mcq(8,[2023],`In figure, PQ ∥ BC. Find the length of side AC, given that PB = 6 cm, AP = 4 cm and AQ = 8 cm.`,['12 cm','20 cm','6 cm','14 cm'],1,`[[AP|PB]] = [[AQ|QC]]: [[4|6]] = [[8|QC]], so QC = 12 cm. AC = AQ + QC = 8 + 12 = 20 cm.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],P:P2([50,100],[0,0],.4),Q:P2([50,100],[100,0],.4)},s:'AB BC CA PQ',par:['PQ','BC'],t:{PB:'6 cm',AP:'4 cm',AQ:'8 cm'}})});
mcq(9,[2023],`If in triangles ABC and DEF, [[AB|DE]] = [[BC|FD]] then they will be similar when`,['∠B = ∠E','∠A = ∠D','∠B = ∠D','∠A = ∠F'],2,`The sides AB, BC form the angle B in ΔABC, and the sides DE, FD form the angle D in ΔDEF. With the sides in proportion, the triangles are similar (SAS) when the included angles are equal, i.e. ∠B = ∠D.`);
mcq(10,[2023],`In the given figure, DE ∥ BC. If AD = 3 cm, AB = 7 cm, EC = 3 cm then length of AE is`,['2 cm','2.25 cm','3.5 cm','4 cm'],1,`DB = 7 − 3 = 4 cm. [[AD|DB]] = [[AE|EC]]: [[3|4]] = [[AE|3]], so AE = [[9|4]] = 2.25 cm.`,{fig:bpt(3/7,3/7,{AD:'3 cm',AB:'7 cm',EC:'3 cm'})});
mcq(11,[2025],`In the given figure, PQ ∥ BC. If [[AP|PB]] = [[4|13]] and AC = 20.4 cm then the length of AQ is`,['2.8 cm','5.8 cm','3.8 cm','4.8 cm'],3,`[[AQ|QC]] = [[AP|PB]] = [[4|13]], so [[AQ|AC]] = [[4|17]]. AQ = [[4|17]] × 20.4 = 4.8 cm.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],P:P2([50,100],[0,0],4/17),Q:P2([50,100],[100,0],4/17)},s:'AB BC CA PQ',par:['PQ','BC'],t:{AC:'20.4 cm'}})});
mcq(12,[],`In the given figure, if ∠A = 90°, ∠B = 90°, OB = 4.5 cm, OA = 6 cm and AP = 4 cm then find QB.`,['3 cm','6 cm','4.5 cm','3.5 cm'],0,`ΔOAP ~ ΔOBQ (∠A = ∠B = 90° and vertically opposite angles at O). [[OA|OB]] = [[AP|BQ]]: [[6|4.5]] = [[4|QB]], so QB = 3 cm.`,{fig:geo({p:{A:[0,0],B:[84,0],O:[48,0],P:[0,-32],Q:[84,24]},s:'AB PQ AP BQ',ra:[['A','B','P'],['B','A','Q']],t:{OA:'6 cm',OB:'4.5 cm',AP:'4 cm'}})});
mcq(13,[2023],`In the given figure, ∠A = ∠C, AB = 6 cm, AP = 12 cm, CP = 4 cm. Then length of CD is`,['2 cm','6 cm','8 cm','18 cm'],0,`ΔABP ~ ΔCDP (∠A = ∠C and ∠APB = ∠CPD, vertically opposite). [[AB|CD]] = [[AP|CP]]: [[6|CD]] = [[12|4]], so CD = 2 cm.`,{fig:geo({p:{A:[0,60],B:[0,15],E:[0,0],C:[80,0],D:[80,15],P:[60,15]},s:'AB BE EC CD BD AC',arc:[['A','B','C',1],['C','A','D',1]],t:{AB:'6 cm',AP:'12 cm',PC:'4 cm'}})});
mcq(14,[2023],`In the given figure, ΔABC ~ ΔQPR. If AC = 6 cm, BC = 5 cm, QR = 3 cm and PR = x then the value of x is`,['3.6 cm','2.5 cm','10 cm','3.2 cm'],1,`ΔABC ~ ΔQPR gives A ↔ Q, B ↔ P, C ↔ R. So [[AC|QR]] = [[BC|PR]]: [[6|3]] = [[5|x]], and x = 2.5 cm.`,{fig:duo(geo({p:{A:[0,60],C:[100,60],B:[55,0]},s:'AB BC CA',t:{AC:'6 cm',BC:'5 cm'}}),geo({p:{R:[30,60],Q:[0,0],P:[65,0]},s:'RQ QP PR',t:{QR:'3 cm',PR:'x'}}))});
mcq(15,[],`The perimeters of two similar triangles are 25 cm and 15 cm respectively. If one side of the first triangle is 9 cm, then the corresponding side of second triangle is`,['5.4 cm','5.2 cm','4.9 cm','5.1 cm'],0,`The ratio of corresponding sides = the ratio of perimeters = 25 : 15. The side = 9 × [[15|25]] = 5.4 cm.`);
mcq(16,[],`If ΔPRQ ~ ΔXYZ then`,['[[PR|XZ]] = [[RQ|YZ]]','[[PQ|XY]] = [[PR|XZ]]','[[PQ|XZ]] = [[QR|YZ]]','[[QR|XY]] = [[PR|YZ]]'],2,`ΔPRQ ~ ΔXYZ gives P ↔ X, R ↔ Y, Q ↔ Z. So [[PR|XY]] = [[RQ|YZ]] = [[PQ|XZ]]. Option (c) is [[PQ|XZ]] = [[QR|YZ]], which is correct.`);
mcq(17,[2023],`If ΔABC ~ ΔPQR with ∠A = 32° and ∠R = 65° then ∠B is`,['32°','65°','83°','97°'],2,`A ↔ P, B ↔ Q, C ↔ R. So ∠C = ∠R = 65°, and ∠B = 180° − 32° − 65° = 83°.`);
mcq(18,[2025],`Given ΔABC ~ ΔPQR, ∠A = 30° and ∠Q = 90°. The value of ∠R + ∠B is`,['90°','120°','150°','180°'],2,`∠B = ∠Q = 90° and ∠P = ∠A = 30°. So ∠R = 180° − 90° − 30° = 60°. ∠R + ∠B = 60° + 90° = 150°.`);
mcq(19,[],`If ΔABC ~ ΔDEF such that 2AB = DE and BC = 8 cm then find EF.`,['16 cm','14 cm','12 cm','15 cm'],0,`[[EF|BC]] = [[DE|AB]] = 2, so EF = 2 × 8 = 16 cm.`);
mcq(20,[2023],`In the given figure, AB ∥ PQ. If AB = 6 cm, PQ = 2 cm, OB = 3 cm then length of OP is`,['9 cm','3 cm','4 cm','1 cm'],3,`ΔOAB ~ ΔOQP (AB ∥ PQ). [[OB|OP]] = [[AB|PQ]] = [[6|2]] = 3, so OP = [[3|3]] = 1 cm.`,{fig:geo({p:{A:[0,0],B:[10,60],P:[50,10],Q:[53.3,30],O:IX([0,0],[53.3,30],[10,60],[50,10])},s:'AB PQ AQ BP',par:['AB','PQ'],t:{AB:'6 cm',PQ:'2 cm',OB:'3 cm'}})});
mcq(21,[2025],`The measurements of ΔLMN and ΔABC are shown in the figure given below. The length of side AC is`,['16 cm','7 cm','8 cm','4 cm'],2,`In ΔLMN, ∠L = 180° − 130° − 28° = 22°. So ΔLMN ~ ΔABC with L ↔ A, M ↔ B, N ↔ C (22°, 130°, 28°). [[AB|LM]] = [[AC|LN]]: [[5|45]] = [[AC|72]], so AC = 8 cm.`,{fig:duo(geo({p:{L:[0,40],M:[30,0],N:[130,0]},s:'LM MN NL',t:{LM:'45 cm',LN:'72 cm',MN:'63 cm'},ang:[['M','130°'],['N','28°']]}),geo({p:{A:[0,30],B:[18,0],C:[70,0]},s:'AB BC CA',t:{AB:'5 cm'},ang:[['B','130°'],['A','22°']]}))});
mcq(22,[2025],`ΔABC and ΔPQR are shown in the adjoining figures. The measure of ∠C is`,['140°','80°','60°','40°'],3,`[[AB|QR]] = [[3.8|7.6]] = [[1|2]], [[AC|PR]] = [[3√{3}|6√{3}]] = [[1|2]], [[BC|PQ]] = [[6|12]] = [[1|2]]. So ΔABC ~ ΔRQP... with A ↔ R, B ↔ Q, C ↔ P.<br>∠P = 180° − 80° − 60° = 40°, so ∠C = ∠P = 40°.`,{fig:duo(geo({p:{A:[10,40],B:[0,0],C:[60,0]},s:'AB BC CA',t:{AB:'3.8 cm',AC:'3√3 cm',BC:'6 cm'}}),geo({p:{P:[0,0],Q:[110,0],R:[85,60]},s:'PQ QR RP',t:{PR:'6√3 cm',QR:'7.6 cm',PQ:'12 cm'},ang:[['R','80°'],['Q','60°']]}))});
mcq(23,[],`The area of right angled triangle is 40 cm² and its perimeter is 40 cm. The length of its hypotenuse is`,['16 cm','18 cm','17 cm','19 cm'],1,`Let the legs be a, b and the hypotenuse c. [[ab|2]] = 40, so ab = 80, and a + b + c = 40.<br>(a + b)^{2} = c^{2} + 2ab, so (40 − c)^{2} = c^{2} + 160, i.e. 1600 − 80c = 160 and c = 18 cm.`);
mcq(24,[],`In the figure, if [[OA|OD]] = [[OC|OB]] then which pair of angles are equal?`,['∠A = ∠C, ∠B = ∠D','∠C = ∠B, ∠A = ∠D','∠A = ∠B, ∠C = ∠D','None of these'],0,`[[OA|OC]] = [[OD|OB]] and ∠AOD = ∠COB (vertically opposite), so ΔAOD ~ ΔCOB (SAS) with A ↔ C and D ↔ B. Hence ∠A = ∠C and ∠D = ∠B.`,{fig:geo({p:{A:[0,60],D:[0,0],C:[100,60],B:[100,0],O:IX([0,60],[100,0],[0,0],[100,60])},s:'AD CB AB DC'})});
mcq(25,[2025],`In the given figure, in ΔABC, AD ⊥ BC and ∠BAC = 90°. If BC = 16 cm and DC = 4 cm then the value of x is`,['4 cm','5 cm','8 cm','3 cm'],2,`In a right triangle with the altitude AD on the hypotenuse, ΔDAC ~ ΔABC. [[AC|BC]] = [[DC|AC]], so AC^{2} = BC × DC = 16 × 4 = 64 and x = AC = 8 cm.`,{fig:geo({p:{B:[0,0],C:[80,0],D:[60,0],A:[60,34.6]},s:'BC CA AB AD',ra:[['D','A','B'],['A','B','C']],t:{BC:'16 cm',DC:'4 cm',AC:'x'}})});
mcq(26,[2025],`In ΔABC and ΔDEF, ∠B = ∠E, ∠F = ∠C and AB = 3DE. Then the two triangles are`,['Congruent but not similar','Neither congruent nor similar','similar but not congruent','congruent as well as similar'],2,`Two angles are equal, so the triangles are similar (AA). Since AB = 3DE, the corresponding sides are not equal, so they are not congruent.`);
mcq(27,[2025],`Which of the following statement is incorrect?`,['Two congruent figures are always similar.','A square and a rhombus of the same area are always similar.','Two equilateral triangles are always similar.','Two similar triangles need not be congruent.'],1,`A square and a rhombus have the same shape only if the rhombus is a square: their angles can differ. So statement (b) is incorrect.`);
mcq(28,[2025],`Which of the following statement is false?`,['Two right triangles are always similar.','Two squares are always similar.','Two equilateral triangles are always similar.','Two circles are always similar.'],0,`Two right triangles need not have equal acute angles, so they are not always similar. Statement (a) is false.`);
mcq(29,[2025],`In the given figure, ABCD is a trapezium in which XY ∥ AB ∥ CD. If AX = [[2|3]]AD, then CY : YB =`,['2 : 3','3 : 2','1 : 3','1 : 2'],3,`Parallel lines cut the non-parallel sides proportionally: [[AX|XD]] = [[BY|YC]]. AX = [[2|3]]AD, so AX : XD = 2 : 1, and BY : YC = 2 : 1. Hence CY : YB = 1 : 2.`,{fig:geo({p:{D:[20,60],C:[80,60],A:[0,0],B:[100,0],X:P2([0,0],[20,60],2/3),Y:P2([100,0],[80,60],2/3)},s:'AB BC CD DA XY',par:['XY','AB','DC']})});
mcq(30,[],`In the given figure, AD = 3 cm, AE = 5 cm, BD = 4 cm, CF = 2 cm, CE = 4 cm, BF = 2.5 cm then`,['DE ∥ BC','DF ∥ AC','EF ∥ AB','none of these'],2,`[[AD|DB]] = [[3|4]] but [[AE|EC]] = [[5|4]], so DE is not parallel to BC.<br>[[BD|DA]] = [[4|3]] but [[BF|FC]] = [[2.5|2]], so DF is not parallel to AC.<br>[[CE|EA]] = [[4|5]] and [[CF|FB]] = [[2|2.5]] = [[4|5]], so EF ∥ AB.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],D:P2([50,100],[0,0],3/7),E:P2([50,100],[100,0],5/9),F:P2([0,0],[100,0],2.5/4.5)},s:'AB BC CA DE DF EF',t:{AD:'3 cm',AE:'5 cm',BD:'4 cm',CF:'2 cm',CE:'4 cm',BF:'2.5 cm'}})});
mcq(31,[2024],`In the given figure ΔABC is shown. DE ∥ BC, AD = 5 cm, DB = 2.5 cm, BC = 12 cm then DE is`,['10 cm','6 cm','8 cm','7.5 cm'],2,`AB = 7.5 cm. ΔADE ~ ΔABC, so [[DE|BC]] = [[AD|AB]] = [[5|7.5]] = [[2|3]]. DE = [[2|3]] × 12 = 8 cm.`,{fig:bpt(2/3,2/3,{AD:'5 cm',DB:'2.5 cm',BC:'12 cm'})});
mcq(32,[],`ΔABC ~ ΔPQR. If AM and PN are altitudes of ΔABC and ΔPQR respectively and AB² : PQ² = 4 : 9 then AM : PN is`,['16 : 81','4 : 9','3 : 2','2 : 3'],3,`AB : PQ = 2 : 3. In similar triangles the altitudes are in the same ratio as the corresponding sides, so AM : PN = 2 : 3.`);
mcq(33,[2023],`If ΔABC ~ ΔPQR, PQ = 6 cm, AB = 8 cm and perimeter of ΔABC is 36 cm then perimeter of ΔPQR is`,['20.25 cm','27 cm','48 cm','64 cm'],1,`[[Perimeter of ΔPQR|Perimeter of ΔABC]] = [[PQ|AB]] = [[6|8]]. Perimeter of ΔPQR = 36 × [[3|4]] = 27 cm.`);
mcq(34,[2025],`If in two triangles ΔDEF and ΔPQR, ∠D = ∠Q and ∠R = ∠E then which of the following is not true?`,['[[DE|QR]] = [[DF|PQ]]','[[EF|PR]] = [[DF|PQ]]','[[EF|RP]] = [[DE|QR]]','[[DE|PQ]] = [[EF|RP]]'],3,`ΔDEF ~ ΔQRP (D ↔ Q, E ↔ R, F ↔ P). So [[DE|QR]] = [[EF|RP]] = [[DF|QP]]. Options (a), (b) and (c) are all of this form, but (d) [[DE|PQ]] = [[EF|RP]] is not.`);
mcq(35,[2024],`The perimeters of two similar triangles ABC & PQR are 56 cm and 48 cm respectively. [[PQ|AB]] is`,['[[7|8]]','[[6|7]]','[[7|6]]','[[8|7]]'],1,`[[PQ|AB]] = [[Perimeter of ΔPQR|Perimeter of ΔABC]] = [[48|56]] = [[6|7]].`);
mcq(36,[2024],`If the diagonals of a quadrilateral divide each other proportionally then it is a`,['Parallelogram','rectangle','square','trapezium'],3,`If [[AO|OC]] = [[BO|OD]], then ΔAOB ~ ΔCOD and AB ∥ DC. So one pair of opposite sides is parallel: the quadrilateral is a trapezium.`);

/* ===== Assertion-Reason ===== */
ar(37,[],`In the ΔABC, AB = 24 cm, BC = 10 cm and AC = 26 cm then ΔABC is a right angle triangle.`,`If in two triangles, their corresponding angles are equal then the triangles are similar.`,1,`AB^{2} + BC^{2} = 576 + 100 = 676 = AC^{2}, so by the converse of Pythagoras the triangle is right-angled at B. A is true. R is also a true statement (AA similarity), but it is not what proves A.<br><span class="ans">Answer: (b)</span>`);
ar(38,[],`If the co-ordinates of the mid-points of the sides AB and AC of ΔABC are D(3, 5) and E(−3, −3) respectively then BC = 20 units`,`The line joining the mid-points of two sides of a triangle is parallel to the third side and equal to half of it.`,0,`DE = √{(3 + 3)^{2} + (5 + 3)^{2}} = √{100} = 10. By R, BC = 2 × DE = 20. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(39,[2024],`ABCD is a trapezium with DC ∥ AB. E and F are points on AD and BC respectively such that EF ∥ AB. Then [[AE|ED]] = [[BF|FC]].`,`Any line parallel to parallel sides of a trapezium divides the non-parallel sides proportionally.`,0,`R is the theorem about a trapezium, and A is exactly its statement for the line EF. So A is true, R is true and R explains A.<br><span class="ans">Answer: (a)</span>`,{fig:geo({p:{D:[20,60],C:[80,60],A:[0,0],B:[100,0],E:P2([0,0],[20,60],.5),F:P2([100,0],[80,60],.5)},s:'AB BC CD DA EF',par:['EF','AB','DC']})});


/* ===== 2 marks ===== */
vsa(1,[],`ABCD is a parallelogram. Point P divides AB in the ratio 2 : 3 and point Q divides DC in the ratio 4 : 1. Prove that OC is half of OA.`,`Let AP = 2k and PB = 3k, so AB = 5k = DC. DQ : QC = 4 : 1, so QC = [[1|5]]DC = k.<br>AP ∥ QC (AB ∥ DC). In ΔOAP and ΔOCQ: ∠OAP = ∠OCQ and ∠APO = ∠CQO (alternate angles), so ΔOAP ~ ΔOCQ (AA).<br>[[OC|OA]] = [[QC|AP]] = [[k|2k]] = [[1|2]]. So OC = [[1|2]]OA. Hence proved.`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],P:P2([0,0],[80,0],.4),Q:P2([20,50],[100,50],.8),O:IX([0,0],[100,50],P2([0,0],[80,0],.4),P2([20,50],[100,50],.8))},s:'AB BC CD DA AC PQ'})});
vsa(2,[2023],`ABCD is a parallelogram. AE divides the line segment BD in the ratio 1 : 2. If BE = 1.5 cm then find the length of BC.`,`Let AE meet BD at O, so BO : OD = 1 : 2.<br>AD ∥ BE (AD ∥ BC), so ΔAOD ~ ΔEOB (AA). [[BE|AD]] = [[BO|OD]] = [[1|2]], so AD = 2 × 1.5 = 3 cm.<br>BC = AD = <b>3 cm</b> (opposite sides of a parallelogram).`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],O:P2([80,0],[20,50],1/3),E:[90,25]},s:'AB BC CD DA BD AE',t:{BE:'1.5 cm'}})});
vsa(3,[2025],`In figure, ∠PST = ∠PRQ and [[PS|SQ]] = [[PT|TR]] prove that ΔPQR is an isosceles triangle.`,`[[PS|SQ]] = [[PT|TR]], so ST ∥ QR (converse of BPT). Then ∠PST = ∠PQR (corresponding angles).<br>But ∠PST = ∠PRQ (given). So ∠PQR = ∠PRQ.<br>Sides opposite equal angles are equal, so PQ = PR. Hence ΔPQR is isosceles.`,{fig:geo({p:{P:[50,100],Q:[0,0],R:[100,0],S:P2([50,100],[0,0],.5),T:P2([50,100],[100,0],.5)},s:'PQ QR RP ST',arc:[['S','P','T',1],['R','P','Q',1]]})});
vsa(4,[2025],`In the given figure, [[QR|QS]] = [[QT|PR]] and ∠1 = ∠2. Show that ΔPQS ~ ΔTQR.`,`(The figure is redrawn: ∠1 = ∠PQR, ∠2 = ∠PRQ; S lies on QR produced and T on QP.)<br>∠1 = ∠2, so PQ = PR (sides opposite equal angles). Then [[QR|QS]] = [[QT|PR]] = [[QT|PQ]], i.e. [[PQ|QT]] = [[QS|QR]].<br>In ΔPQS and ΔTQR: ∠PQS = ∠TQR (common angle at Q) and [[PQ|TQ]] = [[QS|QR]]. So ΔPQS ~ ΔTQR (SAS).`,{fig:geo({p:{P:[50,100],Q:[0,0],R:[100,0],S:[140,0],T:P2([0,0],[50,100],1/1.4)},s:'PQ QS PR PS TR',arc:[['Q','P','R',1],['R','P','Q',1]]})});
vsa(5,[2023],`ABCD is a trapezium with AB ∥ CD and its diagonals AC and BD intersect each other at O. Show that [[AO|BO]] = [[CO|DO]].`,`In ΔAOB and ΔCOD: ∠OAB = ∠OCD and ∠OBA = ∠ODC (alternate angles, AB ∥ CD). So ΔAOB ~ ΔCOD (AA).<br>[[AO|CO]] = [[BO|DO]], which gives [[AO|BO]] = [[CO|DO]]. Hence shown.`,{fig:trap()});
vsa(6,[],`In a rectangle ABCD, E is a point on AB such that AE = [[2|3]]AB. If AB = 6 km and AD = 3 km, then find DE.`,`AE = [[2|3]] × 6 = 4 km. In the right triangle DAE (∠A = 90°):<br>DE^{2} = AD^{2} + AE^{2} = 9 + 16 = 25.<br>DE = <b>5 km</b>.`,{fig:geo({p:{A:[0,0],B:[60,0],C:[60,30],D:[0,30],E:[40,0]},s:'AB BC CD DA DE',ra:[['A','B','D'],['B','A','C'],['C','B','D'],['D','A','C']],t:{AB:'6 km',AD:'3 km'}})});
vsa(7,[],`In the given figure, G is the mid-point of the side PQ of ΔPQR and GH ∥ QR. Prove that H is the mid-point of the side PR.`,`GH ∥ QR, so by the Basic Proportionality Theorem [[PG|GQ]] = [[PH|HR]].<br>G is the mid-point of PQ, so PG = GQ and [[PG|GQ]] = 1. Hence [[PH|HR]] = 1, i.e. PH = HR. So H is the mid-point of PR.`,{fig:geo({p:{P:[50,100],Q:[0,0],R:[100,0],G:P2([50,100],[0,0],.5),H:P2([50,100],[100,0],.5)},s:'PQ QR RP GH',par:['GH','QR']})});
vsa(8,[],`In the given figure, ΔABC ~ ΔPQR find the value y + z.`,`In ΔPQR (right angle at P): PQ = 3, QR = 6 and ∠R = 30°, so PR = y = √{6^{2} − 3^{2}} = 3√{3}.<br>ΔABC ~ ΔPQR, so [[BC|QR]] = [[AC|PR]] = [[AB|PQ]]. [[8|6]] = [[AB|3]], so z = AB = 4. (Check: [[4√3|3√3]] = [[4|3]] = [[8|6]] ✓.)<br>y + z = <b>3√{3} + 4</b>.`,{fig:duo(geo({p:{Q:[0,30],P:[0,0],R:[52,0]},s:'QP PR RQ',ra:[['P','Q','R']],t:{PQ:'3',QR:'6',PR:'y'},ang:[['R','30°']]}),geo({p:{B:[0,60],A:[0,0],C:[104,0]},s:'BA AC CB',ra:[['A','B','C']],t:{AB:'z',BC:'8',AC:'4√3'},ang:[['C','30°']]}))});
vsa(9,[],`In the given figure, PQRS is a trapezium in which PQ ∥ RS. On PQ and RS there are points E and F respectively such that EF intersects SQ at G. Prove that EQ × GS = GQ × FS.`,`In ΔGEQ and ΔGFS: ∠GQE = ∠GSF (alternate angles, PQ ∥ RS) and ∠EGQ = ∠FGS (vertically opposite angles).<br>So ΔGEQ ~ ΔGFS (AA). [[EQ|FS]] = [[GQ|GS]], i.e. EQ × GS = GQ × FS. Hence proved.`,{fig:geo({p:{S:[0,60],F:[40,60],R:[100,60],P:[20,0],E:[60,0],Q:[90,0],G:IX([0,60],[90,0],[40,60],[60,0])},s:'SF FR RQ PE EQ PS SQ FE',par:['SR','PQ']})});
vsa(10,[],`In the given figure, PQR is a triangle right angled at Q and XY ∥ QR. If PQ = 6 cm, PY = 4 cm and PX : XQ = 1 : 2. Calculate the length of PR and QR.`,`PX : XQ = 1 : 2 and PQ = 6, so PX = 2 cm.<br>XY ∥ QR, so [[PX|PQ]] = [[PY|PR]]: [[2|6]] = [[4|PR]], so PR = <b>12 cm</b>.<br>In right ΔPQR: QR^{2} = PR^{2} − PQ^{2} = 144 − 36 = 108, so QR = <b>6√{3} cm</b>.`,{fig:geo({p:{P:[0,60],Q:[0,0],R:[80,0],X:P2([0,60],[0,0],1/3),Y:P2([0,60],[80,0],1/3)},s:'PQ QR RP XY',ra:[['Q','P','R']],par:['XY','QR'],t:{PQ:'6 cm',PY:'4 cm'}})});
vsa(11,[],`In the given figure, ∠A = ∠B and AD = BE. Show that DE ∥ AB.`,`∠A = ∠B, so CB = CA (sides opposite equal angles).<br>CD = CA − AD and CE = CB − BE. Since CA = CB and AD = BE, we get CD = CE.<br>So [[CD|DA]] = [[CE|EB]]. By the converse of the Basic Proportionality Theorem, DE ∥ AB. Hence shown.`,{fig:geo({p:{C:[50,80],A:[0,0],B:[100,0],D:P2([0,0],[50,80],.4),E:P2([100,0],[50,80],.4)},s:'AB BC CA DE',arc:[['A','B','C',1],['B','A','C',1]],tk:[['AD',1],['BE',1]],par:['DE','AB']})});
vsa(12,[2025],`In the given figure, OA × OB = OC × OD show that ∠A = ∠C and ∠B = ∠D.`,`OA × OB = OC × OD gives [[OA|OC]] = [[OD|OB]].<br>In ΔAOD and ΔCOB: ∠AOD = ∠COB (vertically opposite angles) and [[OA|OC]] = [[OD|OB]]. So ΔAOD ~ ΔCOB (SAS).<br>The corresponding angles are equal: ∠A = ∠C and ∠D = ∠B. Hence shown.`,{fig:geo({p:{A:[20,60],B:[100,10],D:[10,50],C:[110,20],O:[60,35]},s:'AB DC AD CB'})});
vsa(13,[],`In the given figure, if AB ∥ DC, find the value of x.`,`AB ∥ DC, so ΔAOB ~ ΔCOD and [[DO|OB]] = [[CO|OA]].<br>[[x − 2|x − 1]] = [[x + 3|x + 5]], so (x − 2)(x + 5) = (x + 3)(x − 1).<br>x^{2} + 3x − 10 = x^{2} + 2x − 3, so <b>x = 7</b>.`,{fig:trap({t:{DO:'x−2',OC:'x+3',AO:'x+5',OB:'x−1'}})});
vsa(14,[],`In the given figure, find the measure of ∠X.`,`[[PQ|ZY]] = [[4.2|8.4]] = [[1|2]], [[QR|YX]] = [[7|14]] = [[1|2]], [[PR|ZX]] = [[3√{3}|6√{3}]] = [[1|2]].<br>So ΔPQR ~ ΔZYX (SSS) with P ↔ Z, Q ↔ Y, R ↔ X.<br>∠X = ∠R = 180° − 60° − 70° = <b>50°</b>.`,{fig:duo(geo({p:{P:[45,60],Q:[0,0],R:[84,0]},s:'PQ QR RP',t:{PQ:'4.2 cm',PR:'3√3 cm',QR:'7 cm'},ang:[['P','60°'],['Q','70°']]}),geo({p:{X:[0,50],Y:[140,50],Z:[70,0]},s:'XY YZ ZX',t:{XY:'14 cm',XZ:'6√3 cm',YZ:'8.4 cm'}}))});
vsa(15,[],`ABC is a right triangle right angled at C. Let BC = a, CA = b, AB = c and p be the length of perpendicular from C to AB. Prove that cp = ab.`,`Area of ΔABC taking CB as the base and CA as the height = [[1|2]]ab.<br>Area of ΔABC taking AB as the base and the perpendicular CD = p as the height = [[1|2]]cp.<br>Both are the same area, so [[1|2]]cp = [[1|2]]ab, i.e. cp = ab. Hence proved.`,{fig:geo({p:{C:[0,0],B:[80,0],A:[0,60],D:FOOT([0,0],[0,60],[80,0])},s:'CA CB AB CD',ra:[['C','A','B'],['D','C','A']],t:{BC:'a',CA:'b',AB:'c',CD:'p'}})});
vsa(16,[],`In the given figure, CB ∥ QR and CA ∥ PR. If AQ = 12 cm, AR = 20 cm, PB = CQ = 15 cm, calculate PC and BR.`,`In ΔPQR, CA ∥ PR, so [[QC|CP]] = [[QA|AR]] = [[12|20]] = [[3|5]]. With QC = 15: CP = 15 × [[5|3]] = <b>25 cm</b>.<br>CB ∥ QR, so [[PC|CQ]] = [[PB|BR]]: [[25|15]] = [[15|BR]], so BR = <b>9 cm</b>.`,{fig:geo({p:{P:[50,100],Q:[0,0],R:[100,0],A:P2([0,0],[100,0],12/32),C:P2([0,0],[50,100],12/32),B:P2([50,100],[100,0],20/32)},s:'PQ QR RP CB CA',par:['CB','QR'],t:{CQ:'15 cm',PB:'15 cm',QA:'12 cm',AR:'20 cm'}})});
vsa(17,[2025],`If ΔABC ~ ΔPQR in which AB = 6 cm, BC = 4 cm, AC = 8 cm and PR = 6 cm, then find the length of PQ + QR.`,`ΔABC ~ ΔPQR with AB ↔ PQ, BC ↔ QR, AC ↔ PR.<br>[[PR|AC]] = [[6|8]] = [[3|4]]. So PQ = [[3|4]] × 6 = 4.5 cm and QR = [[3|4]] × 4 = 3 cm.<br>PQ + QR = 4.5 + 3 = <b>7.5 cm</b>.`,{fig:duo(geo({p:{A:[0,0],C:[80,0],B:[52.5,29]},s:'AB BC CA',t:{AB:'6 cm',BC:'4 cm',AC:'8 cm'}}),geo({p:{P:[0,0],R:[60,0],Q:[39.4,21.8]},s:'PQ QR RP',t:{PR:'6 cm'}}))});
vsa(18,[],`In the given figure, AB ∥ DE and BD ∥ EF then prove that DC² = CF × AC.`,`AB ∥ DE, so in ΔCAB: [[CD|CA]] = [[CE|CB]] (BPT).<br>BD ∥ EF, so in ΔCBD: [[CF|CD]] = [[CE|CB]] (BPT).<br>So [[CD|CA]] = [[CF|CD]], which gives DC^{2} = CF × AC. Hence proved.`,{fig:geo({p:{C:[50,100],A:[0,0],B:[100,0],D:P2([0,0],[50,100],.4),E:P2([100,0],[50,100],.4),F:P2([50,100],P2([0,0],[50,100],.4),.6)},s:'AB BC CA DE BD EF',par:['AB','DE']})});
vsa(19,[],`In the given figure, AP = 3 cm, AR = 4.5 cm, AQ = 6 cm, AB = 5 cm, AC = 10 cm. Find the length of AD.`,`[[AP|AB]] = [[3|5]] and [[AQ|AC]] = [[6|10]] = [[3|5]], so PQ ∥ BC (converse of BPT).<br>Then PR ∥ BD in ΔABD, so [[AP|AB]] = [[AR|AD]]: [[3|5]] = [[4.5|AD]], giving AD = <b>7.5 cm</b>.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],P:P2([50,100],[0,0],.6),Q:P2([50,100],[100,0],.6),D:[50,0],R:[50,40]},s:'AB BC CA PQ AD',t:{AP:'3 cm',PB:'2 cm',AQ:'6 cm',QC:'4 cm',AR:'4.5 cm'}})});
vsa(20,[2023],`In the given figure, XZ ∥ BC. AZ = 3 cm, ZC = 2 cm, BM = 3 cm, MC = 5 cm. Find the length of XY.`,`XZ ∥ BC, so [[AX|AB]] = [[AZ|AC]] = [[3|5]].<br>In ΔABM, XY ∥ BM, so [[XY|BM]] = [[AX|AB]] = [[3|5]]. XY = [[3|5]] × 3 = <b>1.8 cm</b>.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],X:P2([50,100],[0,0],.6),Z:P2([50,100],[100,0],.6),M:P2([0,0],[100,0],3/8),Y:P2([50,100],P2([0,0],[100,0],3/8),.6)},s:'AB BC CA XZ AM',par:['XZ','BC'],t:{AZ:'3 cm',ZC:'2 cm',BM:'3 cm',MC:'5 cm'}})});
vsa(21,[2023],`In the given figure, AB ⊥ BC, DE ⊥ AC. Prove that ΔABC ~ ΔAED.`,`In ΔABC and ΔAED: ∠ABC = ∠AED = 90° and ∠A = ∠A (common).<br>So ΔABC ~ ΔAED (AA similarity). Hence proved.`,{fig:geo({p:{A:[0,70],B:[0,0],C:[100,0],D:[0,40],E:FOOT([0,40],[0,70],[100,0])},s:'AB BC CA DE',ra:[['B','A','C'],['E','D','C']]})});
vsa(22,[2025],`In the given figure, D is a point on the side BC of ΔABC such that ∠ADC = ∠BAC. Show that CA² = CD·CB.`,`In ΔCAD and ΔCBA: ∠C is common and ∠ADC = ∠BAC (given).<br>So ΔCAD ~ ΔCBA (AA). [[CA|CB]] = [[CD|CA]], so CA^{2} = CD × CB. Hence shown.`,{fig:geo({p:{A:[20,80],B:[0,0],C:[100,0],D:[35,0]},s:'AB BC CA AD',arc:[['A','B','C',1],['D','A','C',1]]})});
