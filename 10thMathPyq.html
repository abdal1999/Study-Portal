mcq(11,[2023],`The sum of zeros of the polynomial √{2}x^{2} − 17 are`,['[[17√{2}|2]]','−[[17√{2}|2]]','0','1'],2,`There is no x term (b = 0), so the sum of zeros = −[[0|√{2}]] = 0.`);
mcq(12,[2025],`The sum of the zeros of the polynomial 5x − 7x^{2} + 3 is`,['−[[7|5]]','[[7|5]]','[[5|7]]','−[[5|7]]'],2,`Write it as −7x^{2} + 5x + 3. Sum of zeros = −[[5|−7]] = [[5|7]].`);
mcq(13,[],`If the zeros of the quadratic polynomial x^{2} + (a + 1)x + b are 2 and −3 then`,['a = −7, b = −1','a = 5, b = −1','a = 2, b = −6','a = 0, b = −6'],3,`Sum of zeros: 2 + (−3) = −1 = −(a + 1), so a = 0. Product: 2 × (−3) = −6 = b.`);
mcq(14,[2023],`If α and β are the zeros of a polynomial x^{2} − 1 then the value of α + β is`,['2','1','−1','0'],3,`Sum of zeros = −[[0|1]] = 0. (The zeros are 1 and −1.)`);
mcq(15,[2024],`If α and β (α > β) are the zeros of a polynomial −x^{2} + 8x + 9 then (α − β) is`,['−10','10','±10','8'],1,`−x^{2} + 8x + 9 = −(x − 9)(x + 1), so the zeros are 9 and −1. α − β = 9 − (−1) = 10.`);
mcq(16,[2025],`If α and β are the zeros of a polynomial 3x^{2} + 6x + k such that α + β + αβ = −[[2|3]] then the value of k is`,['−8','8','−4','4'],3,`α + β = −2 and αβ = [[k|3]]. So −2 + [[k|3]] = −[[2|3]], giving [[k|3]] = [[4|3]] and k = 4.`);
mcq(17,[2025],`If α and β are the zeros of a polynomial x^{2} − ax − b then value of α + β + αβ is`,['a + b','−a − b','a − b','−a + b'],2,`α + β = a and αβ = −b, so α + β + αβ = a − b.`);
mcq(18,[2025],`If α and β are the zeros of a polynomial kx^{2} − 30x + 45k and α + β = αβ then k is`,['−[[2|3]]','−[[3|2]]','[[3|2]]','[[2|3]]'],3,`α + β = [[30|k]] and αβ = 45. Setting them equal: [[30|k]] = 45, so k = [[2|3]].`);
mcq(19,[2024],`If α and β are the zeros of a polynomial px^{2} − 2x + 3p and α + β = αβ then p is`,['−2/3','2/3','1/3','−1/3'],1,`α + β = [[2|p]] and αβ = 3. So [[2|p]] = 3 and p = [[2|3]].`);
mcq(20,[2023],`If α and β are the zeros of a polynomial ax^{2} − 5x + c and α + β = αβ = 10 then`,['a = 5, c = [[1|2]]','a = 1, c = [[5|2]]','a = [[5|2]], c = 1','a = [[1|2]], c = 5'],3,`α + β = [[5|a]] = 10, so a = [[1|2]]. αβ = [[c|a]] = 10, so c = 10a = 5.`);
mcq(21,[],`If α and β are the zeros of a polynomial x^{2} − 4√{3}x + 3 then the value of α + β − αβ is`,['√{3}(2 − √{3})','√{3}(2 + √{3})','√{3}(4 + √{3})','√{3}(4 − √{3})'],3,`α + β = 4√{3} and αβ = 3. α + β − αβ = 4√{3} − 3 = √{3}(4 − √{3}).`);
mcq(22,[2023],`If α and β are the zeros of a polynomial x^{2} + 2x + 1 then [[1|α]] + [[1|β]] is`,['−2','2','0','1'],0,`[[1|α]] + [[1|β]] = [[α + β|αβ]] = [[−2|1]] = −2.`);
mcq(23,[2024],`If α and β are the zeros of a polynomial 4x^{2} − 3x − 7 then [[1|α]] + [[1|β]] is`,['[[7|3]]','−[[7|3]]','[[3|7]]','−[[3|7]]'],3,`α + β = [[3|4]] and αβ = −[[7|4]]. So [[α + β|αβ]] = [[3/4|−7/4]] = −[[3|7]].`);
mcq(24,[],`If α and β are the zeros of a polynomial 2x^{2} − 4x + 5, the value of (α − β)^{2} is`,['2','1','−1','−6'],3,`α + β = 2 and αβ = [[5|2]]. (α − β)^{2} = (α + β)^{2} − 4αβ = 4 − 10 = −6.`);
mcq(25,[2023,2024],`If α and β are the zeros of a polynomial 2x^{2} − 4x + 5, the value of α^{2} + β^{2} is`,['−7','1','−1','−6'],2,`α^{2} + β^{2} = (α + β)^{2} − 2αβ = 4 − 5 = −1.`);
mcq(26,[2023],`If α and β are the zeros of a polynomial x^{2} − ax − b then the value of α^{2} + β^{2} is`,['a^{2} − 2b','a^{2} + 2b','b^{2} − 2a','b^{2} + 2a'],1,`α + β = a and αβ = −b. α^{2} + β^{2} = a^{2} − 2(−b) = a^{2} + 2b.`);
mcq(27,[],`If α and β are the zeros of a polynomial 2x^{2} − 4x + 5, the value of [[1|α^{2}]] + [[1|β^{2}]] is`,['[[4|25]]','−[[4|25]]','[[4|5]]','−[[4|5]]'],1,`[[1|α^{2}]] + [[1|β^{2}]] = [[α^{2} + β^{2}|(αβ)^{2}]] = [[−1|25/4]] = −[[4|25]].`);
mcq(28,[],`If α and β are the zeros of a polynomial x^{2} − x − 4 then the value of [[1|α]] + [[1|β]] − αβ is`,['15/4','−15/4','4','15'],0,`α + β = 1 and αβ = −4. [[1|α]] + [[1|β]] = [[1|−4]] = −[[1|4]]. So the value = −[[1|4]] + 4 = [[15|4]].`);
mcq(29,[],`If m and n are the zeros of a polynomial 3x^{2} + 11x − 4 then the value of [[m|n]] + [[n|m]] will be`,['[[12|145]]','−[[12|145]]','−[[145|12]]','[[145|12]]'],2,`m + n = −[[11|3]] and mn = −[[4|3]]. m^{2} + n^{2} = [[121|9]] + [[8|3]] = [[145|9]]. So [[m|n]] + [[n|m]] = [[145/9|−4/3]] = −[[145|12]].`);
mcq(30,[],`If a and b are the zeros of a polynomial x^{2} + ax + b, the value of a and b are`,['1 and 2','1 and −2','−2 and 1','2 and 1'],1,`Sum: a + b = −a. Product: ab = b. From ab = b with b ≠ 0 we get a = 1. Then 1 + b = −1, so b = −2. So a = 1 and b = −2.`);
mcq(31,[],`If the sum of the zeros of the quadratic polynomial kx^{2} + 2x + 3k is equal to their product then k`,['[[1|3]]','−[[1|3]]','[[2|3]]','−[[2|3]]'],3,`Sum = −[[2|k]] and product = 3. −[[2|k]] = 3 gives k = −[[2|3]].`);
mcq(32,[2024],`The sum and product of zeros of a quadratic polynomial are 2√{3} and 3 respectively, the quadratic polynomial will be`,['x^{2} + 2√{3}x − 3','(x − √{3})^{2}','x^{2} − 2√{3}x − 3','x^{2} + 2√{3}x + 3'],1,`Polynomial = x^{2} − (sum)x + product = x^{2} − 2√{3}x + 3 = (x − √{3})^{2}.`);
mcq(33,[],`The quadratic polynomial p(x) with 3 and −[[2|5]] as sum and product of its zeros`,['x^{2} − 3x − [[2|5]]','x^{2} − 3x − 2','5x^{2} − 15x − 2','15x^{2} − 5x + [[2|5]]'],0,`x^{2} − (sum)x + product = x^{2} − 3x − [[2|5]]. Multiplying by 5 gives 5x^{2} − 15x − 2, which has the same zeros, so options (a) and (c) are both valid. The site accepts either.`,{alt:[2]});
mcq(34,[],`The quadratic polynomial whose sum and product of the zeros are [[21|8]] and [[5|16]], is`,['16x^{2} − 42x + 5','[[1|16]](16x^{2} − 42x + 5)','[[1|12]](16x^{2} + 42x + 5)','[[1|12]](16x^{2} + 42x − 5)'],0,`x^{2} − [[21|8]]x + [[5|16]] = [[1|16]](16x^{2} − 42x + 5). Options (a) and (b) both have these zeros (they differ only by a constant factor). The site accepts either.`,{alt:[1]});
mcq(35,[],`A quadratic polynomial whose zeros are −3 and 4, is`,['x^{2} − 2x + 12','x^{2} + x + 12','[[x^{2}|2]] − [[x|2]] − 6','2x^{2} + 2x − 24'],2,`(x + 3)(x − 4) = x^{2} − x − 12. Option (c) is [[1|2]] of this, so its zeros are −3 and 4. (Option (d) = 2(x^{2} + x − 12) has zeros 3 and −4.)`);
mcq(36,[],`The maximum number of zeros a cubic polynomial can have, is`,['1','2','3','4'],2,`A polynomial of degree n has at most n zeros, so a cubic has at most 3.`);
mcq(37,[2023],`Which of the following is a quadratic polynomial having zeros −[[2|3]] and [[2|3]].`,['4x^{2} − 9','[[4|9]](9x^{2} + 4)','x^{2} + [[9|4]]','5(9x^{2} − 4)'],3,`x^{2} − [[4|9]] = [[1|9]](9x^{2} − 4), so any multiple of 9x^{2} − 4 works, and 5(9x^{2} − 4) has zeros ±[[2|3]]. (4x^{2} − 9 has zeros ±[[3|2]]; options (b) and (c) have no real zeros.)`);
mcq(38,[],`Write a quadratic polynomial whose sum of zeros is −[[1|4]] and product of zeros is [[1|4]]`,['4x^{2} + x + 1','x^{2} + 4x − 1','2x^{2} + 3x − 1','x^{2} − 2x + 1'],0,`x^{2} + [[1|4]]x + [[1|4]] = [[1|4]](4x^{2} + x + 1).`);
mcq(39,[],`The quadratic polynomial whose zeros are reciprocals of the zeros of the polynomial ax^{2} + bx + c, a ≠ 0, c ≠ 0`,['bx^{2} + ax + c','ax^{2} + cx + b','cx^{2} + bx + a','bx^{2} + cx + a'],2,`Sum of reciprocals = [[α + β|αβ]] = −[[b|c]] and product = [[1|αβ]] = [[a|c]]. Polynomial: x^{2} + [[b|c]]x + [[a|c]], i.e. cx^{2} + bx + a.`);
mcq(40,[2025],`The zeros of the polynomial 7y^{2} − [[11|3]]y − [[2|3]] are`,['−[[2|3]], −[[1|7]]','−[[2|7]], −[[1|3]]','[[2|3]], [[1|7]]','[[2|3]], −[[1|7]]'],3,`Multiply by 3: 21y^{2} − 11y − 2 = 21y^{2} − 14y + 3y − 2 = 7y(3y − 2) + 1(3y − 2) = (3y − 2)(7y + 1). Zeros: [[2|3]] and −[[1|7]].`);
mcq(41,[],`The zeros of the polynomial x^{2} − 3x − m(m + 3) are`,['m, m + 3','−m, m + 3','m, −(m + 3)','−m, −(m + 3)'],1,`x^{2} − 3x − m(m + 3) = (x + m)(x − (m + 3)), so the zeros are −m and m + 3.`);
mcq(42,[2023],`The zeros of the polynomial √{3}x^{2} − 8x + 4√{3} are`,['2√{3}, √{3}','2√{3}, [[1|√{3}]]','[[1|√{3}]], √{3}','[[2|√{3}]], 2√{3}'],3,`Split −8x as −6x − 2x: √{3}x(x − 2√{3}) − 2(x − 2√{3}) = (x − 2√{3})(√{3}x − 2). Zeros: 2√{3} and [[2|√{3}]].`);
mcq(43,[2023,2024],`The zeros of the polynomial 4x^{2} − 12x + 9 will be`,['[[3|2]], [[3|2]]','[[2|3]], [[1|3]]','[[3|2]], [[1|3]]','[[1|3]], [[1|3]]'],0,`4x^{2} − 12x + 9 = (2x − 3)^{2}, so both zeros are [[3|2]].`);
mcq(44,[2025],`The zeros of the polynomial x^{2} − 3√{2}x + 4 are`,['2, √{2}','2√{2}, √{2}','4√{2}, −√{2}','√{2}, 2'],1,`x^{2} − 2√{2}x − √{2}x + 4 = x(x − 2√{2}) − √{2}(x − 2√{2}) = (x − 2√{2})(x − √{2}). Zeros: 2√{2} and √{2}.`);
mcq(45,[],`The zeros of polynomial ax^{2} + bx + c are reciprocal of each other if`,['b = 2a','c = b','b = a','c = a'],3,`Product of zeros = [[c|a]] = 1, so c = a.`);
mcq(46,[],`If zeros of the polynomial x^{2} + 4x + 2a are a and [[2|a]] then the value of a is`,['1','2','3','4'],0,`Product of zeros = a × [[2|a]] = 2, and it also equals 2a. So 2a = 2 and a = 1. (The sum of the zeros would then not be −4, so the question as printed is not fully consistent; the expected answer comes from the product.)`);
mcq(47,[2023],`If the zeros of the polynomial x^{2} + (a + 1)x + b are 2 and −3 then`,['a = −7, b = −1','a = 5, b = −1','a = 2, b = −6','a = 0, b = −6'],3,`Sum: −1 = −(a + 1), so a = 0. Product: b = −6.`);
mcq(48,[2024],`The zeros of the polynomial x^{2} + px + q are twice the zeros of the polynomial 4x^{2} − 5x − 6. The value of p is`,['−[[5|2]]','[[5|2]]','−5','10'],0,`Sum of zeros of 4x^{2} − 5x − 6 is [[5|4]]. Twice each zero gives sum 2 × [[5|4]] = [[5|2]] = −p, so p = −[[5|2]].`);
mcq(49,[],`If the square of difference of the zeros of the quadratic polynomial x^{2} + px + 45 is equal to 144 then the value of p is`,['±9','±12','±15','±18'],3,`(α − β)^{2} = (α + β)^{2} − 4αβ = p^{2} − 180 = 144, so p^{2} = 324 and p = ±18.`);
mcq(50,[2023],`The number of polynomials having zeros as −3 and 5 is`,['1','2','3','more than 3'],3,`Every polynomial k(x + 3)(x − 5), for any non-zero constant k (and also higher-degree ones), has these zeros, so there are infinitely many.`);
mcq(51,[2024],`What should be the subtracted from the polynomial x^{2} − 16x + 30 so that 15 is the zero of the resulting polynomial?`,['30','14','15','16'],2,`Let k be subtracted. At x = 15: 225 − 240 + 30 − k = 0, so 15 − k = 0 and k = 15.`);
mcq(52,[2024],`What should be the added from the polynomial x^{2} − 5x + 4 so that 3 is the zero of the resulting polynomial?`,['1','2','4','5'],1,`Let k be added. At x = 3: 9 − 15 + 4 + k = 0, so k = 2.`);
mcq(53,[2024],`If a polynomial p(x) is given by p(x) = x^{2} − 5x + 6 then the value of p(1) + p(4) is`,['0','4','2','−4'],1,`p(1) = 1 − 5 + 6 = 2 and p(4) = 16 − 20 + 6 = 2. Sum = 4.`);
mcq(54,[2024],`A quadratic polynomial, one of whose zeros is 2 + √{5} and the sum of whose zeros is 4, is`,['x^{2} + 4x − 1','x^{2} − 4x − 1','x^{2} − 4x + 1','x^{2} + 4x + 1'],1,`Other zero = 4 − (2 + √{5}) = 2 − √{5}. Product = 4 − 5 = −1. Polynomial: x^{2} − 4x − 1.`);
mcq(55,[2025],`Two polynomials are shown in the graph below. The number of distinct zeros of both polynomial is:`,['3','5','2','4'],2,`Both curves cut the x-axis at the same two points, so there are only 2 distinct zeros.`,{fig:G55});
mcq(56,[],`Which of the following is not the graph of a quadratic polynomial?`,[G56a,G56b,G56c,G56d],3,`The graph of a quadratic polynomial is a parabola (a single U or ∩ shape). Graph (d) has a hump and a dip, so it is a cubic curve, not a parabola.`);
mcq(57,[],`The graph of y = p(x) where p(x) is a polynomial in variable x, is as follows. The number of zeros of p(x) is`,['2','3','4','5'],3,`Zeros are the points where the graph cuts the x-axis. Counting the crossings from left to right gives 5.`,{fig:G57});
mcq(58,[],`In the given figure, the graph of a polynomial p(x) is shown. The number of zeros of p(x) will be`,['1','2','3','4'],0,`The curve cuts the x-axis at only one point, so there is 1 zero.`,{fig:G58});
mcq(59,[2023],`The graph of y = p(x) is given for a polynomial p(x). The number of zeros of p(x) from the graph is`,['0','1','2','3'],1,`The curve touches the x-axis at exactly one point, so there is 1 zero.`,{fig:G59});
mcq(60,[2023],`The graph of y = p(x) is given for a polynomial p(x). The zeros of p(x) from the graph are`,['−5, 7','−[[5|2]], −[[7|2]]','−5, 0, 7','−5, −[[5|2]], [[7|2]], 7'],2,`The zeros are the x-coordinates where the curve meets the x-axis: −5, 0 and 7. The values −[[5|2]] and [[7|2]] only mark where the turning points lie.`,{fig:G60});

/* ===== Chapter 2: Assertion-Reason ===== */
ar(61,[],`If one zero of the polynomial (k^{2} + 4)x^{2} + 13x + 4k is reciprocal of other then k = 2.`,`If (x − α) is a factor of p(x) then p(α) = 0.`,1,`Product of zeros = 1: [[4k|k^{2} + 4]] = 1, so (k − 2)^{2} = 0 and k = 2. A is true. R is also true (factor theorem), but A is proved using the product of zeros, so R does not explain A.<br><span class="ans">Answer: (b)</span>`);
ar(62,[2023],`The polynomial p(x) = x^{2} + 3x + 3 has two real zeros.`,`A quadratic polynomial can have at most two real zeros.`,3,`Discriminant = 9 − 12 = −3 < 0, so there are no real zeros and A is false. R is true.<br><span class="ans">Answer: (d)</span>`);
ar(63,[2024],`If the graph of a polynomial touches x-axis at only one point then the polynomial cannot be a quadratic polynomial.`,`A polynomial of degree n (n > 1) can have at most n zeros.`,3,`A quadratic such as (x − 1)^{2} touches the x-axis at exactly one point, so A is false. R is true.<br><span class="ans">Answer: (d)</span>`);
ar(64,[2024],`Degree of zero polynomial is not defined.`,`Degree of a non-zero constant polynomial is 0.`,1,`Both statements are true. But R is about non-zero constants and says nothing about why the zero polynomial has no degree, so R does not explain A.<br><span class="ans">Answer: (b)</span>`);

/* ===== Chapter 2: 2 marks ===== */
vsa(1,[],`Find the zeros of the quadratic polynomial √{3}x^{2} − 8x + 4√{3}.`,`Split −8x as −6x − 2x: √{3}x(x − 2√{3}) − 2(x − 2√{3}) = (x − 2√{3})(√{3}x − 2).<br>Zeros: <b>2√{3}</b> and <b>[[2|√{3}]]</b> (= [[2√{3}|3]]).`);
vsa(2,[2025],`Find the zeros of the quadratic polynomial x^{2} + [[4|3]]x − [[4|3]].`,`Multiply by 3: 3x^{2} + 4x − 4 = 3x^{2} + 6x − 2x − 4 = 3x(x + 2) − 2(x + 2) = (x + 2)(3x − 2).<br>Zeros: <b>−2</b> and <b>[[2|3]]</b>.`);
vsa(3,[2025],`If the zeros of the polynomial x^{2} + ax + b are in the ratio 3 : 4 then prove that 12a^{2} = 49b.`,`Let the zeros be 3k and 4k.<br>Sum: 7k = −a, so a^{2} = 49k^{2}. Product: 12k^{2} = b.<br>12a^{2} = 12 × 49k^{2} = 49 × 12k^{2} = 49b. Hence proved.`);
vsa(4,[2025],`If p and q are zeros of the polynomial 21y^{2} − y − 2 then find the value of (1 − p)·(1 − q).`,`p + q = [[1|21]] and pq = −[[2|21]].<br>(1 − p)(1 − q) = 1 − (p + q) + pq = 1 − [[1|21]] − [[2|21]] = [[18|21]] = <b>[[6|7]]</b>.`);
vsa(5,[2025],`Find a quadratic polynomial whose zeros are 2 and −[[7|5]].`,`Sum = 2 − [[7|5]] = [[3|5]]; product = 2 × (−[[7|5]]) = −[[14|5]].<br>Polynomial: x^{2} − [[3|5]]x − [[14|5]], or <b>5x^{2} − 3x − 14</b>.`);
vsa(6,[2025],`If α and β are zeros of the polynomial y^{2} − 5y + 3 then find the value of α^{4}β^{3} + α^{3}β^{4}.`,`α + β = 5 and αβ = 3.<br>α^{4}β^{3} + α^{3}β^{4} = α^{3}β^{3}(α + β) = 3^{3} × 5 = <b>135</b>.`);
vsa(7,[2025],`If the sum of zeros of the polynomial (p + 1)x^{2} + (2p + 3)x + (3p + 4) is −1 then find the value of p?`,`Sum of zeros = −[[2p + 3|p + 1]] = −1, so 2p + 3 = p + 1 and <b>p = −2</b>.`);
vsa(8,[2025],`If α and β are zeros of the polynomial x^{2} − 2x − 1 then find the value of [[1|2α]] + [[1|2β]] + 3αβ.`,`α + β = 2 and αβ = −1.<br>[[1|2α]] + [[1|2β]] = [[α + β|2αβ]] = [[2|−2]] = −1.<br>Value = −1 + 3(−1) = <b>−4</b>.`);
vsa(9,[],`Form a quadratic polynomial p(x) with 3 and −[[2|5]] as sum and product of its zeros respectively.`,`p(x) = x^{2} − (sum)x + product = x^{2} − 3x − [[2|5]], or <b>5x^{2} − 15x − 2</b>.`);
vsa(10,[],`If α and β are the zeros of the polynomial 5x^{2} − 7x + 1 then find the value of [[α|β]] + [[β|α]].`,`α + β = [[7|5]] and αβ = [[1|5]]. α^{2} + β^{2} = [[49|25]] − [[2|5]] = [[39|25]].<br>[[α|β]] + [[β|α]] = [[α^{2} + β^{2}|αβ]] = [[39/25|1/5]] = <b>[[39|5]]</b>.`);
vsa(11,[2024],`If α and β are the zeros of the polynomial x^{2} − 4√{3}x + 3, then find the value of α + β − αβ.`,`α + β = 4√{3} and αβ = 3, so α + β − αβ = <b>4√{3} − 3</b>.`);
vsa(12,[],`If α and β are the zeros of the polynomial x^{2} − (k − 6)x + 2(2k − 1) find the value of k if α + β = [[1|2]]αβ`,`α + β = k − 6 and αβ = 2(2k − 1) = 4k − 2.<br>k − 6 = [[1|2]](4k − 2) = 2k − 1, so <b>k = −5</b>.`);
vsa(13,[],`If one of the zeros of the quadratic polynomial 14x^{2} − 42k^{2}x − 9 is negative of the other, find the value of ‘k’.`,`The zeros are α and −α, so their sum is 0.<br>Sum = [[42k^{2}|14]] = 3k^{2} = 0, so <b>k = 0</b>.`);
vsa(14,[],`If one zero of the polynomial 2x^{2} + 3x + λ is [[1|2]] find the value of λ and the other zero.`,`Put x = [[1|2]]: 2 × [[1|4]] + [[3|2]] + λ = 0, so λ = −2.<br>Product of zeros = [[λ|2]] = −1, so the other zero = −1 ÷ [[1|2]] = <b>−2</b>.<br>(Check: sum = [[1|2]] − 2 = −[[3|2]] ✓.)`);
vsa(15,[],`Find the value of k such that the polynomial x^{2} − (k + 6)x + 2(2k + 1) has sum of its zeros equal to half of their product.`,`Sum = k + 6 and product = 4k + 2.<br>k + 6 = [[1|2]](4k + 2) = 2k + 1, so <b>k = 5</b>.`);

/* ===== Chapter 2: 3 marks ===== */
sa(1,[],`Find the zeros of the quadratic polynomial 6x^{2} − 3 − 7x and verify the relationship between zeros and coefficients.`,`6x^{2} − 7x − 3 = 6x^{2} − 9x + 2x − 3 = 3x(2x − 3) + 1(2x − 3) = (2x − 3)(3x + 1).<br>Zeros: <b>[[3|2]]</b> and <b>−[[1|3]]</b>.<br>Sum = [[3|2]] − [[1|3]] = [[7|6]] = −[[−7|6]] ✓.<br>Product = [[3|2]] × (−[[1|3]]) = −[[1|2]] = [[−3|6]] ✓.`);
sa(2,[],`Find the zeros of the quadratic polynomial x^{2} + [[1|6]]x − 2 and verify the relationship between zeros and coefficients.`,`Multiply by 6: 6x^{2} + x − 12 = 6x^{2} + 9x − 8x − 12 = 3x(2x + 3) − 4(2x + 3) = (2x + 3)(3x − 4).<br>Zeros: <b>−[[3|2]]</b> and <b>[[4|3]]</b>.<br>Sum = −[[3|2]] + [[4|3]] = −[[1|6]] = −[[1/6|1]] ✓.<br>Product = −[[3|2]] × [[4|3]] = −2 ✓.`);
sa(3,[2024],`Find the zeros of the quadratic polynomial x^{2} − 15 and verify the relationship between zeros and coefficients.`,`x^{2} − 15 = (x − √{15})(x + √{15}). Zeros: <b>√{15}</b> and <b>−√{15}</b>.<br>Sum = 0 = −[[0|1]] ✓.<br>Product = −15 = [[−15|1]] ✓.`);
sa(4,[2024],`Find the zeros of the quadratic polynomial 2x^{2} − x − 6 and verify the relationship between zeros and coefficients.`,`2x^{2} − x − 6 = 2x^{2} − 4x + 3x − 6 = 2x(x − 2) + 3(x − 2) = (x − 2)(2x + 3).<br>Zeros: <b>2</b> and <b>−[[3|2]]</b>.<br>Sum = 2 − [[3|2]] = [[1|2]] = −[[−1|2]] ✓.<br>Product = 2 × (−[[3|2]]) = −3 = [[−6|2]] ✓.`);
sa(5,[2025],`Obtain the zeros of the polynomial 7x^{2} + 18x − 9. Hence, write a polynomial each of whose zeros is twice the zeros of given polynomial.`,`7x^{2} + 18x − 9 = 7x^{2} + 21x − 3x − 9 = 7x(x + 3) − 3(x + 3) = (x + 3)(7x − 3). Zeros: <b>−3</b> and <b>[[3|7]]</b>.<br>New zeros: −6 and [[6|7]]. Sum = −[[36|7]], product = −[[36|7]].<br>Polynomial: x^{2} + [[36|7]]x − [[36|7]], or <b>7x^{2} + 36x − 36</b>.`);
sa(6,[2025],`Obtain the zeros of the polynomial p(x) = 2x^{2} − 5x − 3. Hence, obtain a polynomial each of whose zeros is one less than each of the zeros of p(x).`,`2x^{2} − 5x − 3 = (2x + 1)(x − 3). Zeros: <b>3</b> and <b>−[[1|2]]</b>.<br>New zeros: 2 and −[[3|2]]. Sum = [[1|2]], product = −3.<br>Polynomial: x^{2} − [[1|2]]x − 3, or <b>2x^{2} − x − 6</b>.`);
sa(7,[2025],`Find the zeros of the polynomial p(x) = 6x^{2} − 5x − 1. Hence obtain a polynomial each of whose zeros is three times the zeros of p(x).`,`6x^{2} − 5x − 1 = (6x + 1)(x − 1). Zeros: <b>1</b> and <b>−[[1|6]]</b>.<br>New zeros: 3 and −[[1|2]]. Sum = [[5|2]], product = −[[3|2]].<br>Polynomial: x^{2} − [[5|2]]x − [[3|2]], or <b>2x^{2} − 5x − 3</b>.`);
sa(8,[2025],`Find the zeros of the polynomial p(x) = 3x^{2} − 4x − 4. Hence obtain a polynomial each of whose zeros is 2 more than the zeros of p(x).`,`3x^{2} − 4x − 4 = (3x + 2)(x − 2). Zeros: <b>2</b> and <b>−[[2|3]]</b>.<br>New zeros: 4 and [[4|3]]. Sum = [[16|3]], product = [[16|3]].<br>Polynomial: x^{2} − [[16|3]]x + [[16|3]], or <b>3x^{2} − 16x + 16</b>.`);
sa(9,[2025],`Find the zeros of the polynomial p(x) = 4x^{2} + 3x − 1. Hence obtain a polynomial each of whose zeros are reciprocal of the zeros of p(x).`,`4x^{2} + 3x − 1 = (4x − 1)(x + 1). Zeros: <b>[[1|4]]</b> and <b>−1</b>.<br>Reciprocals: 4 and −1. Sum = 3, product = −4.<br>Polynomial: <b>x^{2} − 3x − 4</b>.`);
sa(10,[2025],`If α and β are the zeros of a polynomial px^{2} + qx + 1 then find a quadratic polynomial whose zeros are [[2|α]] and [[2|β]].`,`α + β = −[[q|p]] and αβ = [[1|p]].<br>Sum of new zeros = [[2|α]] + [[2|β]] = [[2(α + β)|αβ]] = 2 × (−[[q|p]]) × p = −2q.<br>Product = [[4|αβ]] = 4p.<br>Polynomial: <b>x^{2} + 2qx + 4p</b>.`);
sa(11,[2025],`If α and β are the zeros of a polynomial x^{2} − ax − b then obtain a quadratic polynomial whose zeros are 3α + 1 and 3β + 1.`,`α + β = a and αβ = −b.<br>Sum of new zeros = 3(α + β) + 2 = 3a + 2.<br>Product = (3α + 1)(3β + 1) = 9αβ + 3(α + β) + 1 = −9b + 3a + 1.<br>Polynomial: <b>x^{2} − (3a + 2)x + (3a − 9b + 1)</b>.`);
sa(12,[2025],`If α and β are the zeros of a polynomial ax^{2} − x + c then obtain a quadratic polynomial whose zeros are α − 3 and β − 3.`,`α + β = [[1|a]] and αβ = [[c|a]].<br>Sum of new zeros = (α + β) − 6 = [[1|a]] − 6.<br>Product = αβ − 3(α + β) + 9 = [[c|a]] − [[3|a]] + 9.<br>Polynomial: x^{2} − ([[1|a]] − 6)x + ([[c − 3|a]] + 9), or <b>ax^{2} + (6a − 1)x + (9a + c − 3)</b>.`);
sa(13,[],`If the zeros of the polynomial x^{2} + px + q are double in value to the zeros of the polynomial 2x^{2} − 5x − 3 then find the values of p and q.`,`2x^{2} − 5x − 3 = (2x + 1)(x − 3), with zeros 3 and −[[1|2]]. Doubled: 6 and −1.<br>Sum = 5 = −p, so <b>p = −5</b>. Product = −6 = q, so <b>q = −6</b>.`);
sa(14,[],`If a, b are the zeros of the polynomial 2x^{2} − 5x + 7 then find a polynomial whose zeros are 2a + 3b and 3a + 2b.`,`a + b = [[5|2]] and ab = [[7|2]].<br>Sum of new zeros = 5(a + b) = [[25|2]].<br>Product = (2a + 3b)(3a + 2b) = 6a^{2} + 13ab + 6b^{2} = 6(a + b)^{2} + ab = 6 × [[25|4]] + [[7|2]] = 41.<br>Polynomial: x^{2} − [[25|2]]x + 41, or <b>2x^{2} − 25x + 82</b>.`);
sa(15,[],`Find a quadratic polynomial whose zeros are reciprocals of the zeros of the polynomial ax^{2} + bx + c, a ≠ 0, c ≠ 0.`,`Sum of reciprocals = [[α + β|αβ]] = −[[b|c]]. Product = [[1|αβ]] = [[a|c]].<br>Polynomial: x^{2} + [[b|c]]x + [[a|c]], or <b>cx^{2} + bx + a</b>.`);
sa(16,[],`Find the quadratic polynomial sum and product of whose zeros are −1 and −20 respectively. Also find the zeros of the polynomial so obtained.`,`Polynomial: x^{2} − (−1)x + (−20) = <b>x^{2} + x − 20</b>.<br>x^{2} + x − 20 = (x + 5)(x − 4), so the zeros are <b>−5</b> and <b>4</b>.`);
sa(17,[],`If the sum and product of the zeroes of the polynomial ax^{2} − 5x + c are equal to 10 each, find the value of ‘a’ and ‘c’.`,`Sum = [[5|a]] = 10, so <b>a = [[1|2]]</b>.<br>Product = [[c|a]] = 10, so c = 10a = <b>5</b>.`);
sa(18,[],`If one zero of 3x^{2} − 8x + 2k + 1 is seven times the other, find the value of k.`,`Let the zeros be α and 7α. Sum: 8α = [[8|3]], so α = [[1|3]].<br>Product: 7α^{2} = [[7|9]] = [[2k + 1|3]], so 2k + 1 = [[7|3]] and <b>k = [[2|3]]</b>.`);
sa(19,[],`If α and β are the zeros of a polynomial 2x^{2} − 3x + 1 then find the quadratic polynomial whose zeros are 3α and 3β.`,`α + β = [[3|2]] and αβ = [[1|2]].<br>Sum of new zeros = 3(α + β) = [[9|2]]. Product = 9αβ = [[9|2]].<br>Polynomial: x^{2} − [[9|2]]x + [[9|2]], or <b>2x^{2} − 9x + 9</b>.`);
sa(20,[],`If α and β are the zeros of a polynomial x^{2} − 4x − 5 the find the value of α^{2} + β^{2}.`,`α + β = 4 and αβ = −5.<br>α^{2} + β^{2} = (α + β)^{2} − 2αβ = 16 + 10 = <b>26</b>.`);
sa(21,[2024],`If α and β are the zeros of a polynomial x^{2} + x − 2 then find the value of [[α|β]] + [[β|α]].`,`α + β = −1 and αβ = −2. α^{2} + β^{2} = 1 + 4 = 5.<br>[[α|β]] + [[β|α]] = [[α^{2} + β^{2}|αβ]] = [[5|−2]] = <b>−[[5|2]]</b>.`);
sa(22,[],`What number should be added to the polynomial x^{2} − 5x + 4 so that 3 is the zero of the polynomial?`,`Let k be added. At x = 3: 9 − 15 + 4 + k = 0, so <b>k = 2</b>.`);

/* ===== Chapter 2: 5 marks ===== */
la(1,[],`If α and β are the zeros of a polynomial 3x^{2} + 2x + 1 find the polynomial whose zeroes are [[1 − α|1 + α]] and [[1 − β|1 + β]].`,`α + β = −[[2|3]] and αβ = [[1|3]].<br>(1 + α)(1 + β) = 1 + (α + β) + αβ = 1 − [[2|3]] + [[1|3]] = [[2|3]].<br>(1 − α)(1 − β) = 1 − (α + β) + αβ = 1 + [[2|3]] + [[1|3]] = 2.<br>Sum of new zeros = [[(1 − α)(1 + β) + (1 − β)(1 + α)|(1 + α)(1 + β)]] = [[2 − 2αβ|(1 + α)(1 + β)]] = [[2 − 2/3|2/3]] = 2.<br>Product = [[(1 − α)(1 − β)|(1 + α)(1 + β)]] = [[2|2/3]] = 3.<br>Polynomial: <b>x^{2} − 2x + 3</b>.`);
la(2,[],`If α and β are the zeros of a polynomial 2x^{2} + 5x + k satisfying the relation α^{2} + β^{2} + αβ = [[21|4]] then find the value of k.`,`α + β = −[[5|2]] and αβ = [[k|2]].<br>α^{2} + β^{2} + αβ = (α + β)^{2} − αβ = [[25|4]] − [[k|2]].<br>[[25|4]] − [[k|2]] = [[21|4]], so [[k|2]] = 1 and <b>k = 2</b>.`);
la(3,[],`If α and β are the zeros of a polynomial 6x^{2} − 5x + k such that α − β = [[1|6]] then find the value of k.`,`α + β = [[5|6]] and αβ = [[k|6]].<br>(α − β)^{2} = (α + β)^{2} − 4αβ, so [[1|36]] = [[25|36]] − [[4k|6]].<br>[[4k|6]] = [[24|36]] = [[2|3]], so <b>k = 1</b>.`);
la(4,[],`If β and [[1|β]] are zeros of the polynomial (a^{2} + a)x^{2} + 61x + 6a find the value of a and β.`,`(The question prints “α and β”; the unknown here is a, so I have read it as a and β.)<br>Product of zeros = β × [[1|β]] = 1 = [[6a|a^{2} + a]].<br>So a^{2} + a = 6a, i.e. a^{2} − 5a = 0, giving a = 0 or a = 5. For a = 0 the polynomial is not quadratic, so <b>a = 5</b>.<br>The polynomial becomes 30x^{2} + 61x + 30 = (6x + 5)(5x + 6), with zeros −[[5|6]] and −[[6|5]]. So <b>β = −[[5|6]] (and [[1|β]] = −[[6|5]]) or β = −[[6|5]]</b>.`);
la(5,[],`Find the zeros of the quadratic polynomial 7y^{2} − [[11|3]]y − [[2|3]] and verify the relationship between the zeros and the coefficients.`,`Multiply by 3: 21y^{2} − 11y − 2 = 21y^{2} − 14y + 3y − 2 = 7y(3y − 2) + 1(3y − 2) = (3y − 2)(7y + 1).<br>Zeros: <b>[[2|3]]</b> and <b>−[[1|7]]</b>.<br>Sum of zeros = [[2|3]] − [[1|7]] = [[11|21]]. −[[b|a]] = [[11/3|7]] = [[11|21]] ✓.<br>Product of zeros = [[2|3]] × (−[[1|7]]) = −[[2|21]]. [[c|a]] = [[−2/3|7]] = −[[2|21]] ✓.`);
la(6,[],`If α and β are the zeros of a polynomial 2x^{2} − 4x + 5, find the values of (i) α^{2} + β^{2}  (ii) [[1|α]] + [[1|β]]  (iii) (α − β)^{2}  (iv) [[1|α^{2}]] + [[1|β^{2}]]  (v) α^{3} + β^{3}`,`α + β = 2 and αβ = [[5|2]].<br><b>(i)</b> α^{2} + β^{2} = 4 − 5 = <b>−1</b>.<br><b>(ii)</b> [[α + β|αβ]] = [[2|5/2]] = <b>[[4|5]]</b>.<br><b>(iii)</b> (α − β)^{2} = 4 − 10 = <b>−6</b>.<br><b>(iv)</b> [[α^{2} + β^{2}|(αβ)^{2}]] = [[−1|25/4]] = <b>−[[4|25]]</b>.<br><b>(v)</b> α^{3} + β^{3} = (α + β)^{3} − 3αβ(α + β) = 8 − 3 × [[5|2]] × 2 = 8 − 15 = <b>−7</b>.`);

/* ===== Chapter 2: case-based ===== */
cs(1,[2023],`In a pool at an aquarium, a dolphin jumps out of the water travelling at 20 cm per second. Its height above water level after t seconds is given by h = 20t − 16t^{2}.`,[
  {l:'(i)',m:1,q:`Find zeroes of polynomial p(t) = 20t − 16t^{2}.`},
  {l:'(ii)',m:1,q:`Which of the following types of graph represents p(t)?`,fig:C1fig},
  {l:'(iii)',m:2,q:`What would be the value of h at t = [[3|2]]? Interpret the result.`,or:`How much distance has the dolphin covered before hitting the water level again?`}
],`<b>(i)</b> 20t − 16t^{2} = 4t(5 − 4t) = 0, so t = <b>0</b> or t = <b>[[5|4]]</b>.<br><b>(ii)</b> The coefficient of t^{2} is negative, so the parabola opens downward, with zeros at 0 and [[5|4]]. This is graph <b>(a)</b>.<br><b>(iii)</b> h = 20 × [[3|2]] − 16 × [[9|4]] = 30 − 36 = <b>−6</b>. A negative height means the dolphin is below the water level, so it has already re-entered the water (it hit the water at t = [[5|4]]).<br>(OR) The dolphin hits the water again at t = [[5|4]] s. Distance = speed × time = 20 × [[5|4]] = <b>25 cm</b>.`);
cs(2,[2023],`While playing in a garden, Samaira saw a honeycomb and asked her mother what is that. Her mother replied that it’s made by honey bees to store honey. Also, she told her that the shape of the honeycomb formed is mathematical structure. The mathematical representation of the honeycomb is shown in the graph.`,[
  {l:'(i)',m:1,q:`How many zeros are there for the polynomial represented by the graph given?`},
  {l:'(ii)',m:1,q:`Write the zeros of the polynomial.`},
  {l:'(iii)',m:2,q:`If the zeros of the polynomial x^{2} + (a + 1)x + b are 2 and −3 then determine the values of a and b.`,or:`If the square of the difference of the zeros of the polynomial x^{2} + px + 45 is 144 then find the values of p.`}
],`<b>(i)</b> The graph cuts the x-axis at 2 points, so there are <b>2 zeros</b>.<br><b>(ii)</b> The zeros are <b>−7 and 7</b>.<br><b>(iii)</b> Sum of zeros = 2 + (−3) = −1 = −(a + 1), so <b>a = 0</b>. Product = 2 × (−3) = −6, so <b>b = −6</b>.<br>(OR) (α − β)^{2} = (α + β)^{2} − 4αβ = p^{2} − 180 = 144, so p^{2} = 324 and <b>p = ±18</b>.`,{fig:C2fig});
cs(3,[2024],`A ball is thrown in the air so that t seconds after it is thrown, its height h meter above its starting point is given by the polynomial h = 25t − 5t^{2}.`,[
  {l:'(i)',m:1,q:`Write zeros of the given polynomial.`},
  {l:'(ii)',m:1,q:`Find the maximum height achieved by the ball.`},
  {l:'(iii)',m:2,q:`After throwing upward, how much time did the ball take to reach to the height of 30 m?`,or:`Find two different values of t when the height of the ball was 20 m.`}
],`<b>(i)</b> 25t − 5t^{2} = 5t(5 − t) = 0, so the zeros are <b>t = 0</b> and <b>t = 5</b>.<br><b>(ii)</b> The maximum is at the midpoint of the zeros, t = [[5|2]]. h = 25 × [[5|2]] − 5 × [[25|4]] = 62.5 − 31.25 = <b>31.25 m</b>.<br><b>(iii)</b> 25t − 5t^{2} = 30 gives t^{2} − 5t + 6 = 0, i.e. (t − 2)(t − 3) = 0. The ball first reaches 30 m after <b>2 seconds</b> (it passes 30 m again on the way down at 3 s).<br>(OR) 25t − 5t^{2} = 20 gives t^{2} − 5t + 4 = 0, i.e. (t − 1)(t − 4) = 0, so <b>t = 1 s and t = 4 s</b>.`,{fig:C3fig});

const C8fig=plot({alt:'Parabola with zeros at 1 and 5',w:270,h:210,x0:-1.5,x1:7.5,y0:-6,y1:9,curves:[{f:x=>x*x-6*x+5,a:-0.6,b:6.6}],dots:[[1,0],[5,0],[3,-4]],xt:[[3,'3']],yt:[[5,'5'],[-4,'−4']],lb:[[0.4,-1,'(1, 0)','end'],[5.6,-1,'(5, 0)','start'],[3,-5.2,'(3, −4)','middle']]});
cs(4,[],`A fountain shoots a jet of water into the air. The height h (in metres) of a drop of water t seconds after it leaves the nozzle is given by the polynomial h = 12t − 3t^{2}.`,[
  {l:'(i)',m:1,q:`Find the zeros of the polynomial h = 12t − 3t^{2}.`},
  {l:'(ii)',m:1,q:`Find the maximum height reached by the water.`},
  {l:'(iii)',m:2,q:`(a) At what two times is the height of the drop 9 m?`,or:`(b) Find the value of h at t = 5 and interpret the result.`}
],`<b>(i)</b> 12t − 3t^{2} = 3t(4 − t) = 0, so the zeros are <b>t = 0</b> and <b>t = 4</b>.<br><b>(ii)</b> The maximum is at the midpoint of the zeros, t = 2. h = 12 × 2 − 3 × 4 = <b>12 m</b>.<br><b>(iii)(a)</b> 12t − 3t^{2} = 9 gives t^{2} − 4t + 3 = 0, i.e. (t − 1)(t − 3) = 0. So <b>t = 1 s and t = 3 s</b>.<br>(OR) <b>(b)</b> h = 12 × 5 − 3 × 25 = 60 − 75 = <b>−15</b>. A negative height means the drop is below the nozzle level, so by t = 5 s it has already come back down to the ground (it landed at t = 4 s).`);
cs(5,[],`A small shop earns a profit (in hundreds of rupees) of P(x) = −x^{2} + 12x − 20 when it sells x units of a product in a day.`,[
  {l:'(i)',m:1,q:`Find the zeros of P(x).`},
  {l:'(ii)',m:1,q:`Verify the relationship between the zeros and the coefficients of P(x).`},
  {l:'(iii)',m:2,q:`(a) Find the number of units that gives the maximum profit, and the maximum profit.`,or:`(b) Find the profit when 8 units are sold.`}
],`<b>(i)</b> −x^{2} + 12x − 20 = −(x^{2} − 12x + 20) = −(x − 2)(x − 10). Zeros: <b>x = 2</b> and <b>x = 10</b> (the break-even points).<br><b>(ii)</b> Sum of zeros = 2 + 10 = 12 = −[[12|−1]] ✓. Product = 2 × 10 = 20 = [[−20|−1]] ✓.<br><b>(iii)(a)</b> The maximum is midway between the zeros, at x = 6. P(6) = −36 + 72 − 20 = 16. So <b>6 units</b> give the maximum profit of <b>₹ 1600</b>.<br>(OR) <b>(b)</b> P(8) = −64 + 96 − 20 = 12, so the profit is <b>₹ 1200</b>.`);
cs(6,[],`The entrance of a road tunnel has the shape of a parabola. If x metres is the horizontal distance from the centre line of the tunnel, the height of the tunnel (in metres) at that distance is given by p(x) = 16 − x^{2}.`,[
  {l:'(i)',m:1,q:`Find the zeros of p(x).`},
  {l:'(ii)',m:1,q:`What is the width of the tunnel at the road level?`},
  {l:'(iii)',m:2,q:`(a) Find the height of the tunnel at a distance of 3 m from the centre line.`,or:`(b) At what horizontal distance from the centre line is the height of the tunnel 12 m? What is the width of the tunnel at that height?`}
],`<b>(i)</b> 16 − x^{2} = (4 − x)(4 + x) = 0, so the zeros are <b>x = 4</b> and <b>x = −4</b>.<br><b>(ii)</b> The road level is where the height is 0, so the width is the distance between the zeros: 4 − (−4) = <b>8 m</b>.<br><b>(iii)(a)</b> p(3) = 16 − 9 = <b>7 m</b>.<br>(OR) <b>(b)</b> 16 − x^{2} = 12 gives x^{2} = 4, so <b>x = ±2 m</b>. The width at that height is 2 − (−2) = <b>4 m</b>.`);
cs(7,[],`The length and the breadth (in metres) of a rectangular park are the zeros of the polynomial x^{2} − 14x + 40.`,[
  {l:'(i)',m:1,q:`Find the perimeter of the park.`},
  {l:'(ii)',m:1,q:`Find the area of the park.`},
  {l:'(iii)',m:2,q:`(a) Find the length and the breadth of the park.`,or:`(b) If the length is increased by 2 m and the breadth is decreased by 1 m, find the quadratic polynomial whose zeros are the new length and breadth.`}
],`Let the zeros be l and b. Sum = l + b = 14 and product = lb = 40.<br><b>(i)</b> Perimeter = 2(l + b) = 2 × 14 = <b>28 m</b>.<br><b>(ii)</b> Area = lb = <b>40 m²</b>.<br><b>(iii)(a)</b> x^{2} − 14x + 40 = (x − 4)(x − 10), so the zeros are 10 and 4. Length = <b>10 m</b> and breadth = <b>4 m</b>.<br>(OR) <b>(b)</b> New length = 12 m and new breadth = 3 m. Sum = 15 and product = 36. Polynomial: <b>x^{2} − 15x + 36</b>.`);
cs(8,[],`The graph of a quadratic polynomial p(x) is shown. It cuts the x-axis at two points and its lowest point is (3, −4).`,[
  {l:'(i)',m:1,q:`How many zeros does the polynomial represented by the graph have?`},
  {l:'(ii)',m:1,q:`Write the zeros of the polynomial.`},
  {l:'(iii)',m:2,q:`(a) Find the quadratic polynomial represented by the graph (take the coefficient of x^{2} as 1).`,or:`(b) Find the minimum value of the polynomial and the value of x at which it occurs.`}
],`<b>(i)</b> The graph cuts the x-axis at 2 points, so there are <b>2 zeros</b>.<br><b>(ii)</b> The zeros are <b>1</b> and <b>5</b>.<br><b>(iii)(a)</b> Sum of zeros = 6 and product = 5, so p(x) = x^{2} − 6x + 5 = <b>x^{2} − 6x + 5</b>. (Check: p(3) = 9 − 18 + 5 = −4 ✓.)<br>(OR) <b>(b)</b> The lowest point of the graph is (3, −4), so the minimum value is <b>−4</b>, at <b>x = 3</b> (the midpoint of the zeros 1 and 5).`,{fig:C8fig});

la(7,[],`If α and β are the zeros of the polynomial 3x^{2} − 5x − 2, find the values of (i) α^{2} + β^{2}  (ii) α^{3} + β^{3}  (iii) [[1|α^{2}]] + [[1|β^{2}]]  (iv) (α − β)^{2}  (v) [[α|β]] + [[β|α]]`,`α + β = [[5|3]] and αβ = −[[2|3]].<br><b>(i)</b> α^{2} + β^{2} = [[25|9]] + [[4|3]] = <b>[[37|9]]</b>.<br><b>(ii)</b> α^{3} + β^{3} = (α + β)^{3} − 3αβ(α + β) = [[125|27]] + [[10|3]] = <b>[[215|27]]</b>.<br><b>(iii)</b> [[α^{2} + β^{2}|(αβ)^{2}]] = [[37/9|4/9]] = <b>[[37|4]]</b>.<br><b>(iv)</b> (α − β)^{2} = [[25|9]] + [[8|3]] = <b>[[49|9]]</b>.<br><b>(v)</b> [[α^{2} + β^{2}|αβ]] = [[37/9|−2/3]] = <b>−[[37|6]]</b>.<br>(Check: the zeros are 2 and −[[1|3]], and 4 + [[1|9]] = [[37|9]] ✓.)`);
la(8,[],`Find the zeros of the polynomial 2x^{2} − 7x + 3 and verify the relationship between the zeros and the coefficients. Hence find a quadratic polynomial whose zeros are the squares of the zeros of the given polynomial.`,`2x^{2} − 7x + 3 = 2x^{2} − 6x − x + 3 = 2x(x − 3) − 1(x − 3) = (x − 3)(2x − 1). Zeros: <b>3</b> and <b>[[1|2]]</b>.<br>Sum = 3 + [[1|2]] = [[7|2]] = −[[−7|2]] ✓. Product = 3 × [[1|2]] = [[3|2]] ✓.<br>New zeros: 9 and [[1|4]]. Sum = [[37|4]], product = [[9|4]].<br>Polynomial: x^{2} − [[37|4]]x + [[9|4]], or <b>4x^{2} − 37x + 9</b>.`);
la(9,[],`If α and β are the zeros of the polynomial x^{2} − px + q, find a quadratic polynomial whose zeros are [[α^{2}|β]] and [[β^{2}|α]].`,`α + β = p and αβ = q.<br>Sum of new zeros = [[α^{2}|β]] + [[β^{2}|α]] = [[α^{3} + β^{3}|αβ]] = [[(α + β)^{3} − 3αβ(α + β)|αβ]] = [[p^{3} − 3pq|q]].<br>Product = [[α^{2}|β]] × [[β^{2}|α]] = αβ = q.<br>Polynomial: x^{2} − [[p^{3} − 3pq|q]]x + q, or <b>qx^{2} − (p^{3} − 3pq)x + q^{2}</b>.<br>(Check with p = 5, q = 6: the zeros of x^{2} − 5x + 6 are 2 and 3, so the new zeros are [[4|3]] and [[9|2]], with sum [[35|6]] = [[125 − 90|6]] ✓.)`);
la(10,[],`If α and β are the zeros of the polynomial x^{2} − 8x + k such that α^{2} + β^{2} = 40, find the value of k and hence find the zeros of the polynomial.`,`α + β = 8 and αβ = k.<br>α^{2} + β^{2} = (α + β)^{2} − 2αβ = 64 − 2k = 40, so 2k = 24 and <b>k = 12</b>.<br>The polynomial is x^{2} − 8x + 12 = (x − 2)(x − 6), so the zeros are <b>2</b> and <b>6</b>.<br>(Check: 4 + 36 = 40 ✓.)`);
la(11,[],`If α and β are the zeros of the polynomial 2x^{2} − 5x + 3, find a quadratic polynomial whose zeros are [[α|β]] and [[β|α]]. Also verify your answer by finding the zeros of the given polynomial.`,`α + β = [[5|2]] and αβ = [[3|2]]. α^{2} + β^{2} = [[25|4]] − 3 = [[13|4]].<br>Sum of new zeros = [[α^{2} + β^{2}|αβ]] = [[13/4|3/2]] = [[13|6]]. Product = [[α|β]] × [[β|α]] = 1.<br>Polynomial: x^{2} − [[13|6]]x + 1, or <b>6x^{2} − 13x + 6</b>.<br><b>Verification:</b> 2x^{2} − 5x + 3 = (2x − 3)(x − 1), so the zeros are [[3|2]] and 1. Then [[α|β]] and [[β|α]] are [[3|2]] and [[2|3]], with sum [[9 + 4|6]] = [[13|6]] and product 1 ✓.`);
