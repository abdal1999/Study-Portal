vsa(23,[],`X is a point on the side BC of ΔABC. XM and XN are drawn parallel to AB and AC respectively meeting AB in N and AC in M. MN produced meets CB produced at T. Prove that TX² = TB × TC.`,`XN ∥ MC, so in ΔTMC: [[TN|TM]] = [[TX|TC]].<br>NB ∥ MX (NB lies along AB, and XM ∥ AB), so in ΔTMX: [[TN|TM]] = [[TB|TX]].<br>So [[TX|TC]] = [[TB|TX]], which gives TX^{2} = TB × TC. Hence proved.`,{fig:geo({p:{A:[40,100],B:[0,0],C:[100,0],X:[30,0],M:P2([100,0],[40,100],.7),N:P2([0,0],[40,100],.3),T:IX(P2([0,0],[40,100],.3),P2([100,0],[40,100],.7),[0,0],[100,0])},s:'AB BC CA XM XN TB TN NM'})});
vsa(24,[2024],`In the given figure, ABCD is a quadrilateral. Diagonal BD bisects ∠B & ∠D both. Prove that (i) ΔABD ~ ΔCBD (ii) AB = BC.`,`(i) In ΔABD and ΔCBD: ∠ABD = ∠CBD and ∠ADB = ∠CDB (BD bisects ∠B and ∠D). So ΔABD ~ ΔCBD (AA).<br>(ii) Also BD is common, so the ratio of similarity is [[BD|BD]] = 1, i.e. the triangles are congruent. Hence AB = BC (corresponding sides).`,{fig:geo({p:{A:[0,0],B:[100,0],C:[110,70],D:[15,60]},s:'AB BC CD DA BD',arc:[['B','A','D',1],['B','D','C',1],['D','A','B',2],['D','B','C',2]]})});
vsa(25,[2024],`Diagonals AC & BD of a trapezium ABCD intersect at O, where AB ∥ DC. If [[DO|BO]] = [[1|2]] then show that AB = 2CD.`,`In ΔAOB and ΔCOD: ∠OAB = ∠OCD and ∠OBA = ∠ODC (alternate angles). So ΔAOB ~ ΔCOD (AA).<br>[[AB|CD]] = [[BO|DO]] = 2, so AB = 2CD. Hence shown.`,{fig:trap()});
vsa(26,[2024],`In ΔABC, altitudes AD and BE are drawn. If AD = 7 cm, BE = 9 cm, EC = 12 cm then find the length of CD.`,`In ΔCDA and ΔCEB: ∠CDA = ∠CEB = 90° and ∠C is common, so ΔCDA ~ ΔCEB (AA).<br>[[CD|CE]] = [[AD|BE]]: [[CD|12]] = [[7|9]], so CD = [[84|9]] = <b>[[28|3]] cm</b>.`,{fig:geo({p:{B:[0,0],C:[100,0],A:[40,60],D:[40,0],E:FOOT([0,0],[40,60],[100,0])},s:'AB BC CA AD BE',ra:[['D','A','C'],['E','B','C']],t:{AD:'7 cm',BE:'9 cm',EC:'12 cm'}})});
vsa(27,[2024],`In the given figure, [[EA|EC]] = [[EB|ED]] prove ΔEAB ~ ΔECD.`,`In ΔEAB and ΔECD: ∠AEB = ∠CED (vertically opposite angles) and [[EA|EC]] = [[EB|ED]].<br>So ΔEAB ~ ΔECD (SAS similarity). Hence proved.`,{fig:geo({p:{A:[10,70],C:[90,10],B:[10,10],D:[90,70],E:[50,40]},s:'AC BD AB CD',arc:[['E','A','B',1],['E','C','D',1]]})});
vsa(28,[2025],`In the given figure, ΔABE ≅ ΔACD. Prove that ΔADE ~ ΔABC.`,`ΔABE ≅ ΔACD, so AB = AC and AE = AD (CPCT). So [[AD|AB]] = [[AE|AC]].<br>In ΔADE and ΔABC: ∠A is common and [[AD|AB]] = [[AE|AC]]. So ΔADE ~ ΔABC (SAS similarity).`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],D:P2([50,100],[0,0],.4),E:P2([50,100],[100,0],.4)},s:'AB BC CA DE BE CD'})});
vsa(29,[2024],`In the given figure, ΔAHK ~ ΔABC. If AK = 8 cm, BC = 3.2 cm, HK = 6.4 cm then find the length of AC.`,`ΔAHK ~ ΔABC with H ↔ B and K ↔ C. [[AK|AC]] = [[HK|BC]]: [[8|AC]] = [[6.4|3.2]] = 2.<br>AC = <b>4 cm</b>.`,{fig:geo({p:{C:[0,50],B:[0,10],A:[60,50],K:[150,50],H:[150,110]},s:'CK BH CB KH',ra:[['C','K','B'],['K','C','H']],t:{AK:'8 cm',BC:'3.2 cm',HK:'6.4 cm'}})});
vsa(30,[2025],`AD and PS are medians of triangles ABC and PQR respectively such that ΔABD ~ ΔPQS. Prove that ΔABC ~ ΔPQR.`,`ΔABD ~ ΔPQS, so ∠B = ∠Q and [[AB|PQ]] = [[BD|QS]].<br>D and S are mid-points of BC and QR, so BD = [[1|2]]BC and QS = [[1|2]]QR. Hence [[AB|PQ]] = [[BC|QR]].<br>In ΔABC and ΔPQR: ∠B = ∠Q and [[AB|PQ]] = [[BC|QR]]. So ΔABC ~ ΔPQR (SAS).`,{fig:duo(med(),med2())});
vsa(31,[2025],`AD and PS are angle bisectors of ∠A and ∠P of triangles ABC and PQR. If ΔABC ~ ΔPQR then prove that ΔACD ~ ΔPRS.`,`ΔABC ~ ΔPQR, so ∠A = ∠P and ∠C = ∠R.<br>AD and PS bisect these angles: ∠CAD = [[1|2]]∠A = [[1|2]]∠P = ∠RPS.<br>In ΔACD and ΔPRS: ∠CAD = ∠RPS and ∠C = ∠R. So ΔACD ~ ΔPRS (AA).`,{fig:duo(geo({p:{A:[40,75],B:[0,0],C:[100,0],D:P2([0,0],[100,0],.4)},s:'AB BC CA AD',arc:[['A','B','D',1],['A','D','C',1]]}),geo({p:{P:[48,90],Q:[0,0],R:[120,0],S:P2([0,0],[120,0],.4)},s:'PQ QR RP PS',arc:[['P','Q','S',1],['P','S','R',1]]}))});
vsa(32,[2025],`In ΔABC and ΔPQR, AD and PS are altitudes such that ΔABD ~ ΔPQS and ΔACD ~ ΔPRS. Prove that ΔABC ~ ΔPQR.`,`ΔABD ~ ΔPQS gives ∠B = ∠Q.<br>ΔACD ~ ΔPRS gives ∠C = ∠R.<br>In ΔABC and ΔPQR: ∠B = ∠Q and ∠C = ∠R. So ΔABC ~ ΔPQR (AA).`,{fig:duo(geo({p:{A:[30,75],B:[0,0],C:[100,0],D:[30,0]},s:'AB BC CA AD',ra:[['D','A','B']]}),geo({p:{P:[36,90],Q:[0,0],R:[120,0],S:[36,0]},s:'PQ QR RP PS',ra:[['S','P','Q']]}))});


/* ===== 3 marks ===== */
sa(1,[],`In the given figure, two triangles ABC and DBC lie on the same side of BC such that PQ ∥ BA and PR ∥ BD. Prove that QR ∥ AD.`,`In ΔCBA, PQ ∥ BA, so [[CP|PB]] = [[CQ|QA]] (BPT).<br>In ΔCBD, PR ∥ BD, so [[CP|PB]] = [[CR|RD]] (BPT).<br>So [[CQ|QA]] = [[CR|RD]]. By the converse of the Basic Proportionality Theorem in ΔCAD, QR ∥ AD. Hence proved.`,{fig:geo({p:{B:[0,0],C:[100,0],A:[10,75],D:[90,70],P:[80,0],Q:P2([100,0],[10,75],.2),R:P2([100,0],[90,70],.2)},s:'AB BC CD DA AC BD PQ PR QR',par:['PQ','BA']})});
sa(2,[],`In the given figure, if ∠ACB = ∠CDA, AC = 6 cm and AD = 3 cm then find the length of AB.`,`In ΔACB and ΔADC: ∠A is common and ∠ACB = ∠ADC (given). So ΔACB ~ ΔADC (AA).<br>[[AC|AD]] = [[AB|AC]], so AC^{2} = AD × AB: 36 = 3 × AB.<br>AB = <b>12 cm</b>.`,{fig:geo({p:{A:[0,0],B:[100,0],C:[30,50],D:[30,0]},s:'AB BC CA CD',arc:[['C','A','B',1],['D','C','A',1]],t:{AC:'6 cm',AD:'3 cm'}})});
sa(3,[],`In the given figure, BC ∥ PQ and BC = 8 cm, PQ = 4 cm, BA = 6.5 cm, AP = 2.8 cm. Find CA and AQ.`,`BC ∥ PQ, so ΔABC ~ ΔAQP (alternate angles and vertically opposite angles).<br>[[AB|AQ]] = [[BC|QP]] = [[AC|AP]] = [[8|4]] = 2.<br>AQ = [[6.5|2]] = <b>3.25 cm</b> and CA = 2 × 2.8 = <b>5.6 cm</b>.`,{fig:geo({p:{B:[0,40],A:[65,40],Q:[97.5,40],C:[40,-10],P:[77.5,65]},s:'BQ CP BC PQ',par:['BC','PQ'],t:{BA:'6.5 cm',AP:'2.8 cm',BC:'8 cm',PQ:'4 cm'}})});
sa(4,[],`Two right triangles ABC and DBC are drawn on the same hypotenuse BC and on the same side of BC. If AC and BD intersect at P, prove that AP × PC = BP × DP.`,`In ΔAPB and ΔDPC: ∠BAP = ∠CDP = 90° and ∠APB = ∠DPC (vertically opposite angles).<br>So ΔAPB ~ ΔDPC (AA). [[AP|DP]] = [[BP|CP]], so AP × PC = BP × DP. Hence proved.`,{fig:geo({p:{B:[0,0],C:[100,0],A:[32.9,47],D:[78.7,41],P:IX([32.9,47],[100,0],[0,0],[78.7,41])},s:'BC AB AC BD DC',ra:[['A','B','C'],['D','B','C']]})});
sa(5,[],`In the given figure, find the value of x in terms of a, b and c.`,`∠LMN = ∠PNK = 50°, so LM ∥ PN (corresponding angles).<br>ΔKNP ~ ΔKML (AA): [[NP|ML]] = [[KN|KM]], i.e. [[x|a]] = [[c|b + c]].<br><b>x = [[ac|b + c]]</b>.`,{fig:geo({p:{M:[0,0],N:[50,0],K:[100,0],L:[15,60],P:P2([100,0],[15,60],.5)},s:'MN NK KL LM NP',arc:[['M','L','N',1],['N','P','K',1]],t:{LM:'a',MN:'b',NK:'c',NP:'x'}})});
sa(6,[],`In the given figure, P and Q are the points on the sides AB and AC respectively of ΔABC such that AP = 3.5 cm, PB = 7 cm, AQ = 3 cm and QC = 6 cm. If PQ = 4.5 cm find BC.`,`[[AP|PB]] = [[3.5|7]] = [[1|2]] and [[AQ|QC]] = [[3|6]] = [[1|2]], so PQ ∥ BC (converse of BPT).<br>ΔAPQ ~ ΔABC with [[AP|AB]] = [[3.5|10.5]] = [[1|3]]. So [[PQ|BC]] = [[1|3]] and BC = 3 × 4.5 = <b>13.5 cm</b>.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],P:P2([50,100],[0,0],1/3),Q:P2([50,100],[100,0],1/3)},s:'AB BC CA PQ',par:['PQ','BC'],t:{AP:'3.5 cm',PB:'7 cm',AQ:'3 cm',QC:'6 cm',PQ:'4.5 cm'}})});
sa(7,[],`Two right triangles ABC and DBC are drawn on the same hypotenuse BC and on the same side of BC. If AC and BD intersect at P, prove that AP × PC = BP × DP.`,`In ΔAPB and ΔDPC: ∠BAP = ∠CDP = 90° and ∠APB = ∠DPC (vertically opposite angles).<br>So ΔAPB ~ ΔDPC (AA). [[AP|DP]] = [[BP|CP]], so AP × PC = BP × DP. Hence proved.`,{fig:geo({p:{B:[0,0],C:[100,0],A:[32.9,47],D:[78.7,41],P:IX([32.9,47],[100,0],[0,0],[78.7,41])},s:'BC AB AC BD DC',ra:[['A','B','C'],['D','B','C']]})});
sa(8,[2023],`In the given figure, AB = AC. E is a point on CB produced. If AD is perpendicular to BC and EF perpendicular to AC prove that ΔABD ~ ΔCEF.`,`AB = AC, so ∠ABC = ∠ACB (angles opposite equal sides).<br>In ΔABD and ΔCEF: ∠ADB = ∠EFC = 90°, and ∠ABD = ∠ACB = ∠ECF.<br>So ΔABD ~ ΔCEF (AA similarity). Hence proved.`,{fig:geo({p:{A:[60,100],B:[30,0],C:[90,0],D:[60,0],E:[0,0],F:FOOT([0,0],[60,100],[90,0])},s:'AB EB BD DC CA AD EF',ra:[['D','A','B'],['F','E','A']]})});
sa(9,[],`In the given figure, ΔABC ~ ΔDEF. AP bisects ∠CAB and DQ bisects ∠FDE. Prove that (i) [[AP|DQ]] = [[AB|DE]] (ii) ΔCAP ~ ΔFDQ.`,`ΔABC ~ ΔDEF, so ∠A = ∠D, ∠B = ∠E and ∠C = ∠F.<br>AP and DQ bisect ∠A and ∠D, so ∠BAP = ∠EDQ = [[1|2]]∠A.<br>(i) In ΔABP and ΔDEQ: ∠B = ∠E and ∠BAP = ∠EDQ, so ΔABP ~ ΔDEQ (AA). Hence [[AP|DQ]] = [[AB|DE]].<br>(ii) In ΔCAP and ΔFDQ: ∠C = ∠F and ∠CAP = ∠FDQ, so ΔCAP ~ ΔFDQ (AA).`,{fig:duo(geo({p:{C:[40,70],A:[0,0],B:[90,0],P:P2([40,70],[90,0],.5)},s:'AB BC CA AP',arc:[['A','C','P',1],['A','P','B',1]]}),geo({p:{F:[40,70],D:[0,0],E:[90,0],Q:P2([40,70],[90,0],.5)},s:'DE EF FD DQ',arc:[['D','F','Q',1],['D','Q','E',1]]}))});
sa(10,[],`In the given figure, DE ∥ AC and DF ∥ AE. Prove that [[BF|FE]] = [[BE|EC]].`,`(The printed question reads [[BE|FE]] = [[BE|EC]]; the standard statement is [[BF|FE]] = [[BE|EC]], which is proved here.)<br>In ΔBAE, DF ∥ AE, so [[BF|FE]] = [[BD|DA]] (BPT).<br>In ΔBAC, DE ∥ AC, so [[BE|EC]] = [[BD|DA]] (BPT).<br>Hence [[BF|FE]] = [[BE|EC]]. Proved.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],D:P2([0,0],[50,100],.4),E:P2([0,0],[100,0],.4),F:P2([0,0],[100,0],.16)},s:'AB BC CA DE DF AE'})});
sa(11,[],`In the given figure, DB ⊥ BC, DE ⊥ AB and AC ⊥ BC. Prove that [[BE|DE]] = [[AC|BC]].`,`DB ⊥ BC and AC ⊥ BC, so DB ∥ AC. Hence ∠DBE = ∠BAC (alternate angles).<br>In ΔDEB and ΔBCA: ∠DEB = ∠BCA = 90° and ∠DBE = ∠BAC. So ΔDEB ~ ΔBCA (AA).<br>[[BE|AC]] = [[DE|BC]], so [[BE|DE]] = [[AC|BC]]. Hence proved.`,{fig:geo({p:{B:[0,0],C:[100,0],A:[100,60],D:[0,35],E:FOOT([0,35],[0,0],[100,60])},s:'BC CA AB DB DE',ra:[['B','D','C'],['C','A','B'],['E','D','A']]})});
sa(12,[],`A 6 m high tree casts a 4 m long shadow. At the same time, a flag pole casts a shadow 50 m long. How long is the flag pole?`,`At the same time the sun’s rays make the same angle with the ground, so the two right triangles are similar (AA).<br>[[Height of the flag pole|6]] = [[50|4]], so the height = [[6 × 50|4]] = <b>75 m</b>.`,{fig:duo(geo({p:{A:[0,60],B:[0,0],C:[40,0]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'6 m',BC:'4 m'}}),geo({p:{P:[0,90],Q:[0,0],R:[120,0]},s:'PQ QR RP',ra:[['Q','P','R']],t:{PQ:'h',QR:'50 m'}}))});
sa(13,[2023],`In ΔABC, DE ∥ BC, find the value of x.`,`DE ∥ BC, so [[AD|DB]] = [[AE|EC]]: [[x|x − 2]] = [[x + 2|x − 1]].<br>x(x − 1) = (x − 2)(x + 2), so x^{2} − x = x^{2} − 4 and <b>x = 4</b>.`,{fig:bpt(.5,.5,{AD:'x',DB:'x−2',AE:'x+2',EC:'x−1'})});
sa(14,[],`A tower casts a shadow 24 m long at the same time as a 6 m pole casts a shadow 4 m long. Find the height of the tower.`,`The sun’s rays make the same angle, so the right triangles formed by the pole and the tower are similar (AA).<br>[[Height of the tower|6]] = [[24|4]], so the height = [[6 × 24|4]] = <b>36 m</b>.`,{fig:duo(geo({p:{A:[0,60],B:[0,0],C:[40,0]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'6 m',BC:'4 m'}}),geo({p:{P:[0,90],Q:[0,0],R:[120,0]},s:'PQ QR RP',ra:[['Q','P','R']],t:{PQ:'h',QR:'24 m'}}))});
sa(15,[],`In ΔABC, DE ∥ BC with AD = 3 cm, DB = 5 cm and AE = 4.5 cm. Find EC and AC.`,`DE ∥ BC, so [[AD|DB]] = [[AE|EC]]: [[3|5]] = [[4.5|EC]], so EC = <b>7.5 cm</b>.<br>AC = AE + EC = 4.5 + 7.5 = <b>12 cm</b>.`,{fig:bpt(3/8,3/8,{AD:'3 cm',DB:'5 cm',AE:'4.5 cm'})});

/* ===== 5 marks ===== */
la(1,[2023,2024],`Prove that if a line is drawn parallel to one side of a triangle intersecting the other two sides in distinct points, then the other two sides are divided in the same ratio. Using the above theorem prove that a line through the point of intersection of the diagonals and parallel to the base of the trapezium divides the non parallel sides in the same ratio.`,`<b>Theorem (BPT).</b> In ΔABC, DE ∥ BC with D on AB and E on AC. To prove [[AD|DB]] = [[AE|EC]].<br>Join BE and CD, and draw EF ⊥ AB and DG ⊥ AC.<br>ar(ΔADE) = [[1|2]] × AD × EF and ar(ΔBDE) = [[1|2]] × DB × EF, so [[ar(ADE)|ar(BDE)]] = [[AD|DB]]. … (1)<br>ar(ΔADE) = [[1|2]] × AE × DG and ar(ΔCDE) = [[1|2]] × EC × DG, so [[ar(ADE)|ar(CDE)]] = [[AE|EC]]. … (2)<br>ΔBDE and ΔCDE are on the same base DE and between the same parallels DE and BC, so ar(BDE) = ar(CDE). … (3)<br>From (1), (2) and (3): [[AD|DB]] = [[AE|EC]]. Hence proved.<br><b>Trapezium.</b> In trapezium ABCD (AB ∥ DC) the diagonals meet at O, and EF ∥ AB through O meets AD at E and BC at F.<br>In ΔADC, EO ∥ DC, so [[AE|ED]] = [[AO|OC]]. Since AB ∥ DC, ΔAOB ~ ΔCOD gives [[AO|OC]] = [[BO|OD]].<br>In ΔBCD, OF ∥ DC, so [[BF|FC]] = [[BO|OD]].<br>Therefore [[AE|ED]] = [[AO|OC]] = [[BO|OD]] = [[BF|FC]]. Hence EF divides the non-parallel sides in the same ratio.`,{fig:duo(bpt(.4,.4,{}),geo({p:{A:[0,0],B:[100,0],C:[75,50],D:[25,50],O:IX([0,0],[75,50],[100,0],[25,50]),E:IX([0,0],[25,50],[0,IX([0,0],[75,50],[100,0],[25,50])[1]],[100,IX([0,0],[75,50],[100,0],[25,50])[1]]),F:IX([100,0],[75,50],[0,IX([0,0],[75,50],[100,0],[25,50])[1]],[100,IX([0,0],[75,50],[100,0],[25,50])[1]])},s:'AB BC CD DA AC BD EF',par:['AB','EF','DC']}))});
la(2,[2025],`Prove that basic proportionality theorem. Hence, in the given figure, prove that [[AM|MB]] = [[AN|ND]] where LM ∥ CB and LN ∥ CD.`,`<b>BPT.</b> If a line is drawn parallel to one side of a triangle to intersect the other two sides in distinct points, it divides the two sides in the same ratio. (Proof: as in the standard area proof — join BE, CD for DE ∥ BC; ar(ADE)/ar(BDE) = AD/DB, ar(ADE)/ar(CDE) = AE/EC, and ar(BDE) = ar(CDE), so AD/DB = AE/EC.)<br><b>Application.</b> In ΔABC, LM ∥ CB, so [[AM|MB]] = [[AL|LC]]. … (1)<br>In ΔADC, LN ∥ CD, so [[AN|ND]] = [[AL|LC]]. … (2)<br>From (1) and (2): [[AM|MB]] = [[AN|ND]]. Hence proved.`,{fig:geo({p:{A:[0,30],C:[100,30],B:[70,70],D:[70,-10],L:[60,30],M:P2([0,30],[70,70],.6),N:P2([0,30],[70,-10],.6)},s:'AB BC CD DA AC LM LN'})});
la(3,[2025],`State Basic Proportionality theorem. Use it to prove the following: If three parallel lines l, m and n are intersected by transversals q and s as shown in the figure, then [[AB|BC]] = [[DE|EF]].`,`<b>BPT:</b> If a line is drawn parallel to one side of a triangle to intersect the other two sides at distinct points, then it divides the two sides in the same ratio.<br><b>Proof.</b> Join AF, meeting the line m at G.<br>In ΔACF, BG ∥ CF (m ∥ n), so [[AB|BC]] = [[AG|GF]]. … (1)<br>In ΔAFD, GE ∥ AD (m ∥ l), so [[AG|GF]] = [[DE|EF]]. … (2)<br>From (1) and (2): [[AB|BC]] = [[DE|EF]]. Hence proved.`,{fig:geo({p:{A:[20,60],B:[17,30],C:[10,0],D:[80,60],E:[77,30],F:[70,0],x:[-5,60],l:[110,60],y:[-5,30],m:[110,30],z:[-5,0],n:[110,0]},s:'AB BC DE EF xl ym zn',sl:'lmn',par:['xl','ym','zn']})});
la(4,[2025],`State basic proportionality theorem. Use the theorem to do the following: In ΔABC, AD is the angle bisector of angle A. BA is produced to E such that CE ∥ AD. Prove that [[BD|DC]] = [[BA|AC]].`,`<b>BPT:</b> A line parallel to one side of a triangle, meeting the other two sides at distinct points, divides them in the same ratio.<br><b>Proof.</b> ∠1 = ∠2 (AD bisects ∠A). ∠2 = ∠3 (alternate angles, CE ∥ AD, transversal AC). ∠1 = ∠4 (corresponding angles, CE ∥ AD, transversal BE).<br>So ∠3 = ∠4, hence AE = AC (sides opposite equal angles).<br>In ΔBCE, AD ∥ CE, so by BPT [[BD|DC]] = [[BA|AE]] = [[BA|AC]]. Hence proved.`,{fig:geo({p:{B:[0,0],C:[80,0],A:[30,50],D:P2([0,0],[80,0],.452),E:[66.3,110.5]},s:'BA AE BC CA AD CE',arc:[['A','B','D',1],['A','D','C',2],['C','A','E',2],['E','A','C',1]]})});
la(5,[2025],`State and prove the converse of basic proportionality theorem.`,`<b>Statement.</b> If a line divides two sides of a triangle in the same ratio, then the line is parallel to the third side.<br><b>Proof.</b> In ΔABC, let D on AB and E on AC be such that [[AD|DB]] = [[AE|EC]]. We show DE ∥ BC.<br>Suppose DE is not parallel to BC. Draw DE′ ∥ BC meeting AC at E′. By BPT, [[AD|DB]] = [[AE′|E′C]].<br>So [[AE|EC]] = [[AE′|E′C]]. Adding 1 to both sides: [[AC|EC]] = [[AC|E′C]], so EC = E′C.<br>Then E and E′ coincide, which contradicts our assumption. Hence DE ∥ BC.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],D:P2([50,100],[0,0],.4),E:P2([50,100],[100,0],.4)},s:'AB BC CA DE'})});
la(6,[2025],`State the converse of basic proportionality theorem. Also find [[BF|FC]] in the following figure, given that AB ∥ DC ∥ EF and [[AE|ED]] = [[2|3]]. Also, find the length of EF if AB = 10 cm and DC = 15 cm.`,`<b>Converse of BPT:</b> If a line divides two sides of a triangle in the same ratio, then it is parallel to the third side.<br>AB ∥ DC ∥ EF, so the parallel lines divide the transversals AD and BC in the same ratio: [[BF|FC]] = [[AE|ED]] = <b>[[2|3]]</b>.<br>Let EF meet AC at G. In ΔADC, EG ∥ DC: [[EG|DC]] = [[AE|AD]] = [[2|5]], so EG = [[2|5]] × 15 = 6 cm.<br>In ΔCAB, GF ∥ AB: [[GF|AB]] = [[CF|CB]] = [[3|5]], so GF = [[3|5]] × 10 = 6 cm.<br>EF = EG + GF = 6 + 6 = <b>12 cm</b>.`,{fig:geo({p:{A:[15,60],B:[75,60],D:[0,0],C:[100,0],E:P2([15,60],[0,0],.4),F:P2([75,60],[100,0],.4),G:IX(P2([15,60],[0,0],.4),P2([75,60],[100,0],.4),[15,60],[100,0])},s:'AB BC CD DA EF',d:'AC',par:['AB','EF','DC']})});
la(7,[],`In the given figure, DEFG is a square and ∠BAC = 90°. Show that FG² = BG × FC.`,`DEFG is a square, so DG ⊥ BC and EF ⊥ BC, and DG = EF = FG.<br>In ΔABC, ∠B + ∠C = 90°. In ΔBGD: ∠BDG = 90° − ∠B = ∠C.<br>In ΔBGD and ΔEFC: ∠BGD = ∠EFC = 90° and ∠BDG = ∠ECF. So ΔBGD ~ ΔEFC (AA).<br>[[BG|EF]] = [[GD|FC]]. Since GD = EF = FG: [[BG|FG]] = [[FG|FC]].<br>Hence FG^{2} = BG × FC.`,{fig:geo({p:{B:[0,0],C:[100,0],A:[50,50],G:[33.3,0],F:[66.7,0],D:[33.3,33.3],E:[66.7,33.3]},s:'BG GF FC AB AC DG EF DE',ra:[['A','B','C']]})});
la(8,[],`In the given figure, if ΔABC ~ ΔDEF and their sides of lengths (in cm) are marked along them, then find the lengths of sides of each triangle.`,`ΔABC ~ ΔDEF, so [[AB|DE]] = [[AC|DF]] = [[BC|EF]].<br>[[2x − 1|18]] = [[3x|6x]] = [[1|2]], so 2x − 1 = 9 and x = 5.<br>Check: [[2x + 2|3x + 9]] = [[12|24]] = [[1|2]] ✓.<br>ΔABC: AB = 9 cm, AC = 15 cm, BC = 12 cm. ΔDEF: DE = 18 cm, DF = 30 cm, EF = 24 cm.`,{fig:duo(geo({p:{A:[40,70],B:[0,0],C:[100,0]},s:'AB BC CA',t:{AB:'2x−1',AC:'3x',BC:'2x+2'}}),geo({p:{D:[40,70],E:[0,0],F:[100,0]},s:'DE EF FD',t:{DE:'18',DF:'6x',EF:'3x+9'}}))});
la(9,[],`In ΔABC, AD is a median and O is any point on AD. BO and CO on producing meet AC and AB at E and F respectively. Now AD is produced to X such that OD = DX as shown in figure. Prove that (i) EF ∥ BC (ii) AO : AX = AF : AB.`,`BD = DC and OD = DX, so the diagonals of BOCX bisect each other: BOCX is a parallelogram. So BX ∥ OC (i.e. BX ∥ FC) and CX ∥ OB (i.e. CX ∥ BE).<br>(i) In ΔABX, FO ∥ BX, so [[AF|FB]] = [[AO|OX]]. In ΔACX, EO ∥ CX, so [[AE|EC]] = [[AO|OX]].<br>So [[AF|FB]] = [[AE|EC]], and by the converse of BPT, EF ∥ BC.<br>(ii) From [[AF|FB]] = [[AO|OX]], adding 1: [[AB|FB]] = [[AX|OX]]. Also from [[AF|FB]] = [[AO|OX]] we get [[AF|AB]] = [[AO|AX]]. So AO : AX = AF : AB.`,{fig:geo({p:{A:[50,100],B:[0,20],C:[100,20],D:[50,20],O:[50,55],X:[50,-15],E:IX([0,20],[50,55],[50,100],[100,20]),F:IX([100,20],[50,55],[50,100],[0,20])},s:'AB BC CA AD DX BE CF BX CX EF'})});
la(10,[2023],`In the given figure, ∠BED = ∠BDE and E is the mid-point of BC. Prove that [[AF|CF]] = [[AD|BE]].`,`Draw CG ∥ AB meeting DF at G.<br>Since E is the mid-point of BC, BE = EC. In ΔBDE and ΔCGE: ∠BED = ∠CEG (vertically opposite), BE = CE, and ∠DBE = ∠GCE (alternate angles). So ΔBDE ≅ ΔCGE and BD = CG.<br>∠BED = ∠BDE gives BD = BE. So CG = BD = BE.<br>Now AB ∥ CG, so ΔAFD ~ ΔCFG: [[AF|CF]] = [[AD|CG]] = [[AD|BE]]. Hence proved.`,{fig:geo({p:{A:[80,100],B:[0,0],C:[100,0],D:[16,20],E:[50,0],F:IX([16,20],[50,0],[80,100],[100,0])},s:'AB BC CA DE EF CF',arc:[['E','B','D',1],['D','B','E',1]]})});
la(11,[2023,2024,2025],`PA, QB and RC are each perpendicular to AC. If AP = x, QB = z, RC = y, AB = a and BC = b then prove that [[1|x]] + [[1|y]] = [[1|z]].`,`In ΔCQB and ΔCPA: ∠CBQ = ∠CAP = 90° and ∠C is common, so ΔCQB ~ ΔCPA. [[QB|PA]] = [[BC|AC]], i.e. [[z|x]] = [[b|a + b]]. … (1)<br>In ΔAQB and ΔARC: ∠ABQ = ∠ACR = 90° and ∠A is common, so ΔAQB ~ ΔARC. [[QB|RC]] = [[AB|AC]], i.e. [[z|y]] = [[a|a + b]]. … (2)<br>Adding (1) and (2): [[z|x]] + [[z|y]] = [[a + b|a + b]] = 1.<br>So z([[1|x]] + [[1|y]]) = 1, i.e. [[1|x]] + [[1|y]] = [[1|z]]. Hence proved.`,{fig:geo({p:{A:[0,0],B:[55.4,0],C:[90,0],P:[0,80],R:[90,50],Q:IX([0,80],[90,0],[0,0],[90,50])},s:'AC PA BQ RC PC AR',ra:[['A','C','P'],['B','C','Q'],['C','A','R']],t:{AP:'x',BQ:'z',CR:'y',AB:'a',BC:'b'}})});
la(12,[],`In ΔABC, AD is the median to BC and in ΔPQR, PM is the median to QR. If [[AB|PQ]] = [[BC|QR]] = [[AD|PM]]. Prove that ΔABC ~ ΔPQR.`,`D and M are mid-points of BC and QR, so BD = [[1|2]]BC and QM = [[1|2]]QR. Hence [[BC|QR]] = [[BD|QM]].<br>So [[AB|PQ]] = [[BD|QM]] = [[AD|PM]], and ΔABD ~ ΔPQM (SSS). Therefore ∠B = ∠Q.<br>In ΔABC and ΔPQR: ∠B = ∠Q and [[AB|PQ]] = [[BC|QR]]. So ΔABC ~ ΔPQR (SAS). Hence proved.`,{fig:duo(med(),med2())});
la(13,[2023,2024],`Sides AB and AC and median AM of a triangle ABC are respectively proportional to sides DE and DF and median DN of another triangle DEF. Show that ΔABC ~ ΔDEF.`,`Given [[AB|DE]] = [[AC|DF]] = [[AM|DN]].<br>Produce AM to P so that AM = MP, and DN to Q so that DN = NQ. Join BP, CP, EQ and FQ.<br>The diagonals of ABPC bisect each other, so ABPC is a parallelogram: BP = AC and CP = AB. Similarly EQ = DF and FQ = DE.<br>[[AB|DE]] = [[BP|EQ]] = [[AP|DQ]] (since AP = 2AM, DQ = 2DN). So ΔABP ~ ΔDEQ (SSS) and ∠1 = ∠2.<br>Similarly [[AC|DF]] = [[CP|FQ]] = [[AP|DQ]], so ΔACP ~ ΔDFQ and ∠3 = ∠4.<br>Adding: ∠1 + ∠3 = ∠2 + ∠4, i.e. ∠A = ∠D.<br>In ΔABC and ΔDEF: [[AB|DE]] = [[AC|DF]] and ∠A = ∠D. So ΔABC ~ ΔDEF (SAS).`,{fig:duo(geo({p:{A:[50,80],B:[0,0],C:[100,0],M:[50,0]},s:'AB BC CA AM'}),geo({p:{D:[50,80],E:[0,0],F:[100,0],N:[50,0]},s:'DE EF FD DN'}))});
la(14,[2025],`Sides AB and BC and median AD of triangle ABC are respectively proportional to sides PQ and QR and median PM of triangle PQR. Show that ΔABC ~ ΔPQR.`,`(The printed conclusion reads ΔABC ~ ΔDEF; the triangles in the question are ΔABC and ΔPQR, so ΔABC ~ ΔPQR is proved.)<br>Given [[AB|PQ]] = [[BC|QR]] = [[AD|PM]]. D and M are mid-points of BC and QR, so [[BD|QM]] = [[BC|QR]].<br>So [[AB|PQ]] = [[BD|QM]] = [[AD|PM]], and ΔABD ~ ΔPQM (SSS), giving ∠B = ∠Q.<br>In ΔABC and ΔPQR: ∠B = ∠Q and [[AB|PQ]] = [[BC|QR]]. So ΔABC ~ ΔPQR (SAS). Hence proved.`,{fig:duo(med(),med2())});
la(15,[],`Find the length of the second diagonal of a rhombus, whose side is 5 cm and one of the diagonal is 6 cm.`,`The diagonals of a rhombus bisect each other at right angles. Let AC = 6 cm, so AO = 3 cm.<br>In right ΔAOB: BO^{2} = AB^{2} − AO^{2} = 25 − 9 = 16, so BO = 4 cm.<br>The second diagonal BD = 2 × BO = <b>8 cm</b>.`,{fig:geo({p:{A:[0,40],B:[60,100],C:[120,40],D:[60,-20],O:[60,40]},s:'AB BC CD DA AC BD',ra:[['O','A','B']],t:{AB:'5 cm',AO:'3 cm'}})});
la(16,[2024],`In the given figure, ∠1 = ∠2 and ΔNSQ ~ ΔMTR then prove that ΔPTS ~ ΔPRQ.`,`(The printed conclusion reads ΔPTS ~ ΔPRO; it is read as ΔPTS ~ ΔPRQ, the standard form of this question.)<br>∠1 = ∠2 gives PS = PT (sides opposite equal angles in ΔPST).<br>ΔNSQ ~ ΔMTR gives ∠SQN = ∠TRM, i.e. ∠PQR = ∠PRQ, so PQ = PR.<br>Then [[PS|PQ]] = [[PT|PR]], so ST ∥ QR (converse of BPT) and ∠PST = ∠PQR.<br>In ΔPTS and ΔPRQ: ∠P is common and ∠PST = ∠PQR. So ΔPTS ~ ΔPRQ (AA).`,{fig:geo({p:{P:[50,100],M:[0,0],Q:[30,0],R:[70,0],N:[100,0],S:P2([50,100],[30,0],.4),T:P2([50,100],[70,0],.4),O:IX([0,0],P2([50,100],[70,0],.4),P2([50,100],[30,0],.4),[100,0])},s:'PQ PR MN MT SN ST',arc:[['S','P','T',1],['T','P','S',1]]})});
la(17,[2023],`ABCD is a parallelogram, P is a point on side BC and DP when produced meets AB produced at L. Prove that (i) [[DP|PL]] = [[DC|BL]] (ii) [[DL|DP]] = [[AL|DC]] (iii) If LP : PD = 2 : 3 then find BP : BC.`,`(i) In ΔDPC and ΔLPB: ∠DPC = ∠LPB (vertically opposite) and ∠PDC = ∠PLB (alternate angles, DC ∥ BL). So ΔDPC ~ ΔLPB (AA).<br>[[DP|LP]] = [[DC|LB]] = [[PC|PB]]. … (1) Hence [[DP|PL]] = [[DC|BL]].<br>(ii) From (1), [[PL|DP]] = [[BL|DC]]. Adding 1: [[PL + DP|DP]] = [[BL + DC|DC]], i.e. [[DL|DP]] = [[BL + AB|DC]] (as DC = AB) = [[AL|DC]].<br>(iii) LP : PD = 2 : 3, so [[DP|PL]] = [[3|2]]. From (1), [[PC|PB]] = [[3|2]], i.e. BP : PC = 2 : 3.<br>BP : BC = 2 : (2 + 3) = <b>2 : 5</b>.`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],P:P2([80,0],[100,50],.4),L:IX([20,50],P2([80,0],[100,50],.4),[0,0],[80,0])},s:'AB BC CD DA DP PL BL'})});
la(18,[2025],`The diagonal BD of a parallelogram ABCD intersects the line segment AE at the point F, where E is any point on the side BC. Prove that DF × EF = FB × FA.`,`AD ∥ BE (AD ∥ BC). In ΔFAD and ΔFEB: ∠FAD = ∠FEB (alternate angles) and ∠FDA = ∠FBE (alternate angles).<br>So ΔFAD ~ ΔFEB (AA). [[FA|FE]] = [[FD|FB]], so FD × FE = FB × FA. Hence proved.`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],E:P2([80,0],[100,50],.5),F:IX([80,0],[20,50],[0,0],P2([80,0],[100,50],.5))},s:'AB BC CD DA BD AE'})});
la(19,[2023],`D is a point on the side BC of a triangle ABC such that ∠ADC = ∠BAC then prove that CA² = CB.CD.`,`In ΔCAD and ΔCBA: ∠C is common and ∠ADC = ∠BAC (given). So ΔCAD ~ ΔCBA (AA).<br>[[CA|CB]] = [[CD|CA]], so CA^{2} = CB × CD. Hence proved.`,{fig:geo({p:{A:[20,80],B:[0,0],C:[100,0],D:[35,0]},s:'AB BC CA AD',arc:[['A','B','C',1],['D','A','C',1]]})});
la(20,[2023,2024],`Through the mid-point M of the side CD of a parallelogram ABCD, the line BM is drawn intersecting AC in L and AD (produced) in E. Prove that EL = 2 BL.`,`In ΔDME and ΔCMB: DM = CM (M is the mid-point), ∠DME = ∠CMB (vertically opposite) and ∠MDE = ∠MCB (alternate angles, AE ∥ BC). So ΔDME ≅ ΔCMB, and DE = CB.<br>AD = BC (parallelogram), so AE = AD + DE = 2BC.<br>AE ∥ BC, so ΔAEL ~ ΔCBL (AA): [[EL|BL]] = [[AE|CB]] = [[2BC|BC]] = 2.<br>Hence EL = 2BL.`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],M:[60,50],E:[40,100],L:IX([0,0],[100,50],[80,0],[60,50])},s:'AB BC CD DA AC BM ME DE'})});
la(21,[2023],`If AD and PM are medians of triangles ABC and PQR respectively, where ΔABC ~ ΔPQR then prove that [[AB|PQ]] = [[AD|PM]].`,`ΔABC ~ ΔPQR, so ∠B = ∠Q and [[AB|PQ]] = [[BC|QR]].<br>D and M are mid-points of BC and QR, so [[BC|QR]] = [[2BD|2QM]] = [[BD|QM]]. So [[AB|PQ]] = [[BD|QM]].<br>In ΔABD and ΔPQM: ∠B = ∠Q and [[AB|PQ]] = [[BD|QM]]. So ΔABD ~ ΔPQM (SAS).<br>Therefore [[AB|PQ]] = [[AD|PM]]. Hence proved.`,{fig:duo(med(),med2())});
la(22,[2023],`In the given figure, ∠ADC = ∠BCA prove that ΔACB ~ ΔADC. Hence find BD if AC = 8 cm and AD = 3 cm.`,`In ΔACB and ΔADC: ∠A is common and ∠ACB = ∠ADC (given). So ΔACB ~ ΔADC (AA).<br>[[AC|AD]] = [[AB|AC]], so AC^{2} = AD × AB: 64 = 3 × AB, AB = [[64|3]] cm.<br>BD = AB − AD = [[64|3]] − 3 = <b>[[55|3]] cm</b>.`,{fig:geo({p:{A:[0,0],B:[100,0],C:[30,60],D:[30,0]},s:'AB BC CA CD',arc:[['D','A','C',1],['C','B','A',1]],t:{AC:'8 cm',AD:'3 cm'}})});
la(23,[2023],`In the given figure, ΔABC and ΔDBC are on the same base BC. If AD intersects BC at O prove that [[ar(ΔABC)|ar(ΔDBC)]] = [[AO|DO]].`,`Draw AM ⊥ BC and DN ⊥ BC.<br>ar(ΔABC) = [[1|2]] × BC × AM and ar(ΔDBC) = [[1|2]] × BC × DN, so [[ar(ABC)|ar(DBC)]] = [[AM|DN]].<br>In ΔAMO and ΔDNO: ∠AMO = ∠DNO = 90° and ∠AOM = ∠DON (vertically opposite). So ΔAMO ~ ΔDNO (AA), giving [[AM|DN]] = [[AO|DO]].<br>Hence [[ar(ΔABC)|ar(ΔDBC)]] = [[AO|DO]].`,{fig:geo({p:{B:[0,40],C:[100,40],A:[55,100],D:[45,-20],O:IX([55,100],[45,-20],[0,40],[100,40])},s:'AB BC CA DB DC AD'})});
la(24,[2023],`In the given figure, CD is the perpendicular bisector of AB. EF is perpendicular to CD. AE intersects CD at G. Prove that [[CF|CD]] = [[FG|DG]].`,`CD ⊥ AB and EF ⊥ CD, so EF ∥ AB. D is the mid-point of AB, so AD = DB.<br>In ΔCFE and ΔCDB: ∠CFE = ∠CDB = 90° and ∠C is common, so ΔCFE ~ ΔCDB: [[CF|CD]] = [[EF|DB]].<br>In ΔGFE and ΔGDA: ∠GFE = ∠GDA = 90° and ∠FGE = ∠DGA (vertically opposite), so ΔGFE ~ ΔGDA: [[FG|DG]] = [[EF|AD]].<br>Since AD = DB, [[EF|DB]] = [[EF|AD]]. Hence [[CF|CD]] = [[FG|DG]].`,{fig:geo({p:{C:[0,40],D:[100,40],B:[100,80],A:[100,0],E:P2([0,40],[100,80],.7),F:[P2([0,40],[100,80],.7)[0],40],G:IX([100,0],P2([0,40],[100,80],.7),[0,40],[100,40])},s:'CD BA CB AE EF',ra:[['D','C','B'],['F','C','E']]})});
la(25,[2023,2024,2025],`In a ΔPQR, N is a point on PR such that QN ⊥ PR. If PN × NR = QN² then prove that ∠PQR = 90°.`,`PN × NR = QN^{2} gives [[PN|QN]] = [[QN|NR]].<br>In ΔPNQ and ΔQNR: ∠PNQ = ∠QNR = 90° and [[PN|QN]] = [[QN|NR]]. So ΔPNQ ~ ΔQNR (SAS), with ∠NPQ = ∠NQR.<br>In right ΔPNQ: ∠NPQ + ∠PQN = 90°. So ∠NQR + ∠PQN = 90°.<br>That is ∠PQR = <b>90°</b>. Hence proved.`,{fig:geo({p:{P:[0,0],R:[100,0],Q:[30,45],N:[30,0]},s:'PR RQ QP QN',ra:[['N','P','Q']]})});
la(26,[2023],`In the given figure, CD and RS are respectively the medians of ΔABC & ΔPQR. If ΔABC ~ ΔPQR then prove that (i) ΔADC ~ ΔPSR (ii) AD × PR = AC × PS.`,`(i) ΔABC ~ ΔPQR, so ∠A = ∠P and [[AB|PQ]] = [[AC|PR]].<br>CD and RS are medians, so AD = [[1|2]]AB and PS = [[1|2]]PQ. So [[AD|PS]] = [[AB|PQ]] = [[AC|PR]].<br>In ΔADC and ΔPSR: ∠A = ∠P and [[AD|PS]] = [[AC|PR]]. So ΔADC ~ ΔPSR (SAS).<br>(ii) From [[AD|PS]] = [[AC|PR]]: AD × PR = AC × PS. Hence proved.`,{fig:duo(geo({p:{A:[0,0],B:[100,0],C:[30,60],D:[50,0]},s:'AB BC CA CD'}),geo({p:{P:[0,0],Q:[80,0],R:[24,48],S:[40,0]},s:'PQ QR RP RS'}))});
la(27,[2024],`E is a point on the side AD produced of a parallelogram ABCD and BE intersects CD at F. Show that ΔABE ~ ΔCFB.`,`In a parallelogram ∠A = ∠C (opposite angles).<br>AE ∥ BC with transversal BE, so ∠AEB = ∠CBF (alternate angles).<br>In ΔABE and ΔCFB: ∠A = ∠C and ∠AEB = ∠CBF. So ΔABE ~ ΔCFB (AA). Hence shown.`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],E:[30,75],F:IX([80,0],[30,75],[20,50],[100,50])},s:'AB BC CD DA DE BE'})});
la(28,[2025],`The corresponding sides of ΔABC and ΔPQR are in the ratio 3 : 5. AD ⊥ BC and PS ⊥ QR as shown in the following figures: (i) Prove that ΔADC ~ ΔPSR. (ii) If AD = 4 cm, find the length of PS. (iii) Using (ii) find area(ΔABC) : area(ΔPQR).`,`(i) ΔABC ~ ΔPQR, so ∠C = ∠R. In ΔADC and ΔPSR: ∠ADC = ∠PSR = 90° and ∠C = ∠R. So ΔADC ~ ΔPSR (AA).<br>(ii) [[AD|PS]] = [[AC|PR]] = [[3|5]]. [[4|PS]] = [[3|5]], so PS = <b>[[20|3]] cm</b>.<br>(iii) area(ΔABC) : area(ΔPQR) = (3 : 5)^{2} = <b>9 : 25</b>. (Using the altitudes, [[ar(ABC)|ar(PQR)]] = [[BC × AD|QR × PS]] = [[3 × 3|5 × 5]] = [[9|25]].)`,{fig:duo(geo({p:{B:[0,0],C:[100,0],A:[25,70],D:[25,0]},s:'AB BC CA AD',ra:[['D','A','B']]}),geo({p:{Q:[0,0],R:[100,0],P:[25,70],S:[25,0]},s:'PQ QR RP PS',ra:[['S','P','Q']]}))});
la(29,[2025],`In the given figure, ΔCAB is a right triangle, right angled at A and AD ⊥ BC. Prove that ΔADB ~ ΔCDA. Further, if BC = 10 cm and CD = 2 cm, find the length of AD.`,`In ΔADB and ΔCDA: ∠ADB = ∠CDA = 90°. ∠BAD = 90° − ∠DAC = ∠ACD (in ΔCDA, ∠ACD + ∠DAC = 90°). So ΔADB ~ ΔCDA (AA).<br>[[AD|CD]] = [[DB|DA]], so AD^{2} = BD × CD. BD = BC − CD = 10 − 2 = 8.<br>AD^{2} = 8 × 2 = 16, so AD = <b>4 cm</b>.`,{fig:geo({p:{A:[0,0],B:[100,0],C:[0,50],D:FOOT([0,0],[0,50],[100,0])},s:'AB BC CA AD',ra:[['A','C','B'],['D','A','B']],t:{BC:'10 cm',CD:'2 cm'}})});


/* ===== Chapter 6: extra assertion-reason (practice) ===== */
ar(40,[],`In ΔABC, if DE ∥ BC with D on AB and E on AC, then [[AD|DB]] = [[AE|EC]].`,`If a line is drawn parallel to one side of a triangle intersecting the other two sides, it divides them in the same ratio.`,0,`A is the statement of the Basic Proportionality Theorem for DE ∥ BC, and R is the theorem itself. So A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(41,[],`If ΔABC ~ ΔDEF and AB = 2DE, then the perimeter of ΔABC is twice the perimeter of ΔDEF.`,`The ratio of the perimeters of two similar triangles is equal to the ratio of their corresponding sides.`,0,`[[Perimeter of ΔABC|Perimeter of ΔDEF]] = [[AB|DE]] = 2, so A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);
ar(42,[],`All congruent triangles are similar.`,`Similar triangles have equal corresponding angles and proportional corresponding sides.`,0,`Congruent triangles have equal angles and equal sides (ratio 1), so they satisfy the definition in R. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(43,[],`A square and a rhombus are always similar.`,`Two polygons are similar if their corresponding angles are equal and their corresponding sides are proportional.`,3,`A rhombus can have angles different from 90°, so it is not always similar to a square. A is false. R is the correct definition, so R is true.<br><span class="ans">Answer: (d)</span>`);
ar(44,[],`The ratio of the areas of two similar triangles whose sides are in the ratio 2 : 3 is 4 : 9.`,`The ratio of the areas of two similar triangles is equal to the square of the ratio of their corresponding sides.`,0,`(2 : 3)^{2} = 4 : 9, so A is true and R is the rule used.<br><span class="ans">Answer: (a)</span>`);
ar(45,[],`A triangle with sides 5 cm, 12 cm and 13 cm is a right-angled triangle.`,`If the square of one side of a triangle is equal to the sum of the squares of the other two sides, then the angle opposite the first side is a right angle.`,0,`5^{2} + 12^{2} = 25 + 144 = 169 = 13^{2}, so by the converse of Pythagoras the triangle is right-angled. A is true and R is that converse.<br><span class="ans">Answer: (a)</span>`);
ar(46,[],`In ΔABC, if DE ∥ BC then ΔADE ~ ΔABC.`,`If two angles of one triangle are equal to two angles of another triangle, the triangles are similar (AA).`,0,`DE ∥ BC gives ∠ADE = ∠ABC (corresponding angles), and ∠A is common. So by AA, ΔADE ~ ΔABC. A is true and R is the criterion used.<br><span class="ans">Answer: (a)</span>`);
ar(47,[],`Any two equilateral triangles are similar.`,`Every angle of an equilateral triangle is 60°.`,0,`All angles of both triangles are 60°, so they are similar by AA. A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(48,[],`Any two circles are similar.`,`All circles have the same shape.`,0,`Two circles differ only in size (radius), and scaling one gives the other, so they are similar. A is true and R is the reason.<br><span class="ans">Answer: (a)</span>`);
ar(49,[],`Any two isosceles triangles are similar.`,`An isosceles triangle has two equal angles.`,3,`Two isosceles triangles can have different angles (for example 40°, 70°, 70° and 80°, 50°, 50°), so they are not always similar. A is false. R is a true statement.<br><span class="ans">Answer: (d)</span>`);
ar(50,[],`The ratio of the perimeters of two similar triangles is equal to the ratio of their corresponding altitudes.`,`In similar triangles, the corresponding sides, altitudes and medians are all in the same ratio.`,0,`The perimeters are in the ratio of the corresponding sides, which equals the ratio of the corresponding altitudes (by R). So A is true and R explains it.<br><span class="ans">Answer: (a)</span>`);
ar(51,[],`A triangle with sides 7 cm, 24 cm and 25 cm has a right angle opposite the side of 25 cm.`,`In a right-angled triangle, the hypotenuse is the longest side.`,1,`7^{2} + 24^{2} = 49 + 576 = 625 = 25^{2}, so the right angle is opposite the 25 cm side, and A is true. R is also true, but it does not prove that this particular triangle is right-angled (that needs the converse of Pythagoras).<br><span class="ans">Answer: (b)</span>`);

/* ===== Chapter 6: case-based (practice) ===== */
cs(1,[],`Anaya, who is 1.5 m tall, stands in sunlight and her shadow is 2 m long. At the same time, the shadow of a tree is 12 m long.`,[
  {l:'(i)',m:1,q:`Which similarity criterion shows that the triangle formed by Anaya and her shadow is similar to the triangle formed by the tree and its shadow?`},
  {l:'(ii)',m:1,q:`Find the height of the tree.`},
  {l:'(iii)',m:2,q:`(a) At the same time, find the length of the shadow of a 2.4 m tall pole.`,or:`(b) At the same time, a building casts a 20 m shadow. Find the height of the building.`}
],`<b>(i)</b> The sun’s rays make the same angle with the ground, and both the girl and the tree stand at 90° to the ground. So two angles are equal: the <b>AA criterion</b>.<br><b>(ii)</b> [[Height of the tree|1.5]] = [[12|2]], so the height = 1.5 × 6 = <b>9 m</b>.<br><b>(iii)(a)</b> [[2.4|1.5]] = [[shadow|2]], so the shadow = [[2.4 × 2|1.5]] = <b>3.2 m</b>.<br>(OR) <b>(b)</b> [[Height|1.5]] = [[20|2]], so the height = 1.5 × 10 = <b>15 m</b>.`,{fig:duo(geo({p:{A:[0,15],B:[0,0],C:[20,0]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'1.5 m',BC:'2 m'}}),geo({p:{P:[0,90],Q:[0,0],R:[120,0]},s:'PQ QR RP',ra:[['Q','P','R']],t:{PQ:'h',QR:'12 m'}}))});
cs(2,[],`A 13 m long ladder rests against a vertical wall. Its top reaches a point 12 m above the ground, and its foot is x metres from the base of the wall.`,[
  {l:'(i)',m:1,q:`Which theorem is used to find x?`},
  {l:'(ii)',m:1,q:`Find the distance x of the foot of the ladder from the wall.`},
  {l:'(iii)',m:2,q:`(a) If the foot of the ladder is pulled 7 m away from the wall (so that it is 12 m from the wall), how high does the top reach on the wall? (The ladder is still 13 m long.)`,or:`(b) Find the area of the triangle formed by the ladder, the wall and the ground.`}
],`<b>(i)</b> Pythagoras theorem (the wall is vertical, so the triangle is right-angled).<br><b>(ii)</b> x^{2} = 13^{2} − 12^{2} = 169 − 144 = 25, so <b>x = 5 m</b>.<br><b>(iii)(a)</b> Height^{2} = 13^{2} − 12^{2} = 25, so the height = <b>5 m</b>. (With the foot 12 m from the wall, the top reaches only 5 m.)<br>(OR) <b>(b)</b> Area = [[1|2]] × 5 × 12 = <b>30 m²</b>.`,{fig:geo({p:{A:[0,120],B:[0,0],C:[50,0]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'12 m',AC:'13 m',BC:'x'}})});
cs(3,[],`A 1.5 m tall boy stands 6 m from the foot of a 4.5 m high street lamp. The lamp casts the boy’s shadow on the ground, and the shadow has length s metres.`,[
  {l:'(i)',m:1,q:`Which pair of triangles in the figure are similar?`},
  {l:'(ii)',m:1,q:`Find the length of the boy’s shadow.`},
  {l:'(iii)',m:2,q:`(a) How far is the tip of the shadow from the foot of the lamp post?`,or:`(b) If the boy moves to a position 12 m from the lamp post, what is the new length of his shadow?`}
],`<b>(i)</b> ΔLBS and ΔNMS are similar (both are right-angled and share the angle at S), by AA.<br><b>(ii)</b> [[MN|BL]] = [[MS|BS]]: [[1.5|4.5]] = [[s|s + 6]], so 4.5s = 1.5s + 9 and <b>s = 3 m</b>.<br><b>(iii)(a)</b> Distance = 6 + 3 = <b>9 m</b>.<br>(OR) <b>(b)</b> [[1.5|4.5]] = [[s|s + 12]], so 3s = 18 and the new shadow is <b>6 m</b> long.`,{fig:geo({p:{L:[0,45],B:[0,0],M:[60,0],N:[60,15],S:[90,0]},s:'LB BS LS MN',ra:[['B','L','S'],['M','N','S']],t:{LB:'4.5 m',MN:'1.5 m',BM:'6 m',MS:'s'}})});
cs(4,[],`Two vertical poles of heights 8 m and 14 m stand on level ground 8 m apart.`,[
  {l:'(i)',m:1,q:`What is the difference in the heights of the poles?`},
  {l:'(ii)',m:1,q:`Find the distance between the tops of the two poles.`},
  {l:'(iii)',m:2,q:`(a) A bird flies in a straight line from the top of the shorter pole to the top of the taller pole. How far does it fly?`,or:`(b) A bird flies in a straight line from the top of the shorter pole to the foot of the taller pole. How far does it fly?`}
],`<b>(i)</b> 14 − 8 = <b>6 m</b>.<br><b>(ii)</b> The tops and the horizontal gap form a right triangle with legs 6 m and 8 m: distance = √{6^{2} + 8^{2}} = √{100} = <b>10 m</b>.<br><b>(iii)(a)</b> The same distance: <b>10 m</b>.<br>(OR) <b>(b)</b> The legs are 8 m (height of the shorter pole) and 8 m (gap): distance = √{64 + 64} = <b>8√{2} m</b>.`,{fig:geo({p:{P:[0,0],Q:[80,0],R:[0,80],T:[80,140]},s:'PQ PR QT RT',ra:[['P','R','Q'],['Q','P','T']],t:{PR:'8 m',QT:'14 m',PQ:'8 m'}})});
cs(5,[],`A park is in the shape of a rhombus ABCD. Its diagonals AC and BD are 16 m and 12 m long and intersect at O.`,[
  {l:'(i)',m:1,q:`What is the angle between the diagonals at O?`},
  {l:'(ii)',m:1,q:`Find the side of the park.`},
  {l:'(iii)',m:2,q:`(a) Find the perimeter of the park.`,or:`(b) Find the area of the park.`}
],`<b>(i)</b> The diagonals of a rhombus bisect each other at right angles, so the angle is <b>90°</b>.<br><b>(ii)</b> AO = 8 m and BO = 6 m. In right ΔAOB: AB = √{8^{2} + 6^{2}} = √{100} = <b>10 m</b>.<br><b>(iii)(a)</b> Perimeter = 4 × 10 = <b>40 m</b>.<br>(OR) <b>(b)</b> Area = [[1|2]] × 16 × 12 = <b>96 m²</b>.`,{fig:geo({p:{A:[-8,0],B:[0,6],C:[8,0],D:[0,-6],O:[0,0]},s:'AB BC CD DA AC BD',ra:[['O','A','B']],t:{AO:'8 m',BO:'6 m'}})});
cs(6,[],`A plot ABCD is a trapezium with AB ∥ DC. Its diagonals meet at O, with AO = 6 m, OC = 4 m and BO = 9 m.`,[
  {l:'(i)',m:1,q:`Name the pair of similar triangles formed by the diagonals.`},
  {l:'(ii)',m:1,q:`Find the length OD.`},
  {l:'(iii)',m:2,q:`(a) Find the ratio AB : CD.`,or:`(b) If CD = 8 m, find AB.`}
],`<b>(i)</b> ΔAOB ~ ΔCOD (AB ∥ DC, so the alternate angles are equal).<br><b>(ii)</b> [[AO|CO]] = [[BO|DO]]: [[6|4]] = [[9|OD]], so <b>OD = 6 m</b>.<br><b>(iii)(a)</b> [[AB|CD]] = [[AO|CO]] = [[6|4]], so AB : CD = <b>3 : 2</b>.<br>(OR) <b>(b)</b> AB = [[3|2]] × 8 = <b>12 m</b>.`,{fig:trap({t:{AO:'6 m',OC:'4 m',OB:'9 m'}})});
cs(7,[],`A triangular park ABC has AB = 60 m, BC = 80 m and CA = 100 m. A map of the park is drawn as ΔPQR with PQ = 3 cm, where ΔPQR is similar to ΔABC (P ↔ A, Q ↔ B, R ↔ C).`,[
  {l:'(i)',m:1,q:`What is the scale of the map (as PQ : AB)?`},
  {l:'(ii)',m:1,q:`Find the length QR on the map.`},
  {l:'(iii)',m:2,q:`(a) Find the length PR on the map.`,or:`(b) Find the ratio of the area of ΔPQR to the area of ΔABC.`}
],`<b>(i)</b> PQ : AB = 3 cm : 60 m = 3 cm : 6000 cm = <b>1 : 2000</b>.<br><b>(ii)</b> QR = 80 m ÷ 2000 = 80 × 100 cm ÷ 2000 = <b>4 cm</b>.<br><b>(iii)(a)</b> PR = 100 × 100 ÷ 2000 = <b>5 cm</b>.<br>(OR) <b>(b)</b> The ratio of areas = (1 : 2000)^{2} = <b>1 : 4000000</b>. (Check: ΔPQR has legs 3 and 4, so its area is 6 cm².)`,{fig:duo(geo({p:{A:[0,60],B:[0,0],C:[80,0]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'60 m',BC:'80 m',AC:'100 m'}}),geo({p:{P:[0,30],Q:[0,0],R:[40,0]},s:'PQ QR RP',ra:[['Q','P','R']],t:{PQ:'3 cm'}}))});
cs(8,[],`A triangular garden ABC has a straight path DE with D on AB and E on AC, parallel to the side BC. AD = 4 m, DB = 6 m, AE = 5 m and BC = 20 m.`,[
  {l:'(i)',m:1,q:`Which theorem gives [[AD|DB]] = [[AE|EC]]?`},
  {l:'(ii)',m:1,q:`Find EC.`},
  {l:'(iii)',m:2,q:`(a) Find the length of the path DE.`,or:`(b) Find the length AC.`}
],`<b>(i)</b> The Basic Proportionality Theorem (Thales theorem), since DE ∥ BC.<br><b>(ii)</b> [[4|6]] = [[5|EC]], so <b>EC = 7.5 m</b>.<br><b>(iii)(a)</b> ΔADE ~ ΔABC: [[DE|BC]] = [[AD|AB]] = [[4|10]], so DE = [[4|10]] × 20 = <b>8 m</b>.<br>(OR) <b>(b)</b> AC = AE + EC = 5 + 7.5 = <b>12.5 m</b>.`,{fig:bpt(.4,.4,{AD:'4 m',DB:'6 m',AE:'5 m',BC:'20 m'})});
cs(9,[],`In a triangular plot ABC, D and E are the mid-points of the sides AB and AC respectively, and BC = 48 m.`,[
  {l:'(i)',m:1,q:`What is the relation between DE and BC?`},
  {l:'(ii)',m:1,q:`Find the length DE.`},
  {l:'(iii)',m:2,q:`(a) If the perimeter of ΔABC is 120 m, find the perimeter of ΔADE.`,or:`(b) Find the ratio of the area of ΔADE to the area of ΔABC.`}
],`<b>(i)</b> By the mid-point theorem, DE ∥ BC and DE = [[1|2]]BC.<br><b>(ii)</b> DE = [[1|2]] × 48 = <b>24 m</b>.<br><b>(iii)(a)</b> ΔADE ~ ΔABC with ratio 1 : 2, so the perimeter of ΔADE = [[1|2]] × 120 = <b>60 m</b>.<br>(OR) <b>(b)</b> The ratio of areas = (1 : 2)^{2} = <b>1 : 4</b>.`,{fig:geo({p:{A:[50,100],B:[0,0],C:[100,0],D:P2([50,100],[0,0],.5),E:P2([50,100],[100,0],.5)},s:'AB BC CA DE',par:['DE','BC'],t:{BC:'48 m'}})});
cs(10,[],`Two triangular flower beds ΔABC and ΔPQR are similar. The side BC = 6 m corresponds to the side QR = 9 m. The area of ΔABC is 24 m².`,[
  {l:'(i)',m:1,q:`Find the ratio of the corresponding sides BC : QR.`},
  {l:'(ii)',m:1,q:`Find the ratio of the areas of ΔABC and ΔPQR.`},
  {l:'(iii)',m:2,q:`(a) Find the area of ΔPQR.`,or:`(b) If the perimeter of ΔABC is 30 m, find the perimeter of ΔPQR.`}
],`<b>(i)</b> BC : QR = 6 : 9 = <b>2 : 3</b>.<br><b>(ii)</b> The ratio of areas = (2 : 3)^{2} = <b>4 : 9</b>.<br><b>(iii)(a)</b> [[24|ar(PQR)]] = [[4|9]], so ar(ΔPQR) = [[24 × 9|4]] = <b>54 m²</b>.<br>(OR) <b>(b)</b> The perimeters are in the ratio 2 : 3, so the perimeter of ΔPQR = [[3|2]] × 30 = <b>45 m</b>.`,{fig:duo(geo({p:{A:[30,60],B:[0,0],C:[60,0]},s:'AB BC CA',t:{BC:'6 m'}}),geo({p:{P:[45,90],Q:[0,0],R:[90,0]},s:'PQ QR RP',t:{QR:'9 m'}}))});
cs(11,[],`A carpenter makes a triangular frame with sides 15 m, 36 m and 39 m.`,[
  {l:'(i)',m:1,q:`Which side should be the hypotenuse if the frame is right-angled?`},
  {l:'(ii)',m:1,q:`Check whether the frame is right-angled.`},
  {l:'(iii)',m:2,q:`(a) Find the area of the frame.`,or:`(b) Find the length of the perpendicular from the right-angled vertex to the longest side.`}
],`<b>(i)</b> The longest side, <b>39 m</b>.<br><b>(ii)</b> 15^{2} + 36^{2} = 225 + 1296 = 1521 = 39^{2}. By the converse of Pythagoras the frame is <b>right-angled</b>, with the right angle opposite the 39 m side.<br><b>(iii)(a)</b> Area = [[1|2]] × 15 × 36 = <b>270 m²</b>.<br>(OR) <b>(b)</b> [[1|2]] × 39 × h = 270, so h = [[540|39]] = <b>[[180|13]] m</b> (≈ 13.85 m).`,{fig:geo({p:{B:[0,0],C:[36,0],A:[0,15]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'15 m',BC:'36 m',AC:'39 m'}})});
cs(12,[],`A man 1.8 m tall casts a shadow 2.4 m long. At the same time, a building casts a shadow 24 m long.`,[
  {l:'(i)',m:1,q:`Which similarity criterion is used here?`},
  {l:'(ii)',m:1,q:`Find the height of the building.`},
  {l:'(iii)',m:2,q:`(a) At the same time, how long is the shadow of a 3 m pole?`,or:`(b) If the shadow of the man were 3 m long at some other time, find the height of the building whose shadow is 24 m at that time.`}
],`<b>(i)</b> The <b>AA criterion</b>: both objects are vertical and the sun’s rays make the same angle with the ground.<br><b>(ii)</b> [[h|1.8]] = [[24|2.4]] = 10, so h = <b>18 m</b>.<br><b>(iii)(a)</b> [[3|1.8]] = [[shadow|2.4]], so the shadow = [[3 × 2.4|1.8]] = <b>4 m</b>.<br>(OR) <b>(b)</b> [[1.8|3]] = [[h|24]], so h = [[1.8 × 24|3]] = <b>14.4 m</b>.`,{fig:duo(geo({p:{A:[0,18],B:[0,0],C:[24,0]},s:'AB BC CA',ra:[['B','A','C']],t:{AB:'1.8 m',BC:'2.4 m'}}),geo({p:{P:[0,90],Q:[0,0],R:[120,0]},s:'PQ QR RP',ra:[['Q','P','R']],t:{PQ:'h',QR:'24 m'}}))});
cs(13,[],`ABCD is a parallelogram-shaped plot. P is the mid-point of DC, and AP meets the diagonal BD at Q. BD = 15 m.`,[
  {l:'(i)',m:1,q:`Name the pair of similar triangles formed by AP and the diagonal BD.`},
  {l:'(ii)',m:1,q:`Find the ratio DP : AB.`},
  {l:'(iii)',m:2,q:`(a) Find the length DQ.`,or:`(b) Find the length QB.`}
],`<b>(i)</b> ΔDPQ ~ ΔBAQ (DC ∥ AB, so the alternate angles are equal and the angles at Q are vertically opposite).<br><b>(ii)</b> P is the mid-point of DC, so DP = [[1|2]]DC = [[1|2]]AB. DP : AB = <b>1 : 2</b>.<br><b>(iii)(a)</b> [[DQ|QB]] = [[DP|AB]] = [[1|2]], so DQ = [[1|3]] × 15 = <b>5 m</b>.<br>(OR) <b>(b)</b> QB = [[2|3]] × 15 = <b>10 m</b>.`,{fig:geo({p:{A:[0,0],B:[80,0],C:[100,50],D:[20,50],P:P2([20,50],[100,50],.5),Q:IX([0,0],P2([20,50],[100,50],.5),[80,0],[20,50])},s:'AB BC CD DA BD AP'})});
cs(14,[],`ΔABC is right-angled at B, and BD is drawn perpendicular to the hypotenuse AC. AD = 9 cm and DC = 16 cm.`,[
  {l:'(i)',m:1,q:`Which pair of triangles is similar to ΔABC and why?`},
  {l:'(ii)',m:1,q:`Find BD.`},
  {l:'(iii)',m:2,q:`(a) Find AB and BC.`,or:`(b) Find the area of ΔABC.`}
],`<b>(i)</b> ΔABD ~ ΔABC and ΔBDC ~ ΔABC (each has a right angle and shares an acute angle with ΔABC: AA).<br><b>(ii)</b> ΔABD ~ ΔBCD gives BD^{2} = AD × DC = 9 × 16 = 144, so <b>BD = 12 cm</b>.<br><b>(iii)(a)</b> AC = 25 cm. AB^{2} = AD × AC = 9 × 25 = 225, so <b>AB = 15 cm</b>. BC^{2} = DC × AC = 16 × 25 = 400, so <b>BC = 20 cm</b>.<br>(OR) <b>(b)</b> Area = [[1|2]] × AC × BD = [[1|2]] × 25 × 12 = <b>150 cm²</b>. (Also [[1|2]] × 15 × 20 = 150 ✓.)`,{fig:geo({p:{A:[0,0],C:[100,0],D:[36,0],B:[36,48]},s:'AC AB BC BD',ra:[['D','B','A'],['B','A','C']],t:{AD:'9 cm',DC:'16 cm'}})});
cs(15,[],`In ΔABC, DE ∥ BC with D on AB and E on AC. AD = 2 cm and DB = 3 cm.`,[
  {l:'(i)',m:1,q:`Find the ratio AD : AB.`},
  {l:'(ii)',m:1,q:`Find the ratio of the areas of ΔADE and ΔABC.`},
  {l:'(iii)',m:2,q:`(a) If the area of ΔABC is 75 cm², find the area of ΔADE.`,or:`(b) If the area of ΔABC is 75 cm², find the area of the trapezium DBCE.`}
],`<b>(i)</b> AB = 2 + 3 = 5 cm, so AD : AB = <b>2 : 5</b>.<br><b>(ii)</b> ΔADE ~ ΔABC, so the ratio of areas = (2 : 5)^{2} = <b>4 : 25</b>.<br><b>(iii)(a)</b> ar(ΔADE) = [[4|25]] × 75 = <b>12 cm²</b>.<br>(OR) <b>(b)</b> ar(trapezium DBCE) = 75 − 12 = <b>63 cm²</b>.`,{fig:bpt(.4,.4,{AD:'2 cm',DB:'3 cm'})});

CUR=1;


/* ---------- state ---------- */
const KEY='khanclasses-pyq-v1';
let prog={done:{},mcq:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.done&&p.mcq)prog=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog));}catch(e){}}
const S={ch:1,lv:'mcq',yr:'all',st:'all',open:{}};

const $=id=>document.getElementById(id);
const isRight=(q,i)=>i===q.a||(q.alt||[]).indexOf(i)>-1;
const ansText=q=>[q.a].concat(q.alt||[]).sort().map(i=>'('+L4[i]+')').join(' or ');
const figH=f=>f?`<div class="fig">${f}</div>`:'';
const chQs=()=>Q.filter(q=>q.ch===S.ch);

/* ---------- render ---------- */
function renderControls(){
  const sel=$('chapter');
  sel.innerHTML=CHAPTERS.map(c=>`<option value="${c.n}" ${c.ready?'':'disabled'} ${c.n===S.ch?'selected':''}>Ch ${c.n} · ${c.name}${c.ready?'':' (coming soon)'}</option>`).join('');
  const years=['all','2025','2024','2023','practice'];
  const names={all:'All years','2025':'2025','2024':'2024','2023':'2023',practice:'Practice'};
  $('years').innerHTML=years.map(y=>`<button type="button" class="chip" data-y="${y}" aria-pressed="${S.yr===y}">${names[y]}</button>`).join('');
}
function renderProgress(){
  const qs=chQs();const d=qs.filter(q=>prog.done[q.id]).length;
  $('progText').textContent=`${d} of ${qs.length} questions done`;
  $('progBar').style.width=(qs.length?d/qs.length*100:0)+'%';
  const m=qs.filter(q=>q.t==='mcq'||q.t==='ar');
  const att=m.filter(q=>prog.mcq[q.id]!==undefined);
  const ok=att.filter(q=>isRight(q,prog.mcq[q.id])).length;
  $('accText').textContent=att.length?`1-mark accuracy: ${ok} of ${att.length} correct`:'';
}
function renderLevels(){
  const qs=chQs();
  $('levels').innerHTML=LEVELS.map(l=>{
    const a=qs.filter(q=>q.t===l.k);const d=a.filter(q=>prog.done[q.id]).length;
    const dis=a.length===0;
    return `<button type="button" class="lv" role="tab" data-l="${l.k}" aria-selected="${S.lv===l.k}" ${dis?'':''}>
      <b>${l.name}</b><small>${l.sub}</small><span class="ct">${a.length?`${d} / ${a.length} done`:'No questions yet'}</span></button>`;
  }).join('');
}
function tagsHTML(q){
  if(!q.y.length)return `<span class="tag p">Practice</span>`;
  return q.y.map(y=>`<span class="tag">Board ${y}</span>`).join('');
}
function solHTML(q){
  const open=S.open[q.id];
  return `<div class="sol" id="sol-${q.id}" ${open?'':'hidden'}>${fmt(q.s)}</div>`;
}
function qHTML(q){
  const done=!!prog.done[q.id];let body='';
  if(q.t==='mcq'){
    const pick=prog.mcq[q.id];
    body=`<div class="qt">${fmt(q.q)}</div>${figH(q.fig)}<div class="opts">`+q.o.map((o,i)=>{
      let c='';if(pick!==undefined){if(isRight(q,i))c='right';else if(i===pick)c='wrong';}
      return `<button type="button" class="opt ${c}" data-act="pick" data-id="${q.id}" data-i="${i}" ${pick!==undefined?'disabled':''}><span class="l">${L4[i]})</span><span>${fmt(o)}</span></button>`;
    }).join('')+`</div>`;
    if(pick!==undefined){
      body+=`<div class="fb ${isRight(q,pick)?'ok':'bad'}">${isRight(q,pick)?'Correct':'Not quite. The correct answer is '+ansText(q)}</div><div class="sol">${fmt(q.s)}</div>`;
      body+=`<div class="act"><button type="button" class="btn" data-act="retry" data-id="${q.id}">Try again</button></div>`;
    }
  }else if(q.t==='ar'){
    const pick=prog.mcq[q.id];
    body=`<div class="qt ar"><p><b>Assertion (A):</b> ${fmt(q.A)}</p><p><b>Reason (R):</b> ${fmt(q.R)}</p></div>
    <div class="opts one">`+AR_OPTS.map((o,i)=>{
      let c='';if(pick!==undefined){if(isRight(q,i))c='right';else if(i===pick)c='wrong';}
      return `<button type="button" class="opt ${c}" data-act="pick" data-id="${q.id}" data-i="${i}" ${pick!==undefined?'disabled':''}><span class="l">${L4[i]})</span><span>${o}</span></button>`;
    }).join('')+`</div>`;
    if(pick!==undefined){
      body+=`<div class="fb ${isRight(q,pick)?'ok':'bad'}">${isRight(q,pick)?'Correct':'Not quite. The correct answer is '+ansText(q)}</div><div class="sol">${fmt(q.s)}</div>`;
      body+=`<div class="act"><button type="button" class="btn" data-act="retry" data-id="${q.id}">Try again</button></div>`;
    }
  }else if(q.t==='case'){
    body=`<div class="qt"><p>${fmt(q.q)}</p></div>${figH(q.fig)}`+q.parts.map(p=>`<div class="part"><b>${p.l}</b> ${fmt(p.q)}<span class="pm">[${p.m}]</span>${p.or?`<div class="or">OR</div>${fmt(p.or)}<span class="pm">[${p.m}]</span>`:''}${figH(p.fig)}</div>`).join('')
      +`<div class="act"><button type="button" class="btn pri" data-act="sol" data-id="${q.id}" aria-expanded="${!!S.open[q.id]}">${S.open[q.id]?'Hide solution':'Show solution'}</button><button type="button" class="btn" data-act="done" data-id="${q.id}" aria-pressed="${done}">${done?'Done':'Mark as done'}</button></div>`+solHTML(q);
  }else{
    body=`<div class="qt">${fmt(q.q)}</div>${figH(q.fig)}<div class="act"><button type="button" class="btn pri" data-act="sol" data-id="${q.id}" aria-expanded="${!!S.open[q.id]}">${S.open[q.id]?'Hide solution':'Show solution'}</button><button type="button" class="btn" data-act="done" data-id="${q.id}" aria-pressed="${done}">${done?'Done':'Mark as done'}</button></div>`+solHTML(q);
  }
  return `<article class="q ${done?'done':''}" id="q-${q.id}"><div class="mg"><span class="no">${q.n}</span><span class="mk">[${q.m}]</span></div><div class="bd"><div class="meta">${tagsHTML(q)}</div>${body}</div></article>`;
}
function filtered(){
  return chQs().filter(q=>q.t===S.lv).filter(q=>{
    if(S.yr==='all')return true;
    if(S.yr==='practice')return q.y.length===0;
    return q.y.indexOf(+S.yr)>-1;
  }).filter(q=>{
    if(S.st==='todo')return !prog.done[q.id];
    if(S.st==='done')return !!prog.done[q.id];
    return true;
  });
}
function renderList(){
  const all=chQs().filter(q=>q.t===S.lv);const f=filtered();
  const lv=LEVELS.find(l=>l.k===S.lv);
  $('count').textContent=all.length?`${lv.name}: showing ${f.length} of ${all.length}`:`${lv.name}`;
  if(!all.length){
    $('list').innerHTML=`<div class="empty"><b>No ${lv.name.toLowerCase()} questions for this chapter yet</b>The file for this chapter has no ${lv.sub.split('· ')[1]} questions. They will appear here when they are added.</div>`;return;
  }
  if(!f.length){
    $('list').innerHTML=`<div class="empty"><b>Nothing matches these filters</b>Try a different year or choose “All questions”.</div>`;return;
  }
  $('list').innerHTML=f.map(qHTML).join('');
}
function renderAll(){renderControls();renderProgress();renderLevels();renderList();}

/* ---------- events ---------- */
$('chapter').addEventListener('change',e=>{S.ch=+e.target.value;S.open={};renderAll();});
$('status').addEventListener('change',e=>{S.st=e.target.value;renderList();});
$('years').addEventListener('click',e=>{const b=e.target.closest('[data-y]');if(!b)return;S.yr=b.dataset.y;renderControls();renderList();});
$('levels').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;S.lv=b.dataset.l;S.open={};renderLevels();renderList();window.scrollTo({top:0,behavior:'auto'});});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;const act=b.dataset.act;
  if(act==='pick'){prog.mcq[id]=+b.dataset.i;prog.done[id]=true;save();rerender(id);}
  else if(act==='retry'){delete prog.mcq[id];delete prog.done[id];save();rerender(id);}
  else if(act==='sol'){S.open[id]=!S.open[id];rerender(id);}
  else if(act==='done'){if(prog.done[id])delete prog.done[id];else prog.done[id]=true;save();rerender(id);}
});
function rerender(id){
  const q=Q.find(x=>x.id===id);const el=$('q-'+id);
  if(el&&q){
    const tmp=document.createElement('div');tmp.innerHTML=qHTML(q);el.replaceWith(tmp.firstElementChild);
  }
  if(S.st!=='all'){/* keep card visible until filters change */}
  renderProgress();renderLevels();
}
$('reset').addEventListener('click',()=>{
  if(!confirm('Clear all your progress and answers on this device?'))return;
  prog={done:{},mcq:{}};S.open={};save();renderAll();
});

renderAll();
</script>
</body>
</html>
