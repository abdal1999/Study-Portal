<style>
:root{
  --paper:#FBFCFE; --card:#FFFFFF; --ink:#14213D; --ink2:#4A5775; --line:#DCE3F0;
  --pen:#2F5BEA; --pen-soft:#E8EEFF; --red:#C8102E; --ok:#1E8E5A; --okbg:#E4F5EC;
  --badbg:#FCE6E9; --hl:#FFE45C; --grid:rgba(47,91,234,.07);

  --body:'Literata',Georgia,'Times New Roman',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --card:#151E33; --ink:#E8EDF8; --ink2:#9AA8C7; --line:#25314D;
    --pen:#7C9BFF; --pen-soft:#1B2745; --red:#FF6B81; --ok:#4CD08A; --okbg:#12301F;
    --badbg:#3A1620; --hl:#6B5A00; --grid:rgba(124,155,255,.08);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --card:#151E33; --ink:#E8EDF8; --ink2:#9AA8C7; --line:#25314D;
  --pen:#7C9BFF; --pen-soft:#1B2745; --red:#FF6B81; --ok:#4CD08A; --okbg:#12301F;
  --badbg:#3A1620; --hl:#6B5A00; --grid:rgba(124,155,255,.08);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:17px;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* header */
.brandbar{border-bottom:2px solid var(--red);background:var(--card)}
.brandbar .wrap{padding-top:10px;padding-bottom:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em}
.hero{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:30px;padding-bottom:26px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0 0 20px;color:var(--ink2);font-size:16px;max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.field{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:14px}
select{background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:8px 30px 8px 10px;min-height:42px;font-family:var(--display);font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;min-height:38px;font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.prog{margin-top:20px}
.prog-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink2);margin-bottom:6px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--pen);transition:width .35s}

/* level tabs */
.levels{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.levels .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:thin}
.lv{flex:0 0 auto;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;min-width:132px;cursor:pointer}
.lv b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}
.lv small{display:block;color:var(--ink2);font-family:var(--display);font-size:12.5px}
.lv .ct{display:block;margin-top:2px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--pen)}
.lv[aria-selected="true"]{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.lv[disabled]{opacity:.5;cursor:default}

/* list */
main{padding:22px 0 40px}
.count{font-family:var(--display);font-weight:600;color:var(--ink2);font-size:14px;margin:0 0 14px}
.q{display:grid;grid-template-columns:58px 1fr;background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.q.done{border-color:var(--ok)}
.mg{border-right:2px solid var(--red);padding:14px 6px;text-align:center;background:linear-gradient(var(--pen-soft),var(--pen-soft))}
.no{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.mk{display:block;margin-top:6px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--red)}
.bd{padding:14px 16px 14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-family:var(--display);font-weight:700;font-size:12.5px;border-radius:4px;padding:2px 8px;background:var(--hl);color:#14213D}
.tag.p{background:var(--pen-soft);color:var(--pen)}
.qt{overflow-wrap:anywhere}
.qt p{margin:0 0 8px}
.ar b{font-family:var(--display)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;min-height:44px;cursor:pointer;overflow-wrap:anywhere}
.opt .l{font-family:var(--display);font-weight:700;color:var(--pen);flex:0 0 auto}
.opt:hover:not([disabled]){border-color:var(--pen)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--red)}
.opt[disabled]{cursor:default}
.arlist{margin:12px 0 0;padding:10px 12px;background:var(--pen-soft);border-radius:8px;font-size:15px}
.arlist div{margin:2px 0}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:7px 14px;min-height:42px;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sol{margin-top:12px;border-left:4px solid var(--pen);background:var(--pen-soft);border-radius:0 8px 8px 0;padding:10px 14px;font-size:16px;overflow-wrap:anywhere}
.sol[hidden]{display:none}
.sol .ans{font-family:var(--display);font-weight:700;color:var(--ok)}
.fb{margin-top:10px;font-family:var(--display);font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--red)}
.part{margin:10px 0;padding-left:2px}
.part .pm{font-family:var(--display);font-weight:700;color:var(--red);margin-left:6px}
.or{text-align:center;font-family:var(--display);font-weight:800;margin:6px 0}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:10px;padding:26px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-family:var(--display);color:var(--ink);font-size:18px;margin-bottom:4px}

.fig{margin:10px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;justify-items:center}
.opt svg{max-width:100%;height:auto}
/* math */
sup,sub{line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.2;margin:0 .12em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em}
.rt .rb{border-top:1px solid currentColor;padding:0 .1em}
.ol{text-decoration:overline}

footer{border-top:2px solid var(--red);background:var(--card)}
footer .wrap{padding-top:16px;padding-bottom:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-family:var(--display);font-weight:600;font-size:14px}
footer .btn{min-height:38px;font-size:13px}

@media (max-width:560px){
  body{font-size:16px}
  .q{grid-template-columns:44px 1fr}
  .no{font-size:18px}
  .bd{padding:12px}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

<script>
/* ---------- tiny math markup ---------- */
function fmt(s){
  return s
    .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>')
    .replace(/_\{([^}]*)\}/g,'<sub>$1</sub>')
    .replace(/√\{([^}]*)\}/g,'<span class="rt">√<span class="rb">$1</span></span>')
    .replace(/\[\[([^|\]]*)\|([^\]]*)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>')
    .replace(/~\{([^}]*)\}/g,'<span class="ol">$1</span>');
}

/* ---------- chapters & levels ---------- */
const CHAPTERS=[
  {n:1,name:'Real Numbers',ready:true},
  {n:2,name:'Polynomials',ready:true},{n:3,name:'Pair of Linear Equations in Two Variables',ready:true},
  {n:4,name:'Quadratic Equations',ready:true},{n:5,name:'Arithmetic Progressions',ready:true},{n:6,name:'Triangles',ready:true},
  {n:7,name:'Coordinate Geometry'},{n:8,name:'Introduction to Trigonometry'},
  {n:9,name:'Some Applications of Trigonometry'},{n:10,name:'Circles'},
  {n:11,name:'Areas Related to Circles'},{n:12,name:'Surface Areas and Volumes'},
  {n:13,name:'Statistics'},{n:14,name:'Probability'}
];
const LEVELS=[
  {k:'mcq',name:'MCQ',sub:'Section A · 1 mark'},
  {k:'ar',name:'Assertion–Reason',sub:'Section A · 1 mark'},
  {k:'vsa',name:'Very short answer',sub:'Section B · 2 marks'},
  {k:'sa',name:'Short answer',sub:'Section C · 3 marks'},
  {k:'la',name:'Long answer',sub:'Section D · 5 marks'},
  {k:'case',name:'Case-based',sub:'Section E · 4 marks'}
];
const AR_OPTS=[
  'Both assertion (A) and reason (R) are true and reason (R) is the correct explanation of assertion (A)',
  'Both assertion (A) and reason (R) are true but reason (R) is not the correct explanation of assertion (A)',
  'Assertion (A) is true but reason (R) is false',
  'Assertion (A) is false but reason (R) is true'
];

/* ---------- question bank ---------- */
const Q=[];
let CUR=1;
const L4=['a','b','c','d'];
function mcq(n,y,q,o,a,s,x){Q.push(Object.assign({id:CUR+'-mcq-'+n,ch:CUR,t:'mcq',m:1,n,y,q,o,a,s},x||{}));}
function ar(n,y,A,R,a,s,x){Q.push(Object.assign({id:CUR+'-ar-'+n,ch:CUR,t:'ar',m:1,n,y,A,R,a,s},x||{}));}
function vsa(n,y,q,s,x){Q.push(Object.assign({id:CUR+'-vsa-'+n,ch:CUR,t:'vsa',m:2,n,y,q,s},x||{}));}
function sa(n,y,q,s,x){Q.push(Object.assign({id:CUR+'-sa-'+n,ch:CUR,t:'sa',m:3,n,y,q,s},x||{}));}
function cs(n,y,q,parts,s,x){Q.push(Object.assign({id:CUR+'-case-'+n,ch:CUR,t:'case',m:4,n,y,q,parts,s},x||{}));}

function rootProof(n){return `Assume, to the contrary, that √{${n}} is rational. Then √{${n}} = [[a|b]], where a and b are co-prime integers and b ≠ 0.<br>Squaring: a^{2} = ${n}b^{2}, so ${n} divides a^{2}. Since ${n} is prime, ${n} divides a. Write a = ${n}c.<br>Then ${n}^{2}c^{2} = ${n}b^{2}, so b^{2} = ${n}c^{2}, and ${n} divides b as well.<br>So ${n} is a common factor of a and b, which contradicts that they are co-prime. Hence √{${n}} is irrational.`;}
function irr(target,expr,root){return `Assume, to the contrary, that ${target} is rational.<br>Then ${expr} would also be rational, because sums, differences, products and quotients (by a non-zero number) of rational numbers are rational.<br>But ${root} is irrational. This is a contradiction, so ${target} is irrational.`;}

/* ===== 1 mark: MCQ ===== */
mcq(1,[2024],`If two positive integers p and q can be expressed as p = ab^{2} and q = a^{3}b, where a and b are prime numbers then LCM(p, q) =`,['ab','a^{2}b^{2}','a^{3}b^{2}','a^{3}b^{3}'],2,`LCM takes the highest power of each prime: a^{3} and b^{2}. So LCM = a^{3}b^{2}.`);
mcq(2,[2023],`If p and q are natural numbers and ‘p’ is the multiple of ‘q’, then what is the HCF of ‘p’ and ‘q’?`,['pq','p','q','p + q'],2,`q divides p, so the greatest common factor is q itself.`);
mcq(3,[2025],`If x = ab^{3} and y = a^{3}b where a and b are prime numbers then HCF(x, y) − LCM(x, y) is equal to`,['1 − a^{3}b^{3}','ab(1 − ab)','ab − a^{4}b^{4}','ab(1 − ab)(1 + ab)'],3,`HCF = ab and LCM = a^{3}b^{3}.<br>HCF − LCM = ab − a^{3}b^{3} = ab(1 − a^{2}b^{2}) = ab(1 − ab)(1 + ab).`);
mcq(4,[2025],`Let x = a^{2}b^{3}c^{n} and y = a^{3}b^{m}c^{2}, where a, b and c are prime numbers. If LCM(x, y) = a^{3}b^{4}c^{3} then (m + n) is`,['10','7','6','5'],1,`The highest power of b is 4, and b^{3} is in x, so m = 4. The highest power of c is 3, and c^{2} is in y, so n = 3.<br>m + n = 7.`);
mcq(5,[2025],`Let a = p^{2}q^{3}r^{n} and b = p^{3}q^{m}r^{2}, where p, q, r are prime numbers. If LCM(a, b) = p^{3}q^{4}r^{3} then (3n − 2m) is`,['−1','1','3','−3'],1,`m = 4 and n = 3 (same reasoning as the previous question).<br>3n − 2m = 9 − 8 = 1.`);
mcq(6,[2025],`The sum of exponents of prime factors in the prime factorization of 4004 is`,['3','4','5','2'],2,`4004 = 2^{2} × 7 × 11 × 13. Sum of exponents = 2 + 1 + 1 + 1 = 5.`);
mcq(7,[],`The sum of exponents of prime factors in the prime factorization of 1764 is`,['3','4','5','6'],3,`1764 = 2^{2} × 3^{2} × 7^{2}. Sum of exponents = 2 + 2 + 2 = 6.`);
mcq(8,[],`The total number of factors of prime number is`,['1','0','2','3'],2,`A prime has exactly two factors: 1 and itself.`);
mcq(9,[2025],`The HCF of 40, 110 and 360 is`,['40','110','360','10'],3,`40 = 2^{3}×5, 110 = 2×5×11, 360 = 2^{3}×3^{2}×5. Common: 2 × 5 = 10.`);
mcq(10,[2024],`The HCF and LCM of 378, 180, 420 are`,['6, 3980','12, 3780','6, 3780','12, 3980'],2,`378 = 2×3^{3}×7, 180 = 2^{2}×3^{2}×5, 420 = 2^{2}×3×5×7.<br>HCF = 2 × 3 = 6. LCM = 2^{2}×3^{3}×5×7 = 3780.`);
mcq(11,[2024],`If the product of two co-prime numbers is 553, then their HCF is`,['1','553','7','79'],0,`Co-prime numbers have no common factor other than 1, so HCF = 1.`);
mcq(12,[],`The LCM of smallest two digit composite number and smallest composite number is`,['12','4','20','44'],2,`Smallest two-digit composite number = 10; smallest composite number = 4.<br>LCM(10, 4) = 20.`);
mcq(13,[2023],`The ratio of LCM and HCF of the least composite and the least prime numbers is`,['1 : 2','2 : 1','1 : 1','1 : 3'],1,`Least composite = 4, least prime = 2. LCM(4, 2) = 4, HCF(4, 2) = 2. Ratio = 4 : 2 = 2 : 1.`);
mcq(14,[],`If HCF(336, 54) = 6, LCM(336, 54) is`,['2024','3024','1012','1512'],1,`LCM = [[336 × 54|6]] = 56 × 54 = 3024.`);
mcq(15,[],`The value of ‘x’, if HCF(x, 18) = 2 and LCM(x, 18) = 36, is`,['2','5','7','4'],3,`x × 18 = 2 × 36 = 72, so x = 4.`);
mcq(16,[],`HCF of two numbers is 27 and their LCM is 162. If one of the numbers is 54 then the other number is`,['36','35','9','81'],3,`Other number = [[27 × 162|54]] = 81.`);
mcq(17,[],`The LCM of two numbers is 14 times their HCF. The sum of LCM and HCF is 600. If one number is 280 then the other number is`,['20','28','60','80'],3,`LCM = 14 × HCF, so 15 × HCF = 600 and HCF = 40, LCM = 560.<br>Other number = [[40 × 560|280]] = 80.`);
mcq(18,[],`225 can be expressed as`,['5 × 3^{2}','5^{2} × 3','5^{2} × 3^{2}','5^{3} × 3'],2,`225 = 25 × 9 = 5^{2} × 3^{2}.`);
mcq(19,[],`108 can be expressed as a product of its prime as`,['2^{3} × 3^{2}','2^{3} × 3^{3}','2^{2} × 3^{2}','2^{2} × 3^{3}'],3,`108 = 4 × 27 = 2^{2} × 3^{3}.`);
mcq(20,[],`When 2120 is expressed as the product of its prime factors we get`,['2 × 5^{3} × 53','2^{3} × 5 × 53','5 × 7^{2} × 31','5^{2} × 7 × 33'],1,`2120 = 8 × 265 = 2^{3} × 5 × 53.`);
mcq(21,[],`If a and b are two positive integers such that the least prime factor of a is 3 and the least prime factor of b is 5. Then the least prime factor of (a + b) is`,['1','2','3','4'],1,`Neither a nor b has 2 as a factor, so both are odd. The sum of two odd numbers is even, so 2 is the least prime factor of a + b.`);
mcq(22,[],`Select the least number that is divisible by all numbers between 1 and 10 (both inclusive)`,['2520','5040','1010','2020'],0,`LCM(1, 2, …, 10) = 2^{3} × 3^{2} × 5 × 7 = 2520.`);
mcq(23,[2023],`If ‘n’ is a natural number then which of the following numbers end with zero?`,['(3 × 2)^{n}','(2 × 5)^{n}','(6 × 2)^{n}','(5 × 3)^{n}'],1,`A number ends with 0 only if both 2 and 5 are its prime factors. (2 × 5)^{n} = 10^{n} ends with 0.`);
mcq(24,[],`2√{3} is ______ number.`,['Integer','rational','irrational','whole'],2,`√{3} is irrational, and a non-zero rational multiple of an irrational number is irrational.`);
mcq(25,[2023],`If p^{2} = [[32|50]] then p is ______ number.`,['Whole','integer','rational','irrational'],2,`p^{2} = [[32|50]] = [[16|25]], so p = [[4|5]], which is rational (not an integer).`);
mcq(26,[2025],`√{0.4} is a/an ______ number.`,['Natural','integer','rational','irrational'],3,`√{0.4} = √{[[2|5]]} = [[√{2}|√{5}]] = [[√{10}|5]]. Since √{10} is irrational, the number is irrational.`);
mcq(27,[2024],`If the HCF(2520, 6600) = 40 and LCM(2520, 6600) = 252 × k then the value of k is`,['1650','1600','165','1625'],0,`LCM = [[2520 × 6600|40]] = 415800 = 252 × 1650, so k = 1650.`);
mcq(28,[2025],`If HCF(98, 28) = m and LCM(98, 28) = n then the value of n − 7m is`,['0','28','98','198'],2,`98 = 2×7^{2}, 28 = 2^{2}×7. m = 14, n = 196.<br>n − 7m = 196 − 98 = 98.`);
mcq(29,[2025],`If x is the LCM of 4, 6, 8 and y is the LCM of 3, 5, 7 and p is the LCM of x and y, then which of the following is true?`,['p = 35x','p = 4y','p = 8x','p = 16y'],0,`x = 24, y = 105. p = LCM(24, 105) = 2^{3}×3×5×7 = 840.<br>840 = 35 × 24, so p = 35x.`);
mcq(30,[2024],`If a = 2^{2} × 3^{x}, b = 2^{2} × 3 × 5, c = 2^{2} × 3 × 7 and LCM(a, b, c) = 3780 then x is`,['1','2','3','0'],2,`3780 = 2^{2} × 3^{3} × 5 × 7. The power of 3 in the LCM is 3, and only a can supply 3^{3}, so x = 3.`);
mcq(31,[2024],`If 3825 = 3^{x} × 5^{y} × 17^{z} then x + y − 2z is`,['0','1','2','3'],2,`3825 = 3^{2} × 5^{2} × 17, so x = 2, y = 2, z = 1.<br>x + y − 2z = 2 + 2 − 2 = 2.`);
mcq(32,[2025],`If 1080 = 2^{p} × 3^{q} × 5 then p − q is`,['6','−1','1','0'],3,`1080 = 2^{3} × 3^{3} × 5, so p = 3, q = 3 and p − q = 0.`);
mcq(33,[2025],`If a^{b} = 32, where a and b are positive integers then the value of b^{ab} is`,['72','5^{10}','2^{10}','5^{12}'],1,`32 = 2^{5}, so a = 2 and b = 5. Then b^{ab} = 5^{10}.<br>(The other choice, a = 32 and b = 1, gives 1, which is not among the options.)`);
mcq(34,[2024],`A pair of irrational numbers whose product is a rational number is`,['(√{16}, √{4})','(√{5}, √{2})','(√{3}, √{27})','(√{36}, √{2})'],2,`(a) √{16} and √{4} are rational, not irrational. (b) √{5} × √{2} = √{10}, irrational. (d) 6 × √{2}, irrational.<br>(c) √{3} and √{27} = 3√{3} are both irrational, and their product is 3 × 3 = 9, which is rational.`);
mcq(35,[2024],`The smallest irrational number by which √{20} should be multiplied so as to get a rational number, is`,['√{20}','√{2}','5','√{5}'],3,`√{20} = 2√{5}. Multiplying by √{5} gives 2 × 5 = 10, which is rational. (5 is rational, so it is not an irrational choice.)`);
mcq(36,[2025],`The greatest number which divides 70 and 125, leaving remainder 5 and 8 respectively, is`,['13','65','875','1750'],0,`The number divides 70 − 5 = 65 and 125 − 8 = 117. HCF(65, 117) = 13, and 13 is greater than both remainders.`);
mcq(37,[2024],`The greatest number which divides 281 and 1249, leaving remainder 5 and 7 respectively, is`,['23','276','138','69'],2,`The number divides 281 − 5 = 276 and 1249 − 7 = 1242. HCF(276, 1242) = 138 (1242 = 4 × 276 + 138, and 276 = 2 × 138).`);
mcq(38,[2025],`The least number which is a perfect square and is divisible by each of 16, 20 and 50 is`,['1200','100','3600','2400'],2,`LCM(16, 20, 50) = 2^{4} × 5^{2} = 400, so the number must be a multiple of 400.<br>Among the options: 1200 = 400×3 and 2400 = 400×6 are not perfect squares; 100 is not a multiple of 400; 3600 = 400 × 9 = 60^{2} is both.<br>(400 itself would be the least such number, but it is not one of the options.)`);
mcq(39,[2025],`Which of the following is a rational number between √{3} and √{5}?`,['1.4142387954012','2.3~{26}','π','1.857142'],3,`√{3} ≈ 1.732 and √{5} ≈ 2.236.<br>(a) 1.414… is less than 1.732. (b) 2.32… is more than 2.236. (c) π ≈ 3.14 is out of range (and irrational). (d) 1.857142 is a terminating decimal, so rational, and it lies between 1.732 and 2.236.`);
mcq(40,[2025],`(1 + √{3})^{2} − (1 − √{3})^{2} is a`,['Positive rational number','Positive irrational number','negative integer','negative irrational number'],1,`Using a^{2} − b^{2} = (a − b)(a + b): (2√{3})(2) = 4√{3}, which is positive and irrational.`);
mcq(41,[2025],`(√{3} + 2)^{2} + (√{3} − 2)^{2} is a/an`,['Positive rational number','Positive irrational number','negative rational number','negative irrational number'],0,`(a + b)^{2} + (a − b)^{2} = 2(a^{2} + b^{2}) = 2(3 + 4) = 14, which is a positive rational number.`);
mcq(42,[2025],`If (−1)^{n} + (−1)^{8} = 0 then n is`,['Any positive integer','Any negative number','any odd number','any even number'],2,`(−1)^{8} = 1, so (−1)^{n} must be −1. That happens when n is odd.`);
mcq(43,[2025],`Which of the following cannot be the unit digit of 8^{n} where n is a natural number?`,['4','2','0','6'],2,`The unit digit of 8^{n} cycles 8, 4, 2, 6, 8, … It is never 0, because 8^{n} has no factor 5.`);

/* ===== 1 mark: Assertion-Reason ===== */
ar(44,[],`If HCF of 510 and 92 is 2 then their LCM is 32460.`,`HCF(a, b) × LCM(a, b) = a × b`,3,`LCM = [[510 × 92|2]] = 23460, not 32460, so A is false. R is the correct product formula, so R is true.<br><span class="ans">Answer: (d)</span>`);
ar(45,[2025],`For any two prime numbers x and y (x < y), HCF(x, y) = x and LCM(x, y) = y.`,`HCF(x, y) ≤ LCM(x, y) where x, y are any two natural numbers.`,3,`Two different primes have HCF = 1 and LCM = xy, so A is false. R is true because the HCF divides the LCM.<br><span class="ans">Answer: (d)</span>`);
ar(46,[2025],`For any two prime numbers p and q, their HCF is 1 and LCM is p + q.`,`For any two natural numbers, HCF × LCM = Product of numbers.`,3,`For distinct primes HCF = 1 and LCM = pq (not p + q), so A is false. R is true.<br><span class="ans">Answer: (d)</span>`);
ar(47,[2025],`Unit digit of 3^{n} cannot be an even number for any natural number n.`,`2 is not a prime factor of 3^{n} for any natural number n.`,0,`3^{n} has only 3 as a prime factor, so it is always odd, and its unit digit (3, 9, 7, 1) can never be even. So A is true, R is true, and R explains A.<br><span class="ans">Answer: (a)</span>`);
ar(48,[2023],`The number 5^{n} never ends with digit 0 for any natural number n.`,`Prime factorisation of 5 has only two factors, 1 and 5.`,1,`A number ends in 0 only if it has both 2 and 5 as factors. 5^{n} has no factor 2, so A is true. R is also true (5 is prime), but it does not explain why 5^{n} lacks the factor 2.<br><span class="ans">Answer: (b)</span>`);
ar(49,[],`The largest number that divides 70 and 125 which leaves remainder 5 and 8 is 13.`,`HCF(65, 117) = 13`,0,`The number must divide 70 − 5 = 65 and 125 − 8 = 117, so it is HCF(65, 117) = 13. Both A and R are true, and R is exactly the working that proves A.<br><span class="ans">Answer: (a)</span>`);

/* ===== 2 marks ===== */
vsa(1,[2024],`Explain why (7 × 13 × 11) + 11 and (7 × 6 × 5 × 4 × 3 × 2 × 1) + 3 are composite numbers.`,`(7 × 13 × 11) + 11 = 11(7 × 13 + 1) = 11 × 92, which has factors other than 1 and itself.<br>(7 × 6 × 5 × 4 × 3 × 2 × 1) + 3 = 5040 + 3 = 5043 = 3(1680 + 1) = 3 × 1681.<br>Both numbers can be written as a product of two numbers greater than 1, so both are composite.`);
vsa(2,[],`Explain whether (3 × 12 × 101) + 4 is a prime number or a composite number.`,`(3 × 12 × 101) + 4 = 3636 + 4 = 3640 = 4(909 + 1) = 4 × 910.<br>It has factors other than 1 and itself, so it is a <b>composite</b> number.`);
vsa(3,[],`Given that HCF(306, 1314) = 18. Find LCM(306, 1314).`,`LCM = [[306 × 1314|18]] = 306 × 73 = <b>22338</b>.`);
vsa(4,[2023,2024],`Check whether 4^{n} can end with the digit 0 for any natural number n.`,`4^{n} = 2^{2n}, whose only prime factor is 2.<br>For a number to end in 0 it must be divisible by 10, so it needs the prime factor 5 as well. 4^{n} has no factor 5, so it <b>cannot</b> end with 0.`);
vsa(5,[],`Show that 5√{6} is an irrational number.`,irr('5√{6}','√{6} = [[5√{6}|5]]','√{6}'));
vsa(6,[],`If two positive integers p and q are written as p = a^{2}b^{3} and q = a^{3}b where a and b are prime numbers then verify LCM(p, q) × HCF(p, q) = pq.`,`LCM(p, q) = a^{3}b^{3} and HCF(p, q) = a^{2}b.<br>LCM × HCF = a^{3}b^{3} × a^{2}b = a^{5}b^{4}.<br>pq = a^{2}b^{3} × a^{3}b = a^{5}b^{4}.<br>Both are equal, so the result is verified.`);
vsa(7,[2023],`Prove 3 + √{5} is an irrational number.`,irr('3 + √{5}','√{5} = (3 + √{5}) − 3','√{5}'));
vsa(8,[2023],`Prove 6 − √{7} is an irrational number.`,irr('6 − √{7}','√{7} = 6 − (6 − √{7})','√{7}'));
vsa(9,[2023],`Two numbers are in the ratio 2 : 3 and their LCM is 180. What is the HCF of these numbers?`,`Let the numbers be 2k and 3k, where k is their HCF. Their LCM is 6k.<br>6k = 180, so k = 30.<br>HCF = <b>30</b>.`);
vsa(10,[2023],`Using prime factorization find HCF and LCM of 96 and 120.`,`96 = 2^{5} × 3 and 120 = 2^{3} × 3 × 5.<br>HCF = 2^{3} × 3 = <b>24</b>.<br>LCM = 2^{5} × 3 × 5 = <b>480</b>.`);
vsa(11,[2025],`Two numbers are in the ratio 4 : 5 and their HCF is 11. Find their LCM?`,`The numbers are 44 and 55 (4 × 11 and 5 × 11). Their LCM = 4 × 5 × 11 = <b>220</b>.`);
vsa(12,[2023],`Find the greatest number which divides 85 and 72 leaving remainders 1 and 2 respectively.`,`The number divides 85 − 1 = 84 and 72 − 2 = 70.<br>84 = 2^{2} × 3 × 7 and 70 = 2 × 5 × 7, so HCF = 14. It is greater than both remainders.<br>The number is <b>14</b>.`);
vsa(13,[2025],`Find the smallest number which is divisible by both 644 and 462.`,`644 = 2^{2} × 7 × 23 and 462 = 2 × 3 × 7 × 11.<br>LCM = 2^{2} × 3 × 7 × 11 × 23 = <b>21252</b>.`);
vsa(14,[2023],`Find the greatest 3-digit number which is divisible by 18, 24 and 36.`,`LCM(18, 24, 36) = 72. The largest 3-digit multiple of 72: 999 ÷ 72 gives quotient 13, so 13 × 72 = <b>936</b>.`);
vsa(15,[2023],`Find the least number which when divided by 12, 16 and 24 leaves remainder 7 in each case.`,`LCM(12, 16, 24) = 48. The required number is 48 + 7 = <b>55</b>.`);
vsa(16,[],`Find the smallest natural number by which 1200 should be multiplied so that the square root of the product is a rational number.`,`1200 = 2^{4} × 3 × 5^{2}. For the product to be a perfect square, the power of 3 must become even.<br>Multiply by 3: 3600 = 60^{2}, and √{3600} = 60 is rational.<br>The smallest number is <b>3</b>.`);
vsa(17,[2024],`In a school, there are two sections of class X. There are 40 students in the first section and 48 students in the second section. Determine the minimum number of books required for their class library so that they can be distributed equally among students of both sections.`,`The number of books must be a common multiple of 40 and 48; the minimum is the LCM.<br>40 = 2^{3} × 5 and 48 = 2^{4} × 3, so LCM = 2^{4} × 3 × 5 = <b>240</b> books.`);

/* ===== 3 marks ===== */
sa(1,[2025],`Prove that √{2} is an irrational number.`,rootProof(2));
sa(2,[2025],`Prove that √{3} is an irrational number.`,rootProof(3));
sa(3,[2023,2025],`Prove that √{5} is an irrational number.`,rootProof(5));
sa(4,[2025],`Prove that [[1|√{5}]] is an irrational number.`,irr('[[1|√{5}]]','its reciprocal, √{5},','√{5}'));
sa(5,[2024],`Given that √{3} is an irrational, prove that 5 + 2√{3} is an irrational number.`,irr('5 + 2√{3}','√{3} = [[(5 + 2√{3}) − 5|2]]','√{3}'));
sa(6,[],`Given that √{5} is an irrational, prove that 2√{5} − 3 is an irrational number.`,irr('2√{5} − 3','√{5} = [[(2√{5} − 3) + 3|2]]','√{5}'));
sa(7,[2024],`Given that √{3} is an irrational, prove that [[2 − √{3}|5]] is an irrational number.`,irr('[[2 − √{3}|5]]','√{3} = 2 − 5 × [[2 − √{3}|5]]','√{3}'));
sa(8,[2025],`Prove that (5√{3} + [[2|3]]) is an irrational number given that √{3} is irrational number.`,irr('5√{3} + [[2|3]]','√{3} = [[(5√{3} + 2/3) − 2/3|5]]','√{3}'));
sa(9,[2025],`Prove that (4√{2} + [[5|3]]) is an irrational number given that √{2} is irrational number.`,irr('4√{2} + [[5|3]]','√{2} = [[(4√{2} + 5/3) − 5/3|4]]','√{2}'));
sa(10,[],`Given that √{2} is an irrational, prove that 5 + 3√{2} is an irrational number.`,irr('5 + 3√{2}','√{2} = [[(5 + 3√{2}) − 5|3]]','√{2}'));
sa(11,[2024],`Prove that (√{2} + √{3})^{2} is irrational number, given that √{6} is an irrational number.`,`(√{2} + √{3})^{2} = 2 + 3 + 2√{6} = 5 + 2√{6}.<br>`+irr('5 + 2√{6}','√{6} = [[(5 + 2√{6}) − 5|2]]','√{6}'));
sa(12,[2025],`Let x and y be two distinct prime numbers and p = x^{2}y^{3}, q = xy^{4}, r = x^{5}y^{2}. Find the HCF and LCM of p, q and r. Further check if HCF(p, q, r) × LCM(p, q, r) = p × q × r or not.`,`HCF = x^{1}y^{2} = xy^{2} (lowest powers). LCM = x^{5}y^{4} (highest powers).<br>HCF × LCM = xy^{2} × x^{5}y^{4} = x^{6}y^{6}.<br>p × q × r = x^{2+1+5} y^{3+4+2} = x^{8}y^{9}.<br>They are <b>not equal</b>. (The product rule HCF × LCM = product holds only for two numbers.)`);
sa(13,[2025],`State true or false for each of the following statements and justify in each case:<br>(i) 2 × 3 × 5 × 7 + 7 is a composite number.<br>(ii) 2 × 3 × 5 × 7 + 1 is a composite number.`,`(i) 2 × 3 × 5 × 7 + 7 = 7(2 × 3 × 5 + 1) = 7 × 31 = 217. It has factors 7 and 31, so the statement is <b>True</b>.<br>(ii) 2 × 3 × 5 × 7 + 1 = 211. It is not divisible by 2, 3, 5, 7, 11 or 13 (and 15^{2} = 225 > 211), so 211 is prime. The statement is <b>False</b>.`);
sa(14,[2025],`Let p, q and r be three distinct prime numbers. Check whether p.q.r + 1 is a composite number or not. Further, give an example for 3 distinct primes p, q, r such that<br>(i) p.q.r + 1 is a composite number.<br>(ii) p.q.r + 1 is a prime number.`,`pqr + 1 may be either; it depends on the primes chosen, so it is not always composite.<br>(i) Composite: p, q, r = 3, 5, 7 gives 3 × 5 × 7 + 1 = 106 = 2 × 53. (If all three primes are odd, pqr + 1 is even and bigger than 2, so it is composite.)<br>(ii) Prime: p, q, r = 2, 3, 5 gives 2 × 3 × 5 + 1 = 31, which is prime.`);
sa(15,[],`Write the smallest number which is divisible by both 306 and 657.`,`306 = 2 × 3^{2} × 17 and 657 = 3^{2} × 73.<br>LCM = 2 × 3^{2} × 17 × 73 = <b>22338</b>.`);
sa(16,[2023],`Find HCF and LCM of 26, 65 and 117 using prime factorization.`,`26 = 2 × 13, 65 = 5 × 13, 117 = 3^{2} × 13.<br>HCF = <b>13</b>.<br>LCM = 2 × 3^{2} × 5 × 13 = <b>1170</b>.`);
sa(17,[2023],`Find by prime factorization the LCM of the numbers 18180 and 7575. Also find the HCF of two numbers.`,`18180 = 2^{2} × 3^{2} × 5 × 101 and 7575 = 3 × 5^{2} × 101.<br>LCM = 2^{2} × 3^{2} × 5^{2} × 101 = <b>90900</b>.<br>HCF = 3 × 5 × 101 = <b>1515</b>.`);
sa(18,[],`144 cartons of Coke cans and 90 cartons of Pepsi cans are to be stacked in a canteen. If each stack is of the same height and if it equal contain cartons of the same drink, what would be the greatest number of cartons each stack would have?`,`The stack size must divide both 144 and 90, and we want the greatest, so find HCF(144, 90).<br>144 = 2^{4} × 3^{2} and 90 = 2 × 3^{2} × 5, so HCF = 18.<br>Each stack has <b>18 cartons</b> (8 stacks of Coke and 5 of Pepsi).`);
sa(19,[2024],`Three bells toll at intervals of 9, 12, 15 minutes respectively. If they start tolling together, after what time will they next toll together?`,`LCM(9, 12, 15) = 2^{2} × 3^{2} × 5 = 180 minutes.<br>They next toll together after <b>180 minutes (3 hours)</b>.`);
sa(20,[2023],`Three bells ring at intervals of 6, 12 and 18 minutes. If all the three bells rang at 6 a.m., when will they ring together again?`,`LCM(6, 12, 18) = 36 minutes.<br>6:00 a.m. + 36 minutes = <b>6:36 a.m.</b>`);
sa(21,[],`Four bells toll at an interval of 8, 12, 15 and 18 seconds respectively. All the four begin to toll together. Find the number of times they toll together in one hour excluding the one at the start.`,`LCM(8, 12, 15, 18) = 2^{3} × 3^{2} × 5 = 360 seconds.<br>One hour = 3600 seconds, and 3600 ÷ 360 = 10.<br>They toll together <b>10 times</b> (the last one is exactly at the end of the hour).`);
sa(22,[],`The length, breadth and height of a room are 8m 50cm, 6m 25cm and 4m 75cm respectively. Find the length of the longest rod that can measure the dimensions of the room exactly.`,`In centimetres: 850, 625 and 475. The longest rod = HCF(850, 625, 475).<br>850 = 2 × 5^{2} × 17, 625 = 5^{4}, 475 = 5^{2} × 19, so HCF = 25.<br>The rod is <b>25 cm</b> long.`);
sa(23,[],`On a morning walk, three persons step off together and their steps measure 40 cm, 42 cm and 45 cm respectively. Find the minimum distance each should walk so that each can cover the same distance in complete steps.`,`Minimum distance = LCM(40, 42, 45).<br>40 = 2^{3} × 5, 42 = 2 × 3 × 7, 45 = 3^{2} × 5, so LCM = 2^{3} × 3^{2} × 5 × 7 = 2520.<br>Distance = <b>2520 cm (25.2 m)</b>.`);
sa(24,[2023],`The traffic lights at three different road crossings change after every 48 seconds, 72 seconds and 108 seconds respectively. If they change simultaneously at 7 a.m, at what time will they change together next?`,`LCM(48, 72, 108): 48 = 2^{4} × 3, 72 = 2^{3} × 3^{2}, 108 = 2^{2} × 3^{3}, so LCM = 2^{4} × 3^{3} = 432 seconds = 7 min 12 s.<br>They change together next at <b>7:07:12 a.m.</b>`);
sa(25,[],`National Art convention got registrations from students from all parts of the country, of which 60 are interested in music, 84 are interested in dance and 108 students are interested in handicrafts. For optimum cultural exchange, organisers wish to keep them in minimum number of groups such that each group consists of students interested in the same artform and the number of students in each group is the same. Find the number of students in each group. Find the number of groups in each art form. How many rooms are required if each group will be allotted a room?`,`Minimum number of groups means the largest group size, so group size = HCF(60, 84, 108) = <b>12</b>.<br>Groups: music 60 ÷ 12 = <b>5</b>, dance 84 ÷ 12 = <b>7</b>, handicrafts 108 ÷ 12 = <b>9</b>.<br>Rooms required = 5 + 7 + 9 = <b>21</b>.`);
sa(26,[2024],`In a teacher’s workshop the number of teacher teaching French, Hindi and English are 48, 80 and 144 respectively. Find the minimum number of rooms required if in each room the same numbers of teachers are seated and all of them are of same subject.`,`Minimum rooms means the largest number per room: HCF(48, 80, 144) = 16.<br>Rooms: 48 ÷ 16 = 3, 80 ÷ 16 = 5, 144 ÷ 16 = 9.<br>Minimum rooms = 3 + 5 + 9 = <b>17</b>.`);
sa(27,[2025],`Three sets of Physics, Chemistry and Mathematics books have to be stacked in such a way that all the books are stored subject-wise and the height of each stack is the same. The number of Physics books is 144, the number of chemistry books is 180 and the number of Mathematics books is 192. Assuming that the books are of same thickness, determine the number of stacks of Physics, Chemistry and Mathematics books.`,`Each stack has the same number of books, equal to HCF(144, 180, 192) = 12.<br>Physics: 144 ÷ 12 = <b>12</b> stacks. Chemistry: 180 ÷ 12 = <b>15</b> stacks. Mathematics: 192 ÷ 12 = <b>16</b> stacks.`);

/* ===== Case-based ===== */
cs(1,[2023],`February 14 is celebrated as International Book Giving Day and many countries in the world celebrate this day. Some people in India also started celebrating this day and donated the following number of books of various subjects to a public library: History = 96, Science = 240, Mathematics = 336.<br>These books have to be arranged in minimum number of stacks such that each stack contains books of only one subject and the number of books on each stack is the same.`,[
  {l:'(i)',m:1,q:`How many books are arranged in each stack?`},
  {l:'(ii)',m:1,q:`How many stacks are used to arrange all the Mathematics books?`},
  {l:'(iii)',m:2,q:`(a) Determine the total number of stacks that will be used for arranging all the books.`,or:`(b) If the thickness of each book of History, Science and Mathematics is 1.8 cm, 2.2 cm and 2.5 cm respectively, then find the height of each stack of History, Science and Mathematics books.`}
],`Minimum number of stacks means the largest stack size: HCF(96, 240, 336) = 2^{4} × 3 = 48.<br><b>(i)</b> 48 books in each stack.<br><b>(ii)</b> Mathematics stacks = 336 ÷ 48 = <b>7</b>.<br><b>(iii)(a)</b> History 96 ÷ 48 = 2, Science 240 ÷ 48 = 5, Mathematics 7. Total = 2 + 5 + 7 = <b>14 stacks</b>.<br><b>(iii)(b)</b> Height = 48 × thickness. History: 48 × 1.8 = <b>86.4 cm</b>. Science: 48 × 2.2 = <b>105.6 cm</b>. Mathematics: 48 × 2.5 = <b>120 cm</b>.`);
cs(2,[],`Three sets of English, Hindi and Mathematics books have to be stacked in such a way that all the books are stored topic wise and the height of each stack is the same. The number of English books is 96, the number of Hindi books is 240 and the number of Mathematics books is 336. Assuming that the books are of the same thickness.`,[
  {l:'(i)',m:1,q:`Find the number of stacks of Hindi books?`},
  {l:'(ii)',m:2,q:`Find the number of stacks of English books?`,or:`Find the number of stacks of Mathematics books?`},
  {l:'(iii)',m:1,q:`What is the number of books that can be stored in each stack?`}
],`Equal height with the same thickness means the same number of books in every stack, so the stack size is HCF(96, 240, 336) = 48.<br><b>(i)</b> Hindi stacks = 240 ÷ 48 = <b>5</b>.<br><b>(ii)</b> English stacks = 96 ÷ 48 = <b>2</b>. (OR) Mathematics stacks = 336 ÷ 48 = <b>7</b>.<br><b>(iii)</b> <b>48 books</b> in each stack.`);
cs(3,[2024],`Teaching Mathematics through activities is a powerful approach that enhances students’ understanding and engagement. Keeping this in mind, Ms. Muktha planned a prime number game for class 5 students. She announces the number 2 in her class and asked the first student to multiply it by a prime number and then pass it to second student. Second student also multiplied it by a prime number and passed it to third student. In this way by multiplying to a prime number, the last student got 173250.<br>Now, Muktha asked some questions as given below to the students:`,[
  {l:'(i)',m:1,q:`What is the least prime number used by students?`},
  {l:'(ii)',m:2,q:`How many students are in the class?`,or:`What is the highest prime number used by students?`},
  {l:'(iii)',m:1,q:`Which prime number has been used maximum times?`}
],`Prime factorisation: 173250 = 2 × 3^{2} × 5^{3} × 7 × 11. The starting 2 was announced by the teacher, so the students multiplied by 3, 3, 5, 5, 5, 7, 11.<br><b>(i)</b> Least prime used by students = <b>3</b>.<br><b>(ii)</b> Number of students = 2 + 3 + 1 + 1 = <b>7</b>. (OR) Highest prime used = <b>11</b>.<br><b>(iii)</b> 5 has been used the maximum number of times (<b>3 times</b>).`);

/* ===== Extra case-based (practice) ===== */
cs(4,[],`The school band is planning its annual-day seating. 112 students of Class 8, 140 students of Class 9 and 168 students of Class 10 will attend. They are to be seated in rows so that every row has students of only one class and every row has the same number of students, using the minimum number of rows.`,[
  {l:'(i)',m:1,q:`Write the prime factorisation of 140.`},
  {l:'(ii)',m:1,q:`How many students sit in each row?`},
  {l:'(iii)',m:2,q:`(a) Find the total number of rows needed.`,or:`(b) If each student needs 0.5 m of space along the row, find the length of one row.`}
],`<b>(i)</b> 140 = 2^{2} × 5 × 7.<br><b>(ii)</b> Minimum rows means the largest row size: HCF(112, 140, 168). 112 = 2^{4}×7, 140 = 2^{2}×5×7, 168 = 2^{3}×3×7, so HCF = 2^{2}×7 = <b>28</b> students per row.<br><b>(iii)(a)</b> Rows: 112 ÷ 28 = 4, 140 ÷ 28 = 5, 168 ÷ 28 = 6. Total = 4 + 5 + 6 = <b>15 rows</b>.<br><b>(iii)(b)</b> Length of a row = 28 × 0.5 = <b>14 m</b>.`);
cs(5,[],`Aman, Bela and Charu jog around a circular park, starting together from the same point at 6:00 a.m. Aman takes 18 minutes for one round, Bela takes 24 minutes and Charu takes 30 minutes. Each keeps a steady speed in the same direction.`,[
  {l:'(i)',m:1,q:`Write the prime factorisation of 18, 24 and 30.`},
  {l:'(ii)',m:1,q:`After how many minutes will they all be at the starting point together again?`},
  {l:'(iii)',m:2,q:`(a) At what time will this happen?`,or:`(b) How many rounds will each of them have completed by then?`}
],`<b>(i)</b> 18 = 2 × 3^{2}, 24 = 2^{3} × 3, 30 = 2 × 3 × 5.<br><b>(ii)</b> LCM = 2^{3} × 3^{2} × 5 = <b>360 minutes</b>.<br><b>(iii)(a)</b> 360 minutes = 6 hours, so they meet at <b>12:00 noon</b>.<br><b>(iii)(b)</b> Aman: 360 ÷ 18 = <b>20</b> rounds. Bela: 360 ÷ 24 = <b>15</b> rounds. Charu: 360 ÷ 30 = <b>12</b> rounds.`);
cs(6,[],`A community hall has a rectangular floor of length 840 cm and breadth 630 cm. The floor is to be covered completely with identical square tiles, without cutting any tile. The tiles should be as large as possible.`,[
  {l:'(i)',m:1,q:`Write 840 and 630 as products of prime factors.`},
  {l:'(ii)',m:1,q:`What is the side of each square tile?`},
  {l:'(iii)',m:2,q:`(a) How many tiles are needed?`,or:`(b) If each tile costs ₹ 450, find the total cost of the tiles.`}
],`<b>(i)</b> 840 = 2^{3} × 3 × 5 × 7 and 630 = 2 × 3^{2} × 5 × 7.<br><b>(ii)</b> The largest square tile has side HCF(840, 630) = 2 × 3 × 5 × 7 = <b>210 cm</b>.<br><b>(iii)(a)</b> Tiles along the length = 840 ÷ 210 = 4 and along the breadth = 630 ÷ 210 = 3, so <b>12 tiles</b>.<br><b>(iii)(b)</b> Cost = 12 × 450 = <b>₹ 5400</b>.`);
cs(7,[],`Meera’s square garden has an area of 50 m². She wants to fence it and asks her teacher whether the length of the side and the length of fencing needed are rational numbers.`,[
  {l:'(i)',m:1,q:`Find the side of the garden.`},
  {l:'(ii)',m:1,q:`Is the side of the garden a rational or an irrational number?`},
  {l:'(iii)',m:2,q:`(a) Given that √{2} is irrational, prove that the side of the garden is irrational.`,or:`(b) Given that √{2} is irrational, prove that the perimeter of the garden is irrational.`}
],`<b>(i)</b> Side = √{50} = √{25 × 2} = <b>5√{2} m</b>.<br><b>(ii)</b> It is <b>irrational</b> (proved in part iii).<br><b>(iii)(a)</b> `+irr('5√{2}','√{2} = [[5√{2}|5]]','√{2}')+`<br><b>(iii)(b)</b> Perimeter = 4 × 5√{2} = 20√{2} m.<br>`+irr('20√{2}','√{2} = [[20√{2}|20]]','√{2}'));
cs(8,[],`A fitness centre runs three classes in a cycle. Yoga is held every 6 days, Zumba every 8 days and Swimming every 10 days. On 1 January of a non-leap year, all three classes were held on the same day.`,[
  {l:'(i)',m:1,q:`After how many days will Yoga and Zumba next be held on the same day?`},
  {l:'(ii)',m:1,q:`After how many days will all three classes next be held on the same day?`},
  {l:'(iii)',m:2,q:`(a) On which date will this happen?`,or:`(b) How many times in that year, after 1 January, will all three classes be held on the same day?`}
],`<b>(i)</b> LCM(6, 8) = <b>24 days</b>.<br><b>(ii)</b> LCM(6, 8, 10) = 2^{3} × 3 × 5 = <b>120 days</b>.<br><b>(iii)(a)</b> January has 31 days, February 28, March 31 and April 30, so 1 January + 120 days is <b>1 May</b>.<br><b>(iii)(b)</b> The classes coincide again after 120, 240 and 360 days (the 360th day is 27 December). The next one, at 480 days, falls in the next year. So <b>3 times</b>.`);

/* ===== Long answer (practice, 5 marks) ===== */
function la(n,y,q,s,x){Q.push(Object.assign({id:CUR+'-la-'+n,ch:CUR,t:'la',m:5,n,y,q,s},x||{}));}
la(1,[],`Prove that √{7} is an irrational number. Hence show that 5 − 3√{7} is also irrational.`,`<b>Part 1: √{7} is irrational (3 marks)</b><br>`+rootProof(7)+`<br><b>Part 2 (2 marks)</b><br>`+irr('5 − 3√{7}','√{7} = [[5 − (5 − 3√{7})|3]]','√{7}'));
la(2,[],`Find the HCF and LCM of 84, 126 and 210 using prime factorisation. Also verify that HCF × LCM = product of the numbers for the pair 84 and 126.`,`84 = 2^{2} × 3 × 7, 126 = 2 × 3^{2} × 7, 210 = 2 × 3 × 5 × 7.<br>HCF(84, 126, 210) = 2 × 3 × 7 = <b>42</b>.<br>LCM(84, 126, 210) = 2^{2} × 3^{2} × 5 × 7 = <b>1260</b>.<br><b>Verification for 84 and 126:</b> HCF = 2 × 3 × 7 = 42 and LCM = 2^{2} × 3^{2} × 7 = 252.<br>HCF × LCM = 42 × 252 = 10584, and 84 × 126 = 10584. Both are equal, so the result is verified.`);
la(3,[],`A sweet shop has 420 ladoos, 504 barfis and 588 pedas. They are to be packed in boxes so that each box has sweets of one kind only and every box has the same number of sweets. Find the greatest number of sweets each box can hold, the number of boxes of each kind, and the total number of boxes needed.`,`The greatest possible box size is HCF(420, 504, 588).<br>420 = 2^{2}×3×5×7, 504 = 2^{3}×3^{2}×7, 588 = 2^{2}×3×7^{2}, so HCF = 2^{2} × 3 × 7 = <b>84</b> sweets per box.<br>Ladoos: 420 ÷ 84 = <b>5</b> boxes. Barfis: 504 ÷ 84 = <b>6</b> boxes. Pedas: 588 ÷ 84 = <b>7</b> boxes.<br>Total boxes = 5 + 6 + 7 = <b>18</b>.`);
la(4,[],`Find the greatest number that divides 1251, 9377 and 15628 leaving remainders 1, 2 and 3 respectively.`,`The required number divides 1251 − 1 = 1250, 9377 − 2 = 9375 and 15628 − 3 = 15625 exactly.<br>1250 = 2 × 5^{4}, 9375 = 3 × 5^{5}, 15625 = 5^{6}.<br>HCF = 5^{4} = <b>625</b>, which is greater than all the remainders (1, 2, 3), so it is valid.`);
la(5,[],`Without doing long division, state whether each of the following has a terminating or a non-terminating repeating decimal expansion, giving the reason: (i) [[13|3125]]  (ii) [[17|8]]  (iii) [[64|455]]  (iv) [[15|1600]]  (v) [[29|343]]`,`A rational number [[p|q]] in lowest terms has a terminating decimal expansion only if the prime factors of q are 2 and/or 5.<br>(i) 3125 = 5^{5}, so <b>terminating</b> (0.00416).<br>(ii) 8 = 2^{3}, so <b>terminating</b> (2.125).<br>(iii) 455 = 5 × 7 × 13 has the prime factors 7 and 13, so <b>non-terminating repeating</b>.<br>(iv) [[15|1600]] = [[3|320]], and 320 = 2^{6} × 5, so <b>terminating</b> (0.009375).<br>(v) 343 = 7^{3}, so <b>non-terminating repeating</b>.`);
la(6,[],`Find the least number which leaves remainder 5 when divided by 6, 9, 15 and 18, and is exactly divisible by 7.`,`LCM(6, 9, 15, 18) = 2 × 3^{2} × 5 = 90. Numbers leaving remainder 5 in each case are of the form 90k + 5: 95, 185, 275, 365, 455, …<br>Checking divisibility by 7: 95, 185, 275 and 365 leave remainders 4, 3, 2 and 1, but 455 = 7 × 65.<br>The least number is <b>455</b>.<br>Check: 455 = 450 + 5, and 450 is a multiple of 6, 9, 15 and 18.`);

/* ---------- graph helper (inline SVG) ---------- */
let _pid=0;
function plot(o){
  const W=o.w||240,H=o.h||190,P=o.pad||20,id='ar'+(++_pid);
  const sx=x=>P+(x-o.x0)/(o.x1-o.x0)*(W-2*P), sy=y=>H-P-(y-o.y0)/(o.y1-o.y0)*(H-2*P);
  const f1=v=>v.toFixed(1);
  const fmtn=v=>String(v).replace('-','−');
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${o.alt||'graph'}" style="max-width:100%;height:auto;color:var(--ink)"><defs><marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>`;
  (o.polys||[]).forEach(p=>{s+=`<polygon points="${p.map(q=>f1(sx(q[0]))+','+f1(sy(q[1]))).join(' ')}" style="fill:var(--hl)" fill-opacity=".6" stroke="none"/>`;});
  if(o.grid){
    const st=o.step||1;
    for(let x=Math.ceil(o.x0/st)*st;x<=o.x1+1e-9;x+=st)s+=`<line x1="${f1(sx(x))}" y1="${f1(sy(o.y0))}" x2="${f1(sx(x))}" y2="${f1(sy(o.y1))}" stroke="currentColor" stroke-opacity=".12"/>`;
    for(let y=Math.ceil(o.y0/st)*st;y<=o.y1+1e-9;y+=st)s+=`<line x1="${f1(sx(o.x0))}" y1="${f1(sy(y))}" x2="${f1(sx(o.x1))}" y2="${f1(sy(y))}" stroke="currentColor" stroke-opacity=".12"/>`;
  }
  s+=`<line x1="${f1(sx(o.x0))}" y1="${f1(sy(0))}" x2="${f1(sx(o.x1))}" y2="${f1(sy(0))}" stroke="currentColor" stroke-width="1.2" marker-end="url(#${id})" marker-start="url(#${id})"/>`;
  s+=`<line x1="${f1(sx(0))}" y1="${f1(sy(o.y0))}" x2="${f1(sx(0))}" y2="${f1(sy(o.y1))}" stroke="currentColor" stroke-width="1.2" marker-end="url(#${id})" marker-start="url(#${id})"/>`;
  const T=(x,y,t,a,z)=>`<text x="${f1(x)}" y="${f1(y)}" text-anchor="${a||'start'}" font-size="${z||11}" font-family="Arial,sans-serif" fill="currentColor">${t}</text>`;
  (o.dashes||[]).forEach(d=>{s+=`<line x1="${f1(sx(d[0]))}" y1="${f1(sy(d[1]))}" x2="${f1(sx(d[2]))}" y2="${f1(sy(d[3]))}" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>`;});
  const curves=(o.curves||[]).slice(),segs=(o.segs||[]).slice();
  (o.lines||[]).forEach(l=>{
    if(l[1]!==0)curves.push({f:x=>(l[2]-l[0]*x)/l[1],a:o.x0,b:o.x1,col:l[3]});
    else segs.push([l[2]/l[0],o.y0,l[2]/l[0],o.y1,l[3]]);
  });
  curves.forEach(c=>{
    let d='',pen=false;const N=220;
    for(let i=0;i<=N;i++){
      const x=c.a+(c.b-c.a)*i/N,y=c.f(x);
      if(y<o.y0||y>o.y1){pen=false;continue;}
      d+=(pen?'L':'M')+f1(sx(x))+','+f1(sy(y))+' ';pen=true;
    }
    s+=`<path d="${d}" fill="none" style="stroke:var(--${c.col==='r'?'red':'pen'})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  segs.forEach(g=>{s+=`<line x1="${f1(sx(g[0]))}" y1="${f1(sy(g[1]))}" x2="${f1(sx(g[2]))}" y2="${f1(sy(g[3]))}" style="stroke:var(--${g[4]==='r'?'red':'pen'})" stroke-width="2.2" stroke-linecap="round"/>`;});
  (o.dots||[]).forEach(d=>{s+=`<circle cx="${f1(sx(d[0]))}" cy="${f1(sy(d[1]))}" r="3" fill="currentColor"/>`;});
  if(o.ticks){
    const st=o.step||1;
    for(let x=Math.ceil(o.x0/st)*st;x<=o.x1+1e-9;x+=st){if(Math.abs(x)<1e-9)continue;s+=T(sx(x),sy(0)+13,fmtn(x),'middle',9);}
    for(let y=Math.ceil(o.y0/st)*st;y<=o.y1+1e-9;y+=st){if(Math.abs(y)<1e-9)continue;s+=T(sx(0)-4,sy(y)+3,fmtn(y),'end',9);}
  }
  (o.xt||[]).forEach(t=>{s+=`<line x1="${f1(sx(t[0]))}" y1="${f1(sy(0)-3)}" x2="${f1(sx(t[0]))}" y2="${f1(sy(0)+3)}" stroke="currentColor"/>`+T(sx(t[0]),sy(0)+14,t[1],'middle');});
  (o.yt||[]).forEach(t=>{s+=`<line x1="${f1(sx(0)-3)}" y1="${f1(sy(t[0]))}" x2="${f1(sx(0)+3)}" y2="${f1(sy(t[0]))}" stroke="currentColor"/>`+T(sx(0)-6,sy(t[0])+4,t[1],'end');});
  (o.lb||[]).forEach(l=>{s+=T(sx(l[0]),sy(l[1]),l[2],l[3]);});
  s+=T(sx(o.x1)-2,sy(0)-5,o.xl||'x','end');
  if(!o.xl)s+=T(sx(o.x0)+2,sy(0)-5,'x′','start');
  s+=T(sx(0)+6,sy(o.y1)+10,o.yl||'y','start');
  return s+'</svg>';
}

mcq(1,[2023],`If one zero of the quadratic polynomial x^{2} + 3x + k is 2 then the value of k is`,['10','−10','5','−5'],1,`Put x = 2: 4 + 6 + k = 0, so k = −10.`);
mcq(2,[],`If one zero of the quadratic polynomial kx^{2} + 3x + k is 2 then the value of k is`,['[[5|6]]','−[[5|6]]','[[6|5]]','−[[6|5]]'],3,`Put x = 2: 4k + 6 + k = 0, so 5k = −6 and k = −[[6|5]].`);
mcq(3,[],`If one zero of the quadratic polynomial (k − 1)x^{2} + kx + 1 is −3 then the value of k is`,['[[4|3]]','−[[4|3]]','[[2|3]]','−[[2|3]]'],0,`Put x = −3: 9(k − 1) − 3k + 1 = 0, so 6k − 8 = 0 and k = [[4|3]].`);
mcq(4,[2025],`If −4 is a zero of the polynomial x^{2} − x − (2 + 2k), the value of k is`,['3','9','6','−9'],1,`Put x = −4: 16 + 4 − (2 + 2k) = 0, so 18 − 2k = 0 and k = 9.`);
mcq(5,[],`If −1 is a zero of the polynomial x^{2} − 7x − 8 then other zero is,`,['4','8','1','−4'],1,`Product of zeros = −8, so the other zero = −8 ÷ (−1) = 8. (Check: sum = −1 + 8 = 7 ✓.)`);
mcq(6,[2023],`If one zero of the polynomial 6x^{2} + 37x − (k − 2) is the reciprocal of the other, then value of k is`,['−4','−6','4','6'],0,`Product of zeros = 1, so [[−(k − 2)|6]] = 1, giving k − 2 = −6 and k = −4.`);
mcq(7,[2025],`If one zero of the polynomial (p^{2} + 4)x^{2} + 65x + 4p is the reciprocal of the other, then value of p is`,['−1','1','−2','2'],3,`Product of zeros = 1: [[4p|p^{2} + 4]] = 1, so p^{2} − 4p + 4 = 0, i.e. (p − 2)^{2} = 0 and p = 2.`);
mcq(8,[2025],`If the zeros of the polynomial ax^{2} + bx + [[2a|b]] are reciprocal of each other, then the value of b is`,['2','[[1|2]]','−2','−[[1|2]]'],0,`Product of zeros = 1: ([[2a|b]]) ÷ a = [[2|b]] = 1, so b = 2.`);
mcq(9,[2023],`If one zero of the polynomial x^{2} − 3kx + 4k be twice the other, then the value of k is`,['−2','2','[[1|2]]','−[[1|2]]'],1,`Let the zeros be α and 2α. Sum: 3α = 3k, so α = k. Product: 2α^{2} = 4k, so 2k^{2} = 4k and k = 2 (k = 0 would make the polynomial x^{2}).`);
