  function showPDFList(subject, type) {
  const listEl = document.getElementById('pdfList');
  const titleEl = document.getElementById('pdfTitle');
  const data = pdfData[subject][type];

  listEl.innerHTML = '';
  titleEl.textContent = `${subject.charAt(0).toUpperCase() + subject.slice(1)} - ${formatType(type)}`;

  // RESET STYLE (important)
  listEl.style.display = 'flex';
  listEl.style.flexWrap = 'wrap';
  listEl.style.justifyContent = 'center';
  listEl.style.gap = '30px';

  // ================= PREVIOUS YEAR (NEW DROPDOWN) =================
  if (type === 'previous') {

    listEl.style.display = 'block'; // override

    const wrapper = document.createElement('div');
    wrapper.style.display = "flex";
    wrapper.style.flexDirection = "column";
    wrapper.style.alignItems = "center";
    wrapper.style.marginTop = "20px";

    const select = document.createElement('select');
    select.style.padding = "10px 15px";
    select.style.marginBottom = "20px";
    select.style.borderRadius = "8px";
    select.style.fontSize = "1rem";
    select.style.cursor = "pointer";

    const years = Object.keys(data).sort((a, b) => b - a);

    years.forEach(year => {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      select.appendChild(option);
    });

    wrapper.appendChild(select);

    const column = document.createElement('div');
    column.className = 'pdf-column';
    column.style.maxWidth = "420px";
    column.style.width = "100%";

    const heading = document.createElement('h4');
    column.appendChild(heading);

    const ul = document.createElement('ul');
    column.appendChild(ul);

    function loadYear(year) {
      heading.textContent = "📊 " + year;
      ul.innerHTML = "";

      data[year].forEach(pdf => {
        const li = document.createElement('li');
        const link = document.createElement('a');

        link.href = pdf.url;
        link.textContent = pdf.name;
        link.target = "_blank";

        li.appendChild(link);
        ul.appendChild(li);
      });
    }

    // load latest year by default
    loadYear(years[0]);

    select.addEventListener('change', () => {
      loadYear(select.value);
    });

    wrapper.appendChild(column);
    listEl.appendChild(wrapper);
  }

  // ================= ASSIGNMENTS + SAMPLE PAPERS (OLD WORKING STYLE) =================
  else if (typeof data === 'object' && !Array.isArray(data)) {

    for (const key in data) {
      const column = document.createElement('div');
      column.className = 'pdf-column'; // 🔥 important (restores UI)

      const heading = document.createElement('h4');
      heading.textContent = key.toUpperCase();
      column.appendChild(heading);

      const ul = document.createElement('ul');

      data[key].forEach(pdf => {
        const li = document.createElement('li');
        const link = document.createElement('a');

        link.href = pdf.url;
        link.textContent = pdf.name;
        link.target = "_blank";

        li.appendChild(link);
        ul.appendChild(li);
      });

      column.appendChild(ul);
      listEl.appendChild(column);
    }
  }

  // ================= NOTES (SINGLE COLUMN) =================
  else {
    const column = document.createElement('div');
    column.className = 'pdf-column';

    const heading = document.createElement('h4');
    heading.textContent = formatType(type);
    column.appendChild(heading);

    const ul = document.createElement('ul');

    data.forEach(pdf => {
      const li = document.createElement('li');
      const link = document.createElement('a');

      link.href = pdf.url;
      link.textContent = pdf.name;
      link.target = "_blank";

      li.appendChild(link);
      ul.appendChild(li);
    });

    column.appendChild(ul);
    listEl.appendChild(column);
  }

  document.getElementById('assetsection')
    .scrollIntoView({ behavior: 'smooth' });
}


// 🔥 SAFE FORMAT FUNCTION
function formatType(type) {
  switch(type) {
    case 'notes': return 'Notes';
    case 'assignments': return 'Assignments';
    case 'samplepapers': return 'Sample Papers';
    case 'previous': return 'Previous Year Questions';
    default: return type;
  }
}
